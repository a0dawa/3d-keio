<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>京王線 連続立体交差事業(笹塚〜仙川) 高架化後 3Dビューア</title>
<style>
  :root{
    --ink:#1c2733; --panel:rgba(252,253,254,.94); --line:#c7ced6;
    --keio-pink:#e4007f; --keio-indigo:#1b2a66; --dim:#5a6673;
    --mono:ui-monospace,'SF Mono','Consolas',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif;
    color:var(--ink);background:#dfe8f0}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  /* ---- パネルの開閉タブ ---- */
  .tog{position:fixed;z-index:20;border:1px solid var(--line);background:rgba(255,255,255,.94);
    color:var(--keio-indigo);font:700 12px/1 inherit;cursor:pointer;
    box-shadow:0 2px 8px rgba(20,30,50,.12);padding:0}
  #navTog{top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;
    border-radius:0 0 8px 8px;border-top:none}
  #toolTog{right:0;top:50%;transform:translateY(-50%);width:22px;height:64px;
    border-radius:8px 0 0 8px;border-right:none}
  #nav,#tools{transition:transform .26s ease}
  #nav.hide{transform:translateY(calc(-100% - 20px))}
  #tools.hide{transform:translateX(calc(100% + 20px))}

  /* ---- マスコンの操作ボタン(タッチ対応) ---- */
  #spd .ctl{display:flex;gap:6px}
  #spd .ctl button{min-width:46px;height:40px;border:1px solid var(--keio-indigo);border-radius:9px;
    background:#fff;color:var(--keio-indigo);font:700 15px/1.1 inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #spd .ctl button span{font:600 9.5px/1 inherit;color:var(--dim)}
  #spd .ctl button:active{background:var(--keio-indigo);color:#fff}
  #tools button:disabled{opacity:.42;cursor:not-allowed}
  #spd .ctl button.eb{border-color:#d62828;color:#d62828}
  #spd .ctl button.eb:active{background:#d62828;color:#fff}

  /* ---- スマートフォン対応(横画面で使用) ---- */
  #rot{position:fixed;inset:0;display:none;z-index:99;background:#f4f6f8;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:600 15px/1.7 var(--sans);color:var(--ink);text-align:center;padding:24px}
  #rot .ico{font-size:44px;transform:rotate(90deg)}
  @media (orientation:portrait) and (max-width:900px){
    #rot{display:flex}
    #tools,#nav,#spd{display:none !important}
  }
  @media (orientation:landscape) and (max-height:560px){
    #tools{top:26px;right:6px;padding:5px;gap:4px;max-height:calc(100vh - 40px);overflow:auto}
    #tools button{font-size:10.5px;padding:6px 8px}
    #nav{left:6px;right:6px;top:24px;padding:6px 8px 4px}
    #nav svg{height:54px}
    #nav .cap b{font-size:11px} #nav .cap i{font-size:10px}
    /* マスコン:左下に小さく(面積1/4)・半透明で配置し、中央の視界を空ける */
    #spd{left:4px;bottom:4px;transform:scale(.5);transform-origin:left bottom;
      opacity:.55;padding:8px 10px;gap:10px;align-items:center}
    #spd:active,#spd:focus-within{opacity:.95}
    #spd .v b{display:none}
  }
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 3px 14px rgba(20,35,55,.12);backdrop-filter:blur(4px)}
  #hdr{top:12px;left:12px;padding:11px 14px 10px;max-width:min(450px,calc(100vw - 24px))}
  #hdr h1{font-size:14.5px;font-weight:700;letter-spacing:.02em;line-height:1.45}
  #hdr h1 .rt{color:var(--keio-pink)}
  #hdr .sub{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6}
  #hdr .facts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  #hdr .facts span{font:600 10px var(--mono);color:var(--keio-indigo);
    border:1px solid var(--keio-indigo);border-radius:3px;padding:2px 5px;background:#fff}
  #tools{top:12px;right:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #tools button{font:600 11.5px/1 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;white-space:nowrap}
  #tools button:hover{border-color:var(--keio-indigo)}
  #tools button.on{background:var(--keio-indigo);color:#fff;border-color:var(--keio-indigo)}
  #tools button.ride.on{background:var(--keio-pink);border-color:var(--keio-pink)}
  #tools button:focus-visible{outline:2px solid var(--keio-pink);outline-offset:1px}
  #nav{left:12px;right:196px;top:12px;padding:10px 14px 8px}   /* 上部固定・右のボタン群を回避 */
  #nav .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  #nav .cap b{font-size:12.5px;letter-spacing:.08em;color:var(--keio-indigo)}
  #nav .cap i{font:11.5px var(--mono);color:var(--dim);font-style:normal}
  #nav svg{display:block;width:100%;height:100px;cursor:pointer}
  #nav text{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif}
  #note{display:none;left:12px;bottom:120px;max-width:min(510px,calc(100vw - 24px));
    max-height:52vh;overflow:auto;padding:12px 15px;font-size:11.5px;line-height:1.75}
  #note.show{display:block}
  #note h2{font-size:12px;color:var(--keio-indigo);margin-bottom:5px}
  #note h2:not(:first-child){margin-top:10px}
  #note p{color:#33404d}
  #note .lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
  #note .lg span{display:inline-flex;align-items:center;gap:5px;font-size:11px}
  #note .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
    border-radius:5px;background:#fff;cursor:pointer;color:var(--ink)}
  #kjStepRow button{font:700 13px/1 inherit;width:30px;height:30px;border:1px solid var(--keio-indigo);
    border-radius:6px;background:#fff;color:var(--keio-indigo);cursor:pointer}
  #kjStepRow button:disabled{opacity:.3;cursor:default}
  #hint{right:12px;bottom:120px;padding:7px 11px;font:10.5px/1.7 var(--mono);color:var(--dim)}
  /* 運転台(マスコン+速度計。運転モード時のみ表示) */
  #spd{display:none;left:50%;transform:translateX(-50%);bottom:16px;padding:9px 14px;
    align-items:center;gap:12px}
  #spd.show{display:flex}
  /* 段位チップ(P4〜N〜B7・EB) */
  #spd .notch{min-width:56px;height:38px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font:700 17px/1 var(--mono);color:#fff;background:#8a9099;
    letter-spacing:.04em}
  #spd .notch.p{background:#2f7d4f}      /* 力行 */
  #spd .notch.n{background:#8a9099}      /* 中立 */
  #spd .notch.b{background:#d98a3a}      /* 制動 */
  #spd .notch.e{background:#d62828}      /* 非常 */
  #spd .v{font:700 22px var(--mono);color:var(--ink);min-width:86px;text-align:center}
  /* 次駅と停止位置までの距離 */
  #spd .nxt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px}
  #spd .nxt b{font:700 12.5px/1.2 inherit;color:var(--keio-indigo)}
  #spd .nxt span{font:700 15px/1 var(--mono);color:var(--ink)}
  #spd .nxt span.near{color:#d62828}
  #spd .v i{font:600 12px var(--mono);color:var(--dim);font-style:normal;margin-left:4px}
  #spd .v b{display:block;font:600 9.5px var(--mono);color:var(--dim);margin-top:1px}
  @media (max-width:640px){
    #hdr{padding:9px 11px}
    #hdr h1{font-size:12.5px}
    #hdr .sub,#hdr .facts{display:none}
    #tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:12px;left:12px;right:12px;padding:6px}
    #tools button{padding:7px 8px}
    #hint{display:none}
    #nav svg{height:88px}
  }
</style>
</head>

<canvas id="c" aria-label="京王線高架化後の3Dモデル"></canvas>
<div id="rot">
  <div class="ico">📱</div>
  <div><b>横画面にしてください</b><br>この3Dビューアは横向きでの表示に最適化されています。</div>
</div>

<button id="navTog" class="tog" aria-label="縦断図ナビの表示切替">▲</button>
<button id="toolTog" class="tog" aria-label="メニューの表示切替">▶</button>

<div class="panel" id="tools">
  <button id="btnHome">全体俯瞰(地図の向き)</button>
  <button id="btnRide" class="ride">運転モード OFF</button>
  <button id="btnChase" class="ride">列車追尾 OFF</button>

  <div class="nxt"><b id="nxtName">—</b><span id="nxtDist">—</span></div>

  <div class="ctl">
    <button id="btnUp" aria-label="制動側へ">▲<span>制動</span></button>
    <button id="btnDn" aria-label="力行側へ">▼<span>力行</span></button>
    <button id="btnN">N</button>
    <button id="btnE" class="eb">EB</button>
  </div>
</div>

<div class="panel" id="nav">
  <div class="cap"><b>縦 断 図 ナ ビ</b><i id="navPos">—</i></div>
  <svg id="navSvg" role="navigation" aria-label="縦断図から駅を選択"></svg>
</div>

/* ============================================================================
   京王線 連続立体交差事業(笹塚〜仙川)高架化後 3Dビューア ── 保守ガイド
   ----------------------------------------------------------------------------
   ■ ファイル構成(この見出しコメントで検索できます)
     1. 与件データ        : 駅STA/踏切XINGS(実名25)/交差道路/8工区KOUKU/手順STEPS/可視表VIS
     2. 縦断・断面・平面線形: railY(縦断) mainOff(本線の振り) deckHalf(桁半幅)
                              GEO→GP→CT(実座標スプライン) frame(s,off) nearestS
     3. シーン基盤        : renderer/材質MAT/車体・レンガ等テクスチャ/工区グループ/strip・box・cyl
     4. 地表・道路・施設  : 幹線/踏切道スタブ/側道/玉川上水/給水所/変電所/駅前広場
     5. 高架橋・架線      : deckRunHalf=南半(VGa:下り線部)+北半(VGb:上り線部)/橋脚/架線柱
     6. 軌道ほか          : 本線・副本線・留置線(2本併設)・分岐器・井の頭線・世田谷線・地上線/仮線
     7. 駅                : cbox(曲線追従)によるホーム・ホームドア・駅舎意匠・側面外観・駅名サイン
     8. 街並み            : 街区整列の建物/樹木(幹+樹冠)
     9. 列車              : テクスチャ車体+パンタ(走行6本・滞泊編成)
    10. カメラ・モード    : オービット/運転モードrideOn(ワンハンドルマスコン)/列車追尾chaseOn
    11. 縦断図ナビ        : SVG(駅クリック・踏切目盛・現在位置マーカー)
    12. UI・メインループ  : ボタン類/resize/loop

   ■ 座標系(最重要)
     ・s   : 営業距離[m](笹塚=0。新宿起点kmはヘルパ X(km) で変換)
     ・off : 線路直角方向[m](+=北側/-=南側)
     ・ワールド: 地理準拠 → X=東(+)西(-)/Z=南(+)北(-)/Y=高さ[m]
       真上から見ると「北が上・新宿方(笹塚)が右」= 公式平面図と同じ向き
     ・全構造物は frame(s,off) 経由で配置(直接ワールド座標を使うのは地表面のみ)

   ■ 主な調整パラメータ
     ・線形     : GEO(各駅の緯度経度)を直せば全体が自動追従
     ・断面/高さ: RAIL_H・DECK_DROP・GIRDER・WIDE([中心s,桁半幅,一定区間半長])・BUMPS
     ・踏切     : XINGS=[名称, s位置]
     ・工事手順 : KOUKU(s0/s1=工区範囲, m=工法A側方/B仮線/C直上, jv/note)・STEPS文言・VIS可視表
     ・配色     : MAT(構造物)/brickMat・woodMat・latticeMat(駅意匠)/car_spec由来の色(車両)

   ■ 保守メモ
     ・編集後は <script> 内を抽出し node --check で構文確認を推奨
     ・210m級の長物は必ず cbox(曲線追従ロフト)で生成。直方体Boxは曲線上で弦になる
     ・CT.a は±π跨ぎをアンラップ済み。線形再生成時もこの処理を残すこと
     ・操作系:ドラッグ=移動/Shift・Ctrl+ドラッグ=回転(2026-08変更)
   ========================================================================== */

function strip(x0,x1,step,fA,fB,mat){
  const xs=[];for(let x=x0;x<x1;x+=step)xs.push(x);xs.push(x1);
  const n=xs.length,pos=new Float32Array(n*2*3),idx=[];
  xs.forEach((x,i)=>{
    const a=fA(x),b=fB(x),pa=frame(a[0],a[2]),pb=frame(b[0],b[2]);
    pos[i*6]=pa.x;pos[i*6+1]=a[1];pos[i*6+2]=pa.z;
    pos[i*6+3]=pb.x;pos[i*6+4]=b[1];pos[i*6+5]=pb.z;
    if(i<n-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  return add(new THREE.Mesh(g,mat));
}
function box(w,h,d,mat,s,y,off,ry2){
  const p=frame(s,off);

  m.position.set(p.x,y,p.z);m.rotation.y=-p.a+(ry2||0);
  return add(m);
}

}

const yTop=x=>railY(x)-DECK_DROP, yBot=x=>railY(x)-GIRDER;

function deckPart(x0,x1,mat,o0,o1,edge){   // 桁の帯 o0..o1(±99=桁端)。edge:'S'/'N'は側面+防音壁付き

    strip(x0,x1,12,x=>[x,railY(x)+2.1,-deckHalf(x)+.25],x=>[x,yTop(x),-deckHalf(x)+.25],MAT.barrier);
  }else if(edge==='N'){
    strip(x0,x1,12,x=>[x,yBot(x),deckHalf(x)],x=>[x,yTop(x),deckHalf(x)],mat);
    strip(x0,x1,12,x=>[x,yTop(x),deckHalf(x)-.25],x=>[x,railY(x)+2.1,deckHalf(x)-.25],MAT.barrier);
  }
}
// 架線柱を建てる。門型(ビーム式)。柱はテーパー付きの鋼管、ビームは上下弦を前後
// 2本ずつ持つ立体トラスにして、真横から見ても正面から見ても骨組みが見えるようにする。
function buildPoles(xs){
  if(!xs.length)return;
  const N=xs.length;
  const iB=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),MAT.pole,N*24);
  const iC=new THREE.InstancedMesh(new THREE.CylinderGeometry(.5,.5,1,12),MAT.pole,N*2);
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
  let ib=0,ic=0;
  const put=(inst,idx,s,y,off,sx,sy,sz,rx)=>{const p=frame(s,off);
    e.set(rx||0,-p.a,0,'YXZ');q.setFromEuler(e);
    m4.compose(new THREE.Vector3(p.x,y,p.z),q,new THREE.Vector3(sx,sy,sz));inst.setMatrixAt(idx,m4);};
  for(const x of xs){
    const onDeck=railY(x)>3.4&&x<DECK_END;
    const hw=onDeck?Math.min(deckHalf(x)-.55,poleOff(x)):poleOff(x), base=onDeck?yTop(x):0;
    const top=railY(x)+POLE_TOP, h=top-base;
    for(const sg of[-1,1]){
      put(iC,ic++,x,base+h/2,sg*hw,.40,h,.40);            // 鋼管柱
      put(iB,ib++,x,base+.06,sg*hw,.78,.12,.78);          // ベースプレート
      put(iB,ib++,x,base+.34,sg*hw,.30,.56,.30);          // 柱脚(根巻き)
      put(iB,ib++,x,top-1.7,sg*(hw-.42),.13,.13,.98,0.0); // 柱頭のブレース
    }
    for(const dx of[-.12,.12]){                            // 上下弦を前後2本ずつ=立体トラス
      put(iB,ib++,x+dx,top+.05,0,.13,.13,hw*2);
      put(iB,ib++,x+dx,top-.80,0,.12,.12,hw*2);
    }
    for(let k=0;k<5;k++){                                  // 垂直材
      const ox=-hw+.55+(hw*2-1.1)*k/4;
      put(iB,ib++,x,top-.38,ox,.09,.85,.09);
    }
    for(let k=0;k<8;k++){                                  // 斜材
      const ox=-hw+.55+(hw*2-1.1)*(k+.5)/8;
      put(iB,ib++,x,top-.38,ox,.08,1.02,.08,(k%2?1:-1)*0.58);
    }
  }
  iB.count=ib;iC.count=ic;add(iB);add(iC);
}

/* ---- 架線の吊り金具:架線柱の真下を通る全ての線路へ碍子を下ろす ----
   線路の登録(TRACKS)が出揃ってから実行する。線路を足せば支持も自動で増える。
   「柱の真下が吊り点」であることを、金具の位置としても目に見える形にする。 */
{
  const byG=new Map();
  for(const s of POLE_S){
    const K=kkOf(s), g=K?K.VGa:null;
    for(const t of TRACKS){
      if(s<t.x0-0.01||s>t.x1+0.01) continue;
      const zo=t.zf(s);
      if(Math.abs(zo)>deckHalf(s)+1) continue;        // 桁の外は支持できない
      if(!byG.has(g)) byG.set(g,[]);
      byG.get(g).push([s,zo]);
    }
  }
  const insMat=new THREE.MeshLambertMaterial({color:0xd9cfc0});
  for(const [g,list] of byG){
    if(!list.length) continue;
    const iI=new THREE.InstancedMesh(new THREE.CylinderGeometry(.075,.075,1,8),insMat,list.length);
    const iH=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),MAT.pole,list.length);
    const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler();
    let i=0;
    for(const [s,zo] of list){
      const pc=frame(s,zo), yb=railY(s)+WIRE_CAT, yt=railY(s)+BEAM_LOW;
      e.set(0,-pc.a,0);q.setFromEuler(e);
      m4.compose(new THREE.Vector3(pc.x,(yb+yt)/2,pc.z),q,new THREE.Vector3(1,yt-yb,1));
      iI.setMatrixAt(i,m4);                            // 碍子(ちょう架線⇄ビーム下弦)
      m4.compose(new THREE.Vector3(pc.x,yb-0.04,pc.z),q,new THREE.Vector3(.20,.09,.20));
      iH.setMatrixAt(i,m4);                            // 吊り金具(ちょう架線側の受け)
      i++;
    }
    CUR=g;add(iI);add(iH);
  }
  CUR=null;
}

     交差鉄道は線路に対して斜めに走るので、s一定の帯では覆えない
     (井の頭線は880mの延長でsが約160m動く)。世界座標の直線として判定する。
   ・非重複 …… 世界座標の格子ハッシュに外接円を登録し、円同士が重ならないことを見る。

/* (s,off)に半径radの物を置けるか。高架下・側道は桁半幅から求める(桁幅を変えれば追従)。 */
function cityFree(s,off,rad,px,pz){
  if(Math.abs(off)<deckHalf(s)+5.2+rad) return false;          // 高架下+側道
  for(const q of KEEP){
    if(q.k==='b'){ if(Math.abs(s-q.c)<q.hw+rad && Math.abs(off)<q.oh) return false; }
    else if(q.k==='s'){ if(Math.abs(off-q.o)<q.hw+rad && s>q.s0 && s<q.s1) return false; }
    else if(q.k==='r'){ if(Math.abs(s-q.c)<q.hs+rad && Math.abs(off-q.o)<q.ho+rad) return false; }
    else if(q.k==='d'){ if(Math.hypot(s-q.c,off-q.o)<q.r+rad) return false; }
    else {                                                     // 世界座標の直線(交差鉄道)
      const dx=px-q.A.x, dz=pz-q.A.z;
      const du=dx*q.A.ax+dz*q.A.az, dn=dx*q.A.nx+dz*q.A.nz;
      if(Math.abs(dn)<q.hw+rad && du>q.u0-rad && du<q.u1+rad) return false;
    }
  }
  return true;
}
// すでに置いた物との重なり(世界座標の格子ハッシュ。建物と樹木で共有する)
const OCC=new Map(), OCC_CELL=26, OCC_GAP=1.2;
function occFree(px,pz,r){
  const cx=Math.floor(px/OCC_CELL), cz=Math.floor(pz/OCC_CELL);
  for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){
    const l=OCC.get((cx+a)+','+(cz+b)); if(!l) continue;
    for(const o of l){
      const rr=r+o[2]+OCC_GAP;
      if((px-o[0])*(px-o[0])+(pz-o[1])*(pz-o[1])<rr*rr) return false;
    }
  }
  return true;
}
function occAdd(px,pz,r){
  const k=Math.floor(px/OCC_CELL)+','+Math.floor(pz/OCC_CELL);
  let l=OCC.get(k); if(!l){l=[];OCC.set(k,l);}
  l.push([px,pz,r]);
}

/* ============ 9. 列車(京王8000系) ============ */
/* 【設計方針】旧実装からの全面作り直し
   旧: 実車正面写真を1ドット単位で車体座標へ展開したPNGを前面に貼る「写真転写方式」。
   新: 前面を含め、すべてジオメトリで構成する。
       ただし写真の画素解析で得た"寸法"は実車由来の唯一の資産なので、諸元表
       K8 / BANDS / WIN / FWIN に実測値として引き継ぎ、形状はそこからのみ生成する。
       (数値を書き換えれば車体・窓・帯・前面がすべて追従する一方向のデータフロー)

   旧実装の失敗要因(TEMPLATE.md §4)への構造的な対処:
     - 窓を頂点カラーの条件式で"塗って"いた → 廃止。窓・扉は車体表面のわずか外側に
       置く独立したパネルとして作る。ロフトの分割数と無関係に輪郭が鋭く出る。
     - 帯の上下関係(紺線は赤帯の"上")を誤認   → BANDS 表に下から順に並べ、単調性を
       生成時に検査する。境界には必ず頂点を置き二重化する。
     - 前頭部が黒い塊になる                   → 前頭部の塗り分けはアイボリー地+帯のみ。
       窓・灯具・表示器は独立メッシュなので地色を汚さない。
     - 裏面カリングで面が消える               → パネル類の材質は DoubleSide で統一。
     - 断面リングの頂点数が場所により変わる   → 帯の境界は固定、肩から上の埋め点だけを
       個数固定で等分する(旧実装は先頭部でリング長が変化し接続が壊れていた)。 */

/* ---- 9-1. 実車諸元(単一の真実の源) ----------------------------------------
   出典の別:
     [A] 公表諸元(Wikipedia 京王8000系電車 ほか)
     [B] 本プロジェクトの実車写真 画素解析による実測値
         ※元写真(reference/keio8000_*.png)は失われたが、測定値はここに残り検証基準であり続ける
     [C] 20m級4扉車の標準値(出典未確認。実車資料が入手できたら要更新)
     [D] 利用者提供の前面プロポーション仕様書(mm)。原点=前面最下部かつ左右中心、
         X=左右(全幅2800)、Y=高さ(全高2800)、Z=奥行き(ノーズ頂点が0、奥がプラス)。
         "相対寸法(プロポーション)"として与えられているので、[B]の実寸へ比例配分する。 */
const K8={
  LEN:19.50,      // [C] 車体長[m]
  PITCH:20.00,    // [C] 連結面間距離[m](編成内の車両間隔)
  W:2.845,        // [B] 車体幅[m](正面シルエット幅=車体幅 として測定した基準値)
  FLOOR:0.95,     // [B] 車体裾(床面)高さ[m](レール面基準)
  SHLD:3.15,      // [B] 肩(垂直な側面の上端)[m]
  ROOF:3.64,      // [B] 屋根頂部[m]
  CAB:1.95,       // [B] 乗務員室(普通鋼・アイボリー塗装)の範囲[m]
  BOGIE:13.60,    // [C] 台車中心間距離[m]
  WBASE:2.20,     // [C] 固定軸距[m]
  WHEEL:0.43,     // [C] 車輪半径[m](径860mm)
  DOORW:1.30,     // [A] 客用扉の幅[m](片側4扉)
  DOORX:[-7.05,-2.35,2.35,7.05],   // [C] 客用扉の中心位置[m]
};
// 仕様書[D]の寸法をこのモデルの実寸へ写す縮尺。以後、前面の寸法はすべてこの3関数を通す。
const SPX=(K8.W/2)/1400, SPY=(K8.ROOF-K8.FLOOR)/2800;
const fz=X=>X*SPX;                 // [D]のX[mm] → 車体座標z[m](左右)
const fy=Y=>K8.FLOOR+Y*SPY;        // [D]のY[mm] → レール面基準の高さ[m]
const fd=Z=>Z*SPY;                 // [D]のZ[mm] → 奥行き[m]
const fh=Y=>Y*SPY;                 // [D]のY方向の"寸法"[mm] → [m](高さではなく大きさ)
/* 前頭部の立体形状([D] §2)
     Y=0 で奥へ150 / Y=900(腰)で0=最も手前 / Y=2800(屋根)で奥へ400
     さらに側面(X=±1400)へ向かって約300 奥へ回り込む(平面ではなく半円柱に近い丸み) */
const NZ_BOT=fd(150), NZ_TOP=fd(400), NZ_SIDE=fd(300), NY_BULGE=fy(900);
const NOSE_MAX=NZ_TOP+NZ_SIDE;     // 前頭部が奥へ入る最大量[m]
function noseZ(y){                 // 高さによる奥行き(腰で0、上下へ2次で増える)
  if(y<=NY_BULGE){const t=(NY_BULGE-y)/(NY_BULGE-K8.FLOOR);return NZ_BOT*t*t;}
  const t=(y-NY_BULGE)/(K8.ROOF-NY_BULGE);return NZ_TOP*t*t;
}
const noseZSide=(z,hw)=>hw>0.01?NZ_SIDE*(z/hw)*(z/hw):0;   // 側面への回り込み

/* ---- 9-2. 配色 ------------------------------------------------------------
   [A] 車体は軽量ステンレス。前頭部〜乗務員扉のみ普通鋼でアイボリー塗装。
       帯は京王レッドと京王ブルー。                                            */
const PAL={
  stl  :[0.66,0.69,0.72],      // 軽量ステンレス(ヘアライン)
  roof :[0.57,0.60,0.63],      // 屋根(灰色塗り屋根)
  door :[0.72,0.75,0.78],      // 客用扉(無塗装ステンレス。地よりわずかに明るい)
  red  :[0.776,0.000,0.322],   // [D] 京王レッド #C60052
  navy :[0.000,0.200,0.627],   // [D] 京王ブルー #0033A0
  ivory:[0.941,0.937,0.918],   // [D] アイボリーホワイト #F0EFEA
  glass:[0.067,0.067,0.067],   // [D] ブラックアウトガラス #111111
  glassT:[0.105,0.108,0.115],  // 同上(上端側。わずかな明度差で平板に見せない)
  sash :[0.78,0.81,0.84],      // 窓框・貫通扉の枠(シルバー)
  dark :[0.09,0.10,0.11],      // 戸当り・幌の黒
  skirt:[0.333,0.333,0.333],   // [D] 排障器(スカート)#555555
  void :[0.045,0.050,0.055],   // 戸袋の奥(車内)。帯を通さず一様に暗くする

/* ---- 9-3. 帯([D] §6) --------------------------------------------------------
   京王ブルー(細い帯・下) Y=900〜950 / 京王レッド(太い帯・上) Y=950〜1100。
   2本は隙間なく接し、左右いっぱいまで"水平に"貫通する(前頭部でも跳ね上げない)。
   ※以前は「紺線が赤帯の上」としていたが、利用者提供の仕様書[D]に従い上下を入れ替えた。 */
// 帯の下げ量。実地確認により仕様書[D]の位置から35cm下げる。
// 仕様書は相対寸法なので mm で持ち、下げ量も同じ尺度に揃える(364mm≒0.350m)。
const BAND_DROP=364;
/* 赤帯の太さは仕様書[D]の150mmに対する倍率。実地確認により側面と前/後面で異なる。
   側面 1.20→さらに20%=1.44 / 前後 1.20→さらに30%=1.56。
   また側面の赤帯だけ10cm上げる(青帯は動かさないので、間にステンレス地が出る)。 */
const RED_THICK=1.44, FRED_THICK=1.56, SIDE_RED_UP=0.10;
const BLU=[fy(900-BAND_DROP),fy(950-BAND_DROP)];
const RED_BASE=fy(950-BAND_DROP);      // 帯の基準面(=青帯の上端)
const RED=[RED_BASE+SIDE_RED_UP, RED_BASE+SIDE_RED_UP+fh(150*RED_THICK)];
const BANDS=[
  {y0:0.00,    y1:BLU[0],  c:'stl' },   // 腰板(ステンレス地)
  {y0:BLU[0],  y1:BLU[1],  c:'navy'},   // 京王ブルー(細い帯)
  {y0:BLU[1],  y1:RED[0],  c:'stl' },   // 赤帯を上げたぶんの隙間
  {y0:RED[0],  y1:RED[1],  c:'red' },   // 京王レッド(太い帯)
  {y0:RED[1],  y1:K8.SHLD, c:'stl' },   // 幕板
  {y0:K8.SHLD, y1:9.99,    c:'roof'},   // 肩から上=屋根
];
// 側窓は「帯の上10cmから上」。帯を下げたぶん下端も下がり、上端はそのまま。
// 前/後面の赤帯は側面よりさらに下げる(青帯の高さは前後・側面で同じ)。
const FRED_DROP=0.33;   // 0.40から7cm上げた(実地確認)
// 前/後面の赤帯は側面の10cm上げを受けない。基準面から FRED_DROP だけ下げた位置。
const FRED=[RED_BASE-FRED_DROP, RED_BASE-FRED_DROP+fh(150*FRED_THICK)];
/* 側窓。かつては「赤帯の上端+10cm」から導いていたが、帯の太さや位置を実地確認で
   動かすたびに窓まで動いてしまうため、窓は帯から切り離してこの基準面から決める
   (値は切り離した時点の赤帯上端)。
   基準面+10cm を下端、3.05を上端とし、上下を30cmずつ切り詰めたうえで、
   中心を保って高さを WIN_GROW 倍にし、さらに WIN_DROP だけ下げる。 */
const WIN_REF=1.6859;
const WIN_TRIM=0.30, WIN_GROW=1.21, WIN_DROP=0.07;
const WIN=(function(){
  const b=WIN_REF+0.10+WIN_TRIM, t=3.05-WIN_TRIM;
  const c=(b+t)/2-WIN_DROP, h=(t-b)*WIN_GROW/2;
  return {B:c-h, T:c+h};
})();
const POCKET_NARROW=0.70;   // 戸袋窓は同じ中心で幅を30%狭める
const POCKET_R=0.075;       // 戸袋窓の角丸半径[m]
// 前面窓は帯を下げたぶん下へ広げる(上端はそのまま=窓が大きくなる)
const FWIN={B:fy(1200-BAND_DROP), T:fy(2500)};
// 扉窓の下端。帯の上に必ず出るようにする(帯を下げても窓が帯へ食い込まない)
const DWIN_B=Math.max(WIN.B-0.16, RED[1]+0.02);
// BANDS の健全性検査(下から順に連続していること)。壊れた表で描き始めない。
(function(){
  for(let i=0;i<BANDS.length;i++){
    if(!(BANDS[i].y1>BANDS[i].y0)) throw new Error('BANDS: y1<=y0 at '+i);
    if(i&&Math.abs(BANDS[i].y0-BANDS[i-1].y1)>1e-9) throw new Error('BANDS: 不連続 at '+i);
  }
  if(!(WIN.B>RED[1]&&WIN.T>WIN.B)) throw new Error('WIN: 側窓が帯と干渉');
})();
function bandAt(y){ for(const b of BANDS) if(y>=b.y0&&y<b.y1) return b.c; return 'stl'; }
// 前/後面の帯。赤だけ FRED_DROP ぶん低い位置にある。
function bandAtFront(y){
  if(y>=FRED[0]&&y<FRED[1]) return 'red';
  if(y>=BLU[0] &&y<BLU[1] ) return 'navy';
  return 'stl';
}

/* ---- 9-4. 断面と車体ロフト -------------------------------------------------
   ストレート車体(裾絞りなし)+丸屋根。断面を車長方向にスイープする。          */
const EPS=0.004;
// 客用扉の開口。外板に穴を開け、DOOR_REC だけ奥まった戸袋(内壁)を作る。
// 扉はこの凹みの"内側"を滑るので、開くと車内が見える。
const DOOR_Y0=K8.FLOOR+0.06, DOOR_Y1=K8.SHLD-0.10, DOOR_REC=0.07;
function uniqSorted(a,tol){
  const s=a.slice().sort((p,q)=>p-q), o=[s[0]];
  for(const v of s) if(v-o[o.length-1]>(tol||0.0015)) o.push(v);
  return o;
}
// 側面の高さ方向の頂点列。帯の境界は"固定"、肩から上の埋め点だけを個数固定で等分する。
// → 先頭部で肩が上がってもリングの頂点数が変わらない(接続が壊れない)。
const BAND_YS=(function(){
  const f=[K8.FLOOR];
  for(const b of BANDS) for(const k of [b.y0,b.y1])
    if(k>K8.FLOOR+0.02&&k<K8.SHLD-0.02){ f.push(k-EPS); f.push(k+EPS); }
  f.push(DOOR_Y0); f.push(DOOR_Y1);   // 扉の開口の上下端(ここで外板に穴を開ける)
  return uniqSorted(f);
})();
function sideYs(ys,nFill){
  const out=BAND_YS.slice(), top=BAND_YS[BAND_YS.length-1];
  for(let i=1;i<=nFill;i++) out.push(top+(ys-top)*i/nFill);
  return out;
}
// x位置における断面の形。[D]では前面も全幅2800(=車体幅)なので、幅は絞らない。
// 前頭部の丸みは「奥行き noseZ / noseZSide」で作る(平面視の絞りではない)。
function shapeAt(x,cabF,cabR){
  const half=K8.LEN/2;
  let cab=0;
  if(cabF&&x> half-K8.CAB) cab= 1;
  if(cabR&&x<-half+K8.CAB) cab=-1;
  return {x:x, hw:K8.W/2, ys:K8.SHLD, yt:K8.ROOF, cab:cab, t:0};
}
// 断面の点列(右側面 下→上 → 丸屋根 右→左 → 左側面 上→下)
function sectionPts(s,nRoof,nFill){
  const pts=[], dy=s.yt-s.ys;
  const R=((s.hw*s.hw)+dy*dy)/(2*dy), cy=s.yt-R, a0=Math.atan2(s.ys-cy,s.hw);
  const YS=sideYs(s.ys,nFill);
  for(const y of YS) pts.push([y, s.hw]);
  for(let i=1;i<nRoof;i++){ const th=a0+(Math.PI-2*a0)*i/nRoof;
    pts.push([cy+Math.sin(th)*R, Math.cos(th)*R]); }
  for(let i=YS.length-1;i>=0;i--) pts.push([YS[i], -s.hw]);
  return pts;
}
// 車長方向のstation(扉の縁・乗務員室境界・先頭部を細かく刻む)
function stationXs(cabF,cabR,LP){
  const half=K8.LEN/2, set=[-half,half];
  for(const dx of K8.DOORX) for(const e of [dx-K8.DOORW/2, dx+K8.DOORW/2]){ set.push(e-EPS); set.push(e+EPS); }
  if(cabF){ set.push(half-K8.CAB-EPS); set.push(half-K8.CAB+EPS); }
  if(cabR){ set.push(-half+K8.CAB-EPS); set.push(-half+K8.CAB+EPS); }
  for(let x=-half;x<=half;x+=LP.mid) set.push(x);
  if(cabF) for(let x=half-NOSE_MAX-0.05;x<=half;x+=LP.nose) set.push(x);
  if(cabR) for(let x=-half;x<=-half+NOSE_MAX+0.05;x+=LP.nose) set.push(x);
  return uniqSorted(set.filter(v=>v>=-half-1e-6&&v<=half+1e-6));
}
// 車体地色。前頭部はアイボリー地に、前方へ向かって跳ね上がる帯を乗せる。
// 車体地色。前頭部は普通鋼のアイボリー塗装で、帯は"水平に"左右を貫通する。
// 乗務員室は乗務員扉の直後まで、屋根の高さまで含めてアイボリー(灰色の屋根にしない)。
// front=true のときは前/後面用の帯(赤だけ低い)を使う。
function bodyColor(x,y,z,s,front){
  if(s.cab){
    const c=front?bandAtFront(y):bandAt(y);
    return c==='red'?PAL.red : c==='navy'?PAL.navy : PAL.ivory;
  }
  if(y>=s.ys-0.006) return PAL.roof;
  return PAL[bandAt(y)];
}
// 前面の輪郭(その高さでの半幅)と、前面上の点のx位置
function frontHalfAt(y){
  const hw=K8.W/2;
  if(y<=K8.SHLD) return hw;
  const dy=K8.ROOF-K8.SHLD, R=((hw*hw)+dy*dy)/(2*dy), cy=K8.ROOF-R;
  const v=R*R-(y-cy)*(y-cy);
  return v>0?Math.sqrt(v):0.02;
}
function frontXAt(y,z){
  const hw=frontHalfAt(y), zz=Math.max(-hw,Math.min(hw,z));
  return K8.LEN/2-noseZ(y)-noseZSide(zz,hw);
}
const frontX=y=>frontXAt(y,0);   // 中心線上の前面位置
function buildBodyGeo(cabF,cabR,LP){
  const P=[],C=[],I=[];
  const vtx=(x,y,z,c)=>{ const i=P.length/3; P.push(x,y,z); C.push(c[0],c[1],c[2]); return i; };
  const xs=stationXs(cabF,cabR,LP), rings=[];
  for(const x of xs){
    const s=shapeAt(x,cabF,cabR), pts=sectionPts(s,LP.roof,LP.fill), ring=[];
    for(const p of pts){
      // 先頭側では、各頂点を自分の前面位置より前へ出さない(=前頭部の曲面に押し当てる)
      let xv=x;
      if(cabF) xv=Math.min(xv, frontXAt(p[0],p[1]));
      if(cabR) xv=Math.max(xv,-frontXAt(p[0],p[1]));
      ring.push(vtx(xv,p[0],p[1],bodyColor(x,p[0],p[1],s)));
    }
    rings.push(ring);
  }
  // 断面リングは閉じた多角形として扱う(k+1 を巡回させる)。
  // 巡回させないと車体の"床"が張られず、下から見ると中が透けて見える。
  // 客用扉の位置だけは外板を張らず、穴を開けて奥に戸袋(内壁)を作る。
  const inDoor=(xm,ya,yb,za,zb)=>
    Math.abs(za-zb)<1e-6 && Math.abs(Math.abs(za)-K8.W/2)<0.02 &&
    Math.min(ya,yb)>DOOR_Y0-1e-6 && Math.max(ya,yb)<DOOR_Y1+1e-6 &&
    K8.DOORX.some(d=>Math.abs(xm-d)<K8.DOORW/2-1e-6);
  for(let i=0;i<rings.length-1;i++){
    const A=rings[i],B=rings[i+1];
    for(let k=0;k<A.length;k++){
      const k2=(k+1)%A.length;
      const xm=(P[A[k]*3]+P[B[k]*3])/2;
      if(inDoor(xm,P[A[k]*3+1],P[A[k2]*3+1],P[A[k]*3+2],P[A[k2]*3+2])) continue;
      I.push(A[k],B[k],B[k2]); I.push(A[k],B[k2],A[k2]);
    }
  }
  // 戸袋(奥まった開口)。外向きの法線を保つため、-z側は頂点の並びを逆にする。
  for(const dx of K8.DOORX){
    const a=dx-K8.DOORW/2, b=dx+K8.DOORW/2;
    for(const sz of [1,-1]){
      const zo=sz*K8.W/2, zi=sz*(K8.W/2-DOOR_REC);
      const quad=(q0,q1,q2,q3)=>{
        const v=[q0,q1,q2,q3].map(q=>vtx(q[0],q[1],q[2],PAL.void));
        if(sz>0){ I.push(v[0],v[1],v[2]); I.push(v[0],v[2],v[3]); }
        else    { I.push(v[3],v[2],v[1]); I.push(v[3],v[1],v[0]); }
      };
      quad([a,DOOR_Y0,zi],[b,DOOR_Y0,zi],[b,DOOR_Y1,zi],[a,DOOR_Y1,zi]);   // 内壁
      quad([a,DOOR_Y0,zo],[b,DOOR_Y0,zo],[b,DOOR_Y0,zi],[a,DOOR_Y0,zi]);   // 下の見込み
      quad([a,DOOR_Y1,zi],[b,DOOR_Y1,zi],[b,DOOR_Y1,zo],[a,DOOR_Y1,zo]);   // 上の見込み
      quad([a,DOOR_Y0,zo],[a,DOOR_Y0,zi],[a,DOOR_Y1,zi],[a,DOOR_Y1,zo]);   // 左の見込み
      quad([b,DOOR_Y0,zi],[b,DOOR_Y0,zo],[b,DOOR_Y1,zo],[b,DOOR_Y1,zi]);   // 右の見込み
    }
  }
  // 両端を面で閉じる。先頭側は後傾した前面、連結側は平らな妻面。
  for(const end of [{sgn:1,cab:cabF},{sgn:-1,cab:cabR}]){
    const sgn=end.sgn, tip=shapeAt(sgn*K8.LEN/2,cabF,cabR);
    const yTop=tip.yt, rows=[K8.FLOOR];
    for(const b of BANDS) for(const k of [b.y0,b.y1])
      if(k>K8.FLOOR+0.02&&k<yTop-0.02){ rows.push(k-EPS); rows.push(k+EPS); }
    // 前/後面の赤帯は側面と高さが違うので、その境界にも頂点を置く
    // (置かないと帯の縁が刻みの位置に丸められ、指定した太さで出ない)
    if(end.cab) for(const k of FRED)
      if(k>K8.FLOOR+0.02&&k<yTop-0.02){ rows.push(k-EPS); rows.push(k+EPS); }
    for(let y=K8.FLOOR+LP.face;y<yTop;y+=LP.face) rows.push(y);
    rows.push(yTop);
    const RY=uniqSorted(rows), NC=LP.faceC, grid=[];
    for(const y of RY){
      const hw=Math.max(0.02,frontHalfAt(y));
      const row=[];
      for(let ci=0;ci<=NC;ci++){
        const z=-hw+2*hw*ci/NC;
        const x=sgn*(end.cab?frontXAt(y,z):K8.LEN/2);
        const c=end.cab?bodyColor(sgn*K8.LEN/2,y,z,{hw:hw,ys:tip.ys,cab:sgn},true)
                       :(y>=tip.ys-0.006?PAL.roof:PAL.stl);
        row.push(vtx(x,y,sgn*z,c));
      }
      grid.push(row);
    }
    // 巻き順は前後で共通にする。妻面の頂点は z を sgn 倍して積んでいるので、
    // 巻き順まで反転させると二重に反転し、法線が車体の内側を向いてしまう
    // (後面の一部が裏面カリングで透けて見える原因だった)。
    for(let r=0;r<grid.length-1;r++){
      const A=grid[r],B=grid[r+1];
      for(let ci=0;ci<NC;ci++){
        I.push(A[ci],B[ci],B[ci+1]); I.push(A[ci],B[ci+1],A[ci+1]);
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

/* ---- 9-5. 側面のレイアウト(扉配置から窓割りを自動生成) ----------------------
   K8.DOORX / K8.DOORW を変えれば窓割りも自動で追従する。                      */
// 端の柱/窓間の柱/窓の最大幅[m]。
// 端の柱は"戸袋"でもあるので、扉が全開したときに窓へ被らない幅(片開き1枚ぶん)が要る。
const PIER_END=0.68, PIER_MID=0.26, WIN_MAX=1.00;
// 同じ区画に並ぶ窓どうしを近づける量[m](幅は変えず、位置だけ内側へ寄せる)
const WIN_CLOSE=0.05;
const CREW={ doorX:8.30, doorW:0.72, doorT:2.95,    // 乗務員扉(中心x/幅/上端)
             winX:9.12, winW:0.66, winB:2.18, winT:2.98 };  // 乗務員室側窓
function sideWindows(cabF,cabR){
  const half=K8.LEN/2, hw=K8.DOORW/2, e=[-half];
  for(const dx of K8.DOORX){ e.push(dx-hw); e.push(dx+hw); }
  e.push(half);
  const out=[];
  for(let i=0;i<e.length-1;i+=2){
    let a=e[i], b=e[i+1];
    // 乗務員室にかかる区間は客用窓を置かず、乗務員扉+乗務員室側窓に置き換える
    if(cabF&&b>half-K8.CAB) continue;
    if(cabR&&a<-half+K8.CAB) continue;
    const L=b-a;
    const n=Math.max(1,Math.round((L-2*PIER_END+PIER_MID)/(WIN_MAX+PIER_MID)));
    const w=(L-2*PIER_END-(n-1)*PIER_MID)/n;
    if(w<0.35) continue;
    for(let k=0;k<n;k++){
      // 区画の中心へ向けて WIN_CLOSE/2 ずつ寄せる(2枚なら間隔が WIN_CLOSE 縮む)
      const sh=(n>1)?(WIN_CLOSE/2)*(n-1-2*k)/(n-1):0;
      const x0=a+PIER_END+k*(w+PIER_MID)+sh;
      out.push([x0,x0+w]);
    }
  }
  return out;
}
// 戸袋窓:客用扉の両脇(戸袋の上)に置く小窓。
// 端の柱=戸袋なので、扉が開くとこの窓の前を通る(車体の外を滑る簡略化のため)。
function pocketWindows(cabF,cabR){
  const out=[], half=K8.LEN/2, hw=K8.DOORW/2;
  for(const dx of K8.DOORX) for(const sg of [-1,1]){
    const a=dx+sg*hw, b=a+sg*PIER_END;
    let lo=Math.min(a,b)+0.07, hi=Math.max(a,b)-0.07;
    const c=(lo+hi)/2, w=(hi-lo)*POCKET_NARROW/2;      // 中心を保って幅を狭める
    lo=c-w; hi=c+w;
    if(hi-lo<0.15) continue;
    if(cabF&&hi> half-K8.CAB) continue;      // 乗務員室側には置かない
    if(cabR&&lo<-half+K8.CAB) continue;
    out.push([lo,hi]);
  }
  return out;
}
/* ---- 9-6. 窓・扉パネル(車体表面のわずか外側に置く独立メッシュ) --------------
   材質は DoubleSide。巻き順の反転で面が消える事故(TEMPLATE.md §6)を構造的に断つ。 */
const OUT=0.006;   // 車体表面からの浮かせ量[m]
function pushQuad(P,C,I,p0,p1,p2,p3,c0,c1){
  const b=P.length/3;
  const cs=[c0,c0,c1,c1];                       // 下2点=c0 / 上2点=c1(上下のグラデーション)
  const ps=[p0,p1,p2,p3];
  for(let i=0;i<4;i++){ P.push(ps[i][0],ps[i][1],ps[i][2]); C.push(cs[i][0],cs[i][1],cs[i][2]); }
  I.push(b,b+1,b+2); I.push(b,b+2,b+3);
}
// 側面の矩形パネル。帯の境界で水平に切り、各段の色を帯に従わせる(帯が扉を横切る)。
// z座標は関数 zf(x) で与える。先頭部で車体が絞れてもパネルが浮かない。
function sidePanel(P,C,I,x0,x1,y0,y1,zf,baseKey){
  const ys=[y0,y1];
  for(const b of BANDS) for(const k of [b.y0,b.y1]) if(k>y0+0.005&&k<y1-0.005) ys.push(k);
  const Y=uniqSorted(ys,0.003);
  const za=zf(x0), zb=zf(x1);
  for(let i=0;i<Y.length-1;i++){
    const bk=bandAt((Y[i]+Y[i+1])/2);
    const c=bk==='red'?PAL.red:bk==='navy'?PAL.navy:PAL[baseKey];
    pushQuad(P,C,I,[x0,Y[i],za],[x1,Y[i],zb],[x1,Y[i+1],zb],[x0,Y[i+1],za],c,c);
  }
}
// 窓(框で縁取り、ガラスは上下でわずかに明度差)
function sideWindow(P,C,I,x0,x1,y0,y1,zf,zg){
  const f=0.055;   // 框の幅[m]
  pushQuad(P,C,I,[x0,y0,zf(x0)],[x1,y0,zf(x1)],[x1,y1,zf(x1)],[x0,y1,zf(x0)],PAL.sash,PAL.sash);
  pushQuad(P,C,I,[x0+f,y0+f,zg(x0+f)],[x1-f,y0+f,zg(x1-f)],
                 [x1-f,y1-f,zg(x1-f)],[x0+f,y1-f,zg(x0+f)],PAL.glass,PAL.glassT);
}
// 角丸の窓。上下の隅を半径rで丸める(戸袋窓に使う)。
function roundWindow(P,C,I,x0,x1,y0,y1,zf,zg,r){
  const xc=(x0+x1)/2, hw=(x1-x0)/2, yc=(y0+y1)/2, hh=(y1-y0)/2, f=0.045;
  const rr=Math.min(r,hw*0.85,hh*0.85);
  const halfAt=(y,sh)=>{           // その高さでの半幅(shだけ内側に縮めた輪郭)
    const w=hw-sh, h=hh-sh, q=Math.max(0,Math.min(rr,w*0.85,h*0.85));
    const d=Math.abs(y-yc)-(h-q);
    if(d<=0) return w;
    const v=q*q-d*d;
    return w-q+(v>0?Math.sqrt(v):0);
  };
  const N=12;
  for(const lay of [{sh:0,zz:zf,c:PAL.sash,c2:PAL.sash},
                    {sh:f,zz:zg,c:PAL.glass,c2:PAL.glassT}]){
    const yA=yc-(hh-lay.sh), yB=yc+(hh-lay.sh);
    for(let i=0;i<N;i++){
      const ya=yA+(yB-yA)*i/N, yb=yA+(yB-yA)*(i+1)/N;
      const ha=halfAt(ya,lay.sh), hb=halfAt(yb,lay.sh);
      if(ha<=0||hb<=0) continue;
      pushQuad(P,C,I,[xc-ha,ya,lay.zz(xc-ha)],[xc+ha,ya,lay.zz(xc+ha)],
                     [xc+hb,yb,lay.zz(xc+hb)],[xc-hb,yb,lay.zz(xc-hb)],
               lay.c,lay.sh?lay.c2:lay.c);
    }
  }
}
function buildTrimGeo(cabF,cabR){
  const P=[],C=[],I=[];
  const hwAt=x=>shapeAt(x,cabF,cabR).hw;      // その位置の車体半幅(先頭部の絞りを含む)
  for(const sz of [1,-1]){
    const zo=o=>(x=>sz*(hwAt(x)+o));          // 車体表面から o だけ浮かせた面
    // 客用扉の開口は車体ロフト側で"穴"にして奥まった戸袋を作る(9-4節)。
    // ここでは何も描かない。
    // 客用窓(扉配置から自動生成)
    for(const w of sideWindows(cabF,cabR))
      sideWindow(P,C,I,w[0],w[1],WIN.B,WIN.T,zo(OUT),zo(OUT*0.5));
    // 戸袋窓(角丸)
    for(const w of pocketWindows(cabF,cabR))
      roundWindow(P,C,I,w[0],w[1],WIN.B,WIN.T,zo(OUT),zo(OUT*0.5),POCKET_R);
    // 乗務員扉・乗務員室側窓
    for(const end of [{s:1,on:cabF},{s:-1,on:cabR}]){
      if(!end.on) continue;
      const sg=end.s, dx=sg*CREW.doorX, wx=sg*CREW.winX;
      const rng=(c,w)=>[Math.min(c-w/2,c+w/2), Math.max(c-w/2,c+w/2)];
      const d=rng(dx,CREW.doorW), v=rng(wx,CREW.winW);
      sidePanel(P,C,I,d[0],d[1],K8.FLOOR+0.06,CREW.doorT,zo(OUT),'ivory');
      sideWindow(P,C,I,d[0]+0.08,d[1]-0.08,2.20,CREW.doorT-0.12,zo(OUT*2),zo(OUT*1.5));
      sideWindow(P,C,I,v[0],v[1],CREW.winB,CREW.winT,zo(OUT),zo(OUT*0.5));
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}
/* ---- 9-7. 前面([D] §3〜§8) --------------------------------------------------
   前面はすべてジオメトリ。ブラックアウトした大型ガラス(角丸)・貫通扉・表示器・
   灯具・排障器で構成する。位置と寸法は仕様書[D]のmm値を fz/fy/fh/fd で写して使う。 */
const FOUT=0.008;                       // 前面部品を車体表面から浮かせる量[m]
const GZ=fz(1350), GR=fd(150);          // [D] §3 ガラスの半幅と角丸半径
const DZ=fz(400), DFW=fd(10);           // [D] §4 貫通扉の半幅と枠の幅
const SK_BOT=fy(-500), SK_NOTCH=fy(-200), SK_Z=fz(400);   // [D] §8 排障器
// ガラス(角丸長方形)の、その高さでの半幅
function glassHalf(y){
  if(y<FWIN.B||y>FWIN.T) return 0;
  let d=GZ;
  if(y<FWIN.B+GR){ const t=GR-(y-FWIN.B); d=GZ-GR+Math.sqrt(Math.max(0,GR*GR-t*t)); }
  else if(y>FWIN.T-GR){ const t=GR-(FWIN.T-y); d=GZ-GR+Math.sqrt(Math.max(0,GR*GR-t*t)); }
  return Math.min(d, frontHalfAt(y)-0.02);
}
/* 前面の曲面に沿う小さな矩形パネル。
   平らな箱を前面に置くと、前頭部が側方へ回り込むぶん外側の端が車体に沈む
   (行先表示器が一部埋もれて見えていた原因)。面に沿わせて作ることで防ぐ。 */
function buildFacePanelGeo(sgn,zc,wz,yc,hy,out){
  const P=[],I=[],N=10, y0=yc-hy/2, y1=yc+hy/2;
  for(let i=0;i<=N;i++){
    const z=zc-wz/2+wz*i/N;
    P.push(sgn*(frontXAt(y0,z)+out), y0, sgn*z);
    P.push(sgn*(frontXAt(y1,z)+out), y1, sgn*z);
  }
  for(let i=0;i<N;i++){const k=i*2;I.push(k,k+1,k+2,k+1,k+3,k+2);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}
function buildFaceGeo(sgn){
  const P=[],C=[],I=[];
  // 前面上の点。左右位置zと高さyから、前頭部の曲面に沿うxを求める
  const at=(y,z,o)=>{
    const hw=frontHalfAt(y), zz=Math.max(-hw,Math.min(hw,z));
    return [sgn*(frontXAt(y,zz)+(o===undefined?FOUT:o)), y, sgn*zz];
  };
  const mix=t=>[PAL.glass[0]+(PAL.glassT[0]-PAL.glass[0])*t,
                PAL.glass[1]+(PAL.glassT[1]-PAL.glass[1])*t,
                PAL.glass[2]+(PAL.glassT[2]-PAL.glass[2])*t];
  // §3 ブラックアウトした大型ガラス。"一つの巨大なサングラス"として一枚で張り、
  //    曲面に沿わせるため縦横に細かく分割する(側面へシームレスに回り込む)。
  const NY=28, NZ=24;
  for(let i=0;i<NY;i++){
    const ya=FWIN.B+(FWIN.T-FWIN.B)*i/NY, yb=FWIN.B+(FWIN.T-FWIN.B)*(i+1)/NY;
    const ha=glassHalf(ya), hb=glassHalf(yb);
    if(ha<=0||hb<=0) continue;
    for(let j=0;j<NZ;j++){
      const t0=j/NZ, t1=(j+1)/NZ;
      pushQuad(P,C,I,at(ya,-ha+2*ha*t0),at(ya,-ha+2*ha*t1),
                     at(yb,-hb+2*hb*t1),at(yb,-hb+2*hb*t0),mix(i/NY),mix((i+1)/NY));
    }
  }
  // §4 前面貫通扉。ガラスと同じ黒仕上げなので、細いシルバーの枠線だけを描く
  for(const zz of [-DZ,DZ])
    for(let i=0;i<14;i++){
      const ya=FWIN.B+(FWIN.T-FWIN.B)*i/14, yb=FWIN.B+(FWIN.T-FWIN.B)*(i+1)/14;
      pushQuad(P,C,I,at(ya,zz-DFW,FOUT*2),at(ya,zz+DFW,FOUT*2),
                     at(yb,zz+DFW,FOUT*2),at(yb,zz-DFW,FOUT*2),PAL.sash,PAL.sash);
    }
  for(let j=0;j<10;j++){
    const za=-DZ+2*DZ*j/10, zb=-DZ+2*DZ*(j+1)/10;
    for(const yy of [FWIN.B+DFW,FWIN.T-DFW])
      pushQuad(P,C,I,at(yy-DFW,za,FOUT*2),at(yy-DFW,zb,FOUT*2),
                     at(yy+DFW,zb,FOUT*2),at(yy+DFW,za,FOUT*2),PAL.sash,PAL.sash);
  }
  // §8 排障器(スカート)。中央は連結器を通すため逆U字に切り欠く
  const hw0=K8.W/2, NS=28;
  for(let j=0;j<NS;j++){
    const za=-hw0+2*hw0*j/NS, zb=-hw0+2*hw0*(j+1)/NS;
    const ba=(Math.abs(za)<SK_Z)?SK_NOTCH:SK_BOT, bb=(Math.abs(zb)<SK_Z)?SK_NOTCH:SK_BOT;
    const xa=sgn*(frontXAt(K8.FLOOR,za)-0.03), xb=sgn*(frontXAt(K8.FLOOR,zb)-0.03);
    pushQuad(P,C,I,[xa,ba,sgn*za],[xb,bb,sgn*zb],
                   [xb,K8.FLOOR,sgn*zb],[xa,K8.FLOOR,sgn*za],PAL.skirt,PAL.skirt);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

/* ---- 9-7b. 客用扉(2枚引戸。停車中にホーム側だけ開く) ------------------------
   扉は車体トリムから分離し、片開き1枚を1つのジオメトリにして
   4箇所×2枚×左右2面=16枚をインスタンスで配置する。開閉は行列の更新だけで済む。 */
const DOOR_HW=K8.DOORW/4;       // 片開き1枚の半幅[m]
const DOOR_SLIDE=K8.DOORW/2;    // 開いたときの移動量[m](=片開き1枚ぶん。全開)
/* 左右2面ぶんのジオメトリを別々に作る。
   1つのジオメトリを scale.z=-1 で鏡像にすると面の巻き順が裏返り、法線が
   内側を向く。同じ材質でも陰影が変わって「片側だけ色が違う」ように見えるので、
   -z 面は z を反転したうえで巻き順も反転した専用ジオメトリを持つ。 */
function buildDoorLeaf(sz){
  const P=[],C=[],I=[];
  const z0=()=>0, z1=()=>sz*0.006, z2=()=>sz*0.003;
  sidePanel(P,C,I,-DOOR_HW,DOOR_HW,K8.FLOOR+0.06,K8.SHLD-0.10,z0,'door');
  // 扉の窓も戸袋窓と同じ角丸にする(隅の処理を揃える)
  roundWindow(P,C,I,-DOOR_HW+0.07,DOOR_HW-0.07,DWIN_B,WIN.T-0.05,z1,z2,POCKET_R);
  if(sz<0) for(let i=0;i<I.length;i+=3){const t=I[i+1];I[i+1]=I[i+2];I[i+2]=t;}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}
const G_DOORLEAF={p:buildDoorLeaf(1), m:buildDoorLeaf(-1)};
const _drM=new THREE.Matrix4(),_drQ=new THREE.Quaternion(),
      _drP=new THREE.Vector3(),_drS=new THREE.Vector3(1,1,1);
// 開度 r(0=閉/1=開)を反映する。side は開ける面(車体ローカルzの符号)。
function setCarDoors(c,r,side){
  const d=c.userData&&c.userData.doors;
  if(!d) return;
  const zf=K8.W/2-DOOR_REC/2;   // 扉は戸袋の凹みの"内側"を滑る
  for(const sz of [1,-1]){
    const op=(sz===side)?r:0;                    // 開くのはホームに面した側だけ
    const inst=(sz>0)?d.p:d.m;                   // 面ごとに専用ジオメトリ(鏡像は巻き順も反転)
    let i=0;
    for(const dx of K8.DOORX){
      for(const sg of [-1,1]){
        _drP.set(dx+sg*(DOOR_HW+DOOR_SLIDE*op), 0, sz*zf);
        _drM.compose(_drP,_drQ,_drS);

}

function putRod(g,geo,mat,x0,y0,x1,y1,z,addFine){
  const dx=x1-x0, dy=y1-y0;
  const m=new THREE.Mesh(geo,mat);
  m.scale.x=Math.hypot(dx,dy);
  m.rotation.z=Math.atan2(dy,dx);
  m.position.set((x0+x1)/2,(y0+y1)/2,z);
  if(addFine) addFine(m); else g.add(m);   // addFine は内部で g.add する
  return m;
}
function addPanto(g,px,addFine){
  const y0=K8.ROOF+PT.BASE, yf=y0+PT.INS;              // 台枠の高さ
  // g.add() は Group を返すので、g.add(mesh).position.set(..) と書くと
  // メッシュではなく"車両グループ全体"が動いてしまう。必ずメッシュを受け取って置く。
  const put=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);g.add(m);return m;};
  for(const sz of [-1,1]) put(G_PFR,M_PN,px,yf,sz*PT.ZBAS);            // 台枠(縦)
  for(const sx of [-1,1]){
    put(G_PFX,M_PN,px+sx*1.11,yf,0);                                   // 台枠(横)

      addFine(new THREE.Mesh(G_PINS,M_INS)).position.set(px+sx*1.02,y0+PT.INS/2,sz*0.78);

  const pv=px+PT.PIVX, kn=px+PT.KNEX, tp=px+PT.TOPX, ys=yf+PT.TOPY;
  for(const sz of [-1,1]){
    putRod(g,G_PLOW,M_PN, pv,yf, kn,yf+PT.KNEY, sz*PT.ZLOW);           // 下枠
    putRod(g,G_PUPP,M_PN, kn,yf+PT.KNEY, tp,ys, sz*PT.ZUPP);           // 上枠
    addFine(new THREE.Mesh(G_PSPR,M_PN)).position.set(pv,yf+0.13,sz*PT.ZLOW);   // 復元ばね
  }
  for(const t of [0.30,0.70])                          // 下枠の補強(左右をつなぐ)
    addFine(new THREE.Mesh(G_PBRC,M_PN)).position.set(pv+(kn-pv)*t, yf+PT.KNEY*t, 0);

  putRod(g,G_PROD,M_PN, pv+0.34,yf+0.09, tp+0.06,ys-0.10, 0, addFine);
  put(G_PSHO,M_SH,tp,ys,0);                                            // 舟体

    const ax=new THREE.Mesh(G_AXL,M_WHL); ax.rotation.x=Math.PI/2; ax.position.set(bx+wx,K8.WHEEL,0); g.add(ax);
    for(const wz of [-RAIL_OFF,RAIL_OFF]){   // 車輪はレール中心の真上(軌間1372mm)
      const w=new THREE.Mesh(G_WHL,M_WHL); w.rotation.x=Math.PI/2; w.position.set(bx+wx,K8.WHEEL,wz); g.add(w);
      const d=addFine(new THREE.Mesh(G_DISC,M_DISC)); d.rotation.x=Math.PI/2; d.position.set(bx+wx,K8.WHEEL,wz*0.42);
      addFine(new THREE.Mesh(G_ABX,M_BOG)).position.set(bx+wx,K8.WHEEL+0.10,wz*1.19);   // 軸箱は車輪の外側
    }
    if(motored){
      const mt=addFine(new THREE.Mesh(G_MOT,M_BOG)); mt.rotation.x=Math.PI/2;
      mt.position.set(bx+wx*0.35,K8.WHEEL+0.06,0);
    }
  }
}
function makeCar(livery,panto,cabF,cabR){   // livery は 'keio' のみ(交差鉄道は makeXCar)
  const g=new THREE.Group();
  const key=cabF?'cf':(cabR?'cr':'mid');
  const body=new THREE.Mesh(CARGEO[key],CARMAT); g.add(body);
  const trim=new THREE.Mesh(TRIMGEO[key],TRIMMAT); g.add(trim);
  g.userData.body=body; g.userData.key=key; g.userData.hi=true;
  const fine=[];                        // 遠景で消す細部(LOD)
  const addFine=m=>{ g.add(m); fine.push(m); return m; };
  if(cabF) g.add(new THREE.Mesh(FACEGEO.f,TRIMMAT));
  if(cabR) g.add(new THREE.Mesh(FACEGEO.r,TRIMMAT));
  {                                    // 客用扉(4箇所×2枚×左右2面=16枚)
    const n=K8.DOORX.length*2;
    const ip=new THREE.InstancedMesh(G_DOORLEAF.p,TRIMMAT,n);   // +z面
    const im=new THREE.InstancedMesh(G_DOORLEAF.m,TRIMMAT,n);   // -z面
    g.add(ip); g.add(im);
    g.userData.doors={p:ip,m:im,r:-1,side:1};
    setCarDoors(g,0,1);
  }
  // 屋根上:集中式冷房1基+前後のダクトカバー
  {
    const y0=K8.ROOF+AC_H/2-0.04;
    const ac=new THREE.Mesh(G_AC ,M_AC ); ac.position.set(0,y0,0); g.add(ac);
    const at=new THREE.Mesh(G_ACT,M_ACL); at.position.set(0,y0+AC_H/2+0.02,0); g.add(at);
    for(const fx of [-AC_L*0.25,AC_L*0.25]){             // 凝縮器ファンのグリル
      const fn=addFine(new THREE.Mesh(G_ACF,M_ACL));
      fn.position.set(fx,y0+AC_H/2+0.07,0);
    }
    for(const sz of [-1,1])                              // 側面の点検蓋
      addFine(new THREE.Mesh(G_ACS,M_ACL)).position.set(0,y0-0.06,sz*(AC_W/2-0.06));
    for(const dx of [-DUCT_C,DUCT_C]){
      const du=new THREE.Mesh(G_DUCT,M_DUCT); du.position.set(dx,K8.ROOF+0.02,0); g.add(du);
    }
  }
  // 床下機器
  const vv=new THREE.Mesh(G_VVVF,M_UND); vv.position.set(-3.30,K8.FLOOR-0.36,0); g.add(vv);
  const sv=new THREE.Mesh(G_SIV ,M_UND); sv.position.set( 0.40,K8.FLOOR-0.34,0); g.add(sv);
  const cp=new THREE.Mesh(G_CP  ,M_UND); cp.position.set( 3.40,K8.FLOOR-0.31,-0.20); addFine(cp);
  const bt=new THREE.Mesh(G_BAT ,M_UND); bt.position.set(-6.20,K8.FLOOR-0.28,0.10); addFine(bt);
  const tk=new THREE.Mesh(G_TANK,M_UND); tk.rotation.z=Math.PI/2; tk.position.set(5.40,K8.FLOOR-0.30,0.55); addFine(tk);
  // 台車(先頭台車は付随、他は電動という簡略。編成の見た目には十分)
  addBogie(g,-K8.BOGIE/2, !cabR, addFine);
  addBogie(g, K8.BOGIE/2, !cabF, addFine);
  // 前頭部の部品([D] §5 §7)。表示器と灯具ケースは前面の曲面に沿うパネルなので
  // ジオメトリ側に位置が入っている(埋もれない)。ランプだけ個別に置く。
  for(const end of [{s:1,on:cabF,k:'f'},{s:-1,on:cabR,k:'r'}]){
    if(!end.on) continue;
    const sg=end.s;
    for(const cg of G_LCASE[end.k]) g.add(new THREE.Mesh(cg,M_LCASE));   // ライトケース
    for(const sz of [-1,1]){
      const zh=sz*(LZ-LGAP), zt=sz*(LZ+LGAP);            // 内側=前照灯 / 外側=尾灯
      const hl=addFine(new THREE.Mesh(G_HLAMP,M_HL));
      hl.rotation.z=Math.PI/2; hl.position.set(sg*(frontXAt(LY,zh)+0.034),LY,sg*zh);
      const tl=addFine(new THREE.Mesh(G_LAMP,M_TL));
      tl.rotation.z=Math.PI/2; tl.position.set(sg*(frontXAt(LY,zt)+0.034),LY,sg*zt);
    }
    addFine(new THREE.Mesh(G_SIGNT[end.k],M_SIGNT));      // 種別表示(左)
    addFine(new THREE.Mesh(G_SIGND[end.k],M_SIGND));      // 行先表示(右)
    addFine(new THREE.Mesh(G_CPL,M_CPL))                  // 連結器(排障器の切り欠きの中)
      .position.set(sg*(K8.LEN/2-0.06),fy(-260),0);
  }
  // 連結面の幌(先頭でない側)
  for(const end of [{s:1,on:!cabF},{s:-1,on:!cabR}]){
    if(!end.on) continue;
    addFine(new THREE.Mesh(G_HOOD,M_HOOD)).position.set(end.s*(K8.LEN/2+0.06),2.05,0);
  }
  if(panto) addPanto(g,-(K8.LEN/2-PANTO_FROM_END),addFine);
  g.userData.fine=fine;
  scene.add(g); return g;
}

/* ---- 走行列車(3本)。各駅停車のダイヤを自動運転で再現する ----
   加速=P4(3.3km/h/s), 上限=60km/h, 減速=B5(3.0km/h/s), 停車時間=25秒。
   状態機械: 'run'(駅間走行) → 'brake'(停止位置へ減速) → 'dwell'(25秒停車) → 'run' */
const DRIVE={ACC:3.3, DEC:3.0, VMAX_KMH:60, DWELL:25};   // 自動運転パラメータ
// 駅別の停車時間[秒](未記載の駅は DRIVE.DWELL)。待避線に入る駅は1分。
const DWELL_OF={'八幡山':60,'明大前':60,'桜上水':60,'千歳烏山':60};
const trains=[];
[[1, 300],[1, 3000],[-1, 5600]].forEach(function(a){
  const dir=a[0], xs=a[1], cars=[];
  // 先頭部は編成の外側へ。パンタは西端から2/3/6/7/9両目(向きで j を読み替える)
  for(let j=0;j<10;j++)cars.push(makeCar('keio',hasPanto(dir>0?j+1:10-j), j===0, j===9));
  const reset=(dir>0)?(DOM.x0-210):(DOM.x1+210);
  // st=状態, v=速度[m/s], dwell=停車残り時間, target=次の停止位置s
  trains.push({dir:dir, x:xs, x0:reset, v:0, st:'run', dwell:0, target:null, atSt:null, cars:cars});
});
// 進行方向の次の停止位置を返す。停車時間の決定に使うので駅も一緒に持つ。
// stopPosOf は「先頭(運転台)を着ける位置」を返すが、列車の t.x は先頭車の"中心"なので
// 車体半長ぶん手前を目標にする。ここを取り違えると編成が車体半長だけホームからはみ出す。
function nextStopFor(t){
  let best=null;
  for(const s of STA){
    const sp=stopPosOf(s,t.dir)-t.dir*CAR_HALF;
    if(t.dir>0 && sp>t.x+1 && (best===null||sp<best.s)) best={s:sp,st:s};
    if(t.dir<0 && sp<t.x-1 && (best===null||sp>best.s)) best={s:sp,st:s};
  }
  return best;
}
function dwellOf(st){ return (st&&DWELL_OF[st.n])||DRIVE.DWELL; }
// 1列車の自動運転を1フレーム進める
function driveTrain(t,dt){
  const VMAX=DRIVE.VMAX_KMH/3.6;
  if(t.st==='dwell'){                       // 停車中:残り時間を減らす
    t.dwell-=dt;
    if(t.dwell<=0){ t.st='run'; t.target=nextStopFor(t); }
    return;
  }
  if(t.target===null) t.target=nextStopFor(t);
  if(t.target===null){                      // 前方に駅なし=端へ。折返して入り直す
    t.x+=t.dir*t.v*dt; t.v=Math.min(VMAX,t.v+DRIVE.ACC/3.6*dt);
    if((t.dir>0&&t.x>DOM.x1-CAR_HALF)||(t.dir<0&&t.x<DOM.x0+CAR_HALF)){ t.x=t.x0; t.v=0; t.st='run'; t.target=null; }
    return;
  }
  const dist=(t.target.s-t.x)*t.dir;       // 停止位置までの残距離[m](進行方向正)
  const brakeDist=(t.v*t.v)/(2*DRIVE.DEC/3.6);   // 現速度から止まるのに要る距離
  if(dist<=brakeDist+0.2){                   // 減速フェーズ
    t.st='brake';
    t.v=Math.max(0, t.v-DRIVE.DEC/3.6*dt);
    if(t.v<0.15 && dist<1.0){ t.x=t.target.s; t.v=0; t.st='dwell';
      t.dwell=dwellOf(t.target.st); t.atSt=t.target.st; }   // 停車時間は駅別(八幡山60秒)
    else t.x+=t.dir*t.v*dt;
  }else{                                     // 力行/惰行フェーズ(60km/h上限)
    t.st='run';
    t.v=Math.min(VMAX, t.v+DRIVE.ACC/3.6*dt);
    t.x+=t.dir*t.v*dt;
  }
}

// 車両は「前後の車端2点を結ぶ弦」に沿って配置する(曲線でも必ず線路方向を向く)
const CAR_HALF=K8.LEN/2;
// 車端2点の実位置から姿勢(ヨー+ピッチ)を決める。勾配区間でも車体が線路に沿う
let LOD_NEAR=420;   // この距離までは高精細モデル(スマホでは短縮)
const _UP=new THREE.Vector3(0,1,0), _F=new THREE.Vector3(), _R=new THREE.Vector3(),
      _U=new THREE.Vector3(), _M4=new THREE.Matrix4();
function seatCar(c,s,zf,dir){
  const sA=s-CAR_HALF, sB=s+CAR_HALF;
  const pA=frame(sA,zf(sA)), pB=frame(sB,zf(sB));
  const yA=railY(sA)+.1, yB=railY(sB)+.1;
  _F.set(pB.x-pA.x, yB-yA, pB.z-pA.z);
  if(dir<0)_F.multiplyScalar(-1);                      // 上り列車は先頭部を進行方向へ
  _F.normalize();
  _R.crossVectors(_F,_UP).normalize();                 // 右手系: X=前, Y=上, Z=右
  _U.crossVectors(_R,_F).normalize();
  _M4.makeBasis(_F,_U,_R);
  c.quaternion.setFromRotationMatrix(_M4);
  c.position.set((pA.x+pB.x)/2, (yA+yB)/2, (pA.z+pB.z)/2);
  lodCar(c);
}
// LODの切替。走行中の列車だけでなく、留置中の車両も毎フレーム見直す
// (初期化時に一度だけ判定していたため、留置線の編成が遠景モデルのまま固定されていた)。
function lodCar(c){
  const ud=c.userData;
  if(!ud||!ud.body) return;
  const d=camera.position.distanceTo(c.position), hi=d<LOD_NEAR;
  if(hi!==ud.hi){
    ud.hi=hi;
    ud.body.geometry=(hi?CARGEO:CARGEO_LO)[ud.key];
    if(ud.fine) for(const m of ud.fine) m.visible=hi;     // 灯具・幌・配管等は遠景で省く
  }
}
// 編成の各車両を配置する。範囲外の車両は非表示にし、姿勢計算もスキップして軽量化。
function placeTrain(t){
  const zf=t.dir>0?zRunDown:zRunUp;   // 停車列車は八幡山で内側(停車線)へ
  for(let j=0;j<t.cars.length;j++){
    const s=t.x-t.dir*j*K8.PITCH, c=t.cars[j];
    const inside=(s>DOM.x0+CAR_HALF && s<DOM.x1-CAR_HALF);
    c.visible = inside && trainsOn;
    if(inside) seatCar(c, s, zf, t.dir);      // 見えている車両だけ弦法で姿勢決定
  }
}
/* ---- 交差鉄道の車両(井の頭線・世田谷線) --------------------------------
   京王線の8000系とは別形式なので、専用の簡易モデルにする。
   以前は8000系のジオメトリを色替えして使い回していたため、井の頭線にも
   世田谷線にも京王8000系の前面が付いていた。
   箱形の車体+段付きの丸屋根+窓帯+スカート+台車。線区ごとに寸法と色を変える。
   遠景の脇役なので部品点数は最小限にする(LODも持たない)。 */
const XCAR={
  // L=車体長 / W=車体幅 / H=屋根高 / FLOOR=床面 / GAUGE=軌間 / band=帯 / body=車体
  ino :{L:19.5, W:2.80, H:3.55, FLOOR:1.05, GAUGE:GAUGE_INO,  band:0x1a9ed6, body:0xd8dbdf, panto:true},
  seta:{L:13.6, W:2.50, H:3.40, FLOOR:0.95, GAUGE:GAUGE_SETA, band:0x6aa84f, body:0xe8e6df, panto:true},
};
const XMAT={};
for(const k in XCAR) XMAT[k]={body:M(XCAR[k].body), band:M(XCAR[k].band)};
const XM_WIN=M(0x25333c), XM_ROOF=M(0xb4b9be), XM_UND=M(0x3a3f45),
      XM_TRK=M(0x33383d), XM_WHL=M(0x4a4f55), XM_PAN=M(0x8d949b);
function makeXCar(kind){
  const S=XCAR[kind], MT=XMAT[kind], g=new THREE.Group();
  const put=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z||0);g.add(m);return m;};
  const bodyH=S.H-0.30-S.FLOOR;                       // 腰板から肩まで
  const cy=S.FLOOR+bodyH/2;
  put(new THREE.BoxGeometry(S.L,bodyH,S.W),MT.body,0,cy,0);
  // 段付きの丸屋根(2段の箱で近似。遠景では丸みの差は分からない)
  put(new THREE.BoxGeometry(S.L,0.14,S.W),XM_ROOF,0,S.FLOOR+bodyH+0.07,0);
  put(new THREE.BoxGeometry(S.L-0.12,0.16,S.W-0.36),XM_ROOF,0,S.FLOOR+bodyH+0.22,0);
  // 窓帯(側面)と線区の帯
  put(new THREE.BoxGeometry(S.L-1.7,0.92,S.W+0.02),XM_WIN,0,S.FLOOR+bodyH*0.62,0);
  put(new THREE.BoxGeometry(S.L,0.20,S.W+0.04),MT.band,0,S.FLOOR+bodyH*0.24,0);
  // 前後の妻面:線区の帯を回した平妻+前面窓
  for(const sg of [-1,1]){
    put(new THREE.BoxGeometry(0.10,bodyH,S.W-0.06),MT.band,sg*(S.L/2+0.05),cy,0);
    put(new THREE.BoxGeometry(0.06,0.86,S.W-0.62),XM_WIN,sg*(S.L/2+0.11),S.FLOOR+bodyH*0.66,0);
  }
  // 床下機器とスカート
  put(new THREE.BoxGeometry(S.L*0.52,0.56,S.W-0.66),XM_UND,0,S.FLOOR-0.36,0);
  for(const sg of [-1,1]) put(new THREE.BoxGeometry(0.14,0.52,S.W-0.30),XM_UND,sg*(S.L/2-0.25),0.52,0);
  // 台車(軌間は線区ごと)
  const wOff=(S.GAUGE+RAIL_W)/2, WH=new THREE.CylinderGeometry(0.43,0.43,0.10,12);
  for(const bx of [-S.L*0.33,S.L*0.33]){
    put(new THREE.BoxGeometry(2.60,0.46,S.W-0.60),XM_TRK,bx,0.62,0);
    for(const ax of [bx-1.05,bx+1.05]) for(const sz of [-wOff,wOff]){
      const w=put(WH,XM_WHL,ax,0.43,sz); w.rotation.x=Math.PI/2;
    }
  }
  if(S.panto){   // 簡易のシングルアーム(台枠・下枠・上枠・舟体)
    const py=S.H, px=-S.L*0.28;
    put(new THREE.BoxGeometry(1.90,0.06,1.30),XM_PAN,px,py+0.05,0);
    const lo=put(new THREE.BoxGeometry(1.10,0.07,0.09),XM_PAN,px-0.30,py+0.35,0);
    lo.rotation.z=0.62;
    const up=put(new THREE.BoxGeometry(0.95,0.06,0.07),XM_PAN,px+0.12,py+0.72,0);
    up.rotation.z=-0.55;
    put(new THREE.BoxGeometry(0.16,0.05,1.80),XM_PAN,px+0.52,py+0.94,0);
  }
  g.userData.xcar=kind;
  scene.add(g); return g;
}
/* 交差鉄道の列車。折り返し範囲は「編成の最後尾まで線路の上に載る」ように決める
   (編成長ぶんを引かずに ±440 まで走らせると、後ろの車両が線路の外へ出て宙に浮く)。 */
const INO_CARS=5, INO_PITCH=20, INO_TRK=-3;      // 5両・車両間隔・走る線(掘割の南側)
const INO_LIM=Math.min(-XR.U0,XR.U1)-(INO_CARS-1)*INO_PITCH-XCAR.ino.L/2;
const inoCars=[];for(let j=0;j<INO_CARS;j++)inoCars.push(makeXCar('ino'));
let inoZ=-INO_LIM,inoDir=1;
const SETA_CARS=2, SETA_PITCH=14;
const setaCars=[];for(let j=0;j<SETA_CARS;j++)setaCars.push(makeXCar('seta'));
const SETA_LO=XR.SETA_U0+(SETA_CARS-1)*SETA_PITCH+XCAR.seta.L/2,
      SETA_HI=XR.SETA_U1-XCAR.seta.L/2-46;
let setaZ=SETA_LO,setaDir=1;
/* 交差鉄道の列車を進めて配置する。
   車体の原点はレール面なので、y は道床のレール頭頂面 XR.RAILTOP に置く
   (以前は .86 固定で、レール頭頂面 .89 より3cm沈み、車輪とレールの面が
   同じ高さで重なってちらついていた)。 */
function stepXRail(dt){
  inoZ+=inoDir*13*dt;
  if(inoZ>INO_LIM){inoZ=INO_LIM;inoDir=-1;}else if(inoZ<-INO_LIM){inoZ=-INO_LIM;inoDir=1;}
  for(let j=0;j<inoCars.length;j++){
    const u=inoZ-inoDir*j*INO_PITCH, c=inoCars[j];   // 井の頭線の実測軸に沿って走行
    c.position.set(INO.x+INO.ax*u+INO.nx*INO_TRK, XR.RAILTOP, INO.z+INO.az*u+INO.nz*INO_TRK);
    c.rotation.y=-INO.phi;
  }
  setaZ+=setaDir*8*dt;
  if(setaZ>SETA_HI){setaZ=SETA_HI;setaDir=-1;}else if(setaZ<SETA_LO){setaZ=SETA_LO;setaDir=1;}
  for(let j=0;j<setaCars.length;j++){
    const u=setaZ-setaDir*j*SETA_PITCH, c=setaCars[j];
    c.position.set(SETA.x+SETA.ax*u, XR.RAILTOP, SETA.z+SETA.az*u);
    c.rotation.y=-SETA.phi;
  }
}
stepXRail(0);           // 初期配置(列車走行OFFのままでも線路の上に載っている)
const parkedCars=[];
{ // 滞泊編成:留置線の実測有効長に応じ両数を自動決定
  // 留置線は sx が j とともに増える(走行列車と逆)。cabF/cabR をそのまま使うと
  // 両端の運転台が編成の内側を向いてしまうので、前後を入れ替える。
  const nE=10, nW=10;                       // 滞泊は上下方とも10両(指示)
  // 留置線は sx が j とともに増える=j が大きいほど西。西端基準は nE-j
  for(let j=0;j<nE;j++){const c=makeCar('keio',hasPanto(nE-j),j===nE-1,j===0);
    const sx=YARD_E+12+j*K8.PITCH+K8.LEN/2;
    seatCar(c,sx,()=>YARD_A,1);
    KOUKU[3].VGn.add(c);parkedCars.push(c);}
  for(let j=0;j<nW;j++){const c=makeCar('keio',hasPanto(nW-j),j===nW-1,j===0);
    const sx=YW0e+12+j*K8.PITCH+K8.LEN/2;
    seatCar(c,sx,()=>YARD_B,1);
    KOUKU[3].VGn.add(c);parkedCars.push(c);}
}

/* ---- ホームドア(可動式ホーム柵) ------------------------------------------
   開口は「列車の停止位置」と「車両の扉配置 K8.DOORX」から算出する。
   1両4箇所×10両=40箇所。停止位置や扉配置を変えれば開口も自動で追従するので、
   ホームドアと車両の扉がずれることが起こらない。
   停車中(発車の3秒前まで)だけ開く。                                          */
const PSD=[];
const G_PSD_LEAF=new THREE.BoxGeometry(1,1.22,.07);
const MAT_PSDL=M(0xdfe2e5);
const PSD_OPEN=0.80;                      // 開口の半幅[m](開口1.60m)
for(const d of PSD_DEF){
  const st=d.st, ro=runOff(st.x);
  for(const off of d.drs){
    // その扉列がどの走行線に面しているか。停車列車は ±runOff を走る。
    // (笹塚では内側が留置線、明大前などでは外側が副本線で、そちらは開かない)
    let dir=0, openable=true;
    if(Math.abs(off+ro)<2.5) dir=1;        // 南側=下り
    else if(Math.abs(off-ro)<2.5) dir=-1;  // 北側=上り
    if(!dir){
      // 停車列車が来ない側(笹塚の留置線側・待避線を使わない側)にもホームドアは
      // 設置する。開口の位置は本線の停止位置に合わせ、開閉はしない。
      dir=off<0?1:-1; openable=false;
    }
    const stop=stopPosOf(st,dir)-dir*CAR_HALF;          // 先頭車の中心
    const open=[];
    for(let j=0;j<10;j++){                              // 10両
      const cs=stop-dir*j*K8.PITCH;
      for(const dx of K8.DOORX) open.push(cs+dir*dx);   // 1両4箇所
    }
    open.sort((a,b)=>a-b);
    // その扉列から見て、列車のどちらの"面"(車体ローカルzの符号)がホーム側か。
    // ローカル+zが±offのどちらを向くかは線形の向き(この路線はsが西へ増える)と
    // 進行方向で決まる。符号を推論で決めると間違えるので、実際の姿勢から求める。
    const trackOff=dir>0?-ro:ro;
    const side=(off>trackOff?1:-1)*localZSign(st.x,dir);
    CUR=st.kk?KOUKU[st.kk-1].VGs:null;
    // 開口と開口の間の固定部
    let prev=d.x0;
    for(const c of open){
      if(c-PSD_OPEN-prev>0.05) cbox(prev,c-PSD_OPEN,off,.06,d.y+1.1,d.y+2.32,MAT.hdoor);
      prev=c+PSD_OPEN;
    }
    if(d.x1-prev>0.05) cbox(prev,d.x1,off,.06,d.y+1.1,d.y+2.32,MAT.hdoor);
    // 扉(2枚引き)。曲線に追従させるためインスタンスで置き、開閉は行列を更新する
    const inst=new THREE.InstancedMesh(G_PSD_LEAF,MAT_PSDL,open.length*2);
    add(inst);
    PSD.push({st:st,dir:dir,off:off,side:side,openable:openable,
              y:d.y+1.71,open:open,inst:inst,r:-1});
  }
}
CUR=null;
// 開度 r(0=閉/1=開)を反映する
const _psdM=new THREE.Matrix4(),_psdQ=new THREE.Quaternion(),_psdE=new THREE.Euler(),
      _psdV=new THREE.Vector3(),_psdS=new THREE.Vector3(PSD_OPEN,1,1);
function setPSD(p,r){
  let i=0;
  for(const c of p.open){
    for(const sg of[-1,1]){
      const s=c+sg*(PSD_OPEN/2+PSD_OPEN*r);            // 閉=開口の内側/開=戸袋へ退避
      const q=frame(s,p.off);
      _psdE.set(0,-q.a,0);_psdQ.setFromEuler(_psdE);
      _psdV.set(q.x,p.y,q.z);
      _psdM.compose(_psdV,_psdQ,_psdS);
      p.inst.setMatrixAt(i++,_psdM);
    }
  }
  p.inst.instanceMatrix.needsUpdate=true;
  p.r=r;
}
for(const p of PSD) setPSD(p,0);
// 列車の客用扉:停車中(発車3秒前まで)、ホームに面した側だけ開く。
// どちらの面がホーム側かは、その駅・その方向のホームドア(PSD)の位置から決まる。
function stepCarDoors(t,dt){
  const p=(t.st==='dwell'&&t.atSt)
    ?PSD.find(q=>q.st===t.atSt&&q.dir===t.dir&&q.openable):null;
  const want=(p&&t.dwell>3)?1:0, side=p?p.side:1;
  if(t.dr===undefined){t.dr=0;t.dside=1;}
  if(t.dr===want&&t.dside===side) return;
  let nr=t.dr+(want-t.dr)*Math.min(1,dt*3.0);    // 約1秒で開閉
  if(Math.abs(want-nr)<0.005) nr=want;           // 端で止め切る(半開きのまま残らないように)
  t.dr=nr; t.dside=side;
  for(const c of t.cars) setCarDoors(c,nr,side);
}
// 毎フレームの開閉。停車中(発車3秒前まで)だけ開く。
function stepPSD(dt){
  for(const p of PSD){
    let want=0;
    if(p.openable) for(const t of trains){
      if(t.dir===p.dir&&t.st==='dwell'&&t.atSt===p.st&&t.dwell>3){want=1;break;}
    }
    if(p.r===want) continue;                           // 開き切り/閉じ切りなら何もしない
    let nr=p.r+(want-p.r)*Math.min(1,dt*3.5);          // 約0.9秒で開閉
    if(Math.abs(want-nr)<0.005) nr=want;               // 端で止め切る(半開きのまま残らないように)
    setPSD(p,nr);
  }
}

/* ============ 10. カメラ・運転モード・列車追尾 ============ */
const pA0=frame(300,0),pB0=frame(7100,0);
// 初期視点=公式平面図と同じ「北が上・新宿方(笹塚)が右」。
// th=π/2 はカメラを路線の南側に置き、北向きに見下ろす方位。
const OV={tx:(pA0.x+pB0.x)/2,ty:0,tz:(pA0.z+pB0.z)/2,r:5300,th:Math.PI/2,ph:.58};
const cam=Object.assign({},OV);
let autoOrbit=false,trainsOn=true,fly=null;   // 旋回は初期OFF=地図の向きを保持
let rideOn=false,rideS=-200,preRide=null;
let rideYaw=0, ridePitch=0;   // 運転モードの首振り(ドラッグで変更)
// --- ワンハンドルマスコン(運転モード) ---
// notch: -1=非常, 0..7=制動7〜1/中立, ... 実装は index で管理
// NOTCHES[i] = {n:表示名, a:加速度[km/h/s](+=力行/-=制動)}
const NOTCHES=[
  {n:'非常 EB', s:'EB', a:-4.5, k:'e'},
  {n:'制動 B7', s:'B7', a:-4.2, k:'b'},{n:'制動 B6', s:'B6', a:-3.6, k:'b'},{n:'制動 B5', s:'B5', a:-3.0, k:'b'},
  {n:'制動 B4', s:'B4', a:-2.4, k:'b'},{n:'制動 B3', s:'B3', a:-1.8, k:'b'},{n:'制動 B2', s:'B2', a:-1.2, k:'b'},
  {n:'制動 B1', s:'B1', a:-0.6, k:'b'},
  {n:'中 立 N', s:'N', a:-1/6, k:'n'},               // 惰行:6秒で1km/h減速
  {n:'力行 P1', s:'P1', a: 0.8, k:'p'},{n:'力行 P2', s:'P2', a: 1.6, k:'p'},
  {n:'力行 P3', s:'P3', a: 2.4, k:'p'},{n:'力行 P4', s:'P4', a: 3.3, k:'p'}
];
const NIDX_N=8, NIDX_EB=0, NIDX_B7=1, VMAX=130;
let notch=NIDX_N, rideV=0;
/* 保安装置(ATC相当)。前を走る列車との距離から許容速度を決め、超えていれば
   マスコンの操作にかかわらず B7 で自動的に減速する。
     距離 ATC.FAR(600m) …… ATC.VFAR(120km/h)まで
     距離 ATC.NEAR(20m) …… 0km/h
   その間は制動距離の式 v=√(2ad) と同じ形(√)でなめらかにつなぐ。
   前の列車が待避線へ入った/600mより先/エリア外/列車走行OFF なら解除。 */
const ATC={FAR:600, NEAR:20, VFAR:120, OFFTOL:1.5};
let atcLim=null, atcOn=false;
function atcLimit(s){
  if(!trainsOn) return null;
  let lim=null;
  for(const t of trains){
    if(t.dir!==1) continue;                                  // 運転モードは下り線を走る
    if(t.x<DOM.x0||t.x>DOM.x1) continue;                     // エリア外(表示されていない)
    if(Math.abs(runOff(t.x)-mainOff(t.x))>ATC.OFFTOL) continue;   // 待避線に入っている
    const rear=t.x-(t.cars.length-1)*K8.PITCH-K8.LEN/2;      // 前の列車の最後尾
    const d=rear-s;
    if(d<=0||d>ATC.FAR) continue;                            // 後方/600mより先は対象外
    const v=(d<=ATC.NEAR)?0:ATC.VFAR*Math.sqrt((d-ATC.NEAR)/(ATC.FAR-ATC.NEAR));
    if(lim===null||v<lim) lim=v;
  }
  return lim;
}
// 運転モードの状態を出し入れする(検証から走らせるための入り口)
function setRideState(o){
  if(o.s!==undefined)rideS=o.s; if(o.v!==undefined)rideV=o.v;
  if(o.notch!==undefined){notch=o.notch;cmdNotch=o.notch;}
  if(o.acc!==undefined)accEff=o.acc;
}
function getRideState(){return {s:rideS,v:rideV,notch:notch,acc:accEff,lim:atcLim,atc:atcOn};}
// 運転モードの1ステップ(速度と位置)。保安装置の判定もここで行う。
function stepRide(dt){
  atcLim=atcLimit(rideS);
  atcOn=(atcLim!==null&&rideV>atcLim);
  // 加減速の応答は一次遅れ(時定数0.75秒)。さらに速度による特性を加味する:
  //   力行 : 60km/h までは設定どおり、以降は鈍化し 120km/h で半分
  //   制動 : 120km/h では75%、速度が落ちるほど強まり 60km/h 以下で設定どおり
  const aSet=NOTCHES[atcOn?NIDX_B7:notch].a;
  // 保安装置の制動は指令どおりの減速度で効く(速度による鈍化を受けない)。
  // 鈍化を受けると高速域でパターンに追従できず、頭打ちのまま接近してしまう。
  const aCmd=atcOn?aSet:aSet*accCurve(rideV,aSet);
  accEff += (aCmd-accEff)*Math.min(1, dt/NOTCH_LAG);
  rideV=clamp(rideV+accEff*dt,0,VMAX);
  rideS+=(rideV/3.6)*dt; if(rideS>7950){rideS=-250;}          // 終端で笹塚方へ戻る
}
// マスコン操作の遊び(反応遅れ0.75秒):cmdNotch=操作値 / notch=実際に効いている段
let cmdNotch=NIDX_N, accEff=0; const NOTCH_LAG=0.75;   // accEff=実際に効いている加速度[km/h/s]
let chaseOn=false,chaseIdx=0;const chaseEye=new THREE.Vector3();
const CH={th:Math.PI/2-.35,ph:.92,r:150};   // 追尾カメラの球面パラメータ(操作可能)
function applyCam(){
  camera.position.set(
    cam.tx+cam.r*Math.sin(cam.ph)*Math.cos(cam.th),
    cam.ty+cam.r*Math.cos(cam.ph),
    cam.tz+cam.r*Math.sin(cam.ph)*Math.sin(cam.th));
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}
function flyTo(to,dur){fly={a:Object.assign({},cam),b:Object.assign(Object.assign({},cam),to),t0:performance.now(),dur:dur||1400};}
function stepFly(now){
  if(!fly)return;
  let t=(now-fly.t0)/fly.dur;if(t>=1){Object.assign(cam,fly.b);fly=null;return;}
  t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  for(const k of['tx','ty','tz','r','th','ph'])cam[k]=fly.a[k]+(fly.b[k]-fly.a[k])*t;
}
const pts=new Map();let pinchD=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinchD=0;if(!rideOn)fly=null;});
canvas.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pinchD=0;});
canvas.addEventListener('dblclick',()=>{if(rideOn){rideYaw=0;ridePitch=0;}});   // 正面へ戻す
canvas.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinchD=0;});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(rideOn){   // 運転モード:ドラッグで首振り(左右±120°/上下±45°)。2本指は無視
    if(pts.size>=2)return;
    rideYaw   = clamp(rideYaw   - dx*.004, -2.1, 2.1);
    ridePitch = clamp(ridePitch - dy*.003, -0.8, 0.8);
    return;
  }
  if(pts.size===2){
    const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0){if(chaseOn)CH.r=clamp(CH.r*pinchD/d,60,650);else cam.r=clamp(cam.r*pinchD/d,90,9800);}
    pinchD=d;return;
  }
  if(chaseOn){CH.th+=dx*.005;CH.ph=clamp(CH.ph-dy*.004,.18,1.45);return;}   // 追尾中は角度のみ操作
  setAuto(false);
  if(e.shiftKey||e.ctrlKey||(e.buttons&2)){cam.th+=dx*.005;cam.ph=clamp(cam.ph-dy*.004,.14,1.5);}   // 回転=修飾キー+ドラッグ
  else{pan(dx,dy);}   // 移動=ドラッグのみ
});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(rideOn)return;
  if(chaseOn){CH.r=clamp(CH.r*Math.pow(1.0016,e.deltaY),60,650);return;}   // 追尾中は距離を操作
  fly=null;cam.r=clamp(cam.r*Math.pow(1.0016,e.deltaY),90,9800);},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function pan(dx,dy){
  const k=cam.r*.0014;
  const fx=-Math.cos(cam.th),fz=-Math.sin(cam.th),rx=-fz,rz=fx;
  cam.tx-=(rx*dx-fx*dy)*k;cam.tz-=(rz*dx-fz*dy)*k;   // dyの符号を反転(上下の追従を修正)
  cam.tx=clamp(cam.tx,-8500,800);cam.tz=clamp(cam.tz,-900,2100);
}
function goStation(s){setRide(false);setChase(false);setAuto(false);
  const p=frame(s.x,0);
  flyTo({tx:p.x,ty:8,tz:p.z,r:470,th:Math.PI/2-.4,ph:.95},1500);}   // 南側やや斜めから北向きに駅を見る

// --- 運転モード(笹塚→仙川・下り前面展望+ワンハンドルマスコン) ---
let labelPrev=true, xingPrev=false;   // スマホの運転モード中は強制OFFにするため直前の状態を保持

function setXingShown(v){

}
function setRide(v){
  if(v===rideOn)return;
  rideOn=v;
  const b=$('btnRide');b.classList.toggle('on',v);b.textContent='運転モード '+(v?'ON':'OFF');
  if(typeof IS_MOBILE!=='undefined'&&IS_MOBILE){   // スマホ:運転中はラベル類を消し、操作も無効化
    const bl=$('btnLabel'), bx=$('btnXing');

    preRide=Object.assign({},cam);setAuto(false);fly=null;rideS=-220;}

// --- 列車追尾モード ---

  if(v===chaseOn)return;

const nsvg=document.getElementById('navSvg'),NSPS='http://www.w3.org/2000/svg';
const navPos=document.getElementById('navPos');

const el=(t,at)=>{const n=document.createElementNS(NSPS,t);for(const k in at)n.setAttribute(k,at[k]);nsvg.appendChild(n);return n;};

function syncNav(){
  if(!navXm)return;

}

$('btnRide').onclick=()=>setRide(!rideOn);

// ---- マスコンの画面ボタン(タッチ操作用。PCでも使える) ----
$('btnUp').onclick=()=>setNotch(notch-1);      // 上=制動側へ
$('btnDn').onclick=()=>setNotch(notch+1);      // 下=力行側へ
$('btnN').onclick=()=>setNotch(NIDX_N);        // 中立
$('btnE').onclick=()=>setNotch(NIDX_EB);       // 非常ブレーキ

// ---- パネルの開閉(上:縦断図ナビ / 右:メニュー) ----
function togglePanel(panel,btn,dir){
  const hidden=panel.classList.toggle('hide');
  btn.textContent = dir==='top' ? (hidden?'▼':'▲') : (hidden?'◀':'▶');
}
$('navTog').onclick=()=>togglePanel($('nav'),$('navTog'),'top');
$('toolTog').onclick=()=>togglePanel($('tools'),$('toolTog'),'right');

// 停止位置 stopPosOf / ホーム範囲 platRange は 2b章で定義している
// (ホームドアの開口位置の算出にも使うため)。
function nextStop(s){
  for(const st of STA){
    if(s <= platRange(st)[1]) return {st:st, stop:stopPosOf(st,1)};
  }
  return null;
}
function updSpd(){
  const e=$('spdVal');e.textContent=Math.round(rideV);
  e.style.color=(rideV>=120)?'#d62828':'';       // 120km/h以上は赤字
  $('spdKm').textContent='新宿起点 '+(rideS/1000+KM0).toFixed(2)+'km';
  const nx=nextStop(rideS);                       // 次の停車駅と停止位置までの距離
  if(nx){
    const d=nx.stop-rideS;
    $('nxtName').textContent='次 '+nx.st.n;
    const e=$('nxtDist');
    e.textContent=(d>=0? Math.round(d).toLocaleString()+' m' : '停止位置 '+Math.round(-d)+' m 超過');
    e.classList.toggle('near', d<200);
  }else{
    $('nxtName').textContent='終端(仙川)';
    $('nxtDist').textContent='—';
  }
  const nd=NOTCHES[atcOn?NIDX_B7:cmdNotch], mn=$('masName');
  // 保安装置が介入しているときは、操作段ではなく実際に効いている段を出す
  mn.textContent=atcOn?'B7\u00a0ATC':nd.s;   // P4 / N / B7 / EB のような短い段位表示
  mn.className='notch '+(atcOn?'e':nd.k);
  const lb=$('atcInfo');
  if(lb) lb.textContent=(atcLim===null)?'':('ATC '+Math.round(atcLim)+' km/h');
}
function setNotch(i){cmdNotch=clamp(i,0,NOTCHES.length-1);notch=cmdNotch;updSpd();}   // 操作は即時反映
// 速度による加減速特性
function accCurve(v,a){
  if(a>0)    return clamp(1-0.75*(v-60)/60, 0.20, 1);    // 力行:60km/h超で鈍化し120km/hで25%
  if(a<-0.2) return clamp(1-0.25*(v-60)/60, 0.70, 1);    // 制動:120km/hで75%、60km/h以下で100%
  return 1;                                              // 惰行(中立)
}
addEventListener('keydown',e=>{
  if(!rideOn)return;
  if(e.key==='ArrowDown'){setNotch(notch+1);e.preventDefault();}        // 下=力行側へ
  else if(e.key==='ArrowUp'){setNotch(notch-1);e.preventDefault();}     // 上=制動側へ
  else if(e.key==='n'||e.key==='N')setNotch(NIDX_N);
  else if(e.key==='e'||e.key==='E')setNotch(NIDX_EB);   // E=非常ブレーキ
});
$('btnChase').onclick=()=>{
  if(rideOn)setRide(false);
  if(!chaseOn){chaseIdx=0;setChase(true);}
  else{chaseIdx++;
    if(chaseIdx>=trains.length){setChase(false);}
    else{$('btnChase').textContent='列車追尾中 '+(chaseIdx+1)+'/'+trains.length+'(押すと次の列車)';}}
};
$('btnTrain').onclick=e=>{trainsOn=!trainsOn;setTrainsVisible(trainsOn);   // OFF時は車両自体を非表示
  e.target.classList.toggle('on',trainsOn);e.target.textContent='列車走行 '+(trainsOn?'ON':'OFF');};
$('btnLabel').onclick=e=>{const v=!staLabels[0].visible;
  labelPrev=v;
  staLabels.concat(tagLabels).forEach(s=>s.visible=v);
  e.target.classList.toggle('on',v);e.target.textContent='駅ラベル '+(v?'ON':'OFF');};
$('btnXing').onclick=()=>{const v=!xingLabels[0].visible;xingPrev=v;setXingShown(v);};

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();buildNav();
}
addEventListener('resize',resize);resize();

// ---- スマートフォン最適化(横画面前提) ----
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||
                (navigator.maxTouchPoints>1&&Math.min(screen.width,screen.height)<900);
if(IS_MOBILE){
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));   // 解像度上限で描画負荷を抑える
  LOD_NEAR=260;                                             // 高精細モデルの適用範囲を短縮
  const lockLandscape=()=>{                                 // 可能なら横画面に固定
    if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  };
  addEventListener('pointerdown',lockLandscape,{once:true});
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(trainsOn){
    for(const t of trains){
      driveTrain(t,dt);   // 各駅停車の自動運転(加速P4/60km/h上限/減速B5/停車25秒)
      placeTrain(t);
      stepCarDoors(t,dt); // 客用扉:停車中はホーム側だけ開く
    }
    stepPSD(dt);          // ホームドア:停車中(発車3秒前まで)だけ開く
    for(const c of parkedCars) lodCar(c);   // 留置中の編成もLODを見直す
    stepXRail(dt);      // 井の頭線・世田谷線
  }
  if(rideOn){
    stepRide(dt);
    updSpd();
    // 視線=線路の接線方向(勾配も含む)。同じ軌道オフセット上の前後2点から方向を作るため、
    // 曲線でも画面中央が線路の正面を向く。
    const off=zDown(rideS), p=frame(rideS,off);   // 運転モードは本線(八幡山では外側の通過線)
    const pa=frame(rideS-6,off), pb=frame(rideS+6,off);
    let tx=pb.x-pa.x, tz=pb.z-pa.z, ty=railY(rideS+6)-railY(rideS-6);
    const tl=Math.hypot(tx,ty,tz)||1; tx/=tl; ty/=tl; tz/=tl;
    const EYE=3.2;                                   // 運転士の目線(レール面から)
    camera.up.set(0,1,0);
    camera.position.set(p.x, railY(rideS)+EYE, p.z);
    // 進行方向を基準に、ドラッグ量(rideYaw/ridePitch)だけ首を振る
    const base=Math.atan2(tz,tx), a2=base+rideYaw;
    const cp=Math.cos(ridePitch);
    const dx=Math.cos(a2)*cp, dz=Math.sin(a2)*cp, dy=ty*cp+Math.sin(ridePitch);
    camera.lookAt(p.x+dx*200, railY(rideS)+EYE+dy*200, p.z+dz*200);
    cam.tx=p.x;cam.tz=p.z;
  }else if(chaseOn){   // 注視点=列車固定、視点=球面(CH)上をユーザー操作可
    const t=trains[chaseIdx],zf=t.dir>0?zRunDown:zRunUp;
    const hx=t.x,ph2=frame(hx,zf(hx));
    const ty=railY(hx)+3;
    const ex=ph2.x+CH.r*Math.sin(CH.ph)*Math.cos(CH.th);
    const ey=ty+CH.r*Math.cos(CH.ph);
    const ez=ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th);
    const kk=Math.min(1,dt*3.6);
    chaseEye.x+=(ex-chaseEye.x)*kk;chaseEye.y+=(ey-chaseEye.y)*kk;chaseEye.z+=(ez-chaseEye.z)*kk;
    camera.position.copy(chaseEye);
    camera.lookAt(ph2.x,ty,ph2.z);
    cam.tx=ph2.x;cam.tz=ph2.z;
  }else{
    stepFly(now);
    if(autoOrbit&&!fly&&pts.size===0)cam.th+=dt*.03;
    applyCam();
  }
  syncNav();
  renderer.render(scene,camera);
}
trains.forEach(placeTrain);
requestAnimationFrame(loop);
</script>
