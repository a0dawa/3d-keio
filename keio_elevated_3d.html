<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>京王線 連続立体交差事業(笹塚〜仙川) 高架化後 3Dビューア</title>
<style>
  :root{
    --ink:#1c2733; --panel:rgba(252,253,254,.94); --line:#c7ced6;
    --keio-pink:#e4007f; --keio-indigo:#1b2a66; --dim:#5a6673;
    --mono:ui-monospace,'SF Mono','Consolas',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif;
    color:var(--ink);background:#dfe8f0}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  /* ---- パネルの開閉タブ ---- */
  .tog{position:fixed;z-index:20;border:1px solid var(--line);background:rgba(255,255,255,.94);
    color:var(--keio-indigo);font:700 12px/1 inherit;cursor:pointer;
    box-shadow:0 2px 8px rgba(20,30,50,.12);padding:0}
  #navTog{top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;
    border-radius:0 0 8px 8px;border-top:none}
  #toolTog{right:0;top:50%;transform:translateY(-50%);width:22px;height:64px;
    border-radius:8px 0 0 8px;border-right:none}
  #nav,#tools{transition:transform .26s ease}
  #nav.hide{transform:translateY(calc(-100% - 20px))}
  #tools.hide{transform:translateX(calc(100% + 20px))}

  /* ---- マスコンの操作ボタン(タッチ対応) ---- */
  #spd .ctl{display:flex;gap:6px}
  #spd .ctl button{min-width:46px;height:40px;border:1px solid var(--keio-indigo);border-radius:9px;
    background:#fff;color:var(--keio-indigo);font:700 15px/1.1 inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #spd .ctl button span{font:600 9.5px/1 inherit;color:var(--dim)}
  #spd .ctl button:active{background:var(--keio-indigo);color:#fff}
  #tools button:disabled{opacity:.42;cursor:not-allowed}
  #spd .ctl button.eb{border-color:#d62828;color:#d62828}
  #spd .ctl button.eb:active{background:#d62828;color:#fff}

  /* ---- スマートフォン対応(横画面で使用) ---- */
  #rot{position:fixed;inset:0;display:none;z-index:99;background:#f4f6f8;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:600 15px/1.7 var(--sans);color:var(--ink);text-align:center;padding:24px}
  #rot .ico{font-size:44px;transform:rotate(90deg)}
  @media (orientation:portrait) and (max-width:900px){
    #rot{display:flex}
    #tools,#nav,#spd{display:none !important}
  }
  @media (orientation:landscape) and (max-height:560px){
    #tools{top:26px;right:6px;padding:5px;gap:4px;max-height:calc(100vh - 40px);overflow:auto}
    #tools button{font-size:10.5px;padding:6px 8px}
    #nav{left:6px;right:6px;top:24px;padding:6px 8px 4px}
    #nav svg{height:54px}
    #nav .cap b{font-size:11px} #nav .cap i{font-size:10px}
    /* マスコン:左下に小さく(面積1/4)・半透明で配置し、中央の視界を空ける */
    #spd{left:4px;bottom:4px;transform:scale(.5);transform-origin:left bottom;
      opacity:.55;padding:8px 10px;gap:10px;align-items:center}
    #spd:active,#spd:focus-within{opacity:.95}
    #spd .v b{display:none}
  }
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 3px 14px rgba(20,35,55,.12);backdrop-filter:blur(4px)}
  #hdr{top:12px;left:12px;padding:11px 14px 10px;max-width:min(450px,calc(100vw - 24px))}
  #hdr h1{font-size:14.5px;font-weight:700;letter-spacing:.02em;line-height:1.45}
  #hdr h1 .rt{color:var(--keio-pink)}
  #hdr .sub{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6}
  #hdr .facts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  #hdr .facts span{font:600 10px var(--mono);color:var(--keio-indigo);
    border:1px solid var(--keio-indigo);border-radius:3px;padding:2px 5px;background:#fff}
  #tools{top:12px;right:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #tools button{font:600 11.5px/1 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;white-space:nowrap}
  #tools button:hover{border-color:var(--keio-indigo)}
  #tools button.on{background:var(--keio-indigo);color:#fff;border-color:var(--keio-indigo)}
  #tools button.ride.on{background:var(--keio-pink);border-color:var(--keio-pink)}
  #tools button:focus-visible{outline:2px solid var(--keio-pink);outline-offset:1px}
  #nav{left:12px;right:196px;top:12px;padding:10px 14px 8px}   /* 上部固定・右のボタン群を回避 */
  #nav .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  #nav .cap b{font-size:12.5px;letter-spacing:.08em;color:var(--keio-indigo)}
  #nav .cap i{font:11.5px var(--mono);color:var(--dim);font-style:normal}
  #nav svg{display:block;width:100%;height:100px;cursor:pointer}
  #nav text{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif}
  #note{display:none;left:12px;bottom:120px;max-width:min(510px,calc(100vw - 24px));
    max-height:52vh;overflow:auto;padding:12px 15px;font-size:11.5px;line-height:1.75}
  #note.show{display:block}
  #note h2{font-size:12px;color:var(--keio-indigo);margin-bottom:5px}
  #note h2:not(:first-child){margin-top:10px}
  #note p{color:#33404d}
  #note .lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
  #note .lg span{display:inline-flex;align-items:center;gap:5px;font-size:11px}
  #note .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
    border-radius:5px;background:#fff;cursor:pointer;color:var(--ink)}
  #kjStepRow button{font:700 13px/1 inherit;width:30px;height:30px;border:1px solid var(--keio-indigo);
    border-radius:6px;background:#fff;color:var(--keio-indigo);cursor:pointer}
  #kjStepRow button:disabled{opacity:.3;cursor:default}
  #hint{right:12px;bottom:120px;padding:7px 11px;font:10.5px/1.7 var(--mono);color:var(--dim)}
  /* 運転台(マスコン+速度計。運転モード時のみ表示) */
  #spd{display:none;left:50%;transform:translateX(-50%);bottom:16px;padding:9px 14px;
    align-items:center;gap:12px}
  #spd.show{display:flex}
  /* 段位チップ(P4〜N〜B7・EB) */
  #spd .notch{min-width:56px;height:38px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font:700 17px/1 var(--mono);color:#fff;background:#8a9099;
    letter-spacing:.04em}
  #spd .notch.p{background:#2f7d4f}      /* 力行 */
  #spd .notch.n{background:#8a9099}      /* 中立 */
  #spd .notch.b{background:#d98a3a}      /* 制動 */
  #spd .notch.e{background:#d62828}      /* 非常 */
  #spd .v{font:700 22px var(--mono);color:var(--ink);min-width:86px;text-align:center}
  /* 次駅と停止位置までの距離 */
  #spd .nxt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px}
  #spd .nxt b{font:700 12.5px/1.2 inherit;color:var(--keio-indigo)}
  #spd .nxt span{font:700 15px/1 var(--mono);color:var(--ink)}
  #spd .nxt span.near{color:#d62828}
  #spd .v i{font:600 12px var(--mono);color:var(--dim);font-style:normal;margin-left:4px}
  #spd .v b{display:block;font:600 9.5px var(--mono);color:var(--dim);margin-top:1px}
  @media (max-width:640px){
    #hdr{padding:9px 11px}
    #hdr h1{font-size:12.5px}
    #hdr .sub,#hdr .facts{display:none}
    #tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:12px;left:12px;right:12px;padding:6px}
    #tools button{padding:7px 8px}
    #hint{display:none}
    #nav svg{height:88px}
  }
</style>
</head>

<canvas id="c" aria-label="京王線高架化後の3Dモデル"></canvas>
<div id="rot">
  <div class="ico">📱</div>
  <div><b>横画面にしてください</b><br>この3Dビューアは横向きでの表示に最適化されています。</div>
</div>

<button id="navTog" class="tog" aria-label="縦断図ナビの表示切替">▲</button>
<button id="toolTog" class="tog" aria-label="メニューの表示切替">▶</button>

<div class="panel" id="tools">
  <button id="btnHome">全体俯瞰(地図の向き)</button>
  <button id="btnRide" class="ride">運転モード OFF</button>
  <button id="btnChase" class="ride">列車追尾 OFF</button>

  <button id="btnXing">踏切名 OFF</button>
</div>

  <div class="v"><span id="spdVal">0</span><i>km/h</i><b id="spdKm">—</b></div>
  <div class="nxt"><b id="nxtName">—</b><span id="nxtDist">—</span></div>
  <div class="ctl">
    <button id="btnUp" aria-label="制動側へ">▲<span>制動</span></button>
    <button id="btnDn" aria-label="力行側へ">▼<span>力行</span></button>
    <button id="btnN">N</button>
    <button id="btnE" class="eb">EB</button>
  </div>
</div>

<div class="panel" id="nav">
  <div class="cap"><b>縦 断 図 ナ ビ</b><i id="navPos">—</i></div>
  <svg id="navSvg" role="navigation" aria-label="縦断図から駅を選択"></svg>
</div>

/* ============================================================================
   京王線 連続立体交差事業(笹塚〜仙川)高架化後 3Dビューア ── 保守ガイド
   ----------------------------------------------------------------------------
   ■ ファイル構成(この見出しコメントで検索できます)
     1. 与件データ        : 駅STA/踏切XINGS(実名25)/交差道路/8工区KOUKU/手順STEPS/可視表VIS
     2. 縦断・断面・平面線形: railY(縦断) mainOff(本線の振り) deckHalf(桁半幅)
                              GEO→GP→CT(実座標スプライン) frame(s,off) nearestS
     3. シーン基盤        : renderer/材質MAT/車体・レンガ等テクスチャ/工区グループ/strip・box・cyl
     4. 地表・道路・施設  : 幹線/踏切道スタブ/側道/玉川上水/給水所/変電所/駅前広場
     5. 高架橋・架線      : deckRunHalf=南半(VGa:下り線部)+北半(VGb:上り線部)/橋脚/架線柱
     6. 軌道ほか          : 本線・副本線・留置線(2本併設)・分岐器・井の頭線・世田谷線・地上線/仮線
     7. 駅                : cbox(曲線追従)によるホーム・ホームドア・駅舎意匠・側面外観・駅名サイン
     8. 街並み            : 街区整列の建物/樹木(幹+樹冠)
     9. 列車              : テクスチャ車体+パンタ(走行6本・滞泊編成)
    10. カメラ・モード    : オービット/運転モードrideOn(ワンハンドルマスコン)/列車追尾chaseOn
    11. 縦断図ナビ        : SVG(駅クリック・踏切目盛・現在位置マーカー)
    12. UI・メインループ  : ボタン類/resize/loop

   ■ 座標系(最重要)
     ・s   : 営業距離[m](笹塚=0。新宿起点kmはヘルパ X(km) で変換)
     ・off : 線路直角方向[m](+=北側/-=南側)
     ・ワールド: 地理準拠 → X=東(+)西(-)/Z=南(+)北(-)/Y=高さ[m]
       真上から見ると「北が上・新宿方(笹塚)が右」= 公式平面図と同じ向き
     ・全構造物は frame(s,off) 経由で配置(直接ワールド座標を使うのは地表面のみ)

   ■ 主な調整パラメータ
     ・線形     : GEO(各駅の緯度経度)を直せば全体が自動追従
     ・断面/高さ: RAIL_H・DECK_DROP・GIRDER・WIDE([中心s,桁半幅,一定区間半長])・BUMPS
     ・踏切     : XINGS=[名称, s位置]
     ・工事手順 : KOUKU(s0/s1=工区範囲, m=工法A側方/B仮線/C直上, jv/note)・STEPS文言・VIS可視表
     ・配色     : MAT(構造物)/brickMat・woodMat・latticeMat(駅意匠)/car_spec由来の色(車両)

   ■ 保守メモ
     ・編集後は <script> 内を抽出し node --check で構文確認を推奨
     ・210m級の長物は必ず cbox(曲線追従ロフト)で生成。直方体Boxは曲線上で弦になる
     ・CT.a は±π跨ぎをアンラップ済み。線形再生成時もこの処理を残すこと
     ・操作系:ドラッグ=移動/Shift・Ctrl+ドラッグ=回転(2026-08変更)
   ========================================================================== */

function strip(x0,x1,step,fA,fB,mat){
  const xs=[];for(let x=x0;x<x1;x+=step)xs.push(x);xs.push(x1);
  const n=xs.length,pos=new Float32Array(n*2*3),idx=[];
  xs.forEach((x,i)=>{
    const a=fA(x),b=fB(x),pa=frame(a[0],a[2]),pb=frame(b[0],b[2]);
    pos[i*6]=pa.x;pos[i*6+1]=a[1];pos[i*6+2]=pa.z;
    pos[i*6+3]=pb.x;pos[i*6+4]=b[1];pos[i*6+5]=pb.z;
    if(i<n-1){const k=i*2;idx.push(k,k+1,k+2,k+1,k+3,k+2);}});
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  return add(new THREE.Mesh(g,mat));
}
function box(w,h,d,mat,s,y,off,ry2){
  const p=frame(s,off);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(p.x,y,p.z);m.rotation.y=-p.a+(ry2||0);
  return add(m);
}
function cyl(r,h,mat,s,y,off,seg){
  const p=frame(s,off);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg||24),mat);
  m.position.set(p.x,y,p.z);return add(m);
}

const yTop=x=>railY(x)-DECK_DROP, yBot=x=>railY(x)-GIRDER;
const oV=(x,v)=>v===99?deckHalf(x):v===-99?-deckHalf(x):v;
function deckPart(x0,x1,mat,o0,o1,edge){   // 桁の帯 o0..o1(±99=桁端)。edge:'S'/'N'は側面+防音壁付き
  strip(x0,x1,12,x=>[x,yTop(x),oV(x,o0)],x=>[x,yTop(x),oV(x,o1)],mat);
  if(edge==='S'){
    strip(x0,x1,12,x=>[x,yTop(x),-deckHalf(x)],x=>[x,yBot(x),-deckHalf(x)],mat);
    strip(x0,x1,12,x=>[x,railY(x)+2.1,-deckHalf(x)+.25],x=>[x,yTop(x),-deckHalf(x)+.25],MAT.barrier);
  }else if(edge==='N'){
    strip(x0,x1,12,x=>[x,yBot(x),deckHalf(x)],x=>[x,yTop(x),deckHalf(x)],mat);
    strip(x0,x1,12,x=>[x,yTop(x),deckHalf(x)-.25],x=>[x,railY(x)+2.1,deckHalf(x)-.25],MAT.barrier);
  }
}

function wires(r0,r1,zf){
  const TH=5.9, TR=4.9;                       // ちょう架線/トロリ線の高さ(レール面から)
  const poles=poleXs(r0,r1);

  const p0=poles[0], p1=poles[poles.length-1];
  // 直近の柱スパン内での垂れ(両端=柱の位置で0、中間で最大0.32m)
  const sag=x=>{
    let a=p0,b=p1;
    for(let i=0;i<poles.length-1;i++){ if(x>=poles[i]&&x<=poles[i+1]){a=poles[i];b=poles[i+1];break;} }
    const t=(b>a)?(x-a)/(b-a):0;
    return 0.32*Math.sin(Math.PI*t);
  };
  const cat=[],tro=[];
  for(let x=p0;x<=p1;x+=5){
    const zo=zf(x);
    const pc=frame(x,zo);
    cat.push(new THREE.Vector3(pc.x,railY(x)+TH-sag(x),pc.z));
    tro.push(new THREE.Vector3(pc.x,railY(x)+TR,pc.z));
  }
  add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(cat),wireMat));
  add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(tro),wireMat));
  const hp=[];                                 // ハンガー(吊り線):柱の真下に配置
  for(const x of poles){
    const zo=zf(x),pc=frame(x,zo);
    hp.push(new THREE.Vector3(pc.x,railY(x)+TH,pc.z));   // 柱位置では垂れ0
    hp.push(new THREE.Vector3(pc.x,railY(x)+TR,pc.z));
  }
  add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(hp),wireMat));
  if(zf===zUp){                                        // 饋電線(き電線):ビーム上を1本通す
    const fd=[];
    for(let x=r0;x<=r1;x+=15){const p=frame(x,deckHalf(x)-1.6);
      fd.push(new THREE.Vector3(p.x,railY(x)+6.9,p.z));}
    add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(fd),wireMat));
  }
}

/* ============ 9. 列車(京王8000系) ============ */
/* 【設計方針】旧実装からの全面作り直し
   旧: 実車正面写真を1ドット単位で車体座標へ展開したPNGを前面に貼る「写真転写方式」。
   新: 前面を含め、すべてジオメトリで構成する。
       ただし写真の画素解析で得た"寸法"は実車由来の唯一の資産なので、諸元表
       K8 / BANDS / WIN / FWIN に実測値として引き継ぎ、形状はそこからのみ生成する。
       (数値を書き換えれば車体・窓・帯・前面がすべて追従する一方向のデータフロー)

   旧実装の失敗要因(TEMPLATE.md §4)への構造的な対処:
     - 窓を頂点カラーの条件式で"塗って"いた → 廃止。窓・扉は車体表面のわずか外側に
       置く独立したパネルとして作る。ロフトの分割数と無関係に輪郭が鋭く出る。
     - 帯の上下関係(紺線は赤帯の"上")を誤認   → BANDS 表に下から順に並べ、単調性を
       生成時に検査する。境界には必ず頂点を置き二重化する。
     - 前頭部が黒い塊になる                   → 前頭部の塗り分けはアイボリー地+帯のみ。
       窓・灯具・表示器は独立メッシュなので地色を汚さない。
     - 裏面カリングで面が消える               → パネル類の材質は DoubleSide で統一。
     - 断面リングの頂点数が場所により変わる   → 帯の境界は固定、肩から上の埋め点だけを
       個数固定で等分する(旧実装は先頭部でリング長が変化し接続が壊れていた)。 */

/* ---- 9-1. 実車諸元(単一の真実の源) ----------------------------------------
   出典の別:
     [A] 公表諸元(Wikipedia 京王8000系電車 ほか)
     [B] 本プロジェクトの実車写真 画素解析による実測値
         ※元写真(reference/keio8000_*.png)は失われたが、測定値はここに残り検証基準であり続ける
     [C] 20m級4扉車の標準値(出典未確認。実車資料が入手できたら要更新)          */
const K8={
  LEN:19.50,      // [C] 車体長[m]
  PITCH:20.00,    // [C] 連結面間距離[m](編成内の車両間隔)
  W:2.845,        // [B] 車体幅[m](正面シルエット幅=車体幅 として測定した基準値)
  FLOOR:0.95,     // [B] 車体裾(床面)高さ[m](レール面基準)
  SHLD:3.15,      // [B] 肩(垂直な側面の上端)[m]
  ROOF:3.64,      // [B] 屋根頂部[m]
  NOSE:0.72,      // 前頭部を平面視・側面視で絞り込む長さ[m]
  CAB:1.95,       // [B] 乗務員室(普通鋼・アイボリー塗装)の範囲[m]
  RAKE:0.34,      // 前面の後傾(上に行くほど後退)[m/m]
  RAKE_Y:2.15,    // 後傾が始まる高さ[m]
  BOGIE:13.60,    // [C] 台車中心間距離[m]
  WBASE:2.20,     // [C] 固定軸距[m]
  WHEEL:0.43,     // [C] 車輪半径[m](径860mm)
  DOORW:1.30,     // [A] 客用扉の幅[m](片側4扉)
  DOORX:[-7.05,-2.35,2.35,7.05],   // [C] 客用扉の中心位置[m]
};
// 前頭部の絞り(形状の調整つまみはこの3つだけ。実車写真との突き合わせはここを触る)
const NOSE_PLAN=t=>1-0.10*t*t*t;   // 平面視:先端で幅90%(角の丸み)
const NOSE_SHLD=3.44;              // 先端での肩の高さ[m](前面窓が上まで回り込む)
const NOSE_DROP=0.05;              // 先端での屋根の下がり[m]

/* ---- 9-2. 配色 ------------------------------------------------------------
   [A] 車体は軽量ステンレス。前頭部〜乗務員扉のみ普通鋼でアイボリー塗装。
       帯は京王レッドと京王ブルー。                                            */
const PAL={
  stl  :[0.66,0.69,0.72],   // 軽量ステンレス(ヘアライン)
  roof :[0.57,0.60,0.63],   // 屋根(灰色塗り屋根)
  door :[0.72,0.75,0.78],   // 客用扉(無塗装ステンレス。地よりわずかに明るい)
  red  :[0.80,0.05,0.29],   // 京王レッド
  navy :[0.09,0.15,0.38],   // 京王ブルー
  ivory:[0.94,0.91,0.83],   // 前頭部(普通鋼・アイボリー塗装)
  glass:[0.13,0.16,0.21],   // 窓(下端側)
  glassT:[0.20,0.25,0.32],  // 窓(上端側。上下でわずかに明度差をつけ平板に見せない)
  sash :[0.78,0.81,0.84],   // 窓框・戸当り
  dark :[0.09,0.10,0.11],   // 表示器・戸当り・幌の黒(ガラス色と混同しない明度に離す)
};

/* ---- 9-3. 側面の帯(下から順。境界には必ず頂点を置き二重化する) --------------
   [B] 赤帯 1.43〜1.66m / 紺の細線 1.83〜1.87m / 側窓 2.27〜3.05m
   ※紺線は赤帯の"上"。ここを取り違えたのが旧実装で最も長く残ったバグだった。   */
const BANDS=[
  {y0:0.00, y1:1.43, c:'stl' },   // 腰板(ステンレス地)
  {y0:1.43, y1:1.66, c:'red' },   // 京王レッド
  {y0:1.66, y1:1.83, c:'stl' },
  {y0:1.83, y1:1.87, c:'navy'},   // 京王ブルーの細線
  {y0:1.87, y1:3.15, c:'stl' },   // 幕板
  {y0:3.15, y1:9.99, c:'roof'},   // 肩から上=屋根
];
const WIN ={B:2.27, T:3.05};      // [B] 側窓の上下端[m]
const FWIN={B:1.95, T:3.42};      // [B] 前面窓の上下端[m]
const BAND_RISE=0.26;             // 前頭部で帯が跳ね上がる量[m]
// BANDS の健全性検査(下から順に連続していること)。壊れた表で描き始めない。
(function(){
  for(let i=0;i<BANDS.length;i++){
    if(!(BANDS[i].y1>BANDS[i].y0)) throw new Error('BANDS: y1<=y0 at '+i);
    if(i&&Math.abs(BANDS[i].y0-BANDS[i-1].y1)>1e-9) throw new Error('BANDS: 不連続 at '+i);
  }
  if(!(WIN.B>1.87&&WIN.T>WIN.B)) throw new Error('WIN: 側窓が帯と干渉');
})();
function bandAt(y){ for(const b of BANDS) if(y>=b.y0&&y<b.y1) return b.c; return 'stl'; }

/* ---- 9-4. 断面と車体ロフト -------------------------------------------------
   ストレート車体(裾絞りなし)+丸屋根。断面を車長方向にスイープする。          */
const EPS=0.004;
function uniqSorted(a,tol){
  const s=a.slice().sort((p,q)=>p-q), o=[s[0]];
  for(const v of s) if(v-o[o.length-1]>(tol||0.0015)) o.push(v);
  return o;
}
// 側面の高さ方向の頂点列。帯の境界は"固定"、肩から上の埋め点だけを個数固定で等分する。
// → 先頭部で肩が上がってもリングの頂点数が変わらない(接続が壊れない)。
const BAND_YS=(function(){
  const f=[K8.FLOOR];
  for(const b of BANDS) for(const k of [b.y0,b.y1])
    if(k>K8.FLOOR+0.02&&k<K8.SHLD-0.02){ f.push(k-EPS); f.push(k+EPS); }
  return uniqSorted(f);
})();
function sideYs(ys,nFill){
  const out=BAND_YS.slice(), top=BAND_YS[BAND_YS.length-1];
  for(let i=1;i<=nFill;i++) out.push(top+(ys-top)*i/nFill);
  return out;
}
// x位置における断面の形(先頭部の絞りを含む)
function shapeAt(x,cabF,cabR){
  const half=K8.LEN/2;
  let t=0;
  if(cabF&&x>half-K8.NOSE)  t=(x-(half-K8.NOSE))/K8.NOSE;
  if(cabR&&x<-half+K8.NOSE) t=((-half+K8.NOSE)-x)/K8.NOSE;
  const hw=(K8.W/2)*(t>0?NOSE_PLAN(t):1);
  const ys=K8.SHLD+(NOSE_SHLD-K8.SHLD)*t;
  const yt=K8.ROOF-NOSE_DROP*t;
  let cab=0;
  if(cabF&&x> half-K8.CAB) cab= 1;
  if(cabR&&x<-half+K8.CAB) cab=-1;
  return {x:x, hw:hw, ys:ys, yt:yt, cab:cab, t:t};
}
// 断面の点列(右側面 下→上 → 丸屋根 右→左 → 左側面 上→下)
function sectionPts(s,nRoof,nFill){
  const pts=[], dy=s.yt-s.ys;
  const R=((s.hw*s.hw)+dy*dy)/(2*dy), cy=s.yt-R, a0=Math.atan2(s.ys-cy,s.hw);
  const YS=sideYs(s.ys,nFill);
  for(const y of YS) pts.push([y, s.hw]);
  for(let i=1;i<nRoof;i++){ const th=a0+(Math.PI-2*a0)*i/nRoof;
    pts.push([cy+Math.sin(th)*R, Math.cos(th)*R]); }
  for(let i=YS.length-1;i>=0;i--) pts.push([YS[i], -s.hw]);
  return pts;
}
// 車長方向のstation(扉の縁・乗務員室境界・先頭部を細かく刻む)
function stationXs(cabF,cabR,LP){
  const half=K8.LEN/2, set=[-half,half];
  for(const dx of K8.DOORX) for(const e of [dx-K8.DOORW/2, dx+K8.DOORW/2]){ set.push(e-EPS); set.push(e+EPS); }
  if(cabF){ set.push(half-K8.CAB-EPS); set.push(half-K8.CAB+EPS); }
  if(cabR){ set.push(-half+K8.CAB-EPS); set.push(-half+K8.CAB+EPS); }
  for(let x=-half;x<=half;x+=LP.mid) set.push(x);
  if(cabF) for(let x=half-K8.NOSE-0.2;x<=half;x+=LP.nose) set.push(x);
  if(cabR) for(let x=-half;x<=-half+K8.NOSE+0.2;x+=LP.nose) set.push(x);
  return uniqSorted(set.filter(v=>v>=-half-1e-6&&v<=half+1e-6));
}
// 車体地色。前頭部はアイボリー地に、前方へ向かって跳ね上がる帯を乗せる。
function bodyColor(x,y,z,s){
  if(y>=s.ys-0.006) return PAL.roof;
  if(s.cab){
    const d=K8.LEN/2-Math.abs(x);                       // 先端からの距離[m]
    const zr=s.hw>0.05?Math.abs(z)/s.hw:0;              // 断面内の左右位置(0=中央/1=側端)
    const rise=BAND_RISE*zr*Math.max(0,Math.min(1,(K8.CAB-d)/K8.CAB));
    const c=bandAt(y-rise);
    return c==='red'?PAL.red : c==='navy'?PAL.navy : PAL.ivory;
  }
  return PAL[bandAt(y)];
}
// 前面(後傾した面)のx位置と、その高さでの半幅
function frontX(y){ return K8.LEN/2-Math.max(0,y-K8.RAKE_Y)*K8.RAKE; }
const FTIP=shapeAt(K8.LEN/2,true,false);
function frontHalfAt(y){
  if(y<=FTIP.ys) return FTIP.hw;
  const dy=FTIP.yt-FTIP.ys, R=((FTIP.hw*FTIP.hw)+dy*dy)/(2*dy), cy=FTIP.yt-R;
  const v=R*R-(y-cy)*(y-cy);
  return v>0?Math.sqrt(v):0.02;
}
function buildBodyGeo(cabF,cabR,LP){
  const P=[],C=[],I=[];
  const vtx=(x,y,z,c)=>{ const i=P.length/3; P.push(x,y,z); C.push(c[0],c[1],c[2]); return i; };
  const xs=stationXs(cabF,cabR,LP), rings=[];
  for(const x of xs){
    const s=shapeAt(x,cabF,cabR), pts=sectionPts(s,LP.roof,LP.fill), ring=[];
    for(const p of pts) ring.push(vtx(x,p[0],p[1],bodyColor(x,p[0],p[1],s)));
    rings.push(ring);
  }
  for(let i=0;i<rings.length-1;i++){
    const A=rings[i],B=rings[i+1];
    for(let k=0;k<A.length-1;k++){ I.push(A[k],B[k],B[k+1]); I.push(A[k],B[k+1],A[k+1]); }
  }
  // 両端を面で閉じる。先頭側は後傾した前面、連結側は平らな妻面。
  for(const end of [{sgn:1,cab:cabF},{sgn:-1,cab:cabR}]){
    const sgn=end.sgn, tip=shapeAt(sgn*K8.LEN/2,cabF,cabR);
    const yTop=tip.yt, rows=[K8.FLOOR];
    for(const b of BANDS) for(const k of [b.y0,b.y1])
      if(k>K8.FLOOR+0.02&&k<yTop-0.02){ rows.push(k-EPS); rows.push(k+EPS); }
    for(let y=K8.FLOOR+LP.face;y<yTop;y+=LP.face) rows.push(y);
    rows.push(yTop);
    const RY=uniqSorted(rows), NC=LP.faceC, grid=[];
    for(const y of RY){
      const hw=end.cab?Math.max(0.02,frontHalfAt(y))
                      :Math.max(0.02,(y<=tip.ys?tip.hw:frontHalfAt(y)));
      const x=sgn*(end.cab?frontX(y):K8.LEN/2);
      const row=[];
      for(let ci=0;ci<=NC;ci++){
        const z=-hw+2*hw*ci/NC;
        const c=end.cab?bodyColor(sgn*K8.LEN/2,y,z,{hw:Math.max(0.05,hw),ys:tip.ys,cab:sgn})
                       :(y>=tip.ys-0.006?PAL.roof:PAL.stl);
        row.push(vtx(x,y,sgn*z,c));
      }
      grid.push(row);
    }
    for(let r=0;r<grid.length-1;r++){
      const A=grid[r],B=grid[r+1];
      for(let ci=0;ci<NC;ci++){
        if(sgn>0){ I.push(A[ci],B[ci],B[ci+1]); I.push(A[ci],B[ci+1],A[ci+1]); }
        else     { I.push(A[ci],B[ci+1],B[ci]); I.push(A[ci],A[ci+1],B[ci+1]); }
      }
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

/* ---- 9-5. 側面のレイアウト(扉配置から窓割りを自動生成) ----------------------
   K8.DOORX / K8.DOORW を変えれば窓割りも自動で追従する。                      */
const PIER_END=0.42, PIER_MID=0.26, WIN_MAX=1.45;   // 端の柱/窓間の柱/窓の最大幅[m]
const CREW={ doorX:8.30, doorW:0.72, doorT:2.95,    // 乗務員扉(中心x/幅/上端)
             winX:9.12, winW:0.66, winB:2.18, winT:2.98 };  // 乗務員室側窓
function sideWindows(cabF,cabR){
  const half=K8.LEN/2, hw=K8.DOORW/2, e=[-half];
  for(const dx of K8.DOORX){ e.push(dx-hw); e.push(dx+hw); }
  e.push(half);
  const out=[];
  for(let i=0;i<e.length-1;i+=2){
    let a=e[i], b=e[i+1];
    // 乗務員室にかかる区間は客用窓を置かず、乗務員扉+乗務員室側窓に置き換える
    if(cabF&&b>half-K8.CAB) continue;
    if(cabR&&a<-half+K8.CAB) continue;
    const L=b-a;
    const n=Math.max(1,Math.round((L-2*PIER_END+PIER_MID)/(WIN_MAX+PIER_MID)));
    const w=(L-2*PIER_END-(n-1)*PIER_MID)/n;
    if(w<0.35) continue;
    for(let k=0;k<n;k++){ const x0=a+PIER_END+k*(w+PIER_MID); out.push([x0,x0+w]); }
  }
  return out;
}
/* ---- 9-6. 窓・扉パネル(車体表面のわずか外側に置く独立メッシュ) --------------
   材質は DoubleSide。巻き順の反転で面が消える事故(TEMPLATE.md §6)を構造的に断つ。 */
const OUT=0.006;   // 車体表面からの浮かせ量[m]
function pushQuad(P,C,I,p0,p1,p2,p3,c0,c1){
  const b=P.length/3;
  const cs=[c0,c0,c1,c1];                       // 下2点=c0 / 上2点=c1(上下のグラデーション)
  const ps=[p0,p1,p2,p3];
  for(let i=0;i<4;i++){ P.push(ps[i][0],ps[i][1],ps[i][2]); C.push(cs[i][0],cs[i][1],cs[i][2]); }
  I.push(b,b+1,b+2); I.push(b,b+2,b+3);
}
// 側面の矩形パネル。帯の境界で水平に切り、各段の色を帯に従わせる(帯が扉を横切る)。
// z座標は関数 zf(x) で与える。先頭部で車体が絞れてもパネルが浮かない。
function sidePanel(P,C,I,x0,x1,y0,y1,zf,baseKey){
  const ys=[y0,y1];
  for(const b of BANDS) for(const k of [b.y0,b.y1]) if(k>y0+0.005&&k<y1-0.005) ys.push(k);
  const Y=uniqSorted(ys,0.003);
  const za=zf(x0), zb=zf(x1);
  for(let i=0;i<Y.length-1;i++){
    const bk=bandAt((Y[i]+Y[i+1])/2);
    const c=bk==='red'?PAL.red:bk==='navy'?PAL.navy:PAL[baseKey];
    pushQuad(P,C,I,[x0,Y[i],za],[x1,Y[i],zb],[x1,Y[i+1],zb],[x0,Y[i+1],za],c,c);
  }
}
// 窓(框で縁取り、ガラスは上下でわずかに明度差)
function sideWindow(P,C,I,x0,x1,y0,y1,zf,zg){
  const f=0.055;   // 框の幅[m]
  pushQuad(P,C,I,[x0,y0,zf(x0)],[x1,y0,zf(x1)],[x1,y1,zf(x1)],[x0,y1,zf(x0)],PAL.sash,PAL.sash);
  pushQuad(P,C,I,[x0+f,y0+f,zg(x0+f)],[x1-f,y0+f,zg(x1-f)],
                 [x1-f,y1-f,zg(x1-f)],[x0+f,y1-f,zg(x0+f)],PAL.glass,PAL.glassT);
}
function buildTrimGeo(cabF,cabR){
  const P=[],C=[],I=[];
  const hwAt=x=>shapeAt(x,cabF,cabR).hw;      // その位置の車体半幅(先頭部の絞りを含む)
  for(const sz of [1,-1]){
    const zo=o=>(x=>sz*(hwAt(x)+o));          // 車体表面から o だけ浮かせた面
    // 客用扉(戸当りを挟んだ2枚引戸)+扉窓
    for(const dx of K8.DOORX){
      const a=dx-K8.DOORW/2, b=dx+K8.DOORW/2;
      sidePanel(P,C,I,a,b,K8.FLOOR+0.06,K8.SHLD-0.10,zo(OUT),'door');
      sidePanel(P,C,I,dx-0.012,dx+0.012,K8.FLOOR+0.06,K8.SHLD-0.10,zo(OUT*1.6),'dark');
      sideWindow(P,C,I,a+0.15,b-0.15,WIN.B-0.16,WIN.T,zo(OUT*2),zo(OUT*1.5));
    }
    // 客用窓(扉配置から自動生成)
    for(const w of sideWindows(cabF,cabR))
      sideWindow(P,C,I,w[0],w[1],WIN.B,WIN.T,zo(OUT),zo(OUT*0.5));
    // 乗務員扉・乗務員室側窓
    for(const end of [{s:1,on:cabF},{s:-1,on:cabR}]){
      if(!end.on) continue;
      const sg=end.s, dx=sg*CREW.doorX, wx=sg*CREW.winX;
      const rng=(c,w)=>[Math.min(c-w/2,c+w/2), Math.max(c-w/2,c+w/2)];
      const d=rng(dx,CREW.doorW), v=rng(wx,CREW.winW);
      sidePanel(P,C,I,d[0],d[1],K8.FLOOR+0.06,CREW.doorT,zo(OUT),'ivory');
      sideWindow(P,C,I,d[0]+0.08,d[1]-0.08,2.20,CREW.doorT-0.12,zo(OUT*2),zo(OUT*1.5));
      sideWindow(P,C,I,v[0],v[1],CREW.winB,CREW.winT,zo(OUT),zo(OUT*0.5));
    }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}
/* ---- 9-7. 前面(3次元曲面ガラス3分割・貫通扉・行先表示器) --------------------
   [A] 前頭部は普通鋼のアイボリー塗装、前面窓は3分割の曲面ガラス、
       分割編成用の貫通路(プラグドア)を中央に備える。                          */
const FGLASS=[[-0.40,0.40],[0.54,1.20],[-1.20,-0.54]];   // 前面窓の左右範囲[m](中央=貫通扉窓)
function buildFaceGeo(sgn){
  const P=[],C=[],I=[];
  const at=(y,z,o)=>[sgn*(frontX(y)+(o===undefined?OUT:o)), y, sgn*z];
  // 前面窓(框+ガラス)。上下に分割してガラスに明度差をつける。
  for(const g0 of FGLASS){
    const z0=g0[0], z1=g0[1], f=0.05;
    pushQuad(P,C,I,at(FWIN.B,z0),at(FWIN.B,z1),at(FWIN.T,z1),at(FWIN.T,z0),PAL.sash,PAL.sash);
    const NY=6;
    for(let i=0;i<NY;i++){
      const ya=FWIN.B+f+(FWIN.T-FWIN.B-2*f)*i/NY, yb=FWIN.B+f+(FWIN.T-FWIN.B-2*f)*(i+1)/NY;
      const mix=t=>[PAL.glass[0]+(PAL.glassT[0]-PAL.glass[0])*t,
                    PAL.glass[1]+(PAL.glassT[1]-PAL.glass[1])*t,
                    PAL.glass[2]+(PAL.glassT[2]-PAL.glass[2])*t];
      pushQuad(P,C,I,at(ya,z0+f,OUT*2),at(ya,z1-f,OUT*2),at(yb,z1-f,OUT*2),at(yb,z0+f,OUT*2),
               mix(i/NY),mix((i+1)/NY));
    }
  }
  // 貫通扉の縁(中央窓の下、腰部まで)
  pushQuad(P,C,I,at(K8.FLOOR+0.10,-0.44),at(K8.FLOOR+0.10,0.44),at(FWIN.B,0.44),at(FWIN.B,-0.44),
           PAL.ivory,PAL.ivory);
  for(const zz of [-0.44,0.44])
    pushQuad(P,C,I,at(K8.FLOOR+0.10,zz-0.015,OUT*2),at(K8.FLOOR+0.10,zz+0.015,OUT*2),
                   at(FWIN.T,zz+0.015,OUT*2),at(FWIN.T,zz-0.015,OUT*2),PAL.dark,PAL.dark);
  // 行先表示器(前面窓の上・中央)
  pushQuad(P,C,I,at(FWIN.T+0.03,-0.52,OUT*2),at(FWIN.T+0.03,0.52,OUT*2),
                 at(FWIN.T+0.19,0.52,OUT*2),at(FWIN.T+0.19,-0.52,OUT*2),PAL.dark,PAL.dark);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(C,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

/* ---- 9-8. ジオメトリのLODと材質 -------------------------------------------- */
const LODP={hi:{roof:40, mid:0.22, nose:0.030, fill:14, face:0.06, faceC:40},
            lo:{roof:12, mid:0.90, nose:0.20,  fill:4,  face:0.30, faceC:12}};
const CARMAT =new THREE.MeshLambertMaterial({vertexColors:true});
const TRIMMAT=new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide});
const CARMAT_INO =new THREE.MeshLambertMaterial({vertexColors:true,color:0x9fd8ea});
const CARMAT_SETA=new THREE.MeshLambertMaterial({vertexColors:true,color:0xa8d99a});
const CARGEO={}, CARGEO_LO={}, TRIMGEO={};
for(const k of ['mid','cf','cr']){

}

/* ---- 9-9. 屋根上・床下・台車 ------------------------------------------------
   [A] 冷房は屋根上集中式 48.84kW(42,000kcal/h)を1両に"1基"。旧実装は3基載せて
       いたが誤り。中央の1基からダクトカバーが前後へ伸びる形に改める。
   [A] 台車は東急車輛製 TS-823A(電動)/TS-824(付随)。車体直結式空気ばね(ボルスタレス)。
   [A] パンタグラフは東洋電機製 PT-4201(菱形)。                                */
const M_AC =M(0x9199a0), M_ACL=M(0xa6adb3), M_DUCT=M(0x8b9299),

      M_HLC =M(0x2a2e33), M_HL =new THREE.MeshLambertMaterial({color:0xf6f7f8,emissive:0x9aa0a6}),
      M_TL  =new THREE.MeshLambertMaterial({color:0xd23b36,emissive:0x521512}),
      M_SKIRT=M(0x585e66), M_CPL=M(0x3a3f45), M_HOOD=M(0x23262a);
// 屋根上
const G_AC  =new THREE.BoxGeometry(2.40,0.34,1.86);      // 集中式冷房装置(1基)

const G_VVVF=new THREE.BoxGeometry(3.10,0.62,2.06);      // 主制御器(VVVF)

const G_ABX =new THREE.BoxGeometry(0.40,0.30,0.26);      // 軸箱

const G_PBS=new THREE.BoxGeometry(2.24,0.10,1.86);
const G_PIN=new THREE.CylinderGeometry(0.085,0.085,0.28,12);

// 前頭部の部品

function addBogie(g,bx,motored){
  for(const sz of [-1,1]){
    const sd=new THREE.Mesh(G_SIDE,M_BOG); sd.position.set(bx,0.62,sz*0.99); g.add(sd);
    const ap=new THREE.Mesh(G_ASP,M_AIR);  ap.position.set(bx,0.86,sz*0.86); g.add(ap);

  const xb=new THREE.Mesh(G_XBM,M_BOG); xb.position.set(bx,0.62,0); g.add(xb);
  for(const wx of [-K8.WBASE/2, K8.WBASE/2]){
    const ax=new THREE.Mesh(G_AXL,M_WHL); ax.rotation.x=Math.PI/2; ax.position.set(bx+wx,K8.WHEEL,0); g.add(ax);
    for(const wz of [-1.06,1.06]){
      const w=new THREE.Mesh(G_WHL,M_WHL); w.rotation.x=Math.PI/2; w.position.set(bx+wx,K8.WHEEL,wz); g.add(w);
      const d=new THREE.Mesh(G_DISC,M_DISC); d.rotation.x=Math.PI/2; d.position.set(bx+wx,K8.WHEEL,wz*0.68); g.add(d);
      const ab=new THREE.Mesh(G_ABX,M_BOG); ab.position.set(bx+wx,K8.WHEEL+0.10,wz*0.86); g.add(ab);

    if(motored){
      const mt=new THREE.Mesh(G_MOT,M_BOG); mt.rotation.x=Math.PI/2;
      mt.position.set(bx+wx*0.35,K8.WHEEL+0.06,0); g.add(mt);

function makeCar(livery,panto,cabF,cabR){
  const g=new THREE.Group();
  const key=cabF?'cf':(cabR?'cr':'mid');
  const body=new THREE.Mesh(CARGEO[key],CARMAT); g.add(body);
  const trim=new THREE.Mesh(TRIMGEO[key],TRIMMAT); g.add(trim);
  g.userData.body=body; g.userData.key=key; g.userData.hi=true;
  const fine=[];                        // 遠景で消す細部(LOD)
  const addFine=m=>{ g.add(m); fine.push(m); return m; };
  if(cabF) g.add(new THREE.Mesh(FACEGEO.f,TRIMMAT));
  if(cabR) g.add(new THREE.Mesh(FACEGEO.r,TRIMMAT));
  // 屋根上:集中式冷房1基+前後のダクトカバー
  const ac=new THREE.Mesh(G_AC,M_AC);  ac.position.set(0,K8.ROOF+0.14,0); g.add(ac);
  const al=new THREE.Mesh(G_ACL,M_ACL);al.position.set(0,K8.ROOF+0.33,0); addFine(al);
  for(const dx of [-4.60,4.60]){
    const du=new THREE.Mesh(G_DUCT,M_DUCT); du.position.set(dx,K8.ROOF+0.03,0); g.add(du);
  }
  for(const vx of [-8.2,8.2]) addFine(new THREE.Mesh(G_VENT,M_ACL)).position.set(vx,K8.ROOF+0.06,0.62);
  // 床下機器
  const vv=new THREE.Mesh(G_VVVF,M_UND); vv.position.set(-3.30,K8.FLOOR-0.36,0); g.add(vv);
  const sv=new THREE.Mesh(G_SIV ,M_UND); sv.position.set( 0.40,K8.FLOOR-0.34,0); g.add(sv);
  const cp=new THREE.Mesh(G_CP  ,M_UND); cp.position.set( 3.40,K8.FLOOR-0.31,-0.20); addFine(cp);
  const bt=new THREE.Mesh(G_BAT ,M_UND); bt.position.set(-6.20,K8.FLOOR-0.28,0.10); addFine(bt);
  const tk=new THREE.Mesh(G_TANK,M_UND); tk.rotation.z=Math.PI/2; tk.position.set(5.40,K8.FLOOR-0.30,0.55); addFine(tk);
  // 台車(先頭台車は付随、他は電動という簡略。編成の見た目には十分)
  addBogie(g,-K8.BOGIE/2, !cabR);

  // 前頭部の部品

    const cp2=new THREE.Mesh(G_CPL,M_CPL);  cp2.position.set(sg*(K8.LEN/2+0.22),0.66,0); addFine(cp2);
  }

  for(const end of [{s:1,on:!cabF},{s:-1,on:!cabR}]){
    if(!end.on) continue;
    addFine(new THREE.Mesh(G_HOOD,M_HOOD)).position.set(end.s*(K8.LEN/2+0.06),2.05,0);
  }
  if(panto){
    const bs=new THREE.Mesh(G_PBS,M_PN); bs.position.set(-1.0,K8.ROOF+0.06,0); g.add(bs);
    for(const zz of [-0.70,0.70]) for(const xx of [-1.66,-0.34])
      addFine(new THREE.Mesh(G_PIN,M_INS)).position.set(xx,K8.ROOF+0.22,zz);
    const a1=new THREE.Mesh(G_PA1,M_PN); a1.position.set(-1.52,K8.ROOF+0.60,0); a1.rotation.z=0.78; g.add(a1);
    const a2=new THREE.Mesh(G_PA2,M_PN); a2.position.set(-0.34,K8.ROOF+0.98,0); a2.rotation.z=-0.30; g.add(a2);
    const sh=new THREE.Mesh(G_PSH,M_SH); sh.position.set(0.34,K8.ROOF+1.10,0); g.add(sh);

  g.userData.fine=fine;
  if(livery==='ino'||livery==='seta'){   // 井の頭線・世田谷線は色替え(簡易)
    body.material=(livery==='ino')?CARMAT_INO:CARMAT_SETA;
    trim.material=(livery==='ino')?CARMAT_INO:CARMAT_SETA;
  }
  scene.add(g); return g;
}

/* ---- 走行列車(3本)。各駅停車のダイヤを自動運転で再現する ----
   加速=P4(3.3km/h/s), 上限=60km/h, 減速=B5(3.0km/h/s), 停車時間=25秒。
   状態機械: 'run'(駅間走行) → 'brake'(停止位置へ減速) → 'dwell'(25秒停車) → 'run' */
const DRIVE={ACC:3.3, DEC:3.0, VMAX_KMH:60, DWELL:25};   // 自動運転パラメータ
const trains=[];
[[1, 300],[1, 3000],[-1, 5600]].forEach(function(a){
  const dir=a[0], xs=a[1], cars=[];
  for(let j=0;j<10;j++)cars.push(makeCar('keio',(j===1||j===7), j===0, j===9));   // 先頭部は編成の外側へ
  const reset=(dir>0)?(DOM.x0-210):(DOM.x1+210);
  // st=状態, v=速度[m/s], dwell=停車残り時間, target=次の停止位置s
  trains.push({dir:dir, x:xs, x0:reset, v:0, st:'run', dwell:0, target:null, cars:cars});
});
// 進行方向の次の停止位置(駅ホーム先端-3m)を返す
function nextStopFor(t){
  let best=null;
  for(const s of STA){
    const sp=stopPosOf(s);
    if(t.dir>0 && sp>t.x+1 && (best===null||sp<best)) best=sp;
    if(t.dir<0 && sp<t.x-1 && (best===null||sp>best)) best=sp;
  }
  return best;
}
// 1列車の自動運転を1フレーム進める
function driveTrain(t,dt){
  const VMAX=DRIVE.VMAX_KMH/3.6;
  if(t.st==='dwell'){                       // 停車中:残り時間を減らす
    t.dwell-=dt;
    if(t.dwell<=0){ t.st='run'; t.target=nextStopFor(t); }
    return;
  }
  if(t.target===null) t.target=nextStopFor(t);
  if(t.target===null){                      // 前方に駅なし=端へ。折返して入り直す
    t.x+=t.dir*t.v*dt; t.v=Math.min(VMAX,t.v+DRIVE.ACC/3.6*dt);
    if((t.dir>0&&t.x>DOM.x1-CAR_HALF)||(t.dir<0&&t.x<DOM.x0+CAR_HALF)){ t.x=t.x0; t.v=0; t.st='run'; t.target=null; }
    return;
  }
  const dist=(t.target-t.x)*t.dir;          // 停止位置までの残距離[m](進行方向正)
  const brakeDist=(t.v*t.v)/(2*DRIVE.DEC/3.6);   // 現速度から止まるのに要る距離
  if(dist<=brakeDist+0.2){                   // 減速フェーズ
    t.st='brake';
    t.v=Math.max(0, t.v-DRIVE.DEC/3.6*dt);
    if(t.v<0.15 && dist<1.0){ t.x=t.target; t.v=0; t.st='dwell'; t.dwell=DRIVE.DWELL; }
    else t.x+=t.dir*t.v*dt;
  }else{                                     // 力行/惰行フェーズ(60km/h上限)
    t.st='run';
    t.v=Math.min(VMAX, t.v+DRIVE.ACC/3.6*dt);
    t.x+=t.dir*t.v*dt;
  }
}

// 車両は「前後の車端2点を結ぶ弦」に沿って配置する(曲線でも必ず線路方向を向く)
const CAR_HALF=K8.LEN/2;
// 車端2点の実位置から姿勢(ヨー+ピッチ)を決める。勾配区間でも車体が線路に沿う
let LOD_NEAR=420;   // この距離までは高精細モデル(スマホでは短縮)
const _UP=new THREE.Vector3(0,1,0), _F=new THREE.Vector3(), _R=new THREE.Vector3(),
      _U=new THREE.Vector3(), _M4=new THREE.Matrix4();
function seatCar(c,s,zf,dir){
  const sA=s-CAR_HALF, sB=s+CAR_HALF;
  const pA=frame(sA,zf(sA)), pB=frame(sB,zf(sB));
  const yA=railY(sA)+.1, yB=railY(sB)+.1;
  _F.set(pB.x-pA.x, yB-yA, pB.z-pA.z);
  if(dir<0)_F.multiplyScalar(-1);                      // 上り列車は先頭部を進行方向へ
  _F.normalize();
  _R.crossVectors(_F,_UP).normalize();                 // 右手系: X=前, Y=上, Z=右
  _U.crossVectors(_R,_F).normalize();
  _M4.makeBasis(_F,_U,_R);
  c.quaternion.setFromRotationMatrix(_M4);
  c.position.set((pA.x+pB.x)/2, (yA+yB)/2, (pA.z+pB.z)/2);
  const ud=c.userData;                                   // LOD:近景=高精細/遠景=簡素
  if(ud&&ud.body){
    const d=camera.position.distanceTo(c.position), hi=d<LOD_NEAR;
    if(hi!==ud.hi){
      ud.hi=hi;
      ud.body.geometry=(hi?CARGEO:CARGEO_LO)[ud.key];
      if(ud.fine) for(const m of ud.fine) m.visible=hi;   // 灯具・幌・配管等は遠景で省く
    }
  }
}
// 編成の各車両を配置する。範囲外の車両は非表示にし、姿勢計算もスキップして軽量化。
function placeTrain(t){
  const zf=t.dir>0?zDown:zUp;
  for(let j=0;j<t.cars.length;j++){
    const s=t.x-t.dir*j*K8.PITCH, c=t.cars[j];
    const inside=(s>DOM.x0+CAR_HALF && s<DOM.x1-CAR_HALF);
    c.visible = inside && trainsOn;
    if(inside) seatCar(c, s, zf, t.dir);      // 見えている車両だけ弦法で姿勢決定
  }
}

];

function applyCam(){

function flyTo(to,dur){fly={a:Object.assign({},cam),b:Object.assign(Object.assign({},cam),to),t0:performance.now(),dur:dur||1400};}
function stepFly(now){
  if(!fly)return;
  let t=(now-fly.t0)/fly.dur;if(t>=1){Object.assign(cam,fly.b);fly=null;return;}
  t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  for(const k of['tx','ty','tz','r','th','ph'])cam[k]=fly.a[k]+(fly.b[k]-fly.a[k])*t;
}
const pts=new Map();let pinchD=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinchD=0;if(!rideOn)fly=null;});
canvas.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pinchD=0;});
canvas.addEventListener('dblclick',()=>{if(rideOn){rideYaw=0;ridePitch=0;}});   // 正面へ戻す
canvas.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);pinchD=0;});
canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(rideOn){   // 運転モード:ドラッグで首振り(左右±120°/上下±45°)。2本指は無視
    if(pts.size>=2)return;
    rideYaw   = clamp(rideYaw   - dx*.004, -2.1, 2.1);
    ridePitch = clamp(ridePitch - dy*.003, -0.8, 0.8);
    return;
  }
  if(pts.size===2){
    const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0){if(chaseOn)CH.r=clamp(CH.r*pinchD/d,60,650);else cam.r=clamp(cam.r*pinchD/d,90,9800);}
    pinchD=d;return;
  }
  if(chaseOn){CH.th+=dx*.005;CH.ph=clamp(CH.ph-dy*.004,.18,1.45);return;}   // 追尾中は角度のみ操作
  setAuto(false);
  if(e.shiftKey||e.ctrlKey||(e.buttons&2)){cam.th+=dx*.005;cam.ph=clamp(cam.ph-dy*.004,.14,1.5);}   // 回転=修飾キー+ドラッグ
  else{pan(dx,dy);}   // 移動=ドラッグのみ
});
canvas.addEventListener('wheel',e=>{e.preventDefault();if(rideOn)return;
  if(chaseOn){CH.r=clamp(CH.r*Math.pow(1.0016,e.deltaY),60,650);return;}   // 追尾中は距離を操作
  fly=null;cam.r=clamp(cam.r*Math.pow(1.0016,e.deltaY),90,9800);},{passive:false});
canvas.addEventListener('contextmenu',e=>e.preventDefault());
function pan(dx,dy){
  const k=cam.r*.0014;
  const fx=-Math.cos(cam.th),fz=-Math.sin(cam.th),rx=-fz,rz=fx;
  cam.tx-=(rx*dx-fx*dy)*k;cam.tz-=(rz*dx-fz*dy)*k;   // dyの符号を反転(上下の追従を修正)
  cam.tx=clamp(cam.tx,-8500,800);cam.tz=clamp(cam.tz,-900,2100);
}

/* ============ 12. UI・ループ ============ */
const $=id=>document.getElementById(id);
function setAuto(v){autoOrbit=v;const b=$('btnOrbit');b.classList.toggle('on',v);b.textContent='自動旋回 '+(v?'ON':'OFF');}
$('btnOrbit').onclick=()=>{setRide(false);setAuto(!autoOrbit);};
$('btnHome').onclick=()=>{setRide(false);setChase(false);setAuto(false);flyTo(OV,1600);};
$('btnRide').onclick=()=>setRide(!rideOn);

// ---- マスコンの画面ボタン(タッチ操作用。PCでも使える) ----
$('btnUp').onclick=()=>setNotch(notch-1);      // 上=制動側へ
$('btnDn').onclick=()=>setNotch(notch+1);      // 下=力行側へ
$('btnN').onclick=()=>setNotch(NIDX_N);        // 中立
$('btnE').onclick=()=>setNotch(NIDX_EB);       // 非常ブレーキ

// ---- パネルの開閉(上:縦断図ナビ / 右:メニュー) ----
function togglePanel(panel,btn,dir){
  const hidden=panel.classList.toggle('hide');
  btn.textContent = dir==='top' ? (hidden?'▼':'▲') : (hidden?'◀':'▶');
}
$('navTog').onclick=()=>togglePanel($('nav'),$('navTog'),'top');
$('toolTog').onclick=()=>togglePanel($('tools'),$('toolTog'),'right');

// 次の停車駅:ホーム先端(駅中心+90m)を過ぎたら次駅へ切り替える。
// 停止位置はホーム先端の3m手前(駅中心+87m)。
const PLAT_HALF=105, STOP_BACK=3;   // ホーム長210m(半長105m)
function stopPosOf(st){
  // 停止位置=ホーム先端の3m手前。ただし笹塚は「先端から3m東」を0m起点とする特例。
  return (st===STA[0]) ? st.x+PLAT_HALF+STOP_BACK : st.x+PLAT_HALF-STOP_BACK;
}
function nextStop(s){
  for(const st of STA){
    if(s <= st.x+PLAT_HALF) return {st:st, stop:stopPosOf(st)};
  }
  return null;
}
function updSpd(){
  const e=$('spdVal');e.textContent=Math.round(rideV);
  e.style.color=(rideV>=120)?'#d62828':'';       // 120km/h以上は赤字
  $('spdKm').textContent='新宿起点 '+(rideS/1000+KM0).toFixed(2)+'km';
  const nx=nextStop(rideS);                       // 次の停車駅と停止位置までの距離
  if(nx){
    const d=nx.stop-rideS;
    $('nxtName').textContent='次 '+nx.st.n;
    const e=$('nxtDist');
    e.textContent=(d>=0? Math.round(d).toLocaleString()+' m' : '停止位置 '+Math.round(-d)+' m 超過');
    e.classList.toggle('near', d<200);
  }else{
    $('nxtName').textContent='終端(仙川)';
    $('nxtDist').textContent='—';
  }
  const nd=NOTCHES[cmdNotch], mn=$('masName');
  mn.textContent=nd.s;                      // P4 / N / B7 / EB のような短い段位表示
  mn.className='notch '+nd.k;
}
function setNotch(i){cmdNotch=clamp(i,0,NOTCHES.length-1);notch=cmdNotch;updSpd();}   // 操作は即時反映
// 速度による加減速特性
function accCurve(v,a){
  if(a>0)    return clamp(1-0.75*(v-60)/60, 0.20, 1);    // 力行:60km/h超で鈍化し120km/hで25%
  if(a<-0.2) return clamp(1-0.25*(v-60)/60, 0.70, 1);    // 制動:120km/hで75%、60km/h以下で100%
  return 1;                                              // 惰行(中立)
}
addEventListener('keydown',e=>{
  if(!rideOn)return;
  if(e.key==='ArrowDown'){setNotch(notch+1);e.preventDefault();}        // 下=力行側へ
  else if(e.key==='ArrowUp'){setNotch(notch-1);e.preventDefault();}     // 上=制動側へ
  else if(e.key==='n'||e.key==='N')setNotch(NIDX_N);
  else if(e.key==='e'||e.key==='E')setNotch(NIDX_EB);   // E=非常ブレーキ
});
$('btnChase').onclick=()=>{
  if(rideOn)setRide(false);
  if(!chaseOn){chaseIdx=0;setChase(true);}
  else{chaseIdx++;
    if(chaseIdx>=trains.length){setChase(false);}
    else{$('btnChase').textContent='列車追尾中 '+(chaseIdx+1)+'/'+trains.length+'(押すと次の列車)';}}
};
$('btnTrain').onclick=e=>{trainsOn=!trainsOn;setTrainsVisible(trainsOn);   // OFF時は車両自体を非表示
  e.target.classList.toggle('on',trainsOn);e.target.textContent='列車走行 '+(trainsOn?'ON':'OFF');};
$('btnLabel').onclick=e=>{const v=!staLabels[0].visible;
  labelPrev=v;
  staLabels.concat(tagLabels).forEach(s=>s.visible=v);
  e.target.classList.toggle('on',v);e.target.textContent='駅ラベル '+(v?'ON':'OFF');};
$('btnXing').onclick=()=>{const v=!xingLabels[0].visible;xingPrev=v;setXingShown(v);};

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();buildNav();
}
addEventListener('resize',resize);resize();

// ---- スマートフォン最適化(横画面前提) ----
const IS_MOBILE=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||
                (navigator.maxTouchPoints>1&&Math.min(screen.width,screen.height)<900);
if(IS_MOBILE){
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));   // 解像度上限で描画負荷を抑える
  LOD_NEAR=260;                                             // 高精細モデルの適用範囲を短縮
  const lockLandscape=()=>{                                 // 可能なら横画面に固定
    if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
  };
  addEventListener('pointerdown',lockLandscape,{once:true});
}

let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-last)/1000);last=now;
  if(trainsOn){
    for(const t of trains){
      driveTrain(t,dt);   // 各駅停車の自動運転(加速P4/60km/h上限/減速B5/停車25秒)
      placeTrain(t);
    }
    inoZ+=inoDir*13*dt;if(inoZ>430||inoZ<-430)inoDir*=-1;
    for(let j=0;j<inoCars.length;j++){
      const u=inoZ-inoDir*j*20;   // 井の頭線の実測軸に沿って走行
      inoCars[j].position.set(INO.x+INO.ax*u+INO.nx*-3,.86,INO.z+INO.az*u+INO.nz*-3);
      inoCars[j].rotation.y=-INO.phi;
    }
    setaZ+=setaDir*8*dt;if(setaZ>-60)setaDir=-1;if(setaZ<-350)setaDir=1;
    for(let j=0;j<setaCars.length;j++){
      const u=setaZ-setaDir*j*14;
      setaCars[j].position.set(SETA.x+SETA.ax*u,.86,SETA.z+SETA.az*u);
      setaCars[j].rotation.y=-SETA.phi;
    }
  }
  if(rideOn){
    // 加減速の応答は一次遅れ(時定数0.75秒)。さらに速度による特性を加味する:
    //   力行 : 60km/h までは設定どおり、以降は鈍化し 120km/h で半分
    //   制動 : 120km/h では75%、速度が落ちるほど強まり 60km/h 以下で設定どおり
    const aSet=NOTCHES[notch].a;
    const aCmd=aSet*accCurve(rideV,aSet);
    accEff += (aCmd-accEff)*Math.min(1, dt/NOTCH_LAG);
    rideV=clamp(rideV+accEff*dt,0,VMAX);
    updSpd();
    rideS+=(rideV/3.6)*dt;if(rideS>7950){rideS=-250;}            // 終端で笹塚方へ戻る
    // 視線=線路の接線方向(勾配も含む)。同じ軌道オフセット上の前後2点から方向を作るため、
    // 曲線でも画面中央が線路の正面を向く。
    const off=zDown(rideS), p=frame(rideS,off);
    const pa=frame(rideS-6,off), pb=frame(rideS+6,off);
    let tx=pb.x-pa.x, tz=pb.z-pa.z, ty=railY(rideS+6)-railY(rideS-6);
    const tl=Math.hypot(tx,ty,tz)||1; tx/=tl; ty/=tl; tz/=tl;
    const EYE=3.2;                                   // 運転士の目線(レール面から)
    camera.up.set(0,1,0);
    camera.position.set(p.x, railY(rideS)+EYE, p.z);
    // 進行方向を基準に、ドラッグ量(rideYaw/ridePitch)だけ首を振る
    const base=Math.atan2(tz,tx), a2=base+rideYaw;
    const cp=Math.cos(ridePitch);
    const dx=Math.cos(a2)*cp, dz=Math.sin(a2)*cp, dy=ty*cp+Math.sin(ridePitch);
    camera.lookAt(p.x+dx*200, railY(rideS)+EYE+dy*200, p.z+dz*200);
    cam.tx=p.x;cam.tz=p.z;
  }else if(chaseOn){   // 注視点=列車固定、視点=球面(CH)上をユーザー操作可
    const t=trains[chaseIdx],zf=t.dir>0?zDown:zUp;
    const hx=t.x,ph2=frame(hx,zf(hx));
    const ty=railY(hx)+3;
    const ex=ph2.x+CH.r*Math.sin(CH.ph)*Math.cos(CH.th);
    const ey=ty+CH.r*Math.cos(CH.ph);
    const ez=ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th);
    const kk=Math.min(1,dt*3.6);
    chaseEye.x+=(ex-chaseEye.x)*kk;chaseEye.y+=(ey-chaseEye.y)*kk;chaseEye.z+=(ez-chaseEye.z)*kk;
    camera.position.copy(chaseEye);
    camera.lookAt(ph2.x,ty,ph2.z);
    cam.tx=ph2.x;cam.tz=ph2.z;
  }else{
    stepFly(now);
    if(autoOrbit&&!fly&&pts.size===0)cam.th+=dt*.03;
    applyCam();
  }
  syncNav();
  renderer.render(scene,camera);
}
trains.forEach(placeTrain);
requestAnimationFrame(loop);
</script>
