  for(let k=0;k<N.length-1;k++){
    const A=N[k], B=N[k+1], L=B.s-A.s;
    if(L<0.05){sag.push(0);continue;}
    const C=chunkAt((A.s+B.s)/2), sg=WIRE_SAG*Math.min(1,(L/50)*(L/50)), n=Math.max(1,Math.ceil(L/CAT.HANG-1e-6));
    let dx=B.x-A.x, dz=B.z-A.z; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    let px=-dz, pz=dx; if(px*(A.nx+B.nx)+pz*(A.nz+B.nz)<0){px=-px;pz=-pz;}
    const at=u=>[A.x+(B.x-A.x)*u, A.y+(B.y-A.y)*u, A.z+(B.z-A.z)*u], ym=u=>WIRE_CAT-4*sg*u*(1-u);
    const us=[0]; for(let j=0;j<n;j++) us.push((j+0.5)/n); us.push(1);
    for(const sd of[-1,1]) for(let j=0;j<us.length-1;j++){
      const p=at(us[j]), q=at(us[j+1]), ox=px*sd*CAT.TWIN, oz=pz*sd*CAT.TWIN;
      C.wl.push(p[0]+ox,p[1]+ym(us[j]),p[2]+oz, q[0]+ox,q[1]+ym(us[j+1]),q[2]+oz);
    }
    {const p=at(0), q=at(1); C.wl.push(p[0],p[1]+WIRE_TRO,p[2], q[0],q[1]+WIRE_TRO,q[2]);}
    for(let j=1;j<us.length-1;j++){
      const p=at(us[j]), y=p[1]+ym(us[j]);
      C.wd.push(p[0],y,p[2], p[0],p[1]+WIRE_TRO,p[2]);                                       // ハンガ

/* 多角形の寄せ集め(v4 の bmesh 相当)。面ごとに頂点を持つので法線は面の向き(平らな陰影) */
function K8B(){this.P=[];this.N=[];this.C=[];this.U=[];}
K8B.prototype.poly=function(pts,col,uvs){               // pts:[[x,y,z],...] v4座標・反時計回り
  const n=pts.length; if(n<3) return;
  const a=pts[0], b=pts[1], c=pts[Math.min(2,n-1)];
  // 面の法線(v4座標)→ 写像
  let nx=0,ny=0,nz=0;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];
    nx+=(p[1]-q[1])*(p[2]+q[2]); ny+=(p[2]-q[2])*(p[0]+q[0]); nz+=(p[0]-q[0])*(p[1]+q[1]);}
  const l=Math.hypot(nx,ny,nz)||1; nx/=l;ny/=l;nz/=l;
  for(let i=1;i<n-1;i++) for(const k of [0,i,i+1]){
    const p=pts[k];
    this.P.push(p[0],p[2],-p[1]); this.N.push(nx,nz,-ny);
    this.C.push(col[0],col[1],col[2]);
    if(uvs) this.U.push(uvs[k][0],uvs[k][1]); else this.U.push(0,0);
  }
};
K8B.prototype.quad=function(a,b,c,d,col,uvs){this.poly([a,b,c,d],col,uvs);};
K8B.prototype.box=function(x0,x1,y0,y1,z0,z1,col){
  const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  for(const f of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])
    this.poly(f.map(i=>v[i]),col);
};
K8B.prototype.cyl=function(p0,p1,r,seg,col,cap){       // p0→p1 の円柱
  const d=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], L=Math.hypot(d[0],d[1],d[2])||1;
  const dn=[d[0]/L,d[1]/L,d[2]/L];
  let ux,uy,uz;                                           // dn に直交する単位ベクトル
  if(Math.abs(dn[0])<0.9){ux=0;uy=dn[2];uz=-dn[1];}else{ux=-dn[2];uy=0;uz=dn[0];}
  let ul=Math.hypot(ux,uy,uz); ux/=ul;uy/=ul;uz/=ul;
  const vx=dn[1]*uz-dn[2]*uy, vy=dn[2]*ux-dn[0]*uz, vz=dn[0]*uy-dn[1]*ux;
  const A=[],B=[];
  for(let i=0;i<seg;i++){const t=2*Math.PI*i/seg, c=Math.cos(t)*r, s=Math.sin(t)*r;
    const o=[ux*c+vx*s, uy*c+vy*s, uz*c+vz*s];
    A.push([p0[0]+o[0],p0[1]+o[1],p0[2]+o[2]]); B.push([p1[0]+o[0],p1[1]+o[1],p1[2]+o[2]]);}
  for(let i=0;i<seg;i++){const j=(i+1)%seg; this.quad(A[i],A[j],B[j],B[i],col);}
  if(cap!==false){ this.poly(A.slice().reverse(),col); this.poly(B,col); }
};
K8B.prototype.sphere=function(c,r,col){                 // 低多角形の球(乗客の頭)
  const S=6,T=4;
  for(let i=0;i<T;i++)for(let j=0;j<S;j++){
    const p=(a,b)=>{const th=Math.PI*a/T, ph=2*Math.PI*b/S;
      return [c[0]+r*Math.sin(th)*Math.cos(ph), c[1]+r*Math.sin(th)*Math.sin(ph), c[2]+r*Math.cos(th)];};
    if(i===0) this.poly([p(0,0),p(1,j),p(1,j+1)],col);
    else if(i===T-1) this.poly([p(i,j),p(T,0),p(i,j+1)],col);
    else this.quad(p(i,j),p(i+1,j),p(i+1,j+1),p(i,j+1),col);
  }
};
K8B.prototype.geo=function(){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(this.P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(this.N,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(this.C,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(this.U,2));
  return g;
};
// 前面の曲面に沿った四角いパッチ(v4 の patch)。off=面からの浮かせ量。UVは左右0〜1/上下0〜1
function k8patch(B,z0,z1,y0,y1,off,n,col){
  const hw=K8.HWB;
  for(let i=0;i<n;i++){
    const ya=y0+(y1-y0)*i/n, yb=y0+(y1-y0)*(i+1)/n, ua=i/n, ub=(i+1)/n;
    const P=(y,z)=>[k8nose(z,y/hw,hw)+off,y,z];
    B.quad(P(ya,z0),P(yb,z0),P(yb,z1),P(ya,z1),col,[[ua,0],[ub,0],[ub,1],[ua,1]]);
  }
}

/* ---- 9-5. 車体シェル(shell_mesh を移植) ----------------------------------------
   側面と前頭部は頂点を共有して滑らかな陰影に、端面・底面は別頂点にして角を立てる
   (v4 は 40° で角を立てている)。面の向きは「車体中心(0,0,2.3)から外へ」に揃える
   (凸な形なので、これで全ての面の表裏が決まる)。 */
function k8ShellGeo(cab){ return carShellGeo(K8_ROWS,k8nose,K8.LEN,cab); }
function carShellGeo(R,nose,LEN,cab){
  const nR=R.length, L2=LEN/2;
  const P=[], I=[];
  const v=(x,y,z)=>{P.push(x,y,z);return P.length/3-1;};   // ここでは v4 座標のまま持つ
  const per=[]; for(const r of R) per.push([-r[1],r[0]]); for(let i=nR-1;i>=0;i--) per.push([R[i][1],R[i][0]]);
  const n=per.length;
  const rear=per.map(p=>v(-L2,p[0],p[1]));
  let front;
  const smooth=[];                       // 滑らかに繋ぐ面(側面・前頭部)
  const tri=(a,b,c,list)=>list.push([a,b,c]);
  const quad=(a,b,c,d,list)=>{list.push([a,b,c]);list.push([a,c,d]);};
  const caps=[];                          // 角を立てる面(端面・底面)=別頂点で作る
  if(!cab){
    front=per.map(p=>v(L2,p[0],p[1]));
  }else{
    const C=44, grid=[];
    for(const r of R){
      const z=r[0], hw=r[1], row=[];
      for(let c=0;c<=C;c++){const s=-1+2*c/C; row.push(v(nose(z,s,hw),s*hw,z));}
      grid.push(row);
    }
    front=[]; for(let r=0;r<nR;r++) front.push(grid[r][0]); for(let r=nR-1;r>=0;r--) front.push(grid[r][C]);
    for(let r=0;r<nR-1;r++) for(let c=0;c<C;c++)
      quad(grid[r][c],grid[r][c+1],grid[r+1][c+1],grid[r+1][c],smooth);
    caps.push(grid[0].slice().reverse(), grid[nR-1].slice());   // 前頭部の下面・上面
  }
  for(let i=0;i<n-1;i++){
    // 底の閉じ(すその−y下端〜+y下端)は角を立てる。それ以外の側面は滑らかに
    quad(rear[i],front[i],front[i+1],rear[i+1],smooth);
  }
  caps.push([rear[n-1],front[n-1],front[0],rear[0]]);           // 底面
  caps.push(rear.slice().reverse());                             // 後端面
  if(!cab) caps.push(front.slice());                             // 前端面(中間車)
  // 面の向きを外向きに揃える
  const ctr=[0,0,2.3];
  const fix=(t)=>{
    const a=t[0]*3,b=t[1]*3,c=t[2]*3;
    const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2];
    const wx=P[c]-P[a],wy=P[c+1]-P[a+1],wz=P[c+2]-P[a+2];
    const nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx;
    const mx=(P[a]+P[b]+P[c])/3-ctr[0], my=(P[a+1]+P[b+1]+P[c+1])/3-ctr[1], mz=(P[a+2]+P[b+2]+P[c+2])/3-ctr[2];
    return (nx*mx+ny*my+nz*mz)<0 ? [t[0],t[2],t[1]] : t;
  };
  for(const t of smooth){const f=fix(t); I.push(f[0],f[1],f[2]);}
  // 角を立てる面は頂点を複製(法線を共有しない)。多角形は凸なので扇で三角形にする
  for(const loop of caps){
    const base=loop.map(k=>v(P[k*3],P[k*3+1],P[k*3+2]));
    for(let i=1;i<base.length-1;i++){const f=fix([base[0],base[i],base[i+1]]); I.push(f[0],f[1],f[2]);}
  }
  // v4 座標 → Three.js
  const Q=new Float32Array(P.length);
  for(let i=0;i<P.length;i+=3){Q[i]=P[i];Q[i+1]=P[i+2];Q[i+2]=-P[i+1];}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(Q,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

/* ---- 9-6. 車体の塗り分け(mat_car_body を移植) ----------------------------------
   v4 は Blender のノードで「物体座標 → 帯・窓・扉・前面の黒」を塗っている。同じ式を
   フラグメントシェーダで書く。拡散は Phong(envMap なし=Lambert と同一)のまま、
   色だけを差し替えるので、色管理・影・照明は他の材質と同じ経路を通る。
   扉の開閉(ビューア独自):扉は2枚引戸で、外板の"内側"を戸袋へ滑る。
     開度 o(0〜1)のとき戸は o×半幅だけ滑り、
       ・戸と戸の間の隙間 … 穴(車内が見える)
       ・見えている戸     … 戸の座標へ戻して扉窓・合わせ目を描く
       ・戸袋窓の奥       … 滑り込んだ戸が見える(本物の戸袋窓と同じ)
   uOpen.x/.y = シェルの +y 面/−y 面の開度(車両ごと)。 */
// 塗り分けの色(8000・9000 共通。前面のガラス域の色だけ形式で違う)
function k8ColorDefs(fglass){
  const f=v=>v.toFixed(5), c3=a=>'vec3('+a.map(f).join(',')+')';
  return [
    '#define C_STL '+c3(k8lin(.72,.73,.74)), '#define C_DOOR '+c3(k8lin(.75,.77,.79)),
    '#define C_BELOW '+c3(k8lin(.36,.37,.38)), '#define C_IVORY '+c3(k8lin(.90,.88,.80)),
    '#define C_ROOF '+c3(k8lin(.60,.61,.60)), '#define C_RED '+c3(k8lin(.83,.02,.42)),
    '#define C_BLUE '+c3(k8lin(.11,.17,.42)), '#define C_RUB '+c3(k8lin(.05,.05,.055)),
    '#define C_GROOVE '+c3(k8lin(.30,.31,.32)), '#define C_FGLASS '+c3(fglass),
    '#define C_INSIDE '+c3(k8lin(.80,.80,.77)),
  ];
}
function k8ShaderDefs(){
  const f=v=>v.toFixed(5);
  const c3=a=>'vec3('+a.map(f).join(',')+')';
  return [
    '#define K8_HWB '+f(K8.HWB), '#define K8_L2 '+f(K8.LEN/2),
    '#define Z_BOT '+f(K8.Z_BOT), '#define Z_FLR '+f(K8.Z_FLR), '#define Z_SH0 '+f(K8.Z_SH0),
    '#define DZ1 '+f(K8.DZ1), '#define DOOR_HW '+f(K8.DOOR_HW), '#define FW '+f(K8.FW),
    '#define RED_UP0 '+f(K8.RED_UP[0]), '#define RED_UP1 '+f(K8.RED_UP[1]),
    '#define RED_LO0 '+f(K8.RED_LO[0]), '#define RED_LO1 '+f(K8.RED_LO[1]),
    '#define BLUE0 '+f(K8.BLUE[0]), '#define BLUE1 '+f(K8.BLUE[1]),
    '#define MAKU0 '+f(K8.MAKU[0]), '#define MAKU1 '+f(K8.MAKU[1]),
    '#define MAKU_END '+f(K8.MAKU_END), '#define MAKU_CAB '+f(K8.MAKU_CAB),
    '#define IVORY_X '+f(K8.IVORY_X), '#define WRAP_X '+f(K8.WRAP_X),
    '#define CREW0 '+f(K8.CREW[0]), '#define CREW1 '+f(K8.CREW[1]),
    '#define DOORX vec4('+K8.DOORX.map(f).join(',')+')',
    ...k8ColorDefs(k8lin(.012,.014,.018)),
    '#define NWIN 26',
  ].join('\n')+'\n';
}
const K8_FRAG_FUNCS=`
varying vec3 vK8P; varying vec3 vK8N;
uniform vec4 uWin[NWIN]; uniform vec4 uWinR[NWIN]; uniform int uNWin; uniform vec2 uOpen;
float k8band(float v,float a,float b){return step(a,v)*step(v,b);}
// 角丸長方形の符号付き距離(負=内側)。上の角 rt・下の角 rb
float k8rr(vec2 p, vec4 b, float rt, float rb){
  vec2 c=vec2((b.x+b.y)*.5,(b.z+b.w)*.5), h=vec2((b.y-b.x)*.5,(b.w-b.z)*.5);
  float r=(p.y>c.y)?rt:rb; r=min(r,min(h.x,h.y)-1e-3);
  vec2 q=abs(p-c)-h+r;
  return length(max(q,0.))+min(max(q.x,q.y),0.)-r;
}
`;
// 塗り分けの本体。diffuseColor を上書きし、k8Spec(鏡面の強さ)を決める
const K8_FRAG_MAIN=`
  vec3 P=vK8P; vec3 Nn=normalize(vK8N);
  float X=P.x, Y=P.y, Z=P.z;
  float isSide=step(.75,abs(Nn.y));
  float sgn=(Y>0.)?1.:-1.;
  float u=X*sgn;
  vec3 col=C_STL; float painted=0.; k8Spec=1.;
  // ---- 帯 ----
#ifdef K8_CAB
  float rTop=mix(RED_UP1,RED_LO1,clamp((X-7.97)/(8.27-7.97),0.,1.));   // 段差:後ろが上段
  float rBot=mix(RED_UP0,RED_LO0,clamp((X-7.87)/(8.15-7.87),0.,1.));
  float red=step(rBot,Z)*step(Z,rTop);
  float makuHi=MAKU_CAB;
#else
  float red=k8band(Z,RED_UP0,RED_UP1);
  float makuHi=MAKU_END;
#endif
  float blue=k8band(Z,BLUE0,BLUE1)*(1.-red);
  float maku=k8band(Z,MAKU0,MAKU1)*k8band(X,-MAKU_END,makuHi)*isSide;
  maku*=1.-k8band(u,5.26,5.61); maku*=1.-k8band(u,3.86,4.06);
  maku*=1.-k8band(u,-0.24,0.86); maku*=1.-k8band(u,-5.61,-5.27);
  float roof=step(Z_SH0+.012,Z);
  // ---- 扉(側面のみ)。開いている戸は戸の座標 Xl へ戻して描く ----
  float o=(sgn>0.)?uOpen.x:uOpen.y;
  float slide=o*DOOR_HW;
  float onLeaf=0., Xl=X, inGap=0., behindLeaf=0., behindXl=X, doorLine=0.;
  for(int k=0;k<4;k++){
    float d=DOORX[k];
    float a=abs(X-d), s=(X>=d)?1.:-1.;
    float inOpen=step(k8rr(vec2(X,Z),vec4(d-DOOR_HW,d+DOOR_HW,Z_FLR,DZ1),.10,.005),0.);
    if(inOpen>.5){
      if(a<slide) inGap=1.;
      else { onLeaf=1.; Xl=X-s*slide; }
    } else if(a>=DOOR_HW && a<DOOR_HW+slide){          // 戸袋に滑り込んだ戸(外板の内側)
      behindLeaf=1.; behindXl=X-s*slide;
    }
    // 開口の縁(ゴム)と扉の外側の線
    float ring=k8rr(vec2(X,Z),vec4(d-DOOR_HW-.006,d+DOOR_HW+.006,Z_FLR,DZ1+.006),.10,.005);
    if(ring<=0. && ring>-.012) doorLine=1.;
    if(abs(a-.709)<.003 && Z>Z_FLR && Z<DZ1+.03) doorLine=2.;
  }
  onLeaf*=isSide; inGap*=isSide; behindLeaf*=isSide;
  // ---- 窓(外枠の内側 FW がガラス) ----
  float glass=0., frame=0., crewTop=0.;
  for(int i=0;i<NWIN;i++){
    if(i>=uNWin) break;
    vec4 b=uWin[i]; vec4 r=uWinR[i];
    float kind=r.z;
    float xx=X;
    if(kind>1.5 && kind<2.5){                           // 扉窓は戸と一緒に動く
      if(onLeaf<.5) continue;
      xx=Xl;
    } else if(onLeaf>.5) continue;                      // 戸の上に他の窓は無い
    float so=k8rr(vec2(xx,Z),b,r.x,r.y);
    if(so>0.) continue;
    float si=k8rr(vec2(xx,Z),vec4(b.x+FW,b.y-FW,b.z+FW,b.w-FW),max(r.x-FW,.004),max(r.y-FW,.004));

    else frame=1.;
  }

  // ---- 色 ----
  if(onLeaf>.5){ col=C_DOOR; }
  if(Z<Z_FLR-.004) col=mix(col,C_BELOW,.35);
#ifdef K8_CAB
  float ivr=step(IVORY_X,X);
  col=mix(col,C_IVORY,ivr); painted=max(painted,ivr);
  col=mix(col,C_ROOF,roof*(1.-ivr));
#else
  col=mix(col,C_ROOF,roof);
#endif
  painted=max(painted,max(max(red,blue),max(maku,roof)));
  col=mix(col,C_RED,max(red,maku));
  col=mix(col,C_BLUE,blue);
  // 戸の合わせ目・戸先の線(戸の座標で)
  if(onLeaf>.5){
    float dd=1e3; for(int k=0;k<4;k++) dd=min(dd,abs(Xl-DOORX[k]));
    if(dd<.0055) col=C_RUB;
    if(abs(dd-.587)<.003 && Z>Z_FLR+.01 && Z<DZ1-.02) col=C_GROOVE;
  }
  if(doorLine>.5 && doorLine<1.5) col=C_RUB;
  if(doorLine>1.5 && onLeaf<.5) col=C_GROOVE;
#ifdef K8_CAB
  if(abs(X-IVORY_X)<.004 && Z>Z_BOT+.05 && Z<Z_SH0-.01 && isSide>.5) col=C_GROOVE;   // 継ぎ目
  { float cr=k8rr(vec2(X,Z),vec4(CREW0,CREW1,Z_FLR+.02,3.046),.06,.005);            // 乗務員扉
    if(isSide>.5 && cr<=0. && cr>-.012) col=C_RUB; }
#endif
  if(frame>.5) { col=C_RUB; painted=1.; }
  // ---- 透ける所(窓ガラス・扉の隙間)。戸袋窓の奥に戸があれば戸を見せる ----
  if(inGap>.5) discard;
  if(glass>.5){
    if(crewTop>.5){ col=C_RUB; }
    else if(behindLeaf>.5){
      // 戸袋の戸。戸の扉窓の位置なら透ける
      bool see=false;
      for(int k=0;k<4;k++){ float d=DOORX[k]; float w=abs(behindXl-d);
        if(w>.135+FW && w<.546-FW && Z>1.995+FW && Z<2.908-FW) see=true; }
      if(see) discard;
      col=C_DOOR*.78; painted=0.;
    } else discard;
  }
#ifdef K8_CAB
  // ---- 前面の黒(ガラス域)と側面への回り込み ----
  float yy=Y*Y/(1.2*1.2), ay=abs(Y);
  float cb=max(ay-1.10,0.), ct=max(ay-1.05,0.);
  float zb=1.86+yy*.07+cb*cb*1.2, zt=3.464-yy*.055-ct*ct*.6;
  float inz=step(zb,Z)*step(Z,zt);

  float tt=clamp((Nn.x-.3)/.4,0.,1.);
  float fglass=step(WRAP_X,X)*(inz*tt+wrapG*(1.-tt));
  if(fglass>.5){ col=C_FGLASS; painted=0.; k8Spec=1.6; }
#endif
  // 車体の内側の面(窓や扉の隙間から見える反対側の壁の裏)は車内の壁の色にする

`;
const CARMAT=mkPhong({color:srgb(0xffffff),side:THREE.DoubleSide,specular:srgb(0x3a4046),shininess:55});
/* 車体の材質(8000・9000 共通):窓の一覧 W・定数 defs・塗り分けの本体 main だけが形式で違う。
   窓の8番目(9000系)は中央の柱の半幅(無ければ 0=柱なし) */
function carBodyMat(cab,W,defs,main,key,ud){
  const m=CARMAT.clone(), NW=26, uWin=[], uWinR=[];
  for(let i=0;i<NW;i++){
    const w=W[i]||[0,0,0,0,0,0,0];
    uWin.push(new THREE.Vector4(w[0],w[1],w[2],w[3]));

/* 塗装・板(ロゴ・車番)は画像だけを作り、1両ごとに1枚のシートに詰めて1つの Mesh で描く(k8Sheet。2026-10-15 利用者指示:

   別々の画像だったときの端の扱い ClampToEdge と同じ)。rect=[u0,v0,幅,高さ](v0 は画像の下端。上下を返して貼る) */
function k8Sheet(key,imgs){
  const ck='sheet'+key; if(K8_TEXCACHE[ck]) return K8_TEXCACHE[ck];
  const P=K8_SHEET_PAD, W=Math.max(...imgs.map(c=>c.width))+2*P, H=imgs.reduce((a,c)=>a+c.height+2*P,0);
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H;
  const cx=cv.getContext('2d'); cx.imageSmoothingEnabled=false;
  const rect=[]; let y=0;
  for(const c of imgs){
    const w=c.width, h=c.height, x0=P, y0=y+P;
    cx.drawImage(c,x0,y0);
    cx.drawImage(c,0,0,1,h,0,y0,P,h); cx.drawImage(c,w-1,0,1,h,x0+w,y0,P,h);          // 左右の縁
    cx.drawImage(c,0,0,w,1,x0,y,w,P); cx.drawImage(c,0,h-1,w,1,x0,y0+h,w,P);          // 上下の縁
    cx.drawImage(c,0,0,1,1,0,y,P,P); cx.drawImage(c,w-1,0,1,1,x0+w,y,P,P);            // 角
    cx.drawImage(c,0,h-1,1,1,0,y0+h,P,P); cx.drawImage(c,w-1,h-1,1,1,x0+w,y0+h,P,P);
    rect.push([x0/W,1-(y0+h)/H,w/W,h/H]);

  const t=canvasTex(cv); t.anisotropy=4;
  const m=mkMat('MeshLambertMaterial',{map:t,transparent:true,alphaTest:.3,side:THREE.DoubleSide});
  staLitPatch(m,true);                            // 駅の照明と夜の下地は車体と同じに

// シートに貼る形:parts=[[形, x の平行移動]](rect と同じ順)。UV を各画像の枠へ写す。並びが同じ車両で使い回す
function k8SheetGeo(parts,rect,key){
  const k=key+'|'+rect.map(r=>r.map(v=>v.toFixed(6)).join(',')).join(';');
  let g=K8_SHEET_GEO.get(k); if(g) return g;
  const A={position:[],normal:[],color:[],uv:[]};
  parts.forEach(([geo,dx],j)=>{
    const at=geo.attributes, P=at.position.array, r=rect[j], U=at.uv.array;
    for(let i=0;i<P.length;i+=3) A.position.push(P[i]+dx,P[i+1],P[i+2]);
    for(const v of at.normal.array) A.normal.push(v);
    for(const v of at.color.array) A.color.push(v);
    for(let i=0;i<U.length;i+=2) A.uv.push(r[0]+U[i]*r[2],r[1]+U[i+1]*r[3]);
  });
  g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(A.position,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(A.normal,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(A.color,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(A.uv,2));
  K8_SHEET_GEO.set(k,g); return g;
}
// 文字を枠いっぱい(縦横比を保つ)に描く

// keep_aspect=False の文字=ロゴ・車番)。false なら縦横比を保って収める(表示器の文字)
function k8fitText(cx,txt,x,y,w,h,font,shear,fill){
  cx.save(); cx.font=font; cx.textAlign='left'; cx.textBaseline='alphabetic';
  const m=cx.measureText(txt);
  const l=m.actualBoundingBoxLeft||0, r=m.actualBoundingBoxRight||m.width||1;
  const a=m.actualBoundingBoxAscent||parseFloat(font.match(/(\d+)px/)[1])*0.75, d=m.actualBoundingBoxDescent||0;
  const bw=(r+l)||1, bh=(a+d)||1;
  // 斜体にすると外接矩形が高さ×shear だけ横へ広がるので、そのぶんを幅に含めて合わせる
  const ew=bw+(shear?bh*shear:0);
  let sx=w/ew, sy=h/bh; if(!fill){const k=Math.min(sx,sy);sx=sy=k;}
  cx.translate(x,y); cx.scale(sx,sy);
  if(shear) cx.transform(1,0,-shear,1,0,0);
  // 外接矩形の中心が (x,y) に来るように置く。斜体は中心の高さを軸に倒すので左右対称に広がる
  cx.fillText(txt,-(r-l)/2,(a-d)/2);
  cx.restore();
}

// 幕板まわりの小物の"箱"(表示器の枠・表示灯ユニット・車側灯・スピーカー)
const K8_SIDEFIT={HWB:K8.HWB, SLED:K8_SLED, SLED_FACE:K8_SLED_FACE, LAMPUNIT:K8_LAMPUNIT, LENS_Z:[3.26,3.14],
  SIDE_LAMP:K8_SIDE_LAMP, SPEAKERS:K8_SPEAKERS, SPK_Z:K8_SPK_Z};
function k8SideFitGeo(T){
  T=T||K8_SIDEFIT;
  const B=new K8B(), hw=T.HWB;
  for(const s of [-1,1]){
    const X=u=>s>0?u:-u;
    const box=(u0,u1,z0,z1,d,col,off)=>{
      const a=Math.min(X(u0),X(u1)), b=Math.max(X(u0),X(u1));
      const y0=Math.min(s*(hw+(off||0)),s*(hw+(off||0)+d)), y1=Math.max(s*(hw+(off||0)),s*(hw+(off||0)+d));
      B.box(a,b,y0,y1,z0,z1,col);
    };
    box(T.SLED[0],T.SLED[1],T.SLED[2],T.SLED[3],.014,K8C.trim);     // 表示器の枠
    box(T.LAMPUNIT[0],T.LAMPUNIT[1],T.LAMPUNIT[2],T.LAMPUNIT[3],.018,K8C.trim);
    const uc=(T.LAMPUNIT[0]+T.LAMPUNIT[1])/2;
    for(const zc of T.LENS_Z) B.cyl([X(uc),s*(hw+.018),zc],[X(uc),s*(hw+.024),zc],.038,12,K8C.lens);
    const sl=T.SIDE_LAMP;                                     // 車側灯(丸)
    B.cyl([X(sl[0]),s*hw,sl[1]],[X(sl[0]),s*(hw+.02),sl[1]],sl[2],16,K8C.trim);
    B.cyl([X(sl[0]),s*(hw+.02),sl[1]],[X(sl[0]),s*(hw+.03),sl[1]],sl[2]-.015,16,K8C.tailOff);
    for(const sp of T.SPEAKERS){                              // 車外スピーカー(縦の格子)
      box(sp[0],sp[1],T.SPK_Z[0],T.SPK_Z[1],.012,K8C.trim);
      for(let k=0;k<9;k++){
        const ua=sp[0]+(sp[1]-sp[0])*(k+.25)/9, ub=sp[0]+(sp[1]-sp[0])*(k+.75)/9;
        box(ua,ub,T.SPK_Z[0]+.02,T.SPK_Z[1]-.02,.002,K8C.led,.012);
      }
    }
  }
  return B.geo();
}
// 側面の表示器の表示面(文字を貼る)。両面ぶん
function k8SideLedGeo(T){
  T=T||K8_SIDEFIT;

  for(const s of [-1,1]){
    const xc=(s>0?1:-1)*(f[0]+f[1])/2;
    k8SidePlate(B,s,xc,(f[2]+f[3])/2,f[1]-f[0],f[3]-f[2],.0145,T.HWB);
  }
  return B.geo();
}

// 前頭部の部品(front_parts を移植)。種類ごとに別の幾何
function k8FrontGeos(){
  const G={};
  const mk=f=>{const B=new K8B(); f(B); return B.geo();};
  const hw=K8.HWB;
  G.case=mk(B=>{for(const sg of[-1,1]) k8patch(B,1.217,1.398,Math.min(sg*.628,sg*1.150),Math.max(sg*.628,sg*1.150),.004,6,K8C.black);});
  G.hl  =mk(B=>{for(const sg of[-1,1]) k8patch(B,1.255,1.363,Math.min(sg*.640,sg*.935),Math.max(sg*.640,sg*.935),.009,6,[1,1,1]);});
  G.tl  =mk(B=>{for(const sg of[-1,1]) k8patch(B,1.262,1.358,Math.min(sg*.950,sg*1.138),Math.max(sg*.950,sg*1.138),.009,6,[1,1,1]);});
  /* 点いている灯火の照り返し。v4(Cycles)では強さ40の前照灯が5mm奥の黒いケースを
     照らし、ケースの縁が明るく写る(大域照明)。実時間の描画には大域照明が無いので、
     灯火の周り(ケースの範囲)に加算合成の淡い光を重ねて同じ見え方にする */
  G.hlGlow=mk(B=>{for(const sg of[-1,1]) k8patch(B,1.222,1.393,Math.min(sg*.630,sg*.945),Math.max(sg*.630,sg*.945),.010,6,[1,1,1]);});
  G.tlGlow=mk(B=>{for(const sg of[-1,1]) k8patch(B,1.232,1.388,Math.min(sg*.945,sg*1.146),Math.max(sg*.945,sg*1.146),.010,6,[1,1,1]);});
  G.vc  =mk(B=>{
    // 貫通扉の輪郭・前面下端の線・取っ手
    for(const yc of [-.385,.385]) for(const zz of [[1.13,1.52],[1.52,1.87]])
      k8patch(B,zz[0],zz[1],yc-.006,yc+.006,.002,1,K8C.rubber);
    k8patch(B,1.13,1.142,-.385,.385,.002,8,K8C.rubber);
    k8patch(B,1.160,1.172,-1.30,1.30,.002,24,K8C.rubber);
    k8patch(B,1.18,1.24,-.03,.03,.003,1,K8C.rubber);
    // ガラス域の中の枠(3枚窓の柱と上下の枠)
    for(const yc of [-.35,.35]) k8patch(B,2.20,2.80,yc-.022,yc+.022,.004,1,K8C.faceBlack);
    for(const zc of [2.20,2.80]) k8patch(B,zc-.018,zc+.018,-1.22,1.22,.004,24,K8C.faceBlack);
    // ワイパー
    for(const sg of[-1,1]){
      const P=(y,z,o)=>[k8nose(z,y/hw,hw)+o,y,z];
      B.cyl(P(sg*.87,1.75,.025),P(sg*.70,1.94,.025),.012,6,K8C.black);
      B.cyl(P(sg*.70,1.93,.03),P(sg*.12,1.90,.03),.008,5,K8C.black);
    }
    /* スカート(アイボリー):上端1.09、下ほど前へ。中央に連結器の切り欠き(スカートの大きさは v4 のまま)。切り欠きは
       9000系と共通の開口 SKIRT_OPEN(上端の半幅 0.574・下端はその0.92倍)、深さは v4(上から6割)の1.2倍(利用者指示)。
       切り欠きの縁の上端と下端にも列を置いて寸法どおりに切る(縁は斜め。上端と下端の列の間は三角形) */
    const NOTCH=K8_SKIRT_NOTCH, D=NOTCH[1], ys=[];
    // 下端の列:bot は y×0.96 なので、深さ D の所で半幅が上端×0.92 になる列の y
    const yT=NOTCH[0], yB=NOTCH[0]*SKIRT_OPEN[1]/(1-0.04*D);
    for(let c=0;c<=28;c++) ys.push((-1+2*c/28)*(hw-.12));
    ys.push(-yT,-yB,yB,yT); ys.sort((a,b)=>a-b);
    const top=[], bot=[];
    for(const y of ys){ const xt=k8nose(1.0,y/hw,hw)-.02; top.push([xt,y,1.09]); bot.push([xt+.06,y*.96,.24]); }
    const Cn=ys.length-1;
    const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
    for(let c=0;c<Cn;c++){
      const ym=(ys[c]+ys[c+1])/2, yc=Math.abs(ym), n0=lerp(top[c],bot[c],D), n1=lerp(top[c+1],bot[c+1],D);
      if(yc<yT) B.quad(n0,bot[c],bot[c+1],n1,K8C.ivory);                 // 切り欠きの下
      else B.quad(top[c],bot[c],bot[c+1],top[c+1],K8C.ivory);
      if(yc>yB&&yc<yT) B.poly(ym>0?[n0,n1,top[c+1]]:[top[c],n0,n1],K8C.ivory);   // 斜めの縁
    }
    for(const sg of[-1,1]){                                // スカートの側板
      const c=sg<0?0:Cn, p=top[c], q=bot[c];
      const v=[p,q,[K8.WRAP_X-.1,q[1],q[2]+.06],[K8.WRAP_X-.1,p[1],p[2]]];
      B.poly(sg>0?v:v.slice().reverse(),K8C.ivory);
    }
    // 連結器・電気連結器・前頭部の床下
    const xs=k8nose(1.0,0,hw);
    B.box(xs-.9,xs+.20,-.13,.13,.76,.96,K8C.under);
    B.box(xs+.10,xs+.26,-.20,.20,.72,1.00,K8C.under);
    B.box(xs-.6,xs+.08,.22,.40,.78,.92,K8C.under);
    B.box(K8.LEN/2-1.3,xs-.30,-1.2,1.2,.76,K8.Z_BOT,K8C.under);
  });
  // 表示器(行先=左・広い/種別=右)・前面の車番・KEIO ロゴ(文字を貼る面)
  G.dest=mk(B=>k8patch(B,3.107,3.272,-1.160,-.540,.003,10,[1,1,1]));
  G.kind=mk(B=>k8patch(B,3.107,3.272,.555,1.010,.003,8,[1,1,1]));
  G.num =mk(B=>k8patch(B,1.448,1.514,-.89,-.63,.008,4,[1,1,1]));
  G.logo=mk(B=>k8patch(B,1.618,1.662,.70,1.02,.0075,6,[1,1,1]));
  // 識別灯(行先の左・種別の右。白の縦長)と、点いたときの淡い光
  G.pass    =mk(B=>{for(const r of K8_PASS.Y) k8patch(B,K8_PASS.Z[0],K8_PASS.Z[1],r[0],r[1],.006,2,[1,1,1]);});
  G.passGlow=mk(B=>{for(const r of K8_PASS.Y) k8patch(B,K8_PASS.Z[0]-.015,K8_PASS.Z[1]+.015,r[0]-.015,r[1]+.015,.010,2,[1,1,1]);});
  return G;
}
// 台車(bogie_mesh を移植)。軸距 wb。車輪はレール中心(RAIL_OFF)の上に載せる
function k8BogieGeo(wb){
  const B=new K8B();
  for(const bx of [-K8.BOGIE_X,K8.BOGIE_X]){
    for(const s of [-1,1]){
      const y=s*.98;
      const prof=[[-wb/2-.32,.60],[-wb/2-.32,.80],[-wb/2+.30,.80],[-.55,.66],[.55,.66],
                  [wb/2-.30,.80],[wb/2+.32,.80],[wb/2+.32,.60],[wb/2-.20,.60],
                  [.60,.50],[-.60,.50],[-wb/2+.20,.60]];
      const A=prof.map(p=>[bx+p[0],y-.07,p[1]]), Bq=prof.map(p=>[bx+p[0],y+.07,p[1]]);
      for(let i=0;i<prof.length;i++){const j=(i+1)%prof.length; B.quad(A[i],A[j],Bq[j],Bq[i],K8C.bogie);}
      // 側枠の側面(凹多角形なので台形の帯に分けて張る)
      for(const face of [A,Bq]){
        const strip=(i0,i1,i2,i3)=>B.quad(face[i0],face[i1],face[i2],face[i3],K8C.bogie);
        strip(0,11,2,1); strip(11,10,3,2); strip(10,9,4,3); strip(9,8,5,4); strip(8,7,6,5);
      }
      for(const wx of [bx-wb/2,bx+wb/2]){
        B.box(wx-.16,wx+.16,y-.11,y+.11,.33,.56,K8C.bogie);                 // 軸箱
        B.cyl([wx,y,.56],[wx,y,.80],.085,10,K8C.bogie);                      // 軸ばね
        B.cyl([wx,s*(RAIL_OFF+.05),K8.WHEEL],[wx,s*(RAIL_OFF-.05),K8.WHEEL],K8.WHEEL,24,K8C.bogie);  // 車輪φ860
        B.cyl([wx,s*(RAIL_OFF+.055),K8.WHEEL],[wx,s*(RAIL_OFF+.045),K8.WHEEL],.19,12,K8C.wheelC);
        const b0=wx-(wx>bx?.38:-.26), b1=wx-(wx>bx?.26:-.38);
        B.box(Math.min(b0,b1),Math.max(b0,b1),y-.08,y+.08,.40,.62,K8C.bogie); // ブレーキ
      }
      B.cyl([bx,y*.9,.82],[bx,y*.9,.98],.21,14,K8C.black);                   // 空気ばね
    }
    B.box(bx-.22,bx+.22,-.98,.98,.60,.74,K8C.bogie);                         // 横ばり
    B.box(bx-.35,bx+.35,-.45,.45,.74,.90,K8C.bogie);                         // けん引装置
    B.cyl([bx,-RAIL_OFF,K8.WHEEL],[bx,RAIL_OFF,K8.WHEEL],.07,8,K8C.bogie,false);   // 車軸(見える位置)
  }
  return B.geo();
}

/* 冷房装置(屋上集中式・各車1台)。2026-10-12 利用者指示で作り直した(以前は平らな箱の上に小さな円筒4つと縦縞)。
   形:屋根に載る下の箱(側面に吸気の網の板)+上の筐体(四方を斜めに落とす)+上面の凝縮器のファン(丸い枠・暗い網・中心のハブ)。
   8000系は日立 HRB504-4 形(ファン2つ)、9000系はファン1つの形(模型の屋根板の資料から)。寸法の細部は推定。
   L=長さ・zt=上端・z0=屋根に載る下端・fans=ファンの中心 x・fr=ファンの半径 */
function acGeoOf(L,zt,z0,fans,fr){
  const B=new K8B(), Lh=L/2, W=.95, zm=zt-.17, zc=zt-.03, ch=.32, cw=.14;
  B.box(-Lh,Lh,-W,W,z0,zm,K8C.ac);                                        // 下の箱
  const b=[[-Lh,-W,zm],[Lh,-W,zm],[Lh,W,zm],[-Lh,W,zm]],                // 上の筐体:下面→上面は四方を斜めに
        t=[[-Lh+ch,-W+cw,zc],[Lh-ch,-W+cw,zc],[Lh-ch,W-cw,zc],[-Lh+ch,W-cw,zc]];
  for(let i=0;i<4;i++){const j=(i+1)%4; B.poly([b[i],b[j],t[j],t[i]],K8C.ac);}
  B.poly(t,K8C.ac);
  for(const fx of fans){                                                  // 凝縮器のファン
    B.cyl([fx,0,zc],[fx,0,zt-.008],fr,24,K8C.ac);
    B.cyl([fx,0,zt-.008],[fx,0,zt-.002],fr-.045,24,K8C.acF);
    B.cyl([fx,0,zt-.008],[fx,0,zt],.09,12,K8C.ac);
  }
  const np=3, pw=(L-.5-(np-1)*.18)/np;                                    // 側面の吸気の網の板(3枚)と横の桟
  for(const s of[-1,1]) for(let k=0;k<np;k++){
    const x0=-Lh+.25+k*(pw+.18), x1=x0+pw, y=s*(W+.002), za=z0+.05, zb=zm-.03;
    const q=(a,c,col)=>{const pp=[[x0,y,a],[x1,y,a],[x1,y,c],[x0,y,c]]; B.poly(s>0?pp.slice().reverse():pp,col);};
    q(za,zb,K8C.acL);
    for(let z=za+.03;z<zb-.01;z+=.035){const y2=s*(W+.004), pp=[[x0,y2,z],[x1,y2,z],[x1,y2,z+.008],[x0,y2,z+.008]]; B.poly(s>0?pp.slice().reverse():pp,K8C.ac);}
  }
  return B.geo();
}

/* パンタグラフ(シングルアーム。panto_mesh を移植)。原点=台座中心、+x=京王八王子方。
   実測:下枠の付け根 +0.07(z3.92)、ひじは +x 側、舟は −0.26。舟の高さはトロリ線
   WIRE_TRO に合わせる(架線と同じ定数から決めるので、すり板が架線に接する)。 */
const K8_PT={HINGE:[0.07,3.92], HEADX:-0.26, L1:1.076, L2:1.34};
function k8PantoKnee(h,tro){
  h=h||K8_PT.HINGE; const head=[K8_PT.HEADX, (tro||WIRE_TRO)-.04];   // tro=トロリ線のレール面からの高さ(交差鉄道。省略=京王線)
  const dx=head[0]-h[0], dz=head[1]-h[1], d=Math.hypot(dx,dz);
  const a=(K8_PT.L1*K8_PT.L1-K8_PT.L2*K8_PT.L2+d*d)/(2*d), hh=Math.sqrt(Math.max(0,K8_PT.L1*K8_PT.L1-a*a));
  const ux=dx/d, uz=dz/d, px=uz, pz=-ux;
  let k=[h[0]+ux*a+px*hh, h[1]+uz*a+pz*hh];
  if(k[0]<h[0]) k=[h[0]+ux*a-px*hh, h[1]+uz*a-pz*hh];       // ひじは +x(京王八王子方)
  return {hinge:h, head:head, knee:k};
}
function k8PantoGeos(zRoof,hinge,tro){
  const zr=(zRoof||K8.Z_CROWN)-.03, K=k8PantoKnee(hinge,tro);
  const frame=new K8B(), base=new K8B(), shoe=new K8B();
  base.box(-.85,.85,-.55,.55,zr,zr+.10,[1,1,1]);                         // 台枠
  for(const sx of [-.7,.7]) for(const sy of [-.45,.45])
    base.cyl([sx,sy,zr-.05],[sx,sy,zr+.02],.06,10,[1,1,1]);              // 碍子
  const H=[K.hinge[0],0,K.hinge[1]], N=[K.knee[0],0,K.knee[1]], T=[K.head[0],0,K.head[1]];
  frame.cyl([-.10,0,zr+.14],H,.03,8,[1,1,1]);
  frame.cyl(H,N,.035,8,[1,1,1]);                                          // 下枠
  frame.cyl(N,T,.028,8,[1,1,1]);                                          // 上枠
  frame.cyl([H[0],-.2,H[2]],[H[0],.2,H[2]],.05,8,[1,1,1]);
  frame.cyl([-.2,0,zr+.12],[(N[0]+H[0])/2,0,(N[2]+H[2])/2+.05],.015,6,[1,1,1]);   // 釣り合い棒
  shoe.box(T[0]-.07,T[0]+.07,-.62,.62,T[2],T[2]+.04,[1,1,1]);             // 舟体(上面=トロリ線)
  for(const s of [-1,1]) shoe.cyl([T[0],s*.62,T[2]+.02],[T[0],s*.82,T[2]-.06],.018,6,[1,1,1]);   // ホーン
  return {frame:frame.geo(), base:base.geo(), shoe:shoe.geo(), knee:K};
}

/* ---- 9-10. 車内と乗客(interior_mesh / people_mesh を移植) --------------------
   窓が透けるので車内が要る。照明は自発光(昼も夜も点いている)。乗客は v4 と同じく
   種で決まる乱数で置く(Math.random を使わない=撮影の乱数の種と独立)。 */
function k8Rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function k8InteriorGeos(cab,S){
  S=S||K8;

  const hw=S.HWB-.08, L=S.LEN/2-(cab?1.05:.3), F=S.Z_FLR;
  B.box(-L,L,-hw,hw,F-.1,F,K8C.floor);
  B.box(-L,L,-hw,hw,F+CH,F+CH+.05,K8C.interior);
  const xs=[-L]; for(const dx of S.DOORX){xs.push(dx-S.DOORW/2);xs.push(dx+S.DOORW/2);} xs.push(L);
  for(let i=0;i<xs.length;i+=2){
    const a=xs[i]+.15, b=xs[i+1]-.15;

function k8PeopleGeo(nSeat,nStand,rng,cab,S){

  const clothes=[[.05,.05,.07],[.12,.13,.2],[.25,.25,.27],[.55,.52,.48],[.75,.74,.7],
                 [.35,.12,.1],[.1,.2,.35],[.6,.45,.3],[.9,.88,.85],[.2,.3,.2]];
  const pick=a=>a[Math.floor(rng()*a.length)];
  const person=(x,y,seated)=>{
    const h=seated?1.0:1.52+rng()*.26, bodyH=seated?.62:h*.58;
    const c=k8lin.apply(null,pick(clothes));
    const skin=k8lin.apply(null,pick([[.85,.68,.55],[.78,.6,.48],[.9,.75,.62]]));
    const hair=k8lin.apply(null,pick([[.03,.02,.02],[.1,.06,.04],[.25,.18,.12]]));
    if(!seated) B.box(x-.1,x+.1,y-.13,y+.13,F,F+h*.45,c);
    const zb=F+(seated?.43:h*.45);
    B.cyl([x,y,zb],[x,y,zb+bodyH*.75],.19,7,c);
    B.sphere([x,y,zb+bodyH*.75+.13],.105,skin);
    B.sphere([x,y,zb+bodyH*.75+.17],.095,hair);
  };
  for(let i=0;i<nSeat;i++){
    const x=-L+rng()*2*L, s=rng()<.5?-1:1;
    if(S.DOORX.some(d=>Math.abs(x-d)<S.DOORW/2+.2)) continue;
    person(x,s*(hw-.2),true);
  }
  for(let i=0;i<nStand;i++) person(-L+rng()*2*L,(rng()-.5),false);
  return B.geo();
}

/* 扉窓のガラス:戸と一緒に滑る。頂点に「どちらの戸か(±1)」を持たせ、車両ごとの
   開度 uOpen(車体の塗り分けと同じ uniform を共有)で頂点シェーダが動かす。
   戸袋へ滑り込んだぶんは外板の内側に隠れ、戸袋窓の奥にだけ見える(本物と同じ)。 */
function k8DoorGlassGeo(S){
  S=S||K8;
  const P=[],L=[], FW=S.FW, DW=S.DWIN||[.135,.546];
  for(const s of [-1,1]) for(const d of S.DOORX) for(const l of [-1,1]){
    const xa=d+l*(DW[0]+FW), xb=d+l*(DW[1]-FW), x0=Math.min(xa,xb), x1=Math.max(xa,xb);
    const z0=(S.DWZ0||S.WZ0)+FW, z1=S.DWZ1-FW, y=s*(S.HWB-.003);
    const q=[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]];
    for(const k of [0,1,2,0,2,3]){const p=q[k]; P.push(p[0],p[2],-p[1]); L.push(l);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('k8leaf',new THREE.Float32BufferAttribute(L,1));
  return g;
}
function k8DoorGlassMat(U){
  const m=K8M.glass.clone();
  m.onBeforeCompile=function(sh){
    sh.uniforms.uOpen=U.uOpen;
    sh.vertexShader='attribute float k8leaf; uniform vec2 uOpen;\n'+sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  { float sv=(-position.z>0.)?1.:-1.; float o=(sv>0.)?uOpen.x:uOpen.y;'+
      ' transformed.x+=k8leaf*o*'+K8.DOOR_HW.toFixed(4)+'; }');
  };
  m.customProgramCacheKey=()=>'k8dglass';
  return m;
}

  R.push([K9.Z_SH0,hw]);
  for(let k=1;k<15;k++){const t=k/15;
    const y=hw*Math.pow(Math.cos(t*Math.PI/2),0.5);
    const z=K9.Z_SH0+(K9.Z_CROWN-K9.Z_SH0)*Math.sqrt(Math.max(0,1-Math.pow(y/hw,4)));

const K9_NOSE_PROFILE=[[0.93,9.60],[1.15,9.752],[3.42,9.752],[3.48,9.735],[3.525,9.71],
                       [3.56,9.67],[3.585,9.62],[3.603,9.56],[3.615,9.48],[3.62,9.40]];
function k9xf(z){
  const P=K9_NOSE_PROFILE;
  if(z<=P[0][0]) return P[0][1];
  for(let i=0;i<P.length-1;i++){const a=P[i], b=P[i+1];
    if(z<=b[0]) return a[1]+(b[1]-a[1])*(z-a[0])/(b[0]-a[0]);}
  return P[P.length-1][1];

function k9SideWindows(cab){

// 前面の曲面に沿ったパッチ
function k9patch(B,z0,z1,y0,y1,off,n,col){
  const hw=K9.HWB;
  for(let i=0;i<n;i++){
    const ya=y0+(y1-y0)*i/n, yb=y0+(y1-y0)*(i+1)/n, ua=i/n, ub=(i+1)/n;
    const P=(y,z)=>[k9nose(z,y/hw,hw)+off,y,z];
    B.quad(P(ya,z0),P(yb,z0),P(yb,z1),P(ya,z1),col,[[ua,0],[ub,0],[ub,1],[ua,1]]);
  }
}
// 前面の曲面に沿った線:折れ線 pts=[[y,z],...] を幅 w の帯にする(扉の縁の角丸など)。off=面からの浮かせ量
function k9stroke(B,pts,w,off,col){
  const hw=K9.HWB, h=w/2, P=(y,z)=>[k9nose(z,y/hw,hw)+off,y,z];
  for(let i=0;i+1<pts.length;i++){
    const a=pts[i], b=pts[i+1], dy=b[0]-a[0], dz=b[1]-a[1], l=Math.hypot(dy,dz)||1, ny=-dz/l*h, nz=dy/l*h;
    B.quad(P(a[0]-ny,a[1]-nz),P(b[0]-ny,b[1]-nz),P(b[0]+ny,b[1]+nz),P(a[0]+ny,a[1]+nz),col);
  }
}

    '#define FBLUE0 '+f(K9.FBLUE0), '#define BT1 '+f(K9.BLUE_TAPER[0]), '#define BT0 '+f(K9.BLUE_TAPER[1]), '#define XC0 '+f(K9_XC0),
    '#define FDOOR_HW '+f(K9.FDOOR_HW),
    '#define FW0 '+f(K9.FWIN[0]), '#define FW1 '+f(K9.FWIN[1]), '#define FWZ0 '+f(K9.FWIN[2]), '#define FWZ1 '+f(K9.FWIN[3]),
    '#define FDW '+f(K9.FDWIN[0]), '#define FDWZ0 '+f(K9.FDWIN[1]), '#define FDWZ1 '+f(K9.FDWIN[2]),

    if(ring<=0. && ring>-.012) doorLine=1.;
  }

  { float cr=k8rr(vec2(X,Z),vec4(CREW0,CREW1,CREWZ0,CREWZ1),.06,.005);

   文字は線で組む(K の腕と脚・E の3本の横棒・I・角の丸い長方形の O)。寸法は measured_9000.md 3b(その2)。画像は板の外接矩形 K9.FLOGO */
function k9Logo(w,h){
  return k8Paint('logo9_'+w+'x'+h,w,h,function(cx){
    const L=K9.FLOGO, sl=K9.FLOGO_SL, Wm=L[1]-L[0], Hm=L[3]-L[2], k=sl/Hm;
    const X=(x,z)=>(x+k*z)/Wm*w, Y=(z)=>(1-z/Hm)*h;        // 板の左下からの(横,高さ)[m]→画素。横は傾きの分だけずらす
    const path=(pts)=>{pts.forEach((p,i)=>{const a=X(p[0],p[1]), b=Y(p[1]); if(i) cx.lineTo(a,b); else cx.moveTo(a,b);}); cx.closePath();};
    const fill=(pts)=>{cx.beginPath(); path(pts); cx.fill();};
    const rect=(xa,xb,za,zb)=>fill([[xa,za],[xb,za],[xb,zb],[xa,zb]]);
    const rr=(xa,xb,za,zb,r)=>{const o=[], c=[[xb-r,za+r,-Math.PI/2],[xb-r,zb-r,0],[xa+r,zb-r,Math.PI/2],[xa+r,za+r,Math.PI]];
      for(const [cx0,cz0,a0] of c) for(let i=0;i<=6;i++){const a=a0+i/6*Math.PI/2; o.push([cx0+r*Math.cos(a),cz0+r*Math.sin(a)]);}
      return o;};
    cx.fillStyle='#f5f5f2'; fill([[0,0],[Wm-sl,0],[Wm-sl,Hm],[0,Hm]]);      // 板(下辺 0〜Wm−sl。上辺は傾きで sl だけ右)
    const zb=.023, H=.09, t=.020, tb=.018;                                  // 文字の下端・高さ・縦画の太さ・横画の太さ
    cx.fillStyle='#1a1a1a';
    let x=.030;
    rect(x,x+t,zb,zb+H);                                                     // K:縦画
    fill([[x+t,zb+.40*H],[x+.093,zb+H],[x+.063,zb+H],[x+t,zb+.68*H]]);       //   上の腕
    fill([[x+t+.004,zb+.50*H],[x+.040,zb+.62*H],[x+.093,zb],[x+.062,zb]]);   //   下の脚
    x+=.093+.025;
    rect(x,x+t,zb,zb+H); rect(x,x+.068,zb+H-tb,zb+H); rect(x,x+.060,zb+H/2-tb/2,zb+H/2+tb/2); rect(x,x+.068,zb,zb+tb);   // E
    x+=.068+.025;
    rect(x,x+.021,zb,zb+H);                                                  // I
    x+=.021+.033;
    cx.beginPath(); path(rr(x,x+.085,zb,zb+H,.030)); path(rr(x+t,x+.085-t,zb+tb,zb+H-tb,.012).reverse()); cx.fill('evenodd');   // O
  });
}

const K30_ROWS=(function(){

  for(let k=0;k<=4;k++){const t=k/4*Math.PI/2; R.push([K.Z_BOT+.06-.06*Math.cos(t), w(K.Z_BOT)-.04+.04*Math.sin(t)]);}

    const y=hw*Math.pow(Math.cos(t*Math.PI/2),0.5), z=K.Z_SH0+(K.Z_CROWN-K.Z_SH0)*Math.sqrt(Math.max(0,1-Math.pow(y/hw,4)));

// 前面:下部は垂直、ガラスは傾き、黒い帯から屋根へ。平面の角は半径 NOSE_RC(ガラスが側面へ回り込む)
function k30xf(z){
  const K=K30;
  if(z<=K.GZ[0]) return K.NOSE_X;
  if(z<=K.GZ[1]) return K.NOSE_X-K.GSET*(z-K.GZ[0])/(K.GZ[1]-K.GZ[0]);
  if(z<=K.BAND_Z) return K.NOSE_X-K.GSET-(K.TOPSET-K.GSET)*(z-K.GZ[1])/(K.BAND_Z-K.GZ[1]);
  const t=Math.min(1,(z-K.BAND_Z)/(K.Z_CROWN-K.BAND_Z)); return K.NOSE_X-K.TOPSET-0.25*t*t;

function k30nose(z,s,hw){
  const RC=Math.min(K30.NOSE_RC,hw*.9), a=Math.abs(s*hw)-(hw-RC);

function k30SideWindows(cab){                            // cab の有無で並びは変わらない(どちらの車体も外の端が運転台)

function k30patch(B,z0,z1,y0,y1,off,n,col){

/* 塗り分け:車体はアップルグリーン(公表の色名)、窓は黒い枠、扉はステンレス。扉は**両開きプラグドア**(公表):開くと戸は外へ出て

const K30_FRAG_MAIN=`
  vec3 P=vK8P; vec3 Nn=normalize(vK8N);
  float X=P.x, Y=P.y, Z=P.z;
  float isSide=step(.75,abs(Nn.y));
  float sgn=(Y>0.)?1.:-1.;
  vec3 col=C_GRN; float painted=1.; k8Spec=1.;
  float roof=step(Z_SH0+.012,Z);
  float o=(sgn>0.)?uOpen.x:uOpen.y;
  float slide=o*DOOR_HW;
  float onLeaf=0., Xl=X, inGap=0., doorLine=0., outer=0.;
  for(int k=0;k<2;k++){
    float d=DOORX2[k];
    float a=abs(X-d), s=(X>=d)?1.:-1.;
    float inZ=step(DZ0,Z)*step(Z,DZ1);
    if(inZ>.5 && a<DOOR_HW){ if(a<slide) inGap=1.; else { onLeaf=1.; Xl=X-s*slide; } }
    else if(inZ>.5 && a<DOOR_HW+slide){ onLeaf=1.; Xl=X-s*slide; outer=1.; }        // プラグドア:外へ出た戸が脇の外板の上に重なる
    float ring=k8rr(vec2(X,Z),vec4(d-DOOR_HW-.03,d+DOOR_HW+.03,DZ0-.01,DZ1+.03),.04,.005);
    if(ring<=0. && ring>-.03) doorLine=1.;
  }
  onLeaf*=isSide; inGap*=isSide;
  float glass=0., frame=0., tr=0.;
  for(int i=0;i<NWIN;i++){
    if(i>=uNWin) break;
    vec4 b=uWin[i]; vec4 r=uWinR[i];
    float kind=r.z, xx=X;
    if(kind>1.5 && kind<2.5){ if(onLeaf<.5) continue; xx=Xl; }
    else if(onLeaf>.5) continue;
    float so=k8rr(vec2(xx,Z),b,r.x,r.y);
    if(so>0.) continue;
    float si=k8rr(vec2(xx,Z),vec4(b.x+FW,b.y-FW,b.z+FW,b.w-FW),max(r.x-FW,.004),max(r.y-FW,.004));

    float dd=1e3; for(int k=0;k<2;k++) dd=min(dd,abs(Xl-DOORX2[k]));
    if(dd<.012) col=C_RUB; }

  if(inGap>.5) discard;
  if(glass>.5 && tr<.5){ if(outer>.5){ col=C_FGLASS; painted=0.; k8Spec=1.4; } else discard; }   // 外板の上に重なった戸の窓は奥が見えない
#ifdef K8_CAB
  // 前面と、側面へ回り込むガラス(運転台の脇)。ガラスの上は黒い帯
  { float front=step(XC0-.02,X)*(1.-isSide)+step(XC0+.02,X);
    float wrap=isSide*step(WRAP_X,X);
    if((front>.5 || wrap>.5) && Z>GZ0 && Z<GZ1){ col=C_FGLASS; painted=0.; k8Spec=1.6;
      if(Z<GZ0+.04 || Z>GZ1-.04 || (wrap>.5 && X<WRAP_X+.04)) { col=C_BLK; painted=1.; k8Spec=1.; } }
    if((front>.5 || wrap>.5) && Z>=GZ1 && Z<BANDZ+.02){ col=C_BLK; painted=1.; }
  }

  diffuseColor.rgb=col;

/* 台車(軸距 wb・台車中心の並び xs)。8000系の k8BogieGeo と同じ形を、軌間・車輪の大きさで変えられるようにした(車輪は別の形 xWheelGeo:

function xBogieGeo(xs,wb,S){
  const B=new K8B(), RO=(S.GAUGE+RAIL_W)/2, fy=RO+.26, zs=S.WHEEL/.43;
  for(const bx of xs){
    for(const s of [-1,1]){
      const y=s*fy;
      const prof=[[-wb/2-.32,.60],[-wb/2-.32,.80],[-wb/2+.30,.80],[-.55,.66],[.55,.66],[wb/2-.30,.80],[wb/2+.32,.80],[wb/2+.32,.60],[wb/2-.20,.60],[.60,.50],[-.60,.50],[-wb/2+.20,.60]];
      const A=prof.map(p=>[bx+p[0],y-.07,p[1]*zs]), Bq=prof.map(p=>[bx+p[0],y+.07,p[1]*zs]);
      for(let i=0;i<prof.length;i++){const j=(i+1)%prof.length; B.quad(A[i],A[j],Bq[j],Bq[i],K8C.bogie);}
      for(const face of [A,Bq]){ const strip=(i0,i1,i2,i3)=>B.quad(face[i0],face[i1],face[i2],face[i3],K8C.bogie);
        strip(0,11,2,1); strip(11,10,3,2); strip(10,9,4,3); strip(9,8,5,4); strip(8,7,6,5); }
      for(const wx of [bx-wb/2,bx+wb/2]){
        B.box(wx-.16,wx+.16,y-.11,y+.11,.33*zs,.56*zs,K8C.bogie);
        B.cyl([wx,y,.56*zs],[wx,y,.80*zs],.085,10,K8C.bogie);
        const b0=wx-(wx>bx?.38:-.26), b1=wx-(wx>bx?.26:-.38);
        B.box(Math.min(b0,b1),Math.max(b0,b1),y-.08,y+.08,.40*zs,.62*zs,K8C.bogie);
      }
      B.cyl([bx,y*.9,.82*zs],[bx,y*.9,.98*zs],.21,14,K8C.black);
    }
    B.box(bx-.22,bx+.22,-fy,fy,.60*zs,.74*zs,K8C.bogie);
    B.box(bx-.35,bx+.35,-.45,.45,.74*zs,.90*zs,K8C.bogie);
    for(const wx of [bx-wb/2,bx+wb/2]) B.cyl([wx,-RO,S.WHEEL],[wx,RO,S.WHEEL],.07,8,K8C.bogie,false);   // 車軸
  }
  return B.geo();
}
function xWheelGeo(xs,wb,S){                              // 車輪:レールの中心の上・下端がレール面(z=0)
  const B=new K8B(), RO=(S.GAUGE+RAIL_W)/2, r=S.WHEEL;
  for(const bx of xs) for(const wx of [bx-wb/2,bx+wb/2]) for(const s of [-1,1]){

    for(const e of[-1,1]) B.cyl([wx,s*(RO+e*.055),r],[wx,s*(RO+e*.045),r],r*.44,12,K8C.wheelC);   // 輪心(両面。車輪の中心はレールの中心)
  }

/* ---- 9-11b. 1両の部品をまとめる(2026-10-11 利用者指示:描画を軽く) -------------------
   同じ材質で同じ近さの段(LOD)にある静止した部品を1つの形にまとめ、1両あたりの描画の呼び出しを減らす
   (中間車 15→12・パンタ付き 19→15・先頭車 26→22)。まとめるのは
     ・頂点カラーの細部(近く):側面の小物・前面のケース・幌
     ・車内(近く):内装と乗客
     ・頂点カラーの床下(遠く以外):床下機器・冷房装置・パンタの台座の小物
   灯火・表示器・車番の画像・ガラス・車体・台車・パンタの枠は、車両ごとに状態や材質が違うか動くのでまとめない。
   部品の形はどれも同じ属性(位置・法線・色・UV、添字なし)なので、変換(y 回りの180°と x の平行移動)を掛けて
   並べるだけ。形は組み合わせ(形式・運転台・向き・乗客・パンタ)ごとに1つ作って全車で使い回す(K8_MERGED) */
const K8_MERGED=new Map();
function k8Merge(key,parts){                      // parts=[[形, 180°回すか, x の平行移動]]
  let g=K8_MERGED.get(key); if(g) return g;
  const A={position:[],normal:[],color:[],uv:[]};
  for(const [geo,rot,dx] of parts){
    const at=geo.attributes, P=at.position.array, N=at.normal.array, c=rot?-1:1;   // y 回りの180°:(x,z)→(−x,−z)
    for(let i=0;i<P.length;i+=3){ A.position.push(c*P[i]+dx,P[i+1],c*P[i+2]); A.normal.push(c*N[i],N[i+1],c*N[i+2]); }
    for(const k of['color','uv']) for(const v of at[k].array) A[k].push(v);
  }
  g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(A.position,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(A.normal,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(A.color,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(A.uv,2));
  K8_MERGED.set(key,g); return g;
}

/* ---- 9-11b. 台車・床下・冷房・パンタは全車両でインスタンスに(2026-10-15 利用者指示:軽く) ----
   1両あたり 2〜5回の描画(台車・床下と冷房・パンタの台枠/枠/舟)が全車両ぶん効いていた。部品の Mesh は今までどおり
   車両の中に置き(位置・LOD の見え方はこれで決まり、検証もこれを測る)、描かない層 CAR_INST.layer へ移す。主シーンを
   描く直前(scene.onBeforeRender。行列の更新の後)に、見えている部品の世界行列を形と材質の組ごとの InstancedMesh へ
   書く。書くのは画面か影の範囲に掛かる車両だけ(インスタンスは間引かれないので)。主シーンの外へ出した車両(⑩⑮の
   照合の描画)は元の Mesh のまま描く */
const CAR_INST={batches:new Map(), layer:31, R:12, drawn:0};
function carInstReg(m,car){
  const k=m.geometry.uuid+'|'+m.material.uuid;
  let b=CAR_INST.batches.get(k);
  if(!b){ b={geo:m.geometry,mat:m.material,list:[],im:null,cap:0}; CAR_INST.batches.set(k,b); }
  b.list.push(m); m.userData.instCar=car;
}
const _ciF=new THREE.Frustum(), _ciM=new THREE.Matrix4(), _ciS=new THREE.Sphere(new THREE.Vector3(),CAR_INST.R);
function carInstSeen(car){
  _ciS.center.copy(car.position);
  if(_ciF.intersectsSphere(_ciS)) return true;
  if(!renderer.shadowMap.enabled) return false;
  const t=sun.target.position, dx=car.position.x-t.x, dy=car.position.y-t.y, dz=car.position.z-t.z;
  const a=dx*SUN_N.x+dy*SUN_N.y+dz*SUN_N.z, R=shadowR+CAR_INST.R;   // 影を写す範囲(光の向きの筒)
  return dx*dx+dy*dy+dz*dz-a*a<R*R;
}
function carInstDraw(cam){
  _ciM.multiplyMatrices(cam.projectionMatrix,cam.matrixWorldInverse); _ciF.setFromProjectionMatrix(_ciM);
  const seen=new Map(), L=CAR_INST.layer; let tot=0;
  for(const b of CAR_INST.batches.values()){
    if(b.list.length>b.cap){
      if(b.im){ scene.remove(b.im); b.im.dispose(); }
      b.cap=Math.ceil(b.list.length*1.25)+4;
      b.im=new THREE.InstancedMesh(b.geo,b.mat,b.cap);
      b.im.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
      b.im.frustumCulled=false; b.im.userData.carInst=true;
      b.im.castShadow=b.list[0].castShadow; b.im.receiveShadow=b.list[0].receiveShadow;
      scene.add(b.im);
    }
    let n=0;
    for(const m of b.list){
      const car=m.userData.instCar;
      if(car.parent!==scene&&!(car.parent&&car.parent.userData.xtrain&&car.parent.parent===scene)){ if(m.layers.mask!==1) m.layers.set(0); continue; }
      if(m.layers.mask===1) m.layers.set(L);
      let o=m, on=true;
      for(;o;o=o.parent){ if(!o.visible){on=false;break;} if(o===car) break; }
      if(on&&car.parent!==scene&&!car.parent.visible) on=false;
      if(!on) continue;
      let v=seen.get(car); if(v===undefined){ v=carInstSeen(car); seen.set(car,v); }
      if(v) b.im.setMatrixAt(n++,m.matrixWorld);
    }
    b.im.count=n; b.im.instanceMatrix.needsUpdate=true; tot+=n;
  }
  CAR_INST.drawn=tot;
}
scene.onBeforeRender=function(r,sc,cam){ carInstDraw(cam); };

        lights='head'|'tail'|'off'(運転台の灯火) / sign={kind,dest}|null(表示器)
   v4 との対応:先頭車・最後尾のシェルは運転台が外を向く(最後尾は180°回す)。
   車番は中間車が新宿方の端、先頭車は運転台側の端。反対の端に KEIO ロゴ。
   series='9000' なら 9000系の幾何(K9GEO)と塗り分け(k9BodyMat)。前面の表示器は中央扉の上の1台。 */
function makeCar(opt){

  const cab=o.cabF||o.cabR, tail=o.cabR;          // シェルの向き(運転台が−x側なら180°回す)
  const g=new THREE.Group();

  const addFine=(geo,mat,parent)=>{const m=add(geo,mat,parent);fine.push(m);return m;};
  // シェル(v4 と同じく最後尾は Z 回り180°。Three.js では上(y)回り)
  const sh=new THREE.Group(); if(tail) sh.rotation.y=Math.PI; g.add(sh);

  // 頂点カラーの細部:側面の小物・前面のケース(シェルと一緒に回す)・幌(新宿方の妻。最後尾の運転台の側には無い)を1つの形に
  { const parts=[[GEO.sideFit,tail,0]];
    if(cab) parts.push([GEO.front.case,tail,0]);
    if(!o.cabR) parts.push([GEO.gang,false,-(SP.LEN/2+.25)]);
    addFine(k8Merge(SK+'|vc|'+(cab?'c':'m')+(tail?'t':'')+(o.cabR?'':'g'),parts),K8M.vc); }
  addFine(cab?GEO.glassCab:GEO.glass,K8M.glass,sh);
  addFine(GEO.doorGlass,k8DoorGlassMat(bodyMat.userData.k8.uni),sh);
  // 車内:内装と乗客を1つの形に
  { const pp=cab?GEO.peopleCab:GEO.people, ci=o.crowd===null?-1:(o.crowd|0)%pp.length;
    const parts=[[cab?GEO.roomCab:GEO.room,false,0]]; if(ci>=0) parts.push([pp[ci],false,0]);
    addFine(k8Merge(SK+'|room|'+(cab?'c':'m')+ci,parts),K8M.room,sh); }
  addFine(cab?GEO.lightCab:GEO.light,K8M.cabinLight,sh);

  { const f=(S9?K9_SIDEFIT:K8_SIDEFIT).SLED_FACE;            // 画像の縦横比=表示面(1m=640px)
    addFine(GEO.sideLed, o.sign?k8SideLed(o.sign.kind,o.sign.dest,Math.round((f[1]-f[0])*640),Math.round((f[3]-f[2])*640)):K8M.ledOff, sh); }
  // 幕板の車番とロゴ。e_local=シェルの+xが新宿方なら+1

    const L=[[GEO.plate,xn,k8NumPlate(o.num)],[GEO.logo,-xn,k8Logo(256,72)]];
    if(cab){
      const F=GEO.front;
      L.push([GEO.cabLogo,0,k8Logo(384,96)]);
      if(S9) L.push([F.num,0,k8FrontNum(o.num,Math.round((K9.FNUM[1]-K9.FNUM[0])*640),Math.round((K9.FNUM[3]-K9.FNUM[2])*640),true)],   // 字形のまま(引き伸ばさない)
                    [F.logo,0,k9Logo(Math.round((K9.FLOGO[1]-K9.FLOGO[0])*1280),Math.round((K9.FLOGO[3]-K9.FLOGO[2])*1280))]);   // 2倍の細かさ(1m=1280px)
      else L.push([F.num,0,k8FrontNum(o.num)],[F.logo,0,k8Logo(256,40)]);

  }
  if(cab){                                                  // 前頭部(灯火・表示器・識別灯は 8000・9000 共通の並び。車番・ロゴは上のシート)
    const F=GEO.front;
    add(F.vc,K8M.vc,sh);                                    // 前面のケースは頂点カラーの細部にまとめた(上)
    addFine(F.hl,o.lights==='head'?M_HL:M_HL_OFF,sh);
    addFine(F.tl,o.lights==='tail'?M_TL:M_TL_OFF,sh);
    if(o.lights==='head') addFine(F.hlGlow,K8M.hlGlow,sh);
    if(o.lights==='tail') addFine(F.tlGlow,K8M.tlGlow,sh);
    const lit=o.sign&&o.lights==='head';                    // 表示は先頭車だけ点く
    if(S9){                                                 // 9000系:行先=扉の上・種別=向かって左の窓の上部(写真)
      // 画像の縦横比は貼る面(K9.FDEST・FKIND・FNUM)と同じに(1m=640px)
      const px=(R)=>[Math.round((R[1]-R[0])*640),Math.round((R[3]-R[2])*640)];
      addFine(F.dest,lit?k8Led(k8DestTxt(o.sign.dest),'#ff8c14',...px(K9.FDEST)):K8M.ledOff,sh);
      addFine(F.kind,lit?k8Led(k8KindTxt(o.sign.kind),K8_KIND_COLORS[o.sign.kind]||'#ff2e14',...px(K9.FKIND)):K8M.ledOff,sh);
    }else{
      addFine(F.dest,lit?k8Led(k8DestTxt(o.sign.dest),'#ff8c14',256,68,K8_FRONT_TXT):K8M.ledOff,sh);
      addFine(F.kind,lit?k8Led(k8KindTxt(o.sign.kind),K8_KIND_COLORS[o.sign.kind]||'#ff2e14',192,68,K8_FRONT_TXT):K8M.ledOff,sh);
    }
    addFine(F.pass,k8PassOn(o)?M_PASS:M_PASS_OFF,sh);          // 識別灯(各停以外で点く)
    if(k8PassOn(o)) addFine(F.passGlow,K8M.hlGlow,sh);
