// 断面:すその丸み → 垂直な側面 → 肩(超楕円) → 屋根頂部。帯・窓・扉の境目に頂点を置く
const K8_ROWS=(function(){
  const R=[], hw=K8.HWB;
  for(let k=0;k<7;k++){const t=k/6*Math.PI/2;
    R.push([K8.Z_FLR-0.14*Math.cos(t), hw-0.05+0.05*Math.sin(t)]);}
  for(const z of [K8.RED_LO[0],K8.RED_LO[1],K8.BLUE[0],K8.BLUE[1],K8.RED_UP[0],K8.RED_UP[1],
                  K8.WZ0,2.46,K8.DWZ1,K8.WZ1,K8.DZ1,K8.MAKU[0],K8.MAKU[1]]) R.push([z,hw]);
  R.push([K8.Z_SH0,hw]);
  for(let k=1;k<15;k++){const t=k/15;
    const y=hw*Math.pow(Math.cos(t*Math.PI/2),0.5);
    const z=K8.Z_SH0+(K8.Z_CROWN-K8.Z_SH0)*Math.sqrt(Math.max(0,1-Math.pow(y/hw,4)));
    R.push([z,Math.max(y,0.06)]);}
  return R;
})();
// 前面の中心線の輪郭(写真の実測):下部は後退、1.62〜2.52 は垂直、その上は後退して肩へ
const K8_NOSE_PROFILE=[[0.95,9.576],[1.62,9.752],[2.52,9.752],[3.50,9.635],[3.55,9.615],
                       [3.60,9.570],[3.63,9.51],[3.66,9.44],[3.69,9.36],[3.73,9.28]];
const K8_NOSE_D=0.34;                    // 前面の角の回り込み
function k8xf(z){                        // 高さ z での前面中心線の x
  const P=K8_NOSE_PROFILE;
  if(z<=P[0][0]) return P[0][1];
  for(let i=0;i<P.length-1;i++){
    const a=P[i], b=P[i+1];
    if(z<=b[0]) return a[1]+(b[1]-a[1])*(z-a[0])/(b[0]-a[0]);
  }
  return P[P.length-1][1];
}
// 前面の平面形:中央はゆるい曲面、角で側面へ回り込む(s=-1〜1 は左右の正規化位置)
function k8nose(z,s,hw){
  const y=s*hw;
  return k8xf(z)-K8_NOSE_D*(1-Math.sqrt(Math.max(0,1-Math.pow(Math.abs(s),6))))-y*y/16.0;
}

/* ---- 9-3. 開口の一覧(side_windows を移植)。外枠の外側の寸法 ---------------- */

function k8SideWindows(cab){
  const W=[];
  for(const g of [4.70,0.0,-4.70]){                     // 扉間:下降窓2枚(2連)
    W.push([g+0.021,g+0.943,K8.WZ0,K8.WZ1,0.07,0.07,0]);
    W.push([g-0.943,g-0.021,K8.WZ0,K8.WZ1,0.07,0.07,0]);
  }
  for(const d of K8.DOORX) for(const sg of [-1,1]){      // 戸袋窓:各扉の両側
    if(cab&&d>7&&sg>0) continue;                         // 運転台側の扉1の前は窓なし(ロゴの板)
    const a=d+sg*0.895, b=d+sg*1.175;
    W.push([Math.min(a,b),Math.max(a,b),K8.WZ0,K8.WZ1,0.09,0.08,1]);
  }
  for(const s of (cab?[-1]:[-1,1])){                     // 車端の下降窓
    const a=s*8.466, b=s*9.396;
    W.push([Math.min(a,b),Math.max(a,b),K8.WZ0,K8.WZ1,0.08,0.08,0]);
  }
  for(const d of K8.DOORX){                              // 扉窓(左右の戸に1枚ずつ)
    W.push([d-0.546,d-0.135,K8.WZ0,K8.DWZ1,0.12,0.10,2]);
    W.push([d+0.135,d+0.546,K8.WZ0,K8.DWZ1,0.12,0.10,2]);
  }
  if(cab) W.push([K8.CREW_WIN[0],K8.CREW_WIN[1],K8.CREW_WIN[2],K8.CREW_WIN[3],0.05,0.05,3]);

/* 多角形の寄せ集め(v4 の bmesh 相当)。面ごとに頂点を持つので法線は面の向き(平らな陰影) */
function K8B(){this.P=[];this.N=[];this.C=[];this.U=[];}
K8B.prototype.poly=function(pts,col,uvs){               // pts:[[x,y,z],...] v4座標・反時計回り
  const n=pts.length; if(n<3) return;
  const a=pts[0], b=pts[1], c=pts[Math.min(2,n-1)];
  // 面の法線(v4座標)→ 写像
  let nx=0,ny=0,nz=0;
  for(let i=0;i<n;i++){const p=pts[i],q=pts[(i+1)%n];
    nx+=(p[1]-q[1])*(p[2]+q[2]); ny+=(p[2]-q[2])*(p[0]+q[0]); nz+=(p[0]-q[0])*(p[1]+q[1]);}
  const l=Math.hypot(nx,ny,nz)||1; nx/=l;ny/=l;nz/=l;
  for(let i=1;i<n-1;i++) for(const k of [0,i,i+1]){
    const p=pts[k];
    this.P.push(p[0],p[2],-p[1]); this.N.push(nx,nz,-ny);
    this.C.push(col[0],col[1],col[2]);
    if(uvs) this.U.push(uvs[k][0],uvs[k][1]); else this.U.push(0,0);
  }
};
K8B.prototype.quad=function(a,b,c,d,col,uvs){this.poly([a,b,c,d],col,uvs);};
K8B.prototype.box=function(x0,x1,y0,y1,z0,z1,col){
  const v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  for(const f of [[0,3,2,1],[4,5,6,7],[0,1,5,4],[1,2,6,5],[2,3,7,6],[3,0,4,7]])
    this.poly(f.map(i=>v[i]),col);
};
K8B.prototype.cyl=function(p0,p1,r,seg,col,cap){       // p0→p1 の円柱
  const d=[p1[0]-p0[0],p1[1]-p0[1],p1[2]-p0[2]], L=Math.hypot(d[0],d[1],d[2])||1;
  const dn=[d[0]/L,d[1]/L,d[2]/L];
  let ux,uy,uz;                                           // dn に直交する単位ベクトル
  if(Math.abs(dn[0])<0.9){ux=0;uy=dn[2];uz=-dn[1];}else{ux=-dn[2];uy=0;uz=dn[0];}
  let ul=Math.hypot(ux,uy,uz); ux/=ul;uy/=ul;uz/=ul;
  const vx=dn[1]*uz-dn[2]*uy, vy=dn[2]*ux-dn[0]*uz, vz=dn[0]*uy-dn[1]*ux;
  const A=[],B=[];
  for(let i=0;i<seg;i++){const t=2*Math.PI*i/seg, c=Math.cos(t)*r, s=Math.sin(t)*r;
    const o=[ux*c+vx*s, uy*c+vy*s, uz*c+vz*s];
    A.push([p0[0]+o[0],p0[1]+o[1],p0[2]+o[2]]); B.push([p1[0]+o[0],p1[1]+o[1],p1[2]+o[2]]);}
  for(let i=0;i<seg;i++){const j=(i+1)%seg; this.quad(A[i],A[j],B[j],B[i],col);}
  if(cap!==false){ this.poly(A.slice().reverse(),col); this.poly(B,col); }
};
K8B.prototype.sphere=function(c,r,col){                 // 低多角形の球(乗客の頭)
  const S=6,T=4;
  for(let i=0;i<T;i++)for(let j=0;j<S;j++){
    const p=(a,b)=>{const th=Math.PI*a/T, ph=2*Math.PI*b/S;
      return [c[0]+r*Math.sin(th)*Math.cos(ph), c[1]+r*Math.sin(th)*Math.sin(ph), c[2]+r*Math.cos(th)];};
    if(i===0) this.poly([p(0,0),p(1,j),p(1,j+1)],col);
    else if(i===T-1) this.poly([p(i,j),p(T,0),p(i,j+1)],col);
    else this.quad(p(i,j),p(i+1,j),p(i+1,j+1),p(i,j+1),col);
  }
};
K8B.prototype.geo=function(){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(this.P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(this.N,3));
  g.setAttribute('color',new THREE.Float32BufferAttribute(this.C,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(this.U,2));
  return g;
};
// 前面の曲面に沿った四角いパッチ(v4 の patch)。off=面からの浮かせ量。UVは左右0〜1/上下0〜1
function k8patch(B,z0,z1,y0,y1,off,n,col){
  const hw=K8.HWB;
  for(let i=0;i<n;i++){
    const ya=y0+(y1-y0)*i/n, yb=y0+(y1-y0)*(i+1)/n, ua=i/n, ub=(i+1)/n;
    const P=(y,z)=>[k8nose(z,y/hw,hw)+off,y,z];
    B.quad(P(ya,z0),P(yb,z0),P(yb,z1),P(ya,z1),col,[[ua,0],[ub,0],[ub,1],[ua,1]]);
  }
}

/* ---- 9-5. 車体シェル(shell_mesh を移植) ----------------------------------------
   側面と前頭部は頂点を共有して滑らかな陰影に、端面・底面は別頂点にして角を立てる
   (v4 は 40° で角を立てている)。面の向きは「車体中心(0,0,2.3)から外へ」に揃える
   (凸な形なので、これで全ての面の表裏が決まる)。 */
function k8ShellGeo(cab){
  const R=K8_ROWS, nR=R.length, L2=K8.LEN/2;
  const P=[], I=[];
  const v=(x,y,z)=>{P.push(x,y,z);return P.length/3-1;};   // ここでは v4 座標のまま持つ
  const per=[]; for(const r of R) per.push([-r[1],r[0]]); for(let i=nR-1;i>=0;i--) per.push([R[i][1],R[i][0]]);
  const n=per.length;
  const rear=per.map(p=>v(-L2,p[0],p[1]));
  let front;
  const smooth=[];                       // 滑らかに繋ぐ面(側面・前頭部)
  const tri=(a,b,c,list)=>list.push([a,b,c]);
  const quad=(a,b,c,d,list)=>{list.push([a,b,c]);list.push([a,c,d]);};
  const caps=[];                          // 角を立てる面(端面・底面)=別頂点で作る
  if(!cab){
    front=per.map(p=>v(L2,p[0],p[1]));
  }else{
    const C=44, grid=[];
    for(const r of R){
      const z=r[0], hw=r[1], row=[];
      for(let c=0;c<=C;c++){const s=-1+2*c/C; row.push(v(k8nose(z,s,hw),s*hw,z));}
      grid.push(row);
    }
    front=[]; for(let r=0;r<nR;r++) front.push(grid[r][0]); for(let r=nR-1;r>=0;r--) front.push(grid[r][C]);
    for(let r=0;r<nR-1;r++) for(let c=0;c<C;c++)
      quad(grid[r][c],grid[r][c+1],grid[r+1][c+1],grid[r+1][c],smooth);
    caps.push(grid[0].slice().reverse(), grid[nR-1].slice());   // 前頭部の下面・上面
  }
  for(let i=0;i<n-1;i++){
    // 底の閉じ(すその−y下端〜+y下端)は角を立てる。それ以外の側面は滑らかに
    quad(rear[i],front[i],front[i+1],rear[i+1],smooth);
  }
  caps.push([rear[n-1],front[n-1],front[0],rear[0]]);           // 底面
  caps.push(rear.slice().reverse());                             // 後端面
  if(!cab) caps.push(front.slice());                             // 前端面(中間車)
  // 面の向きを外向きに揃える
  const ctr=[0,0,2.3];
  const fix=(t)=>{
    const a=t[0]*3,b=t[1]*3,c=t[2]*3;
    const ux=P[b]-P[a],uy=P[b+1]-P[a+1],uz=P[b+2]-P[a+2];
    const wx=P[c]-P[a],wy=P[c+1]-P[a+1],wz=P[c+2]-P[a+2];
    const nx=uy*wz-uz*wy, ny=uz*wx-ux*wz, nz=ux*wy-uy*wx;
    const mx=(P[a]+P[b]+P[c])/3-ctr[0], my=(P[a+1]+P[b+1]+P[c+1])/3-ctr[1], mz=(P[a+2]+P[b+2]+P[c+2])/3-ctr[2];
    return (nx*mx+ny*my+nz*mz)<0 ? [t[0],t[2],t[1]] : t;
  };
  for(const t of smooth){const f=fix(t); I.push(f[0],f[1],f[2]);}
  // 角を立てる面は頂点を複製(法線を共有しない)。多角形は凸なので扇で三角形にする
  for(const loop of caps){
    const base=loop.map(k=>v(P[k*3],P[k*3+1],P[k*3+2]));
    for(let i=1;i<base.length-1;i++){const f=fix([base[0],base[i],base[i+1]]); I.push(f[0],f[1],f[2]);}
  }
  // v4 座標 → Three.js
  const Q=new Float32Array(P.length);
  for(let i=0;i<P.length;i+=3){Q[i]=P[i];Q[i+1]=P[i+2];Q[i+2]=-P[i+1];}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(Q,3));
  g.setIndex(I); g.computeVertexNormals();
  return g;
}

const K8_FRAG_FUNCS=`
varying vec3 vK8P; varying vec3 vK8N;
uniform vec4 uWin[NWIN]; uniform vec4 uWinR[NWIN]; uniform int uNWin; uniform vec2 uOpen;
float k8band(float v,float a,float b){return step(a,v)*step(v,b);}
// 角丸長方形の符号付き距離(負=内側)。上の角 rt・下の角 rb
float k8rr(vec2 p, vec4 b, float rt, float rb){

const CARMAT=mkPhong({color:srgb(0xffffff),side:THREE.DoubleSide,specular:srgb(0x3a4046),shininess:55});
function k8BodyMat(cab){
  const m=CARMAT.clone();
  const W=cab?K8_WIN.cab:K8_WIN.mid, NW=26;
  const uWin=[], uWinR=[];
  for(let i=0;i<NW;i++){
    const w=W[i]||[0,0,0,0,0,0,0];
    uWin.push(new THREE.Vector4(w[0],w[1],w[2],w[3]));
    uWinR.push(new THREE.Vector4(w[4],w[5],w[6],0));
  }
  const U={uWin:{value:uWin},uWinR:{value:uWinR},uNWin:{value:W.length},
           uOpen:{value:new THREE.Vector2(0,0)}};
  m.userData.k8={cab:!!cab, uni:U};
  m.onBeforeCompile=function(sh){
    Object.assign(sh.uniforms,U);
    sh.vertexShader='varying vec3 vK8P; varying vec3 vK8N;\n'+sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  vK8P=vec3(position.x,-position.z,position.y); vK8N=vec3(normal.x,-normal.z,normal.y);');
    sh.fragmentShader=k8ShaderDefs()+(cab?'#define K8_CAB\n':'')+K8_FRAG_FUNCS+
      sh.fragmentShader
        .replace('#include <color_fragment>','#include <color_fragment>\n  float k8Spec=1.;\n  {'+K8_FRAG_MAIN+'  }\n')
        .replace('#include <specularmap_fragment>','#include <specularmap_fragment>\n  specularStrength*=k8Spec;');
  };
  m.customProgramCacheKey=()=>'k8body'+(cab?'C':'M');
  return m;
}

const K8_FONT='"IPAGothic","Noto Sans JP","Hiragino Kaku Gothic ProN",sans-serif';
const K8_TEXCACHE={};
function k8Tex(key,w,h,draw){
  if(K8_TEXCACHE[key]) return K8_TEXCACHE[key];
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  draw(cv.getContext('2d'),w,h);

// 文字を枠いっぱい(縦横比を保つ)に描く
// fill=true なら縦横を別々に伸ばして枠にぴったり合わせる(v4 の placed_text で
// keep_aspect=False の文字=ロゴ・車番)。false なら縦横比を保って収める(表示器の文字)
function k8fitText(cx,txt,x,y,w,h,font,shear,fill){
  cx.save(); cx.font=font; cx.textAlign='left'; cx.textBaseline='alphabetic';
  const m=cx.measureText(txt);
  const l=m.actualBoundingBoxLeft||0, r=m.actualBoundingBoxRight||m.width||1;
  const a=m.actualBoundingBoxAscent||parseFloat(font.match(/(\d+)px/)[1])*0.75, d=m.actualBoundingBoxDescent||0;
  const bw=(r+l)||1, bh=(a+d)||1;
  // 斜体にすると外接矩形が高さ×shear だけ横へ広がるので、そのぶんを幅に含めて合わせる
  const ew=bw+(shear?bh*shear:0);
  let sx=w/ew, sy=h/bh; if(!fill){const k=Math.min(sx,sy);sx=sy=k;}
  cx.translate(x,y); cx.scale(sx,sy);
  if(shear) cx.transform(1,0,-shear,1,0,0);
  // 外接矩形の中心が (x,y) に来るように置く。斜体は中心の高さを軸に倒すので左右対称に広がる
  cx.fillText(txt,-(r-l)/2,(a-d)/2);
  cx.restore();
}

  const hw=K8.HWB;
  G.case=mk(B=>{for(const sg of[-1,1]) k8patch(B,1.217,1.398,Math.min(sg*.628,sg*1.150),Math.max(sg*.628,sg*1.150),.004,6,K8C.black);});
  G.hl  =mk(B=>{for(const sg of[-1,1]) k8patch(B,1.255,1.363,Math.min(sg*.640,sg*.935),Math.max(sg*.640,sg*.935),.009,6,[1,1,1]);});
  G.tl  =mk(B=>{for(const sg of[-1,1]) k8patch(B,1.262,1.358,Math.min(sg*.950,sg*1.138),Math.max(sg*.950,sg*1.138),.009,6,[1,1,1]);});
  /* 点いている灯火の照り返し。v4(Cycles)では強さ40の前照灯が5mm奥の黒いケースを
     照らし、ケースの縁が明るく写る(大域照明)。実時間の描画には大域照明が無いので、
     灯火の周り(ケースの範囲)に加算合成の淡い光を重ねて同じ見え方にする */
  G.hlGlow=mk(B=>{for(const sg of[-1,1]) k8patch(B,1.222,1.393,Math.min(sg*.630,sg*.945),Math.max(sg*.630,sg*.945),.010,6,[1,1,1]);});
  G.tlGlow=mk(B=>{for(const sg of[-1,1]) k8patch(B,1.232,1.388,Math.min(sg*.945,sg*1.146),Math.max(sg*.945,sg*1.146),.010,6,[1,1,1]);});
  G.vc  =mk(B=>{
    // 貫通扉の輪郭・前面下端の線・取っ手
    for(const yc of [-.385,.385]) for(const zz of [[1.13,1.52],[1.52,1.87]])
      k8patch(B,zz[0],zz[1],yc-.006,yc+.006,.002,1,K8C.rubber);
    k8patch(B,1.13,1.142,-.385,.385,.002,8,K8C.rubber);
    k8patch(B,1.160,1.172,-1.30,1.30,.002,24,K8C.rubber);
    k8patch(B,1.18,1.24,-.03,.03,.003,1,K8C.rubber);
    // ガラス域の中の枠(3枚窓の柱と上下の枠)
    for(const yc of [-.35,.35]) k8patch(B,2.20,2.80,yc-.022,yc+.022,.004,1,K8C.faceBlack);
    for(const zc of [2.20,2.80]) k8patch(B,zc-.018,zc+.018,-1.22,1.22,.004,24,K8C.faceBlack);
    // ワイパー
    for(const sg of[-1,1]){
      const P=(y,z,o)=>[k8nose(z,y/hw,hw)+o,y,z];
      B.cyl(P(sg*.87,1.75,.025),P(sg*.70,1.94,.025),.012,6,K8C.black);
      B.cyl(P(sg*.70,1.93,.03),P(sg*.12,1.90,.03),.008,5,K8C.black);
    }
    // スカート(アイボリー):上端1.09、下ほど前へ。中央に連結器の切り欠き(|y|<0.36)
    const Cn=28, top=[], bot=[];
    for(let c=0;c<=Cn;c++){
      const s=-1+2*c/Cn, y=s*(hw-.12), xt=k8nose(1.0,y/hw,hw)-.02;
      top.push([xt,y,1.09]); bot.push([xt+.06,y*.96,.24]);
    }
    const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];
    for(let c=0;c<Cn;c++){
      const yc=Math.abs((-1+2*(c+.5)/Cn)*(hw-.12));
      if(yc<.36) B.quad(lerp(top[c],bot[c],.6),bot[c],bot[c+1],lerp(top[c+1],bot[c+1],.6),K8C.ivory);
      else B.quad(top[c],bot[c],bot[c+1],top[c+1],K8C.ivory);
    }
    for(const sg of[-1,1]){                                // スカートの側板
      const c=sg<0?0:Cn, p=top[c], q=bot[c];
      const v=[p,q,[K8.WRAP_X-.1,q[1],q[2]+.06],[K8.WRAP_X-.1,p[1],p[2]]];
      B.poly(sg>0?v:v.slice().reverse(),K8C.ivory);
    }
    // 連結器・電気連結器・前頭部の床下
    const xs=k8nose(1.0,0,hw);
    B.box(xs-.9,xs+.20,-.13,.13,.76,.96,K8C.under);
    B.box(xs+.10,xs+.26,-.20,.20,.72,1.00,K8C.under);
    B.box(xs-.6,xs+.08,.22,.40,.78,.92,K8C.under);
    B.box(K8.LEN/2-1.3,xs-.30,-1.2,1.2,.76,K8.Z_BOT,K8C.under);
  });
  // 表示器(行先=左・広い/種別=右)・前面の車番・KEIO ロゴ(文字を貼る面)
  G.dest=mk(B=>k8patch(B,3.107,3.272,-1.160,-.540,.003,10,[1,1,1]));
  G.kind=mk(B=>k8patch(B,3.107,3.272,.555,1.010,.003,8,[1,1,1]));
  G.num =mk(B=>k8patch(B,1.448,1.514,-.89,-.63,.008,4,[1,1,1]));
  G.logo=mk(B=>k8patch(B,1.618,1.662,.70,1.02,.0075,6,[1,1,1]));
  return G;
}
// 台車(bogie_mesh を移植)。軸距 wb。車輪はレール中心(RAIL_OFF)の上に載せる
function k8BogieGeo(wb){
  const B=new K8B();
  for(const bx of [-K8.BOGIE_X,K8.BOGIE_X]){
    for(const s of [-1,1]){
      const y=s*.98;
      const prof=[[-wb/2-.32,.60],[-wb/2-.32,.80],[-wb/2+.30,.80],[-.55,.66],[.55,.66],
                  [wb/2-.30,.80],[wb/2+.32,.80],[wb/2+.32,.60],[wb/2-.20,.60],
                  [.60,.50],[-.60,.50],[-wb/2+.20,.60]];
      const A=prof.map(p=>[bx+p[0],y-.07,p[1]]), Bq=prof.map(p=>[bx+p[0],y+.07,p[1]]);
      for(let i=0;i<prof.length;i++){const j=(i+1)%prof.length; B.quad(A[i],A[j],Bq[j],Bq[i],K8C.bogie);}
      // 側枠の側面(凹多角形なので台形の帯に分けて張る)
      for(const face of [A,Bq]){
        const strip=(i0,i1,i2,i3)=>B.quad(face[i0],face[i1],face[i2],face[i3],K8C.bogie);
        strip(0,11,2,1); strip(11,10,3,2); strip(10,9,4,3); strip(9,8,5,4); strip(8,7,6,5);
      }
      for(const wx of [bx-wb/2,bx+wb/2]){
        B.box(wx-.16,wx+.16,y-.11,y+.11,.33,.56,K8C.bogie);                 // 軸箱
        B.cyl([wx,y,.56],[wx,y,.80],.085,10,K8C.bogie);                      // 軸ばね
        B.cyl([wx,s*(RAIL_OFF+.05),K8.WHEEL],[wx,s*(RAIL_OFF-.05),K8.WHEEL],K8.WHEEL,24,K8C.bogie);  // 車輪φ860
        B.cyl([wx,s*(RAIL_OFF+.055),K8.WHEEL],[wx,s*(RAIL_OFF+.045),K8.WHEEL],.19,12,K8C.wheelC);
        const b0=wx-(wx>bx?.38:-.26), b1=wx-(wx>bx?.26:-.38);
        B.box(Math.min(b0,b1),Math.max(b0,b1),y-.08,y+.08,.40,.62,K8C.bogie); // ブレーキ
      }
      B.cyl([bx,y*.9,.82],[bx,y*.9,.98],.21,14,K8C.black);                   // 空気ばね
    }
    B.box(bx-.22,bx+.22,-.98,.98,.60,.74,K8C.bogie);                         // 横ばり
    B.box(bx-.35,bx+.35,-.45,.45,.74,.90,K8C.bogie);                         // けん引装置
    B.cyl([bx,-RAIL_OFF,K8.WHEEL],[bx,RAIL_OFF,K8.WHEEL],.07,8,K8C.bogie,false);   // 車軸(見える位置)
  }
  return B.geo();
}
// 床下機器(v4 は台車と同じメッシュ。ここでは頂点カラーの部品へ)
function k8UnderGeo(){
  const B=new K8B();
  for(const e of [[-5.2,-2.3,.30],[-1.9,1.5,.34],[1.9,5.1,.26]])
    B.box(e[0],e[1],-1.18,1.18,K8.Z_BOT-.02-e[2]*1.6,K8.Z_BOT-.02,K8C.underGray);
  return B.geo();
}
// 冷房装置(長さ4.38m・上端4.055)。側面のルーバー帯は縞で描く
function k8AcGeo(){
  const B=new K8B(), Lh=K8.AC_L/2;
  B.box(-Lh,Lh,-.95,.95,K8.Z_CROWN-.06,3.99,K8C.ac);
  B.box(-Lh+.12,Lh-.12,-.88,.88,3.99,4.02,K8C.ac);
  for(const cx of [-1.45,-.5,.5,1.45]) B.cyl([cx,0,4.00],[cx,0,K8.AC_TOP],.30,18,K8C.roofc);
  for(const s of [-1,1]){                                    // ルーバー(側面の縦縞)
    const y=s*.952;
    for(let k=0;k<Math.floor(K8.AC_L*11);k++){
      const x0=-Lh+(k+.62)/11, x1=-Lh+(k+1)/11;
      if(x1>Lh) break;
      const p=[[x0,y,3.80],[x1,y,3.80],[x1,y,3.97],[x0,y,3.97]];
      B.poly(s>0?p:p.slice().reverse(),K8C.acL);
    }
  }
  return B.geo();
}
// 幌(じゃばら)。連結面の中央(原点)
function k8GangGeo(){
  const B=new K8B();
  for(let k=0;k<7;k++) B.box(-.3+k*.085,-.3+k*.085+.05,-.62,.62,K8.Z_FLR+.02,3.08,K8C.under);
  B.box(-.3,.3,-.55,.55,K8.Z_FLR+.05,3.04,K8C.under);
  return B.geo();
}
/* パンタグラフ(シングルアーム。panto_mesh を移植)。原点=台座中心、+x=京王八王子方。
   実測:下枠の付け根 +0.07(z3.92)、ひじは +x 側、舟は −0.26。舟の高さはトロリ線
   WIRE_TRO に合わせる(架線と同じ定数から決めるので、すり板が架線に接する)。 */
const K8_PT={HINGE:[0.07,3.92], HEADX:-0.26, L1:1.076, L2:1.34};
function k8PantoKnee(){
  const h=K8_PT.HINGE, head=[K8_PT.HEADX, WIRE_TRO-.04];
  const dx=head[0]-h[0], dz=head[1]-h[1], d=Math.hypot(dx,dz);
  const a=(K8_PT.L1*K8_PT.L1-K8_PT.L2*K8_PT.L2+d*d)/(2*d), hh=Math.sqrt(Math.max(0,K8_PT.L1*K8_PT.L1-a*a));
  const ux=dx/d, uz=dz/d, px=uz, pz=-ux;
  let k=[h[0]+ux*a+px*hh, h[1]+uz*a+pz*hh];
  if(k[0]<h[0]) k=[h[0]+ux*a-px*hh, h[1]+uz*a-pz*hh];       // ひじは +x(京王八王子方)
  return {hinge:h, head:head, knee:k};
}
function k8PantoGeos(){
  const zr=K8.Z_CROWN-.03, K=k8PantoKnee();
  const frame=new K8B(), base=new K8B(), shoe=new K8B();
  base.box(-.85,.85,-.55,.55,zr,zr+.10,[1,1,1]);                         // 台枠
  for(const sx of [-.7,.7]) for(const sy of [-.45,.45])
    base.cyl([sx,sy,zr-.05],[sx,sy,zr+.02],.06,10,[1,1,1]);              // 碍子
  const H=[K.hinge[0],0,K.hinge[1]], N=[K.knee[0],0,K.knee[1]], T=[K.head[0],0,K.head[1]];
  frame.cyl([-.10,0,zr+.14],H,.03,8,[1,1,1]);
  frame.cyl(H,N,.035,8,[1,1,1]);                                          // 下枠
  frame.cyl(N,T,.028,8,[1,1,1]);                                          // 上枠
  frame.cyl([H[0],-.2,H[2]],[H[0],.2,H[2]],.05,8,[1,1,1]);
  frame.cyl([-.2,0,zr+.12],[(N[0]+H[0])/2,0,(N[2]+H[2])/2+.05],.015,6,[1,1,1]);   // 釣り合い棒
  shoe.box(T[0]-.07,T[0]+.07,-.62,.62,T[2],T[2]+.04,[1,1,1]);             // 舟体(上面=トロリ線)
  for(const s of [-1,1]) shoe.cyl([T[0],s*.62,T[2]+.02],[T[0],s*.82,T[2]-.06],.018,6,[1,1,1]);   // ホーン
  return {frame:frame.geo(), base:base.geo(), shoe:shoe.geo(), knee:K};
}
// 避雷器(パンタの近く)
function k8PantoBitsGeo(){const B=new K8B(); B.box(-.12,.12,-.10,.10,K8.Z_CROWN-.03,3.80,K8C.under); return B.geo();}

/* ---- 9-10. 車内と乗客(interior_mesh / people_mesh を移植) --------------------
   窓が透けるので車内が要る。照明は自発光(昼も夜も点いている)。乗客は v4 と同じく
   種で決まる乱数で置く(Math.random を使わない=撮影の乱数の種と独立)。 */
function k8Rng(seed){let a=seed>>>0;return function(){a|=0;a=a+0x6D2B79F5|0;
  let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function k8InteriorGeos(cab){
  const B=new K8B(), Lt=new K8B();
  const hw=K8.HWB-.08, L=K8.LEN/2-(cab?1.05:.3), F=K8.Z_FLR;
  B.box(-L,L,-hw,hw,F-.1,F,K8C.floor);
  B.box(-L,L,-hw,hw,F+2.245,F+2.295,K8C.interior);
  const xs=[-L]; for(const dx of K8.DOORX){xs.push(dx-K8.DOORW/2);xs.push(dx+K8.DOORW/2);} xs.push(L);
  for(let i=0;i<xs.length;i+=2){
    const a=xs[i]+.15, b=xs[i+1]-.15;
    for(const s of [-1,1]){
      B.box(a,b,Math.min(s*(hw-.55),s*hw),Math.max(s*(hw-.55),s*hw),F,F+.43,K8C.seat);
      B.box(a,b,Math.min(s*(hw-.12),s*hw),Math.max(s*(hw-.12),s*hw),F+.43,F+.92,K8C.seat);
      B.cyl([a,s*(hw-.5),F+.43],[a,s*(hw-.5),F+2.245],.018,6,K8C.trim);
    }
  }
  for(const s of [-1,1]){
    Lt.box(-L,L,s*.7-.08,s*.7+.08,F+2.215,F+2.245,[1,1,1]);           // 天井の照明
    B.cyl([-L,s*.95,F+1.87],[L,s*.95,F+1.87],.015,6,K8C.trim);
    for(let x=-L+.3;x<L;x+=.45) B.box(x-.03,x+.03,s*.95-.01,s*.95+.01,F+1.57,F+1.87,K8C.strap);
  }
  for(const dx of [-L+.05,L-.05]) B.box(dx-.05,dx+.05,-hw,hw,F,F+2.245,K8C.interior);
  return {room:B.geo(), light:Lt.geo()};
}
function k8PeopleGeo(nSeat,nStand,rng,cab){
  const B=new K8B(), L=K8.LEN/2-.7-(cab?.8:0), F=K8.Z_FLR, hw=K8.HWB-.3;
  const clothes=[[.05,.05,.07],[.12,.13,.2],[.25,.25,.27],[.55,.52,.48],[.75,.74,.7],
                 [.35,.12,.1],[.1,.2,.35],[.6,.45,.3],[.9,.88,.85],[.2,.3,.2]];
  const pick=a=>a[Math.floor(rng()*a.length)];
  const person=(x,y,seated)=>{
    const h=seated?1.0:1.52+rng()*.26, bodyH=seated?.62:h*.58;
    const c=k8lin.apply(null,pick(clothes));
    const skin=k8lin.apply(null,pick([[.85,.68,.55],[.78,.6,.48],[.9,.75,.62]]));
    const hair=k8lin.apply(null,pick([[.03,.02,.02],[.1,.06,.04],[.25,.18,.12]]));
    if(!seated) B.box(x-.1,x+.1,y-.13,y+.13,F,F+h*.45,c);
    const zb=F+(seated?.43:h*.45);
    B.cyl([x,y,zb],[x,y,zb+bodyH*.75],.19,7,c);
    B.sphere([x,y,zb+bodyH*.75+.13],.105,skin);
    B.sphere([x,y,zb+bodyH*.75+.17],.095,hair);
  };
  for(let i=0;i<nSeat;i++){
    const x=-L+rng()*2*L, s=rng()<.5?-1:1;
    if(K8.DOORX.some(d=>Math.abs(x-d)<K8.DOORW/2+.2)) continue;
    person(x,s*(hw-.2),true);
  }
  for(let i=0;i<nStand;i++) person(-L+rng()*2*L,(rng()-.5),false);
  return B.geo();
}

/* 扉窓のガラス:戸と一緒に滑る。頂点に「どちらの戸か(±1)」を持たせ、車両ごとの
   開度 uOpen(車体の塗り分けと同じ uniform を共有)で頂点シェーダが動かす。
   戸袋へ滑り込んだぶんは外板の内側に隠れ、戸袋窓の奥にだけ見える(本物と同じ)。 */
function k8DoorGlassGeo(){
  const P=[],L=[], FW=K8.FW;
  for(const s of [-1,1]) for(const d of K8.DOORX) for(const l of [-1,1]){
    const xa=d+l*(.135+FW), xb=d+l*(.546-FW), x0=Math.min(xa,xb), x1=Math.max(xa,xb);
    const z0=K8.WZ0+FW, z1=K8.DWZ1-FW, y=s*(K8.HWB-.003);
    const q=[[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]];
    for(const k of [0,1,2,0,2,3]){const p=q[k]; P.push(p[0],p[2],-p[1]); L.push(l);}
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('k8leaf',new THREE.Float32BufferAttribute(L,1));
  return g;
}
function k8DoorGlassMat(U){
  const m=K8M.glass.clone();
  m.onBeforeCompile=function(sh){
    sh.uniforms.uOpen=U.uOpen;
    sh.vertexShader='attribute float k8leaf; uniform vec2 uOpen;\n'+sh.vertexShader.replace(
      '#include <begin_vertex>',
      '#include <begin_vertex>\n  { float sv=(-position.z>0.)?1.:-1.; float o=(sv>0.)?uOpen.x:uOpen.y;'+
      ' transformed.x+=k8leaf*o*'+K8.DOOR_HW.toFixed(4)+'; }');
  };
  m.customProgramCacheKey=()=>'k8dglass';
  return m;
}

/* ---- 9-11. 共有する幾何(1回だけ作る) --------------------------------------- */
const K8GEO=(function(){
  const rng=k8Rng(8000);
  const G={
    shell:k8ShellGeo(false), shellCab:k8ShellGeo(true),
    detail:k8DetailGeo(false), detailCab:k8DetailGeo(true),
    sideFit:k8SideFitGeo(), sideLed:k8SideLedGeo(),
    bogieM:k8BogieGeo(2.2), bogieT:k8BogieGeo(2.1), under:k8UnderGeo(),
    ac:k8AcGeo(), gang:k8GangGeo(), pantoBits:k8PantoBitsGeo(),
    plate:k8PlateGeo(0,K8_PLATE_U[1]-K8_PLATE_U[0],K8_PLATE_Z[1]-K8_PLATE_Z[0],(K8_PLATE_Z[0]+K8_PLATE_Z[1])/2,.004),
    logo:k8PlateGeo(0,K8_PLATE_U[1]-K8_PLATE_U[0],.085,(K8_PLATE_Z[0]+K8_PLATE_Z[1])/2,.005),
    cabLogo:k8PlateGeo(8.085,.55,.137,2.8155,.005),
  };
  G.front=k8FrontGeos();
  G.panto=k8PantoGeos();
  const ia=k8InteriorGeos(false), ic=k8InteriorGeos(true);
  G.room=ia.room; G.roomCab=ic.room; G.light=ia.light; G.lightCab=ic.light;
  G.people=[0,1,2].map(()=>k8PeopleGeo(16,4,rng,false));
  G.peopleCab=[0,1,2].map(()=>k8PeopleGeo(14,3,rng,true));
  // ガラス(透ける窓の内側に張る薄い板)。扉窓は戸と一緒に動くので張らない
  for(const cab of [false,true]){
    const B=new K8B();
    for(const w of K8_WIN[cab?'cab':'mid']){
      if(w[6]===2) continue;
      for(const s of [-1,1]){
        const y=s*(K8.HWB-.003);
        const p=[[w[0],y,w[2]],[w[1],y,w[2]],[w[1],y,w[3]],[w[0],y,w[3]]];
        B.poly(s>0?p.slice().reverse():p,[1,1,1]);
      }
    }
    G[cab?'glassCab':'glass']=B.geo();
  }
  G.doorGlass=k8DoorGlassGeo();
  return G;
})();

/* ---- 9-12. 1両を組み立てる ------------------------------------------------------
   opt: cabF/cabR=運転台が+x側/−x側 / panto=パンタあり / motor=電動車(軸距2.2)
        hachi=京王八王子方の向き(車体ローカルx の符号) / num=車番
        lights='head'|'tail'|'off'(運転台の灯火) / sign={kind,dest}|null(表示器)
   v4 との対応:先頭車・最後尾のシェルは運転台が外を向く(最後尾は180°回す)。
   車番は中間車が新宿方の端、先頭車は運転台側の端。反対の端に KEIO ロゴ。 */
function makeCar(opt){
  const o=Object.assign({cabF:false,cabR:false,panto:false,motor:false,hachi:1,num:'8000',
                         lights:'off',sign:null,crowd:0},opt||{});
  const cab=o.cabF||o.cabR, tail=o.cabR;          // シェルの向き(運転台が−x側なら180°回す)
  const g=new THREE.Group();
  const fine=[];
  const add=(geo,mat,parent)=>{const m=new THREE.Mesh(geo,mat);(parent||g).add(m);return m;};
  const addFine=(geo,mat,parent)=>{const m=add(geo,mat,parent);fine.push(m);return m;};
  // シェル(v4 と同じく最後尾は Z 回り180°。Three.js では上(y)回り)
  const sh=new THREE.Group(); if(tail) sh.rotation.y=Math.PI; g.add(sh);
  const bodyMat=k8BodyMat(cab);
  const body=add(cab?K8GEO.shellCab:K8GEO.shell,bodyMat,sh);
  addFine(cab?K8GEO.detailCab:K8GEO.detail,TRIMMAT,sh);
  addFine(K8GEO.sideFit,K8M.vc,sh);
  addFine(cab?K8GEO.glassCab:K8GEO.glass,K8M.glass,sh);
  addFine(K8GEO.doorGlass,k8DoorGlassMat(bodyMat.userData.k8.uni),sh);
  addFine(cab?K8GEO.roomCab:K8GEO.room,K8M.room,sh);
  addFine(cab?K8GEO.lightCab:K8GEO.light,K8M.cabinLight,sh);
  if(o.crowd!==null){
    const pp=cab?K8GEO.peopleCab:K8GEO.people;
    addFine(pp[(o.crowd|0)%pp.length],K8M.room,sh);
  }
  // 側面の表示器(どの車にもある。表示は点いている編成だけ)
  addFine(K8GEO.sideLed, o.sign?k8SideLed(o.sign.kind,o.sign.dest):K8M.ledOff, sh);
  // 幕板の車番とロゴ。e_local=シェルの+xが新宿方なら+1
  {
    const eLocal=tail?o.hachi:-o.hachi;
    const xn=cab?6.0105:eLocal*6.0105;
    const pl=addFine(K8GEO.plate,k8NumPlate(o.num),sh); pl.position.x=xn;
    const lg=addFine(K8GEO.logo,k8Logo(256,72),sh); lg.position.x=-xn;
  }
  if(cab){
    addFine(K8GEO.cabLogo,k8Logo(384,96),sh);
    const F=K8GEO.front;
    addFine(F.case,K8M.vc,sh); add(F.vc,K8M.vc,sh);
    addFine(F.hl,o.lights==='head'?M_HL:M_HL_OFF,sh);
    addFine(F.tl,o.lights==='tail'?M_TL:M_TL_OFF,sh);
    if(o.lights==='head') addFine(F.hlGlow,K8M.hlGlow,sh);
    if(o.lights==='tail') addFine(F.tlGlow,K8M.tlGlow,sh);
    const lit=o.sign&&o.lights==='head';                       // 表示は先頭車だけ点く
    addFine(F.dest,lit?k8Led(o.sign.dest,'#ff8c14',256,68):K8M.ledOff,sh);
    addFine(F.kind,lit?k8Led(o.sign.kind,K8_KIND_COLORS[o.sign.kind]||'#ff2e14',192,68):K8M.ledOff,sh);
    addFine(F.num,k8FrontNum(o.num),sh);
    addFine(F.logo,k8Logo(256,40),sh);
  }
  // 台車・床下・冷房・幌
  add(o.motor?K8GEO.bogieM:K8GEO.bogieT,M_BOG);
  add(K8GEO.under,K8M.vc);
  add(K8GEO.ac,K8M.vc);
  if(!o.cabR) addFine(K8GEO.gang,K8M.vc).position.x=-(K8.LEN/2+.25);
  // パンタグラフ:京王八王子方の台車の上(台座の中心が車両中心から 6.88m)、ひじも八王子方
  if(o.panto){
    const pg=new THREE.Group(); pg.position.x=o.hachi*K8.BOGIE_X; if(o.hachi<0) pg.rotation.y=Math.PI;
    g.add(pg);
    add(K8GEO.panto.base,M_PANS,pg); add(K8GEO.panto.frame,M_PN,pg); add(K8GEO.panto.shoe,M_SH,pg);
    add(K8GEO.pantoBits,K8M.vc).position.x=o.hachi*5.1;
    g.userData.panto=pg;
  }
  g.userData.body=body; g.userData.bodyMat=bodyMat; g.userData.tail=tail;
  g.userData.fine=fine; g.userData.hi=true; g.userData.k8=o;
  g.userData.doors={r:0,side:1};
  scene.add(g); return g;
}
/* 客用扉の開度 r(0=閉/1=開)を反映する。side は開ける面(車体ローカルz の符号)。
   車体ローカル+z = v4 の −y。シェルを180°回した車(最後尾)では左右も入れ替わる。 */
const DOOR_HW=K8.DOOR_HW;         // 片側の戸の幅(=開口の半幅)
const DOOR_SLIDE=K8.DOOR_HW;      // 全開のときの移動量(戸1枚ぶん)
function setCarDoors(c,r,side){
  const ud=c.userData; if(!ud||!ud.bodyMat) return;
  const v4side=(ud.tail?1:-1)*side;                  // 開く面のシェル座標での ±y
  const U=ud.bodyMat.userData.k8.uni.uOpen.value;
  U.set(v4side>0?r:0, v4side<0?r:0);
  ud.doors.r=r; ud.doors.side=side;
}
// 編成の組み立てに使う:新宿方から n 両目(1始まり)の諸元
function k8CarSpec(form,n){
  const F=K8_FORMATIONS[form];
  return {num:F.cars[n-1], panto:F.panto.indexOf(n)>=0, motor:F.motor.indexOf(n)>=0};
}

/* ---- 走行列車(3本)。各駅停車のダイヤを自動運転で再現する ----
   加速=P4(3.3km/h/s), 上限=60km/h, 減速=B5(3.0km/h/s), 停車時間=25秒。
   状態機械: 'run'(駅間走行) → 'brake'(停止位置へ減速) → 'dwell'(25秒停車) → 'run' */
const DRIVE={ACC:3.3, DEC:3.0, VMAX_KMH:60, DWELL:25};   // 自動運転パラメータ
// 駅別の停車時間[秒](未記載の駅は DRIVE.DWELL)。待避線に入る駅は1分。
const DWELL_OF={'八幡山':60,'明大前':60,'桜上水':60,'千歳烏山':60};
const trains=[];
const K8_TRAIN_FORMS=['8714F','8713F'];
[[1, 300],[1, 3000],[-1, 5600]].forEach(function(a){
  const dir=a[0], xs=a[1], cars=[];
  /* 編成は v4 の 8714F/8713F。車番・パンタ・電動車は「新宿方から何両目」で決まる。
     下り(dir>0・西へ)は先頭 j=0 が京王八王子方=新宿方から10両目。上りは逆。
     車体ローカル+x は進行方向なので、京王八王子方(西)の向き hachi は dir と同じ符号。 */
  const form=K8_TRAIN_FORMS[trains.length%K8_TRAIN_FORMS.length];
  for(let j=0;j<10;j++){
    const n=dir>0?10-j:j+1, sp=k8CarSpec(form,n);
    cars.push(makeCar({cabF:j===0, cabR:j===9, panto:sp.panto, motor:sp.motor, num:sp.num,
      hachi:dir>0?1:-1, lights:j===0?'head':(j===9?'tail':'off'),
      sign:{kind:'各停', dest:dir>0?'京王八王子':'新宿'}, crowd:j%3}));
  }
  const reset=(dir>0)?(DOM.x0-210):(DOM.x1+210);
  // st=状態, v=速度[m/s], dwell=停車残り時間, target=次の停止位置s
  trains.push({dir:dir, x:xs, x0:reset, v:0, st:'run', dwell:0, target:null, atSt:null, cars:cars});
});
// 進行方向の次の停止位置を返す。停車時間の決定に使うので駅も一緒に持つ。
// stopPosOf は「先頭(運転台)を着ける位置」を返すが、列車の t.x は先頭車の"中心"なので
// 車体半長ぶん手前を目標にする。ここを取り違えると編成が車体半長だけホームからはみ出す。
function nextStopFor(t){
  let best=null;
  for(const s of STA){
    const sp=stopPosOf(s,t.dir)-t.dir*CAR_HALF;
    if(t.dir>0 && sp>t.x+1 && (best===null||sp<best.s)) best={s:sp,st:s};
    if(t.dir<0 && sp<t.x-1 && (best===null||sp>best.s)) best={s:sp,st:s};
  }
  return best;
}
function dwellOf(st){ return (st&&DWELL_OF[st.n])||DRIVE.DWELL; }
// 1列車の自動運転を1フレーム進める
function driveTrain(t,dt){
  const VMAX=DRIVE.VMAX_KMH/3.6;
  if(t.st==='dwell'){                       // 停車中:残り時間を減らす
    t.dwell-=dt;
    if(t.dwell<=0){ t.st='run'; t.target=nextStopFor(t); }
    return;
  }
  if(t.target===null) t.target=nextStopFor(t);
  if(t.target===null){                      // 前方に駅なし=端へ。折返して入り直す
    t.x+=t.dir*t.v*dt; t.v=Math.min(VMAX,t.v+DRIVE.ACC/3.6*dt);
    if((t.dir>0&&t.x>DOM.x1-CAR_HALF)||(t.dir<0&&t.x<DOM.x0+CAR_HALF)){ t.x=t.x0; t.v=0; t.st='run'; t.target=null; }
    return;
  }
  const dist=(t.target.s-t.x)*t.dir;       // 停止位置までの残距離[m](進行方向正)
  const brakeDist=(t.v*t.v)/(2*DRIVE.DEC/3.6);   // 現速度から止まるのに要る距離
  if(dist<=brakeDist+0.2){                   // 減速フェーズ
    t.st='brake';
    t.v=Math.max(0, t.v-DRIVE.DEC/3.6*dt);
    if(t.v<0.15 && dist<1.0){ t.x=t.target.s; t.v=0; t.st='dwell';
      t.dwell=dwellOf(t.target.st); t.atSt=t.target.st; }   // 停車時間は駅別(八幡山60秒)
    else t.x+=t.dir*t.v*dt;
  }else{                                     // 力行/惰行フェーズ(60km/h上限)
    t.st='run';
    t.v=Math.min(VMAX, t.v+DRIVE.ACC/3.6*dt);
    t.x+=t.dir*t.v*dt;
  }
}

// 車両は「前後の車端2点を結ぶ弦」に沿って配置する(曲線でも必ず線路方向を向く)
const CAR_HALF=K8.LEN/2;
// 車端2点の実位置から姿勢(ヨー+ピッチ)を決める。勾配区間でも車体が線路に沿う
let LOD_NEAR=420;   // この距離までは高精細モデル(スマホでは短縮)
const _UP=new THREE.Vector3(0,1,0), _F=new THREE.Vector3(), _R=new THREE.Vector3(),
      _U=new THREE.Vector3(), _M4=new THREE.Matrix4();
function seatCar(c,s,zf,dir){
  const sA=s-CAR_HALF, sB=s+CAR_HALF;
  const pA=frame(sA,zf(sA)), pB=frame(sB,zf(sB));
  const yA=railY(sA)+RAIL_TOP, yB=railY(sB)+RAIL_TOP;    // 車体の原点=レール頭頂面(v4 の z=0)
  _F.set(pB.x-pA.x, yB-yA, pB.z-pA.z);
  if(dir<0)_F.multiplyScalar(-1);                      // 上り列車は先頭部を進行方向へ
  _F.normalize();
  _R.crossVectors(_F,_UP).normalize();                 // 右手系: X=前, Y=上, Z=右
  _U.crossVectors(_R,_F).normalize();
  _M4.makeBasis(_F,_U,_R);
  c.quaternion.setFromRotationMatrix(_M4);
  c.position.set((pA.x+pB.x)/2, (yA+yB)/2, (pA.z+pB.z)/2);
  lodCar(c);
}
// LODの切替。走行中の列車だけでなく、留置中の車両も毎フレーム見直す
// (初期化時に一度だけ判定していたため、留置線の編成が遠景モデルのまま固定されていた)。
function lodCar(c){
  const ud=c.userData;
  if(!ud||!ud.body) return;
  const d=camera.position.distanceTo(c.position), hi=d<LOD_NEAR;
  if(hi!==ud.hi){
    ud.hi=hi;
    // 遠景では車内・乗客・ガラス・表示器・細部を省く(塗り分けはシェーダなので遠景でも崩れない)
    if(ud.fine) for(const m of ud.fine) m.visible=hi;
  }
}
// 編成の各車両を配置する。範囲外の車両は非表示にし、姿勢計算もスキップして軽量化。
function placeTrain(t){
  const zf=t.dir>0?zRunDown:zRunUp;   // 停車列車は八幡山で内側(停車線)へ
  for(let j=0;j<t.cars.length;j++){
    const s=t.x-t.dir*j*K8.PITCH, c=t.cars[j];
    const inside=(s>DOM.x0+CAR_HALF && s<DOM.x1-CAR_HALF);
    c.visible = inside && trainsOn;
    if(inside) seatCar(c, s, zf, t.dir);      // 見えている車両だけ弦法で姿勢決定
  }
}
/* ---- 交差鉄道の車両(井の頭線・世田谷線) --------------------------------
   京王線の8000系とは別形式なので、専用の簡易モデルにする。
   以前は8000系のジオメトリを色替えして使い回していたため、井の頭線にも
   世田谷線にも京王8000系の前面が付いていた。
   箱形の車体+段付きの丸屋根+窓帯+スカート+台車。線区ごとに寸法と色を変える。
   遠景の脇役なので部品点数は最小限にする(LODも持たない)。 */
const XCAR={
  // L=車体長 / W=車体幅 / H=屋根高 / FLOOR=床面 / GAUGE=軌間 / band=帯 / body=車体
  ino :{L:19.5, W:2.80, H:3.55, FLOOR:1.05, GAUGE:GAUGE_INO,  band:0x1a9ed6, body:0xd8dbdf, panto:true},
  seta:{L:13.6, W:2.50, H:3.40, FLOOR:0.95, GAUGE:GAUGE_SETA, band:0x6aa84f, body:0xe8e6df, panto:true},
};
const XMAT={};
for(const k in XCAR) XMAT[k]={body:M(XCAR[k].body), band:M(XCAR[k].band)};
const XM_WIN=M(0x25333c), XM_ROOF=M(0xb4b9be), XM_UND=M(0x3a3f45),
      XM_TRK=M(0x33383d), XM_WHL=M(0x4a4f55), XM_PAN=M(0x8d949b);
function makeXCar(kind){
  const S=XCAR[kind], MT=XMAT[kind], g=new THREE.Group(), B=new Map();
  /* 部品は材質ごとに1つのジオメトリへ積む(1両26個の Mesh を7個に。7両で約130回の描画が減る)。
     箱=長さ L(x)・高さ H・幅 W(z)、中心 x,y,z、z軸まわりの傾き rz */
  const buf=mat=>{let q=B.get(mat); if(!q){q={P:[],N:[],I:[]};B.set(mat,q);} return q;};
  const put=(L,H,W,mat,x,y,z,rz)=>{
    const q=buf(mat), c=Math.cos(rz||0), s=Math.sin(rz||0);
    for(const [n,f] of boxFaces(-L/2,L/2,-H/2,H/2,-W/2,W/2,['top','bot','px','nx','pz','nz'])){
      const o=q.P.length/3;
      for(let j=0;j<4;j++){const p=f[j]; q.P.push(x+p[0]*c-p[1]*s, y+p[0]*s+p[1]*c, z+p[2]); q.N.push(f[4][0]*c-f[4][1]*s, f[4][0]*s+f[4][1]*c, f[4][2]);}
      q.I.push(o,o+1,o+2,o,o+2,o+3);
    }
  };
  const wheel=(x,y,z,r,t)=>{                                // 車輪(軸は z)。12角の円柱と両面の蓋
    const q=buf(XM_WHL), n=12, o=q.P.length/3;
    for(let k=0;k<n;k++){const a=k/n*Math.PI*2, cx=Math.cos(a), cy=Math.sin(a);
      for(const sz of[-1,1]){q.P.push(x+r*cx,y+r*cy,z+sz*t/2); q.N.push(cx,cy,0);}}
    for(let k=0;k<n;k++){const a=o+k*2, b=o+((k+1)%n)*2; q.I.push(a,b,b+1,a,b+1,a+1);}
    for(const sz of[-1,1]){const c0=q.P.length/3;
      for(let k=0;k<n;k++){const a=k/n*Math.PI*2; q.P.push(x+r*Math.cos(a),y+r*Math.sin(a),z+sz*t/2); q.N.push(0,0,sz);}
      for(let k=1;k<n-1;k++) sz>0?q.I.push(c0,c0+k,c0+k+1):q.I.push(c0,c0+k+1,c0+k);}
  };
  const bodyH=S.H-0.30-S.FLOOR;                       // 腰板から肩まで
  const cy=S.FLOOR+bodyH/2;
  put(S.L,bodyH,S.W,MT.body,0,cy,0);
  // 段付きの丸屋根(2段の箱で近似。遠景では丸みの差は分からない)
  put(S.L,0.14,S.W,XM_ROOF,0,S.FLOOR+bodyH+0.07,0);
  put(S.L-0.12,0.16,S.W-0.36,XM_ROOF,0,S.FLOOR+bodyH+0.22,0);
  // 窓帯(側面)と線区の帯
  put(S.L-1.7,0.92,S.W+0.02,XM_WIN,0,S.FLOOR+bodyH*0.62,0);
  put(S.L,0.20,S.W+0.04,MT.band,0,S.FLOOR+bodyH*0.24,0);
  // 前後の妻面:線区の帯を回した平妻+前面窓
  for(const sg of [-1,1]){
    put(0.10,bodyH,S.W-0.06,MT.band,sg*(S.L/2+0.05),cy,0);
    put(0.06,0.86,S.W-0.62,XM_WIN,sg*(S.L/2+0.11),S.FLOOR+bodyH*0.66,0);
  }
  // 床下機器とスカート
  put(S.L*0.52,0.56,S.W-0.66,XM_UND,0,S.FLOOR-0.36,0);
  for(const sg of [-1,1]) put(0.14,0.52,S.W-0.30,XM_UND,sg*(S.L/2-0.25),0.52,0);
  // 台車(軌間は線区ごと)
  const wOff=(S.GAUGE+RAIL_W)/2;
  for(const bx of [-S.L*0.33,S.L*0.33]){
    put(2.60,0.46,S.W-0.60,XM_TRK,bx,0.62,0);
    for(const ax of [bx-1.05,bx+1.05]) for(const sz of [-wOff,wOff]) wheel(ax,0.43,sz,0.43,0.10);
  }
  if(S.panto){   // 簡易のシングルアーム(台枠・下枠・上枠・舟体)
    const py=S.H, px=-S.L*0.28;
    put(1.90,0.06,1.30,XM_PAN,px,py+0.05,0);
    put(1.10,0.07,0.09,XM_PAN,px-0.30,py+0.35,0,0.62);
    put(0.95,0.06,0.07,XM_PAN,px+0.12,py+0.72,0,-0.55);
    put(0.16,0.05,1.80,XM_PAN,px+0.52,py+0.94,0);
  }
  for(const [mat,q] of B) g.add(new THREE.Mesh(facesGeo(q.P,q.N,q.I),mat));
  g.userData.xcar=kind;
  scene.add(g); return g;
}
/* 交差鉄道の列車。折り返し範囲は「編成の最後尾まで線路の上に載る」ように決める
   (編成長ぶんを引かずに ±440 まで走らせると、後ろの車両が線路の外へ出て宙に浮く)。 */
const INO_CARS=5, INO_PITCH=20, INO_TRK=-3;      // 5両・車両間隔・走る線(掘割の南側)
const INO_LIM=Math.min(-XR.U0,XR.U1)-(INO_CARS-1)*INO_PITCH-XCAR.ino.L/2;
const inoCars=[];for(let j=0;j<INO_CARS;j++)inoCars.push(makeXCar('ino'));
let inoZ=-INO_LIM,inoDir=1;
const SETA_CARS=2, SETA_PITCH=14;
const setaCars=[];for(let j=0;j<SETA_CARS;j++)setaCars.push(makeXCar('seta'));
const SETA_LO=XR.SETA_U0+(SETA_CARS-1)*SETA_PITCH+XCAR.seta.L/2,
      SETA_HI=XR.SETA_U1-XCAR.seta.L/2-46;
let setaZ=SETA_LO,setaDir=1;
/* 交差鉄道の列車を進めて配置する。
   車体の原点はレール面なので、y は道床のレール頭頂面 XR.RAILTOP に置く
   (以前は .86 固定で、レール頭頂面 .89 より3cm沈み、車輪とレールの面が
   同じ高さで重なってちらついていた)。 */
function stepXRail(dt){
  inoZ+=inoDir*13*dt;
  if(inoZ>INO_LIM){inoZ=INO_LIM;inoDir=-1;}else if(inoZ<-INO_LIM){inoZ=-INO_LIM;inoDir=1;}
  for(let j=0;j<inoCars.length;j++){
    const u=inoZ-inoDir*j*INO_PITCH, c=inoCars[j];   // 井の頭線の実測軸に沿って走行

/* ---- ホームドア(可動式ホーム柵) ------------------------------------------
   開口は「列車の停止位置」と「車両の扉配置 K8.DOORX」から算出する。
   1両4箇所×10両=40箇所。停止位置や扉配置を変えれば開口も自動で追従するので、
   ホームドアと車両の扉がずれることが起こらない。
   停車中(発車の3秒前まで)だけ開く。                                          */
const PSD=[];

/* 開口と開口の間の固定部(戸袋)。扉はこの中へ引き込まれる。
   駅ごとの結合ジオメトリ(STG)へ積む:1個ずつ Mesh にすると1列あたり約250回の描画になり、
   ホームドアだけで運転モードの描画の7割を占めていた(2026-10 実測 5,400回/画)。
   ・戸袋(白)と笠木(濃灰)は常に描く。京王の藍の帯と開口脇の支柱は近くだけ(LOD) */
const PSD_H=1.22, PSD_T=0.24;             // 高さ(ホーム面から)・戸袋の厚さ[m]
function psdFixed(S,a,b,off,y){
  const m=(a+b)/2, L=b-a, yp=y+1.1;
  S.mg.col(0xe9ebee).box(MAT.stVC,m,off,yp,yp+PSD_H-0.10,L,PSD_T,{skip:'-y',tag:'ホームドア'});
  S.mg.col(0x59626d).box(MAT.stVC,m,off,yp+PSD_H-0.10,yp+PSD_H,L+0.02,PSD_T+0.06,{skip:'-y'});
  S.md.col(0x1b2a66).box(MAT.stVC,m,off,yp+PSD_H-0.36,yp+PSD_H-0.28,Math.max(0.05,L-0.02),PSD_T+0.012,{skip:'-y+y'});
  for(const e of[a+0.05,b-0.05])
    S.md.col(0xc4c9cf).box(MAT.stVC,e,off,yp,yp+PSD_H+0.04,0.10,PSD_T+0.08,{skip:'-y'});
}
for(const d of PSD_DEF){

    // (笹塚では内側が留置線、明大前などでは外側が副本線で、そちらは開かない)
    let dir=0, openable=true;
    if(Math.abs(off+ro)<2.5) dir=1;        // 南側=下り
    else if(Math.abs(off-ro)<2.5) dir=-1;  // 北側=上り
    if(!dir){
      // 停車列車が来ない側(笹塚の留置線側・待避線を使わない側)にもホームドアは
      // 設置する。開口の位置は本線の停止位置に合わせ、開閉はしない。
      dir=off<0?1:-1; openable=false;
    }
    const stop=stopPosOf(st,dir)-dir*CAR_HALF;          // 先頭車の中心
    const open=[];
    for(let j=0;j<10;j++){                              // 10両
      const cs=stop-dir*j*K8.PITCH;
      for(const dx of K8.DOORX) open.push(cs+dir*dx);   // 1両4箇所
    }
    open.sort((a,b)=>a-b);
    // その扉列から見て、列車のどちらの"面"(車体ローカルzの符号)がホーム側か。
    // ローカル+zが±offのどちらを向くかは線形の向き(この路線はsが西へ増える)と
    // 進行方向で決まる。符号を推論で決めると間違えるので、実際の姿勢から求める。
    const trackOff=dir>0?-ro:ro;
    const side=(off>trackOff?1:-1)*localZSign(st.x,dir);
    CUR=st.kk?KOUKU[st.kk-1].VGs:null;
    // 開口と開口の間の固定部(戸袋)。駅の結合ジオメトリへ積む
    const SG=STG[STA.indexOf(st)];
    let prev=d.x0;
    for(const c of open){
      if(c-PSD_OPEN-prev>0.05) psdFixed(SG,prev,c-PSD_OPEN,off,d.y);
      prev=c+PSD_OPEN;
    }
    if(d.x1-prev>0.05) psdFixed(SG,prev,d.x1,off,d.y);

    const lg=G_PSD_LEAF.clone(), lp=frame((d.x0+d.x1)/2,off);
    lg.boundingSphere=new THREE.Sphere(new THREE.Vector3(lp.x,d.y+1.7,lp.z),(d.x1-d.x0)/2+3);
    const inst=new THREE.InstancedMesh(lg,MAT_PSDL,open.length*2);

const _psdM=new THREE.Matrix4(),_psdQ=new THREE.Quaternion(),_psdE=new THREE.Euler(),
      _psdV=new THREE.Vector3(),_psdS=new THREE.Vector3(PSD_OPEN,1,1);
function setPSD(p,r){
  let i=0;
  for(const c of p.open){
    for(const sg of[-1,1]){
      const s=c+sg*(PSD_OPEN/2+PSD_OPEN*r);            // 閉=開口の内側/開=戸袋へ退避
      const q=frame(s,p.off);
      _psdE.set(0,-q.a,0);_psdQ.setFromEuler(_psdE);
      _psdV.set(q.x,p.y,q.z);
      _psdM.compose(_psdV,_psdQ,_psdS);

function stepCarDoors(t,dt){
  const p=(t.st==='dwell'&&t.atSt)
    ?PSD.find(q=>q.st===t.atSt&&q.dir===t.dir&&q.openable):null;
  const want=(p&&t.dwell>3)?1:0, side=p?p.side:1;
  if(t.dr===undefined){t.dr=0;t.dside=1;}
  if(t.dr===want&&t.dside===side) return;
  let nr=t.dr+(want-t.dr)*Math.min(1,dt*3.0);    // 約1秒で開閉
  if(Math.abs(want-nr)<0.005) nr=want;           // 端で止め切る(半開きのまま残らないように)
  t.dr=nr; t.dside=side;
  for(const c of t.cars) setCarDoors(c,nr,side);

// 毎フレームの開閉。停車中(発車3秒前まで)だけ開く。
function stepPSD(dt){
  for(const p of PSD){

    if(rideOn&&doorOpenT>0&&doorPSD===p) want=1;
    else if(p.openable) for(const t of trains){
      if(t.dir===p.dir&&t.st==='dwell'&&t.atSt===p.st&&t.dwell>3){want=1;break;}
    }
    if(p.r===want) continue;                           // 開き切り/閉じ切りなら何もしない
    let nr=p.r+(want-p.r)*Math.min(1,dt*3.5);          // 約0.9秒で開閉
    if(Math.abs(want-nr)<0.005) nr=want;               // 端で止め切る(半開きのまま残らないように)
    setPSD(p,nr);
  }
}

const NOTCHES=[

  {n:'力行 P1', s:'P1', a: 0.8, k:'p'},{n:'力行 P2', s:'P2', a: 1.6, k:'p'},

const NIDX_N=8, NIDX_EB=0, NIDX_B7=1, VMAX=130;
let notch=NIDX_N, rideV=0;
/* 保安装置(ATC相当)。前を走る列車との距離から許容速度を決め、超えていれば
   マスコンの操作にかかわらず B7 で自動的に減速する。
     距離 ATC.FAR(600m) …… ATC.VFAR(120km/h)まで
     距離 ATC.NEAR(20m) …… 0km/h
   その間は制動距離の式 v=√(2ad) と同じ形(√)でなめらかにつなぐ。
   前の列車が待避線へ入った/600mより先/エリア外/列車走行OFF なら解除。 */
const ATC={FAR:600, NEAR:20, VFAR:120, OFFTOL:1.5};

   ・現示ダウン(制限が厳しくなる)…… 即座に効かせる
   ・現示アップ(制限が緩む・待避などで解除)…… ATC_UP_LAG 秒待ってから効かせる
   遅らせるのは表示だけでなく実際の速度制限も同じ(実機の現示アップと同じ扱い)。
   表示はさらに ATC_DISP_STEP 刻みに丸める。 */
const ATC_DISP_STEP=5, ATC_UP_LAG=20;
let atcRaw=null, atcUpT=0;
/* 客用扉の扱い:駅の停止位置の前後1m以内かつ速度が完全に0km/hで停止したら
   DOOR_OPEN_SEC 秒だけ扉を開ける。開いている間はマスコンの力行操作を受け付けない。

   戸閉灯は実物と同じく「**扉が閉まっていれば点灯**・開いていれば消灯」。
   つまり doorOpenT>0 のあいだ消灯する(名前が示すのは"開いている時間"であって
   "点いている時間"ではない。ここを取り違えると表示が逆になる)。 */
const DOOR_OPEN_SEC=25, DOOR_STOP_TOL=1.0, DOOR_REARM=60;
let doorOpenT=0, doorSt=null, doorPSD=null, doorArmed=null;
const doorLampOn=()=>doorOpenT<=0;      // 戸閉灯の点灯状態(扉が閉まっている=点灯)
function rideStopAt(s){                      // 停止位置の前後1m以内にある駅
  for(const st of STA) if(Math.abs(stopPosOf(st,1)-s)<=DOOR_STOP_TOL) return st;
  return null;
}
/* 自列車が停車したときに開くホームドアの列。
   運転モードは本線(八幡山では外側の通過線)を走るので、待避線側ではなく
   本線側の扉列を選ぶ。本線にホームが無ければ null(扉は開かない)。 */
function ridePSDFor(st){
  const trackOff=-mainOff(st.x);             // 運転モードは zDown=-mainOff の上を走る
  let best=null,bd=2.5;
  for(const q of PSD){
    if(q.st!==st) continue;
    const d=Math.abs(q.off-trackOff);
    if(d<bd){bd=d;best=q;}
  }
  return best;
}
function atcLimit(s){
  if(!trainsOn) return null;
  let lim=null;
  for(const t of trains){
    if(t.dir!==1) continue;                                  // 運転モードは下り線を走る
    if(t.x<DOM.x0||t.x>DOM.x1) continue;                     // エリア外(表示されていない)
    if(Math.abs(runOff(t.x)-mainOff(t.x))>ATC.OFFTOL) continue;   // 待避線に入っている
    const rear=t.x-(t.cars.length-1)*K8.PITCH-K8.LEN/2;      // 前の列車の最後尾
    const d=rear-s;
    if(d<=0||d>ATC.FAR) continue;                            // 後方/600mより先は対象外
    const v=(d<=ATC.NEAR)?0:ATC.VFAR*Math.sqrt((d-ATC.NEAR)/(ATC.FAR-ATC.NEAR));
    if(lim===null||v<lim) lim=v;

}
// 運転モードの状態を出し入れする(検証から走らせるための入り口)
function setRideState(o){

  if(o.acc!==undefined)accEff=o.acc;

  if(o.on!==undefined)rideOn=o.on;

function stepRide(dt){

  if(rv<ev-1e-9){ atcLim=atcRaw; atcUpT=0; }    // 現示ダウンは即時
  else if(rv>ev+1e-9){                          // 現示アップは10秒待つ

  }else atcUpT=0;
  atcOn=(atcLim!==null&&rideV>atcLim);

  if(doorOpenT>0){
    doorOpenT=Math.max(0,doorOpenT-dt);
    if(doorOpenT===0){doorSt=null;doorPSD=null;}
  }else{
    // 点灯条件:停止位置の前後1m以内、かつ速度が完全に0km/hであること
    const st=rideStopAt(rideS);
    if(st&&rideV===0&&doorArmed!==st){
      doorSt=st;doorPSD=ridePSDFor(st);doorOpenT=DOOR_OPEN_SEC;doorArmed=st;
    }
    if(doorArmed&&Math.abs(stopPosOf(doorArmed,1)-rideS)>DOOR_REARM) doorArmed=null;
  }
  // 加減速の応答は一次遅れ(時定数 NOTCH_LAG 秒)。さらに速度による特性を加味する:
  //   力行 : 60km/h までは設定どおり、以降は鈍化し 120km/h で半分
  //   制動 : 120km/h では75%、速度が落ちるほど強まり 60km/h 以下で設定どおり
  // 扉が開いている間(=戸閉灯が消えている間)は力行できない
  const nUse=atcOn?NIDX_B7:(doorOpenT>0?Math.min(notch,NIDX_N):notch);
  const aSet=NOTCHES[nUse].a;

  // 鈍化を受けると高速域でパターンに追従できず、頭打ちのまま接近してしまう。
  const aCmd=atcOn?aSet:aSet*accCurve(rideV,aSet);

let cmdNotch=NIDX_N, accEff=0; const NOTCH_LAG=1.0;   // accEff=実際に効いている加速度[km/h/s]

canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(rideOn){   // 運転モード:ドラッグで首振り(左右±120°/上下±45°)。2本指は無視
    if(pts.size>=2)return;
    rideYaw   = clamp(rideYaw   - dx*.004, -2.1, 2.1);
    ridePitch = clamp(ridePitch - dy*.003, -0.8, 0.8);
    return;
  }
  if(pts.size===2){
    const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0){if(chaseOn)CH.r=clamp(CH.r*pinchD/d,60,650);else cam.r=clamp(cam.r*pinchD/d,90,9800);}
    pinchD=d;return;
  }
  if(chaseOn){CH.th+=dx*.005;CH.ph=clamp(CH.ph-dy*.004,.18,1.45);return;}   // 追尾中は角度のみ操作
  setAuto(false);
  if(e.shiftKey||e.ctrlKey||(e.buttons&2)){cam.th+=dx*.005;cam.ph=clamp(cam.ph-dy*.004,.14,1.5);}   // 回転=修飾キー+ドラッグ
  else{pan(dx,dy);}   // 移動=ドラッグのみ
});

  if(chaseOn){CH.r=clamp(CH.r*Math.pow(1.0016,e.deltaY),60,650);return;}   // 追尾中は距離を操作

  const k=cam.r*.0014;

  cam.tx-=(rx*dx-fx*dy)*k;cam.tz-=(rz*dx-fz*dy)*k;   // dyの符号を反転(上下の追従を修正)
  cam.tx=clamp(cam.tx,-8500,800);cam.tz=clamp(cam.tz,-900,2100);
}

/* 影の「落とす/受ける」は最後に一括で設定する。生成箇所ごとに付けると
   必ず付け忘れが出て、その物だけ影が無いという分かりにくい不整合になる。
   ・地表は受けるだけ(巨大な板なので落とす側に入れても無駄)
   ・線(架線)とラベル(Sprite)は対象外 */
const SHADOW_STAT={cast:0,recv:0};
function applyShadows(){
  SHADOW_STAT.cast=0;SHADOW_STAT.recv=0;
  scene.traverse(function(o){
    if(!(o.isMesh||o.isInstancedMesh))return;
    o.receiveShadow=true;SHADOW_STAT.recv++;
    // 空ドームは裏面の巨大な球。影の対象に入れると世界中が影になる
    if(o===skyDome){o.castShadow=false;o.receiveShadow=false;SHADOW_STAT.recv--;return;}
    if(o===groundMesh){o.castShadow=false;return;}
    // 夜の灯りは「光っている面」なので影を落とさない(落とすと灯りが黒い塊になる)
    if(o.userData.night){o.castShadow=false;o.receiveShadow=false;SHADOW_STAT.recv--;return;}
    o.castShadow=true;SHADOW_STAT.cast++;
  });
}
applyShadows();

let last=performance.now();
/* 世界(列車・扉・交差鉄道)を dt 秒進める。
   実時間のループと撮影モードの両方から呼ぶ。撮影では固定の dt を与えるので、
   何度流しても同じ絵が出る(動画の作り直しで結果が変わらない)。 */
function stepWorld(dt){
  if(!trainsOn) return;
  for(const t of trains){
    driveTrain(t,dt);     // 各駅停車の自動運転(加速P4/60km/h上限/減速B5/停車25秒)
    placeTrain(t);
    stepCarDoors(t,dt);   // 客用扉:停車中はホーム側だけ開く
  }
  stepPSD(dt);            // ホームドア:停車中(発車3秒前まで)だけ開く
  for(const c of parkedCars) lodCar(c);   // 留置中の編成もLODを見直す
  stepXRail(dt);          // 井の頭線・世田谷線
}
let cineOn=false;         // 撮影モード:実時間のループを止め、CINE が時間を進める
function loop(now){
  requestAnimationFrame(loop);
  if(cineOn){last=now;return;}
  // 最初のコマは rAF の時刻が読み込み完了の時刻より前のことがあり、差が負になる
  // (そのままだと列車や雪が数秒ぶん逆に進む)。0〜0.05秒に収める
  const dt=clamp((now-last)/1000,0,.05);last=now;
  stepWorld(dt);
  if(rideOn){
    stepRide(dt);
    updSpd();
    // 視線=線路の接線方向(勾配も含む)。同じ軌道オフセット上の前後2点から方向を作るため、
    // 曲線でも画面中央が線路の正面を向く。
    const off=zDown(rideS), p=frame(rideS,off);   // 運転モードは本線(八幡山では外側の通過線)
    const pa=frame(rideS-6,off), pb=frame(rideS+6,off);
    let tx=pb.x-pa.x, tz=pb.z-pa.z, ty=railY(rideS+6)-railY(rideS-6);
    const tl=Math.hypot(tx,ty,tz)||1; tx/=tl; ty/=tl; tz/=tl;
    const EYE=3.2;                                   // 運転士の目線(レール面から)
    camera.up.set(0,1,0);
    camera.position.set(p.x, railY(rideS)+EYE, p.z);
    // 進行方向を基準に、ドラッグ量(rideYaw/ridePitch)だけ首を振る
    const base=Math.atan2(tz,tx), a2=base+rideYaw;
    const cp=Math.cos(ridePitch);
    const dx=Math.cos(a2)*cp, dz=Math.sin(a2)*cp, dy=ty*cp+Math.sin(ridePitch);
    camera.lookAt(p.x+dx*200, railY(rideS)+EYE+dy*200, p.z+dz*200);
    cam.tx=p.x;cam.tz=p.z;
  }else if(chaseOn){   // 注視点=列車固定、視点=球面(CH)上をユーザー操作可
    const t=trains[chaseIdx],zf=t.dir>0?zRunDown:zRunUp;
    const hx=t.x,ph2=frame(hx,zf(hx));
    const ty=railY(hx)+3;
    const ex=ph2.x+CH.r*Math.sin(CH.ph)*Math.cos(CH.th);
    const ey=ty+CH.r*Math.cos(CH.ph);
    const ez=ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th);
    const kk=Math.min(1,dt*3.6);
    chaseEye.x+=(ex-chaseEye.x)*kk;chaseEye.y+=(ey-chaseEye.y)*kk;chaseEye.z+=(ez-chaseEye.z)*kk;
    camera.position.copy(chaseEye);
    camera.lookAt(ph2.x,ty,ph2.z);
    cam.tx=ph2.x;cam.tz=ph2.z;
  }else{
    stepFly(now);
    if(autoOrbit&&!fly&&pts.size===0)cam.th+=dt*.03;
    applyCam();
  }
  syncNav();
  // 影の写す範囲を注視点へ追従させる(太陽の向きは変えない)
  sunFollow(cam.tx,cam.tz,
    Math.hypot(camera.position.x-cam.tx,camera.position.y,camera.position.z-cam.tz));
  CINE.tick(dt);          // 雪・花びら(冬・春)を進め、空をカメラの真上へ
  lodStruct();            // 駅・高架橋の細部は近くだけ描く(今のカメラで判定)
  renderer.render(scene,camera);
}

/* ============ 13. 撮影モード(動画用) ============
   動画は「駅のフォーカス → 次の駅までの前面展望・俯瞰 → 次の駅のフォーカス」を
   繰り返す。時刻(朝/昼/夕/夜)と季節(春夏秋冬)を場面ごとに差し替える。

   ・実時間のループは止め(cineOn)、外部(tools/capture.js)が1コマずつ
     「時間を dt 進める → カメラを置く → 1枚描く」を呼ぶ。
     固定の dt なので、何度流しても同じ動画になる。
   ・色は「画面上でこう見せたい色」で書く。トーンマッピングを通すと沈むので、
     invTone() が逆算して実際に設定する値を作る(tools/tune_sky.js と同じ考え方)。 */
const CINE=(function(){
  /* ---- トーンマッピングの逆算(見せたい色 → 設定すべき色) ---- */
  const l2s=v=>(v<=0.0031308)?v*12.92:1.055*Math.pow(v,1/2.4)-0.055;
  const AIN=[[0.59719,0.07600,0.02840],[0.35458,0.90834,0.13383],[0.04823,0.01566,0.83777]];
  const AOUT=[[1.60475,-0.10208,-0.00327],[-0.53108,1.10813,-0.07276],[-0.07367,-0.00605,1.07602]];
  const mul=(M,c)=>[0,1,2].map(i=>M[0][i]*c[0]+M[1][i]*c[1]+M[2][i]*c[2]);
  const rrt=v=>(v*(v+0.0245786)-0.000090537)/(v*(0.983729*v+0.432951)+0.238081);
  function toneShow(lin){                      // リニア → 画面上のsRGB値(0〜1)
    const e=renderer.toneMappingExposure/0.6;
    let x=mul(AIN,[lin[0]*e,lin[1]*e,lin[2]*e]).map(rrt);
    return mul(AOUT,x).map(v=>l2s(Math.min(1,Math.max(0,v))));
  }
  const H=h=>[((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255];
  /* 見せたい色(16進) → 設定すべき著作値(16進)。ACESは成分を混ぜるので
     成分ごとではなく3成分まとめて反復で追い込む。 */
  function invTone(hex){
    const t=H(hex); let c=t.slice();
    for(let i=0;i<120;i++){
      const o=toneShow(c.map(s2l)); let moved=0;
      for(let k=0;k<3;k++){
        const r=(o[k]>1e-6)?t[k]/o[k]:1.6;
        const nv=Math.min(1,Math.max(0,c[k]*Math.pow(r,0.7)));
        moved=Math.max(moved,Math.abs(nv-c[k])); c[k]=nv;
      }
      if(moved<1e-7) break;
    }
    return (Math.round(c[0]*255)<<16)|(Math.round(c[1]*255)<<8)|Math.round(c[2]*255);
  }

  /* ---- 時刻 ------------------------------------------------------------
     az=方位[°](0=東・90=南・180=西) / el=高度[°]。空の色は"見せたい色"で書く。 */
  const TIME={
    morning:{n:'朝',  az: 12, el:19, sun:0xffd9a8, si:0.62,
             hs:0xdfe6f2, hg:0x8d8a86, hi:0.74, expo:1.18,
             sky:{top:0x8fb4dd, hor:0xf0e2d2, bot:0xc9ccce, glow:0xffe9c6}, fog:[2200,10000]},
    // 昼は画面の既定の見え方(3章の太陽・半球光・空の"見え方"・フォグ)と同じ値にする。
    // 画面のメニューは開いた時に 昼 を当てるので、ここがずれると既定の絵が変わってしまう
    noon   :{n:'昼',  dir:{x:2400,y:3200,z:1600}, sun:0xfff4e0, si:0.72,
             hs:0xe4ecf4, hg:0x8a8d90, hi:0.82, expo:1.18,
             sky:{top:0x9cc0e8, hor:0xd6e4ef, bot:0xc6d0d6, glow:0xf2e6d4}, fog:[2600,11500]},
    evening:{n:'夕',  az:168, el:14, sun:0xffb070, si:0.60,
             hs:0xe9d9cf, hg:0x87807c, hi:0.62, expo:1.18,
             sky:{top:0x7d9ec8, hor:0xf2c89a, bot:0xb8a89c, glow:0xffd9a0}, fog:[1800,9000]},
    // 夜は「暗いが見える」ようにする。地物を照らすのではなく灯りを足す(8b章)ので、
    // 環境光はほんの少し上げるだけでよい。lights:true が NIGHT を有効にする
    night  :{n:'夜',  az:115, el:48, sun:0xa8bcdc, si:0.10, lights:true,
             hs:0x3a4766, hg:0x171c27, hi:0.26, expo:1.26,
             sky:{top:0x16213a, hor:0x3f4d6c, bot:0x262e3f, glow:0x66779c}, fog:[1800,8200]},
  };
  /* ---- 季節(樹木と地表の色。いずれも"見せたい色"ではなく直接の着色) ---- */
  const SEASON={
    // 桜は一般樹と必ず別の色にする(同じにすると並木が消える)
    spring:{n:'春', ground:0xc6d9a6, tree:[0x8fbf72,0x7fb268,0xa8cf86], sakura:0xf2c0d2},
    summer:{n:'夏', ground:0xa6c893, tree:[0x5f8a4e,0x6f9160,0x55804a], sakura:0x7aa05e},
    autumn:{n:'秋', ground:0xc4c088, tree:[0xd08a3a,0xc2693a,0xb79a46], sakura:0xc9743a},
    winter:{n:'冬', ground:0xc0c2b2, tree:[0x8f8a76,0x7d7a68,0x9a927e], sakura:0xa6927c},
  };

  let curTime='noon', curSeason='summer';
  function setTime(k){
    const t=TIME[k]||TIME.noon; curTime=k;
    const a=(t.az||0)*Math.PI/180, e=(t.el||0)*Math.PI/180;
    setSunDir(t.dir?Object.assign({},t.dir)
      :{x:Math.cos(e)*Math.cos(a)*4000, y:Math.sin(e)*4000, z:Math.cos(e)*Math.sin(a)*4000});
    sun.color.copy(srgb(t.sun)); sun.intensity=t.si;
    hemi.color.copy(srgb(t.hs)); hemi.groundColor.copy(srgb(t.hg)); hemi.intensity=t.hi;
    renderer.toneMappingExposure=t.expo;
    // 空は"見せたい色"から逆算する。フォグは地平と同じ値(遠景が空へ溶ける)
    SKY.TOP=invTone(t.sky.top); SKY.HOR=invTone(t.sky.hor);
    SKY.BOT=invTone(t.sky.bot); SKY.SUN=invTone(t.sky.glow);
    rebuildSky();
    scene.fog.color.copy(srgb(SKY.HOR));
    scene.fog.near=t.fog[0]; scene.fog.far=t.fog[1];
    scene.background.copy(srgb(SKY.HOR));
    NIGHT.set(!!t.lights);      // 窓・街灯・ホームの灯り(8b章)
    applyLook();                // 地表・樹木は時刻でも明るさが変わる
  }
  /* 地表と樹木の色を今の「季節 × 時刻」で塗り直す。
     **夜は地表と緑を暗く落とす**(`GROUND_NIGHT`)。落とさないと、夜なのに
     昼と同じ鮮やかな緑の地面が広がって、灯りを足しても夜に見えない。
     時刻と季節のどちらを変えても呼ぶ(片方だけだと前の時刻の明るさが残る)。 */
  /* ---- 季節の天候:冬=雪 / 春=桜の花びら(ほのかに) -----------------------
     【設計方針】
     ・粒は**世界に固定した場**として持ち、カメラの周り BOX 四方だけを切り出して描く
       (水平は剰余で巡回させる)。カメラが速く動いても粒が一緒に流されず、
       前面展望では正しく後ろへ流れていく
     ・位置は**時刻 t だけの関数**(乱数は生成時に一度だけ)。撮影の世界時間と同じ
       fxT で進めるので、撮り直しても並列に撮っても同じ粒が同じ場所に降る
     ・カメラのごく近く(NEAR 未満)の粒は描かない。目の前の1粒が画面を覆う
     ・点群は照明を受けないので、夜は色を落とす(昼の白のままだと夜に光って見える) */
  let fxT=0;
  const FX=(function(){
    // 粒を描くのはカメラの周り BOX 四方・上下 V の範囲だけ。広く取ると大半の粒が
    // 遠くて1画素未満になり、480×270では何も降っていないように見える(実測)
    const BOX=120, V=90, NEAR=5;
    function tex(draw){
      const cv=document.createElement('canvas');cv.width=cv.height=64;
      draw(cv.getContext('2d'));return canvasTex(cv);
    }
    const snowTex=tex(function(c){
      const g=c.createRadialGradient(32,32,2,32,32,30);
      g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.5,'rgba(255,255,255,0.75)');
      g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);
    });
    const petalTex=tex(function(c){        // 先端に切れ込みのある花びら
      c.translate(32,32);c.rotate(0.6);c.fillStyle='rgba(255,255,255,1)';
      c.beginPath();c.ellipse(0,0,24,14,0,0,Math.PI*2);c.fill();
      c.globalCompositeOperation='destination-out';
      c.beginPath();c.arc(27,0,7,0,Math.PI*2);c.fill();
    });
    function make(n,map,hex,size,opacity){
      const pos=new Float32Array(n*3), seed=new Float32Array(n*4);
      for(let i=0;i<n*4;i++) seed[i]=Math.random();
      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const m=new THREE.PointsMaterial({map:map,color:srgb(hex),size:size,sizeAttenuation:true,
        transparent:true,opacity:opacity,depthWrite:false,alphaTest:0.02});
      const p=new THREE.Points(g,m);
      p.frustumCulled=false; p.visible=false; scene.add(p);
      return {p:p,pos:pos,seed:seed,n:n,base:srgb(hex)};
    }
    // 落下速度[m/s]・横揺れの振幅[m]と周期・風で流れる速さ[m/s]
    const SPEC={
      snow :{n:13000,fall:1.1, sway:0.6, freq:0.7, drift:0.25},
      petal:{n:1200, fall:0.7, sway:1.8, freq:1.3, drift:0.9},   // ほのかに=雪の1/10
    };
    const snow =make(SPEC.snow.n, snowTex, 0xffffff,0.62,0.95);
    const petal=make(SPEC.petal.n,petalTex,0xf6b8cc,0.55,0.95);
    // 中心 c・周期 L で v を巡回させる([c-L/2, c+L/2) に収める)
    const wrap=(v,c,L)=>c+((((v-c+L/2)%L)+L)%L)-L/2;
    function place(o,k,t){
      const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
      const a=o.pos, s=o.seed;
      for(let i=0;i<o.n;i++){
        const r0=s[i*4], r1=s[i*4+1], r2=s[i*4+2], r3=s[i*4+3];
        const sp=k.fall*(0.7+0.6*r3), ph=r3*6.2832, sw=k.sway*(0.5+r2);
        const y=cy+V/2-((((r1*V+sp*t)%V)+V)%V);          // 上下もカメラ基準で巡回
        const x=wrap(r0*BOX+k.drift*t+sw*Math.sin(t*k.freq+ph),cx,BOX);
        const z=wrap(r2*BOX+sw*Math.cos(t*k.freq*0.8+ph*1.3),cz,BOX);
        const near=Math.hypot(x-cx,y-cy,z-cz)<NEAR;
        a[i*3]=x; a[i*3+1]=(near||y<0)?-50:y; a[i*3+2]=z;   // 近すぎる粒・地中の粒は退ける
      }
      o.p.geometry.attributes.position.needsUpdate=true;
    }
    return {
      set(season,night){
        snow.p.visible=(season==='winter'); petal.p.visible=(season==='spring');
        const d=night?0.45:1;
        snow.p.material.color.copy(snow.base).multiplyScalar(d);
        petal.p.material.color.copy(petal.base).multiplyScalar(d);
      },
      update(t){
        if(snow.p.visible) place(snow,SPEC.snow,t);
        if(petal.p.visible) place(petal,SPEC.petal,t);
      },
      snow:snow, petal:petal, SPEC:SPEC, BOX:BOX, V:V, NEAR:NEAR,
    };
  })();

  const GROUND_NIGHT=0.40;
  function applyLook(){
    const s=SEASON[curSeason]||SEASON.summer;
    const dark=(TIME[curTime]&&TIME[curTime].lights)?GROUND_NIGHT:1;
    MAT.ground.color.copy(srgb(s.ground)).multiplyScalar(dark);
    // 樹木は登録簿の順=インスタンスの順。種別(桜/一般)で色を選ぶ
    const col=new THREE.Color();
    for(let i=0;i<CITY.trees.length;i++){
      const tr=CITY.trees[i];
      const h=(tr.kind==='桜')?s.sakura:s.tree[(i*7)%s.tree.length];
      setSrgb(col,h).multiplyScalar(dark);
      CITY.crown.setColorAt(i,col);
    }
    if(CITY.crown.instanceColor)CITY.crown.instanceColor.needsUpdate=true;
    FX.set(curSeason, dark<1);    // 冬=雪 / 春=桜。夜は粒の色を落とす
  }
  function setSeason(k){ curSeason=k; applyLook(); }

  /* ---- カメラ ---------------------------------------------------------- */
  function aimAt(px,py,pz,lx,ly,lz){
    camera.up.set(0,1,0);
    camera.position.set(px,py,pz); camera.lookAt(lx,ly,lz);
    cam.tx=px;cam.tz=pz;            // 影の追従はここを見る
  }
  const tangent=(s,d)=>{            // 線形の接線(単位)
    const a=frame(s-d,0), b=frame(s+d,0);
    let tx=b.x-a.x, tz=b.z-a.z; const l=Math.hypot(tx,tz)||1;
    return {x:tx/l, z:tz/l, y:(railY(s+d)-railY(s-d))/(2*d)};
  };
  // 駅のフォーカス:駅を見下ろしながらゆっくり回り込む(u=0〜1)
  function shotStation(st,u,th0){
    const p=frame(st.x,0), y=railY(st.x);
    const th=(th0===undefined?0.9:th0)+u*0.6, ph=0.92, r=205;
    aimAt(p.x+r*Math.sin(ph)*Math.cos(th), y+r*Math.cos(ph), p.z+r*Math.sin(ph)*Math.sin(th),
          p.x, y+5, p.z);
  }
  /* 駅のフォーカスに列車の到着/発車を入れる。自動運転の列車は等間隔で回っているだけ
     なので、撮る駅にちょうど列車が居るとは限らない。カットの頭で1本を"置き直す"。
     駅を見下ろす画では停車中の列車は上屋に隠れ、10秒で止まる/動き出すだけの動き
     (制動・加速で約40m)ではほとんど写らない(実測)。そこで動きの大きい区間を切り取る:
       arrive … 停止位置の ARRIVE_T 秒手前(60km/h から B5 で減速し始める所)に置く。
                カットの中でホームへ滑り込み、カットの後で止まる
       depart … 発車して DEPART_T 秒たった所に置く。カットの中で加速して駅を出ていく
     置き直しは列車の状態を絶対値で書き換えるので、それまでの経過に依らない
     (撮影ではコマ番号で決まる時刻に適用するので、並列に撮っても同じ映像になる)。
     同じ向きの別の列車が近くに居れば後ろへ退ける(同じ線路に2本重ならないように)。 */
  const STAGE={ARRIVE_T:20.0, DEPART_T:6.0, CLEAR:900, BACK:1200};
  function stage(i,mode,dir){
    const st=STA[i], t=trains.find(q=>q.dir===dir);
    if(!st||!t) return null;
    const stop=stopPosOf(st,dir)-dir*CAR_HALF, dec=DRIVE.DEC/3.6, acc=DRIVE.ACC/3.6;
    const vmax=DRIVE.VMAX_KMH/3.6;
    for(const q of trains) if(q!==t&&q.dir===dir&&Math.abs(q.x-stop)<STAGE.CLEAR){
      q.x=stop-dir*STAGE.BACK; q.v=0; q.st='run'; q.target=null; q.atSt=null; q.dwell=0;
      placeTrain(q);
    }
    if(mode==='arrive'){
      const v=Math.min(vmax,dec*STAGE.ARRIVE_T), d=v*v/(2*dec);   // 制動距離ちょうどの位置から減速
      t.x=stop-dir*d; t.v=v; t.st='brake'; t.target={s:stop,st:st}; t.atSt=null; t.dwell=0;
    }else{
      const v=Math.min(vmax,acc*STAGE.DEPART_T), d=v*v/(2*acc);   // 発車してから進んだ距離
      t.x=stop+dir*d; t.v=v; t.st='run'; t.dwell=0; t.atSt=null; t.target=null;
    }
    for(const c of t.cars) setCarDoors(c,0,1);            // 扉は閉めた状態から(開閉は自動運転が行う)
    t.dr=0; t.dside=1;
    placeTrain(t);
    return t;
  }
  // 前面展望:下り線の運転台から
  function shotFront(s){
    const off=zDown(s), p=frame(s,off), t=tangent(s,6), EYE=3.3;
    aimAt(p.x, railY(s)+EYE, p.z, p.x+t.x*200, railY(s)+EYE+t.y*200, p.z+t.z*200);
  }
  // 俯瞰展望:進行方向の左斜め後ろから、少し先を見る
  function shotAerial(s,u){
    const p=frame(s,0), y=railY(s), t=tangent(s,40);
    const side=135+25*Math.sin(u*Math.PI), h=90+18*Math.sin(u*Math.PI);
    aimAt(p.x-t.x*150-t.z*side, y+h, p.z-t.z*150+t.x*side, p.x+t.x*70, y+4, p.z+t.z*70);
  }

  function hideUI(){
    for(const id of ['nav','tools','spd','navTog','toolTog','rot'])
      {const e=document.getElementById(id); if(e)e.style.display='none';}
    for(const sp of staLabels.concat(tagLabels,xingLabels)) sp.visible=false;
  }
  /* 画面の左下に出す字幕。駅名と「時刻・季節」を出す。
     3D内のスプライトではなくDOMに置く:撮影の画像にはそのまま写り、
     解像度を変えても字の大きさが崩れない。 */
  let capEl=null;
  function caption(main,sub){
    if(!capEl){
      capEl=document.createElement('div');
      capEl.style.cssText='position:fixed;left:2.2%;bottom:5%;z-index:60;'+
        'font-family:"IPAGothic","Noto Sans JP",sans-serif;color:#fff;'+
        'text-shadow:0 1px 3px rgba(0,0,0,.85),0 0 10px rgba(0,0,0,.5);'+
        'line-height:1.25;pointer-events:none;letter-spacing:.04em';
      document.body.appendChild(capEl);
    }
    capEl.style.display=(main||sub)?'block':'none';
    capEl.innerHTML='<div style="font-size:3.1vh;font-weight:bold">'+(main||'')+
      '</div><div style="font-size:1.9vh;opacity:.88">'+(sub||'')+'</div>';
  }
  /* 撮影用の見通し距離。前面展望は線路の先にある物が全部画角へ入るので、
     描画の呼び出し回数が他の画(約1,500)の5倍に跳ね上がる。遠方面とフォグを
     縮めて霞ませると見た目を保ったまま軽くなる。far=0 で時刻の既定へ戻す。
     遠方面を縮めると空ドーム(R=16,000m)が切り落とされるので、
     render() でドームをカメラの真上へ移し、遠方面の内側へ縮める。 */
  let farCut=0;
  function setFar(far,fogNear,fogFar){
    farCut=far||0;
    const t=TIME[curTime]||TIME.noon;
    camera.far = farCut ? farCut : 30000;
    scene.fog.near = farCut ? fogNear : t.fog[0];
    scene.fog.far  = farCut ? fogFar  : t.fog[1];
    camera.updateProjectionMatrix();
    skyDome.scale.setScalar(farCut ? Math.min(1,farCut*0.92/SKY_R) : 1);
  }
  /* 影の品質。影は1パス増えるうえ影マップの解像度ぶん描き直すので、
     撮影の所要時間に最も効く。size を変えたら影マップは作り直させる。 */
  function setShadow(on,size){
    renderer.shadowMap.enabled=!!on; sun.castShadow=!!on;
    if(size){
      sun.shadow.mapSize.set(size,size);
      if(sun.shadow.map){sun.shadow.map.dispose();sun.shadow.map=null;}
    }
  }
  function render(){
    // 空は無限遠のものなので、カメラの真上へ平行移動して描く
    // (置きっぱなしだと区間の端で太陽の輝きの向きがずれる)
    skyDome.position.set(camera.position.x,0,camera.position.z);
    sunFollow(cam.tx,cam.tz,
      Math.hypot(camera.position.x-cam.tx,camera.position.y,camera.position.z-cam.tz));
    FX.update(fxT);              // 雪・花びらを今の時刻とカメラ位置で置き直す
    // 車両の LOD は「今のカメラ」で決め直す。世界を進めた後にカメラを動かすので、
    // そのままだと1コマ前のカメラ位置で判定され、カットの頭で前面の部品が消える
    for(const t of trains) for(const c of t.cars) if(c.visible) lodCar(c);
    for(const c of parkedCars) lodCar(c);
    lodStruct();                 // 駅・高架橋の細部も今のカメラで判定する
    renderer.render(scene,camera);
  }
  return {
    begin(){cineOn=true;hideUI();},
    setTime:setTime, setSeason:setSeason,
    times:Object.keys(TIME), seasons:Object.keys(SEASON),
    label:()=>TIME[curTime].n+'・'+SEASON[curSeason].n,
    step:dt=>{stepWorld(dt);fxT+=dt;},   // 天候の粒も同じ世界時間で進める
    shotStation:shotStation, shotFront:shotFront, shotAerial:shotAerial, stage:stage, STAGE:STAGE,
    render:render, caption:caption, setFar:setFar, setShadow:setShadow,
    fx:FX, fxTime:()=>fxT,
    /* 実時間のループから毎コマ呼ぶ(画面のメニューで時刻・季節を選んだとき用)。
       撮影の render() と同じく、空はカメラの真上へ移し、雪・花びらを今の時刻で置き直す */
    tick(dt){fxT+=dt; skyDome.position.set(camera.position.x,0,camera.position.z); FX.update(fxT);},
    now:()=>({time:curTime,season:curSeason}),
    stations:STA.map(s=>({n:s.n,x:s.x})),
    setSize(w,h){renderer.setPixelRatio(1);renderer.setSize(w,h,false);
      camera.aspect=w/h;camera.updateProjectionMatrix();},
    stats:()=>({calls:renderer.info.render.calls,tri:renderer.info.render.triangles}),
  };
})();
window.CINE=CINE;
// 検証用(tools/verify_k8render.js):車両だけを白い一様な光の正射影で描き、
// v4 の照合ツール(側面45項目・前面14項目)で測るための入口
window.K8API={makeCar:makeCar, setCarDoors:setCarDoors, renderer:renderer, K8:K8, scene:scene};

/* ---- 時刻・季節(画面のメニュー) ----
   撮影モードと同じ CINE.setTime / setSeason を使う(太陽の向き・光の色・露出・空・フォグ・
   夜の灯り・地表と樹木の色・冬の雪/春の花びら)。選んだ組合せはこの端末に覚えておき、
   次に開いたときも使う(保存できない環境では既定の 昼・夏)。 */
const LOOK_UI={time:'noon',season:'summer'};
function setLookUI(t,s){
  if(t&&CINE.times.indexOf(t)>=0){LOOK_UI.time=t;CINE.setTime(t);}
  if(s&&CINE.seasons.indexOf(s)>=0){LOOK_UI.season=s;CINE.setSeason(s);}
  for(const b of document.querySelectorAll('#segTime button')) b.classList.toggle('on',b.dataset.k===LOOK_UI.time);
  for(const b of document.querySelectorAll('#segSeason button')) b.classList.toggle('on',b.dataset.k===LOOK_UI.season);
  try{localStorage.setItem('keio3d.look',JSON.stringify(LOOK_UI));}catch(e){}
}
for(const b of document.querySelectorAll('#segTime button')) b.onclick=()=>setLookUI(b.dataset.k,null);
for(const b of document.querySelectorAll('#segSeason button')) b.onclick=()=>setLookUI(null,b.dataset.k);
{
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('keio3d.look')||'null');}catch(e){saved=null;}
  setLookUI((saved&&saved.time)||'noon',(saved&&saved.season)||'summer');
}

trains.forEach(placeTrain);
requestAnimationFrame(loop);
</script>
</body>
</html>
