<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>京王線 連続立体交差事業(笹塚〜仙川) 高架化後 3Dビューア</title>
<style>
  :root{
    --ink:#1c2733; --panel:rgba(252,253,254,.94); --line:#c7ced6;
    --keio-pink:#e4007f; --keio-indigo:#1b2a66; --dim:#5a6673;
    --mono:ui-monospace,'SF Mono','Consolas',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;
    font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Yu Gothic UI','Noto Sans JP','Meiryo',sans-serif;
    color:var(--ink);background:#dfe8f0}
  #c{position:fixed;inset:0;display:block;touch-action:none}
  /* ---- パネルの開閉タブ ---- */
  .tog{position:fixed;z-index:20;border:1px solid var(--line);background:rgba(255,255,255,.94);
    color:var(--keio-indigo);font:700 12px/1 inherit;cursor:pointer;
    box-shadow:0 2px 8px rgba(20,30,50,.12);padding:0}
  #navTog{top:0;left:50%;transform:translateX(-50%);width:64px;height:22px;
    border-radius:0 0 8px 8px;border-top:none}
  #toolTog{right:0;top:50%;transform:translateY(-50%);width:22px;height:64px;
    border-radius:8px 0 0 8px;border-right:none}
  #nav,#tools{transition:transform .26s ease}
  #nav.hide{transform:translateY(calc(-100% - 20px))}
  #tools.hide{transform:translateX(calc(100% + 20px))}

  /* ---- マスコンの操作ボタン(タッチ対応) ---- */
  #spd .ctl{display:flex;gap:6px}
  #spd .ctl button{min-width:46px;height:40px;border:1px solid var(--keio-indigo);border-radius:9px;
    background:#fff;color:var(--keio-indigo);font:700 15px/1.1 inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation}
  #spd .ctl button span{font:600 9.5px/1 inherit;color:var(--dim)}
  #spd .ctl button:active{background:var(--keio-indigo);color:#fff}
  #tools button:disabled{opacity:.42;cursor:not-allowed}
  #spd .ctl button.eb{border-color:#d62828;color:#d62828}
  #spd .ctl button.eb:active{background:#d62828;color:#fff}

  /* ---- スマートフォン対応(横画面で使用) ---- */
  #rot{position:fixed;inset:0;display:none;z-index:99;background:#f4f6f8;
    flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font:600 15px/1.7 var(--sans);color:var(--ink);text-align:center;padding:24px}
  #rot .ico{font-size:44px;transform:rotate(90deg)}
  @media (orientation:portrait) and (max-width:900px){
    #rot{display:flex}
    #tools,#nav,#spd{display:none !important}
  }
  @media (orientation:landscape) and (max-height:560px){
    #tools{top:26px;right:6px;padding:5px;gap:4px;max-height:calc(100vh - 40px);overflow:auto}
    #tools button{font-size:10.5px;padding:6px 8px}
    #nav{left:6px;right:6px;top:24px;padding:6px 8px 4px}
    #nav svg{height:54px}
    #nav .cap b{font-size:11px} #nav .cap i{font-size:10px}
    /* マスコン:左下に小さく(面積1/4)・半透明で配置し、中央の視界を空ける */
    #spd{left:4px;bottom:4px;transform:scale(.5);transform-origin:left bottom;
      opacity:.55;padding:8px 10px;gap:10px;align-items:center}
    #spd:active,#spd:focus-within{opacity:.95}
    #spd .v b{display:none}
  }
  .panel{position:fixed;background:var(--panel);border:1px solid var(--line);
    border-radius:10px;box-shadow:0 3px 14px rgba(20,35,55,.12);backdrop-filter:blur(4px)}
  #hdr{top:12px;left:12px;padding:11px 14px 10px;max-width:min(450px,calc(100vw - 24px))}
  #hdr h1{font-size:14.5px;font-weight:700;letter-spacing:.02em;line-height:1.45}
  #hdr h1 .rt{color:var(--keio-pink)}
  #hdr .sub{font-size:11px;color:var(--dim);margin-top:4px;line-height:1.6}
  #hdr .facts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  #hdr .facts span{font:600 10px var(--mono);color:var(--keio-indigo);
    border:1px solid var(--keio-indigo);border-radius:3px;padding:2px 5px;background:#fff}
  #tools{top:12px;right:12px;padding:8px;display:flex;flex-direction:column;gap:6px}
  #tools button{font:600 11.5px/1 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);
    border-radius:6px;padding:7px 10px;cursor:pointer;text-align:left;white-space:nowrap}
  #tools button:hover{border-color:var(--keio-indigo)}
  #tools button.on{background:var(--keio-indigo);color:#fff;border-color:var(--keio-indigo)}
  #tools button.ride.on{background:var(--keio-pink);border-color:var(--keio-pink)}
  /* 時刻・季節の切替(4つ並びの小さなボタン) */
  #tools .seg{display:flex;align-items:center;gap:3px}
  #tools .seg b{font:700 10.5px/1 inherit;color:var(--dim);min-width:27px}
  #tools .seg button{flex:1;min-width:26px;padding:6px 0;text-align:center}
  /* 運転モードの種別(運転モードを押したときだけ出す) */
  #tools #segRide{display:none}
  /* 出典(2026-11 利用者指示:画面の右下からメニューの中のボタンへ) */
  #tools #credits{display:none;max-width:236px;font:10.5px/1.55 var(--sans);color:var(--ink);background:#f6f7f9;
    border:1px solid var(--line);border-radius:6px;padding:6px 8px;max-height:46vh;overflow:auto}
  #tools #credits.show{display:block}
  #tools #credits .cr{margin:0 0 4px}
  #tools #credits .cr.fix{color:var(--dim)}
  #tools #segRide.show{display:flex}
  #tools button:focus-visible{outline:2px solid var(--keio-pink);outline-offset:1px}
  #nav{left:12px;right:196px;top:12px;padding:10px 14px 8px}   /* 上部固定・右のボタン群を回避 */
  #nav .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
  #nav .cap b{font-size:12.5px;letter-spacing:.08em;color:var(--keio-indigo)}
  #nav .cap i{font:11.5px var(--mono);color:var(--dim);font-style:normal}
  #nav svg{display:block;width:100%;height:100px;cursor:pointer}
  #nav text{font-family:'Hiragino Sans','Yu Gothic UI',sans-serif}
  #note{display:none;left:12px;bottom:120px;max-width:min(510px,calc(100vw - 24px));
    max-height:52vh;overflow:auto;padding:12px 15px;font-size:11.5px;line-height:1.75}
  #note.show{display:block}
  #note h2{font-size:12px;color:var(--keio-indigo);margin-bottom:5px}
  #note h2:not(:first-child){margin-top:10px}
  #note p{color:#33404d}
  #note .lg{display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
  #note .lg span{display:inline-flex;align-items:center;gap:5px;font-size:11px}
  #note .sw{width:12px;height:12px;border-radius:3px;display:inline-block;border:1px solid rgba(0,0,0,.15)}
    border-radius:5px;background:#fff;cursor:pointer;color:var(--ink)}
  #kjStepRow button{font:700 13px/1 inherit;width:30px;height:30px;border:1px solid var(--keio-indigo);
    border-radius:6px;background:#fff;color:var(--keio-indigo);cursor:pointer}
  #kjStepRow button:disabled{opacity:.3;cursor:default}
  #hint{right:12px;bottom:120px;padding:7px 11px;font:10.5px/1.7 var(--mono);color:var(--dim)}
  /* 運転台(マスコン+速度計。運転モード時のみ表示) */
  #spd{display:none;left:16px;bottom:16px;padding:9px 14px;
    align-items:center;gap:12px}
  #spd.show{display:flex}
  /* 段位チップ(P4〜N〜B7・EB) */
  #spd .notch{min-width:56px;height:38px;border-radius:9px;display:flex;align-items:center;
    justify-content:center;font:700 17px/1 var(--mono);color:#fff;background:#8a9099;
    letter-spacing:.04em}
  #spd .notch.p{background:#2f7d4f}      /* 力行 */
  #spd .notch.n{background:#8a9099}      /* 中立 */
  #spd .notch.b{background:#d98a3a}      /* 制動 */
  #spd .notch.e{background:#d62828}      /* 非常 */
  /* 戸閉灯:扉が閉まっていれば点灯(黄)/開いていれば消灯(黒)。速度表示の左 */
  #spd .dl{display:flex;flex-direction:column;align-items:center;gap:3px}
  #spd .dl i{width:26px;height:26px;border-radius:50%;background:#14181c;
    border:2px solid #4a5058;box-shadow:inset 0 0 4px rgba(0,0,0,.6)}
  #spd .dl.on i{background:#f2c230;border-color:#c99b12;box-shadow:0 0 9px rgba(242,194,48,.85)}
  #spd .dl b{font:700 9px/1 inherit;color:var(--dim)}
  #spd .v{font:700 22px var(--mono);color:var(--ink);min-width:86px;text-align:center}
  /* 次駅と停止位置までの距離 */
  #spd .nxt{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:96px}
  #spd .nxt b{font:700 12.5px/1.2 inherit;color:var(--keio-indigo)}
  #spd .nxt span{font:700 15px/1 var(--mono);color:var(--ink)}
  #spd .nxt span.near{color:#d62828}
  #spd .v i{font:600 12px var(--mono);color:var(--dim);font-style:normal;margin-left:4px}
  #spd .v b{display:block;font:600 9.5px var(--mono);color:var(--dim);margin-top:1px}
  @media (max-width:640px){
    #hdr{padding:9px 11px}
    #hdr h1{font-size:12.5px}
    #hdr .sub,#hdr .facts{display:none}
    #tools{flex-direction:row;flex-wrap:wrap;top:auto;bottom:12px;left:12px;right:12px;padding:6px}
    #tools button{padding:7px 8px}
    #hint{display:none}
    #nav svg{height:88px}
  }
  /* 読み込み中の表示(2026-11 利用者指示「起動時に読み込み中…○○%」)。本体は章の区切りで分けて実行し、区切りごとに描き直す(下の読み込み係) */
  #loading{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;
    background:#e9edf1;color:var(--ink);font:600 17px/1.5 system-ui,-apple-system,'Hiragino Sans','Noto Sans JP',sans-serif;transition:opacity .4s}
  #loading.done{opacity:0;pointer-events:none}
  #loading .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 24px;min-width:240px;text-align:center;
    box-shadow:0 4px 18px rgba(0,0,0,.12)}
  #loading .ttl{font-size:12px;font-weight:500;color:var(--dim);margin-bottom:6px}
  #loading .bar{height:6px;background:#d5dbe1;border-radius:3px;margin-top:10px;overflow:hidden}
  #loading .bar i{display:block;height:100%;width:0;background:var(--keio-pink);transition:width .25s}
  #loading .err{display:none;margin-top:8px;font-size:13px;font-weight:500;color:#b3261e}
</style>
</head>
<body>
<div id="loading" role="status" aria-live="polite"><div class="box">
  <div class="ttl">京王線 連続立体交差事業(笹塚〜仙川)3Dビューア</div>

  </div>
</div>

<div class="panel" id="spd">
  <div id="masName" class="notch">N</div>
  <div class="dl" id="doorLamp"><i></i><b>戸閉</b></div>
  <div class="v"><span id="spdVal">0</span><i>km/h</i><b id="spdKm">—</b></div>

/* ============================================================================
   京王線 連続立体交差事業(笹塚〜仙川)高架化後 3Dビューア ── 保守ガイド
   ----------------------------------------------------------------------------
   ■ ファイル構成(この見出しコメントで検索できます)
     1. 与件データ        : 駅STA/踏切XINGS(実名25)/交差道路/8工区KOUKU
     2. 縦断・断面・平面線形: railY(縦断) mainOff(本線の振り) deckHalf(桁半幅)
                              GEO→GP→CT(実座標スプライン) frame(s,off) nearestS
     3. シーン基盤        : renderer/材質MAT/strip・box・cyl
    3b. 結合ジオメトリ    : MG(材質ごとに結合・頂点カラー・掃引)/LOD(lodStruct)/登録簿STRUCT
     4. 地表・道路・施設  : 幹線/踏切道スタブ/側道/玉川上水/給水所/変電所/駅前広場
     5. 高架橋            : RCラーメン高架橋(床版・高欄・縦梁・柱と横梁・継目)。240mの区画 VIA_CH
     6. 線路の登録        : layTrack(本線・副本線・留置線・渡り線)/trimTracks/井の頭線・世田谷線
    6a. 軌道              : 道床・まくらぎ・締結装置・レール・分岐器(TURNOUTS/FROGS)・車止め
    6b. 架線              : インテグレート架線(鋼管柱・Vトラスビーム・可動ブラケット・電線 CHAINS/SUPS)
     7. 駅                : ホーム・大屋根/上屋・柱・階段とEV・駅名標・外装(公表デザイン FAC)・高架下駅舎
     8. 街並み            : 街区整列の建物/樹木(幹+樹冠)
     9. 列車              : テクスチャ車体+パンタ(走行6本・滞泊編成)
    10. カメラ・モード    : オービット/運転モードrideOn(ワンハンドルマスコン)/列車追尾chaseOn
    11. 縦断図ナビ        : SVG(駅クリック・踏切目盛・現在位置マーカー)
    12. UI・メインループ  : ボタン類/resize/loop

   ■ 座標系(最重要)
     ・s   : 営業距離[m](笹塚=0。新宿起点kmはヘルパ X(km) で変換)
     ・off : 線路直角方向[m](+=北側/-=南側)
     ・ワールド: 地理準拠 → X=東(+)西(-)/Z=南(+)北(-)/Y=高さ[m]
       真上から見ると「北が上・新宿方(笹塚)が右」= 公式平面図と同じ向き
     ・全構造物は frame(s,off) 経由で配置(直接ワールド座標を使うのは地表面のみ)

   ■ 主な調整パラメータ
     ・線形     : GEO(各駅の緯度経度)を直せば全体が自動追従
     ・断面/高さ: RAIL_H・DECK_DROP・GIRDER・BUMPS/軌道 TRK・RAIL_PF/架線 CAT・WIRE_*・POLE_TOP
     ・踏切     : XINGS=[名称, s位置]
     ・配色     : MAT(構造物)/7章 FAC(駅の外装)・頂点カラー(結合ジオメトリ)/car_spec由来の色(車両)

   ■ 保守メモ
     ・編集後は <script> 内を抽出し node --check で構文確認を推奨
     ・210m級の長物は必ず cbox(曲線追従ロフト)で生成。直方体Boxは曲線上で弦になる
     ・CT.a は±π跨ぎをアンラップ済み。線形再生成時もこの処理を残すこと
     ・操作系:ドラッグ=移動/Shift・Ctrl+ドラッグ=回転(2026-08変更)

/* 材質に航空写真を足す(前の onBeforeCompile があれば先に)。top=上向きの面だけ(縁石の側面などは今の色)。

function orthoPatch(mat,top,band){
  mat.userData.ortho=top?'top':'all'; if(band) mat.userData.orthoBand=true;
  const prev=mat.onBeforeCompile, pk=mat.customProgramCacheKey;
  mat.onBeforeCompile=function(sh,r){

      '#include <color_fragment>\n diffuseColor.rgb=orthoMix(diffuseColor.rgb,vOrW,'+(top?'smoothstep(.5,.7,vOrN.y)':'1.')+','+(band?'1.':'0.')+');');
  };

    const base=(pk&&pk!==THREE.Material.prototype.customProgramCacheKey)?pk.call(this):((prev&&prev!==THREE.Material.prototype.onBeforeCompile)?String(prev):'');

}
/* ---- 影 ---------------------------------------------------------------------
   事業区間は約8.6km×幅±470m。1枚の影マップで全域を覆うとテクセルが数m角になり
   使い物にならないので、**太陽の向きは固定したまま影の写す範囲だけをカメラに
   追従**させる。範囲(半径 R)は視点から注視点までの距離に応じて広げる
   (寄れば精細・引けば広く)。

   影がちらつく(クロールする)のは、カメラが動くたびに影マップの画素境界と
   物の縁の位置関係がずれるため。**注視点を影テクセルの格子に載せて**防ぐ。
   格子は光源座標系で取る必要があるので、光の正規直交基底 F/Rt/Up を作って丸める。 */
const SH_MAP=2048;                 // 影マップの一辺[px]
const SH_MIN=180, SH_MAX=600;      // 影を写す半径の下限・上限[m]
                                   // (上限は影テクセルが0.6mを超えない大きさ)
const SUN_DIST=1400;               // 注視点から光源までの距離[m]
const dot3=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const norm3=v=>{const l=Math.hypot(v.x,v.y,v.z);return {x:v.x/l,y:v.y/l,z:v.z/l};};
const cross3=(a,b)=>({x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x});
/* 太陽の方向と、そこから作る影カメラの正規直交基底。
   時刻を変えられるように let にし、setSunDir() で一括して作り直す
   (基底を作り直さないと、影のテクセル格子が古い向きのままになる)。 */
let SUN_V={x:2400,y:3200,z:1600};                          // 太陽の方向(位置ベクトル)
let SUN_N, SUN_F, SUN_RT, SUN_UP;
function setSunDir(v){
  SUN_V=v;
  SUN_N=norm3(SUN_V);                                      // 注視点→光源(単位)
  SUN_F={x:-SUN_N.x,y:-SUN_N.y,z:-SUN_N.z};                // 光源→注視点(視線)
  SUN_RT=norm3(cross3(SUN_F,{x:0,y:1,z:0}));               // 影カメラの横軸
  SUN_UP=norm3(cross3(SUN_RT,SUN_F));                      // 影カメラの縦軸
}
setSunDir(SUN_V);
sun.castShadow=true;
sun.shadow.mapSize.set(SH_MAP,SH_MAP);
sun.shadow.camera.near=SUN_DIST-SH_MAX-120;
sun.shadow.camera.far =SUN_DIST+SH_MAX+120;
sun.shadow.bias=-0.0004;
sun.shadow.normalBias=0.5;         // 斜面のアクネ(縞)対策。桁の側面で出やすい
scene.add(sun.target);
let shadowR=SH_MIN;
// 影を写す半径[m]。視点が離れるほど広く取る(引いたときに影が途切れないように)
function shadowRadius(dist){return clamp(dist*0.55,SH_MIN,SH_MAX);}
/* 注視点(fx,fz)を中心に影の範囲を置き直す。太陽の"向き"は変えない
   (向きが変わると視点を動かすたびに影が回ってしまう)。 */
function sunFollow(fx,fz,dist){
  const R=shadowRadius(dist);
  if(R!==shadowR){
    shadowR=R;
    const c=sun.shadow.camera;
    c.left=-R;c.right=R;c.top=R;c.bottom=-R;c.updateProjectionMatrix();
  }
  const texel=2*shadowR/SH_MAP;                 // 影マップ1画素の実寸[m]
  const p={x:fx,y:0,z:fz};
  const a=Math.round(dot3(p,SUN_RT)/texel)*texel;   // 光源座標系で格子に載せる
  const b=Math.round(dot3(p,SUN_UP)/texel)*texel;
  const c=dot3(p,SUN_F);
  const t={x:SUN_RT.x*a+SUN_UP.x*b+SUN_F.x*c,
           y:SUN_RT.y*a+SUN_UP.y*b+SUN_F.y*c,
           z:SUN_RT.z*a+SUN_UP.z*b+SUN_F.z*c};
  sun.target.position.set(t.x,t.y,t.z);
  sun.target.updateMatrixWorld();
  sun.position.set(t.x+SUN_N.x*SUN_DIST, t.y+SUN_N.y*SUN_DIST, t.z+SUN_N.z*SUN_DIST);
  if(typeof farFollow==='function') farFollow(fx,fz);   // 遠くの影(すぐ下)
}


/* ---- 遠くの影(2026-11 利用者指示「更なるクオリティアップ」③ 影の段分け) ---------------------------------------
   近くの影(sun。半径 180〜600m・2048px)の外は影が無かった。もう1つの平行光 sunFar(色 0=照らさない。影だけ)に粗い影マップ
   (半径 FAR_R=2400m・2048px=1画素 約2.3m)を持たせて、その外を覆う。
   ・Lambert(地表・道路・建物・木。街のほとんど)の影は getShadowMask() が平行光の影を掛け合わせるので、ShaderChunk を差し替えて
     「近くの影マップの内(縁の 3% を除く)なら近く・外なら遠く」の片方だけを使う(両方を掛けると近くでも粗い影がにじむ)。

   ・遠くの影は動かない物だけが落とす(層 FAR_LAYER。列車・交差鉄道の列車・自動車・人は入れない=applyShadows)。写し直すのは、

     渡す光から sunFar を外し、前の影マップと行列をそのまま使う(写し直すコマだけ影の描画が1回ぶん増える)
   ・スマホは影を切るので無い */
const FAR_R=2400, FAR_MAP=2048, FAR_MOVE=200, FAR_LAYER=6, FAR_DIST=4200;

{ const c=sunFar.shadow.camera; c.left=-FAR_R; c.right=FAR_R; c.top=FAR_R; c.bottom=-FAR_R; c.near=FAR_DIST-FAR_R-300; c.far=FAR_DIST+FAR_R+300; c.layers.set(FAR_LAYER); }
sunFar.shadow.bias=-0.0006; sunFar.shadow.normalBias=2.0;   // 1画素 2.3m の粗い影のアクネ(縞)対策
scene.add(sunFar); scene.add(sunFar.target);               // sun より後に足す=平行光の影の 1 番目(シェーダの [1])
const FAR={x:1e9, z:1e9, dir:'', need:true, n:0};
if(THREE.ShaderChunk&&typeof THREE.ShaderChunk.shadowmask_pars_fragment==='string'){
  const a='\t#pragma unroll_loop_start\n\tfor ( int i = 0; i < NUM_DIR_LIGHT_SHADOWS; i ++ ) {\n\t\tdirectionalLight = directionalLightShadows[ i ];\n\t\tshadow *= receiveShadow ? getShadow( directionalShadowMap[ i ], directionalLight.shadowMapSize, directionalLight.shadowBias, directionalLight.shadowRadius, vDirectionalShadowCoord[ i ] ) : 1.0;\n\t}\n\t#pragma unroll_loop_end\n';
  const S=THREE.ShaderChunk.shadowmask_pars_fragment;

    '\t#if NUM_DIR_LIGHT_SHADOWS == 2\n\t{\n'+
    '\t\tvec3 c0 = vDirectionalShadowCoord[ 0 ].xyz / vDirectionalShadowCoord[ 0 ].w;\n'+
    '\t\tbool in0 = c0.x > 0.03 && c0.x < 0.97 && c0.y > 0.03 && c0.y < 0.97 && c0.z < 1.0;\n'+     // 近くの影マップの内
    '\t\tif ( receiveShadow && in0 ) { directionalLight = directionalLightShadows[ 0 ]; shadow *= getShadow( directionalShadowMap[ 0 ], directionalLight.shadowMapSize, directionalLight.shadowBias, directionalLight.shadowRadius, vDirectionalShadowCoord[ 0 ] ); }\n'+
    '\t\telse if ( receiveShadow ) { directionalLight = directionalLightShadows[ 1 ]; shadow *= getShadow( directionalShadowMap[ 1 ], directionalLight.shadowMapSize, directionalLight.shadowBias, directionalLight.shadowRadius, vDirectionalShadowCoord[ 1 ] ); }\n'+
    '\t}\n\t#else\n'+a+'\t#endif\n');

// 写し直すかを決めて sunFar を置く(sunFollow から)。向きは sun と同じ・中心は影テクセルの格子に載せる
function farFollow(fx,fz){
  if(!sunFar.castShadow) return;
  const dk=SUN_N.x.toFixed(5)+','+SUN_N.y.toFixed(5)+','+SUN_N.z.toFixed(5);
  if(!FAR.need&&dk===FAR.dir&&Math.hypot(fx-FAR.x,fz-FAR.z)<FAR_MOVE) return;
  FAR.x=fx; FAR.z=fz; FAR.dir=dk; FAR.need=true;
  const texel=2*FAR_R/FAR_MAP, p={x:fx,y:0,z:fz};
  const a=Math.round(dot3(p,SUN_RT)/texel)*texel, b=Math.round(dot3(p,SUN_UP)/texel)*texel, c=dot3(p,SUN_F);
  const t={x:SUN_RT.x*a+SUN_UP.x*b+SUN_F.x*c, y:SUN_RT.y*a+SUN_UP.y*b+SUN_F.y*c, z:SUN_RT.z*a+SUN_UP.z*b+SUN_F.z*c};
  sunFar.target.position.set(t.x,t.y,t.z); sunFar.target.updateMatrixWorld();
  sunFar.position.set(t.x+SUN_N.x*FAR_DIST, t.y+SUN_N.y*FAR_DIST, t.z+SUN_N.z*FAR_DIST); sunFar.updateMatrixWorld();

// 写し直さないコマは影の描画に渡す光から sunFar を外す(前の影マップ・行列をそのまま使う)
if(renderer.shadowMap&&typeof renderer.shadowMap.render==='function'){
  const _shR=renderer.shadowMap.render;
  renderer.shadowMap.render=function(lights,scn,cam){
    const k=lights&&lights.indexOf?lights.indexOf(sunFar):-1;
    if(k>=0&&!FAR.need&&sunFar.shadow.map){ const L=lights.slice(); L.splice(k,1); return _shR.call(this,L,scn,cam); }
    if(k>=0){ FAR.need=false; FAR.n++; }
    return _shR.call(this,lights,scn,cam);
  };
}

/* 材質は必ずこの工場を通す(色を素通しで書くとその面だけ不自然に明るくなる)。
   色を持つテクスチャも canvasTex を通す。 */
function mkMat(kind,o){
  const q=Object.assign({},o);
  for(const k of ['color','emissive','specular']) if(typeof q[k]==='number') q[k]=srgb(q[k]);
  return new THREE[kind](q);
}
function canvasTex(cv){
  const t=new THREE.CanvasTexture(cv);
  t.encoding=THREE.sRGBEncoding;    // 色を持つテクスチャはsRGBとして読む
  return t;
}
/* ---- 空のテクスチャ(正距円筒) ------------------------------------------------

     行 yy=0 が天頂、yy=h が天底。列 xx が方位角。
   同じテクスチャを空ドームの map と、レール等の envMap の両方に使う
   (mapping は envMap のときだけ効くので、map として使っても支障がない)。   */
const SKY_TEX_W=512, SKY_TEX_H=256;
/* 空の色(SKY)と太陽の向き(SUN_N)から、既存のキャンバスへ描き直す。
   撮影モードが時刻を切り替えるたびに呼ぶので、キャンバスは作り直さない

function viaFlush(){
  const m4=new THREE.Matrix4(),q=new THREE.Quaternion(),e=new THREE.Euler(),v=new THREE.Vector3(),one=new THREE.Vector3(1,1,1);
  for(const C of VIA_CH){

    const b=C.md.bounds(), bb={x0:b.x0,x1:b.x1,y0:b.y0,y1:b.y1,z0:b.z0,z1:b.z1};
    C.mg.flush(g); C.md.flush(d);
    // まくらぎ([s,off,railY,長さの倍率,向き])と締結装置([s,off,railY,向き])のインスタンス。
    // 締結装置は s の順に FAST_BLK ごとのまとまりに分け、まとまりごとに近くだけ描く
    for(const [list,geo,mat,dist,blk] of[[C.ties,TIE_GEO,MAT.tie,TIE_LOD,1e9],
        [C.fast2,FAST2_GEO,MAT.fast,TRK.FAST_LOD,TRK.FAST_BLK],[C.fast1,FAST1_GEO,MAT.fast,TRK.FAST_LOD,TRK.FAST_BLK]]){
      for(let i0=0;i0<list.length;){
        let i1=i0; while(i1<list.length&&list[i1][0]-list[i0][0]<blk) i1++;
        const part=list.slice(i0,i1), im=new THREE.InstancedMesh(geo,mat,part.length), sc=new THREE.Vector3();
        const bx={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,z0:1e9,z1:-1e9};
        part.forEach(function(t,i){
          const f=frame(t[0],t[1]), long=t.length>4; e.set(0,-(f.a+(long?t[4]:t[3])),0); q.setFromEuler(e);
          v.set(f.x,t[2]+TRK.TIE_Y,f.z); sc.set(1,1,long?t[3]:1); m4.compose(v,q,sc); im.setMatrixAt(i,m4);
          bx.x0=Math.min(bx.x0,f.x-2);bx.x1=Math.max(bx.x1,f.x+2);bx.y0=Math.min(bx.y0,v.y);bx.y1=Math.max(bx.y1,v.y);bx.z0=Math.min(bx.z0,f.z-2);bx.z1=Math.max(bx.z1,f.z+2);
        });

        lodAdd(tg,blk<1e9?bx:bb,dist);
        i0=i1;
      }
    }
    // 電線(6b章):き電ちょう架線・トロリ線・架空地線は常時、ハンガと受けは近くだけ
    if(C.wl.length) g.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',
      new THREE.Float32BufferAttribute(C.wl,3)),wireMat));
    if(C.wd.length) d.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position',
      new THREE.Float32BufferAttribute(C.wd,3)),wireMat));
    g.add(d); scene.add(g);

}

// (状態を落とすと、クロッシングに端を削られたトングレールが「状態なし」になる。笹塚の渡り線で起きた)
function cutIv(L,a,b){const out=[];for(const v of L){if(b<=v[0]||a>=v[1]){out.push(v);continue;}
  if(a>v[0])out.push([v[0],a].concat(v.slice(2))); if(b<v[1])out.push([b,v[1]].concat(v.slice(2)));}return out;}
// 両端をなめらかに外へ逃がす(ガードレール・ウイングレールの端の開き)
const flare=(s,a,b,d,L)=>{const u=Math.max(0,Math.max(a+L-s,s-(b-L))/L);return d*u*u;};
function buildTrack(){
  trackTopo();
  // ---- 道床(高架=コンクリート・地上=バラスト) ----
  TRACKS.forEach(function(t,i){
    const run=(s0,s1,ground)=>viaEach(s0,s1,function(C,a,b){
      const hw=ground?TRK.BAL:TRK.BED;
      C.mg.loft(ground?MAT_BALLAST:VD,a,b,s=>{
        const y=railY(s), sp=bedSpan(i,s,hw), c=t.zf(s);
        const g0=floorY(s);                                   // バラストの裾=地表(掘割では底)
        if(!sp) return ground?[[c,g0],[c,y+TRK.BAL_Y],[c,y+TRK.BAL_Y],[c,g0]]:[[c,y-DECK_DROP],[c,y+TRK.BED_Y],[c,y+TRK.BED_Y],[c,y-DECK_DROP]];
        if(ground) return [[sp[0]-(sp[2][0]?0:1.0),g0],[sp[0],y+TRK.BAL_Y],[sp[1],y+TRK.BAL_Y],[sp[1]+(sp[2][1]?0:1.0),g0]];
        const bt=y>3?y-DECK_DROP:-0.05;
        return [[sp[0],bt],[sp[0]+(sp[2][0]?0:0.1),y+TRK.BED_Y],[sp[1]-(sp[2][1]?0:0.1),y+TRK.BED_Y],[sp[1],bt]];
      },{side:-1,cols:ground?[0x8c877f,0x9a958c,0x8c877f]:[0x7d8288,0x8a8f94,0x7d8288],
         uv:ground?(s,q)=>[s/1.2,q[0]/1.2]:undefined,tag:'道床'});
    });
    run(t.x0,Math.min(t.x1,DECK_END),false);
    if(t.x1>DECK_END) run(Math.max(t.x0,DECK_END),t.x1,true);
    for(let s=Math.ceil(t.x0/2)*2;s<=t.x1;s+=2){const sp=bedSpan(i,s,s<DECK_END?TRK.BED:TRK.BAL); if(sp) BEDS.push({id:t.id,s:s,lo:sp[0],hi:sp[1]});}
  });
  // ---- レール:普通の区間・トングレール・クロッシングの切れ目 ----
  for(const T of TURNOUTS) if(/^本線/.test(T.A.id)&&/副本線|停車線/.test(T.B.id))
    SWITCHES.push({T:T, r:0, want:0, tongues:[], lo:Math.min(T.s,T.heel)-2, hi:Math.max(T.s,T.heel)+2});
  const swOf=T=>SWITCHES.find(W=>W.T===T)||null;
  const dOpen=(T,s)=>Math.max(0,TRK.OPEN*(1-Math.abs(s-T.s)/Math.abs(T.heel-T.s)));   // 先端で TRK.OPEN 開く
  for(const t of TRACKS) for(const r of[-1,1]){
    let iv=[[t.x0,t.x1,null]];
    for(const T of TURNOUTS){
      const ah=Math.min(T.s,T.heel), bh=Math.max(T.s,T.heel);
      const A=T.A, B=T.B, sg=T.sg, W=swOf(T);
      if(T.A===t&&r===sg){        // A 側のトングレール:定位で密着(A のゲージ線から基本レールまで)。反位では A の内側へ開く
        // 開きが0になる所(heel)まで。以前は full で終えていたので、反位では固定のレールとの継ぎ目で約5cm 食い違っていた
        iv=cutIv(iv,ah,bh);
        iv.push([ah,bh,s=>{const g=A.zf(s)+sg*(RAIL_OFF-RAIL_W/2)-sg*(W?dOpen(T,s)*W.r:0), w=Math.min(RAIL_W,Math.abs(B.zf(s)-A.zf(s)));
          return [Math.min(g,g+sg*w),Math.max(g,g+sg*w)];},'密着',W]);
      }
      if(T.B===t&&r===-sg){       // B 側のトングレール:定位で基本レールから転てつ方向へ開く。反位で密着
        iv=cutIv(iv,ah,bh);
        // 先端から折れ点(bend)までは A に対してまっすぐ(折れ点で B のレールの位置に着く)、その先は B のレールに沿う
        const Db=Math.abs(B.zf(T.bend)-A.zf(T.bend));
        iv.push([ah,bh,s=>{const d=dOpen(T,s)*(W?1-W.r:1), D=Math.abs(B.zf(s)-A.zf(s)), u=(s-T.s)/(T.bend-T.s);
          const g=A.zf(s)-sg*(RAIL_OFF-RAIL_W/2)+sg*(d+(Db-RAIL_W)*u), w=Math.min(RAIL_W,D), o=u<=1?g:B.zf(s)-sg*(RAIL_OFF+RAIL_W/2)+sg*d;
          return [Math.min(o,o+sg*w),Math.max(o,o+sg*w)];},'開',W]);
      }
    }
    for(const F of FROGS){
      if(!F.t) continue;
      if((F.A===t&&F.ra===r)||(F.B===t&&F.rb===r)) iv=cutIv(iv,Math.min(F.throat,F.nose),Math.max(F.throat,F.nose));
    }
    iv.sort((u,v)=>u[0]-v[0]);
    for(const v of iv){
      const of=s=>t.zf(s)+r*RAIL_OFF;          // 描くのと同じ関数を登録簿に残す(検証が描いた位置そのものを測る)
      if(v[2]){ if(v[4]) v[4].tongues.push({s0:v[0],s1:v[1],e:v[2]}); else headRun(v[0],v[1],v[2]); }   // 転換するものは別の Mesh
      else railRun(v[0],v[1],of,false);
      RAILS.push({id:t.id,r:r,s0:v[0],s1:v[1],kind:v[2]?'トングレール':'レール',state:v[3],e:v[2],o:v[2]?null:of,sw:v[4]||null});
    }
  }
  // 転換するトングレールの Mesh:頭頂面と両側面の帯(headRun と同じ形)を 0.25m 刻みで。fill() が今の r で頂点を置き直す
  for(const W of SWITCHES){
    let n=0; for(const q of W.tongues){ q.n=Math.max(2,Math.ceil((q.s1-q.s0)/0.25)+1); q.o=n; n+=q.n; }
    const P=new Float32Array(n*18), Cl=new Float32Array(n*18), I=[];
    const cT=srgb(0xe6e9ee), cS=srgb(0x8d9298);
    for(const q of W.tongues) for(let i=0;i<q.n;i++){
      const k=(q.o+i)*6;
      for(let j=0;j<6;j++){ const c=j<2?cT:cS; Cl.set([c.r,c.g,c.b],(k+j)*3); }
      if(i<q.n-1){ const a=k, b=k+6;
        I.push(a,b,b+1, a,b+1,a+1,  a+2,b+2,b+3, a+2,b+3,a+3,  a+4,b+5,b+4, a+4,a+5,b+5); }
    }
    const g=new THREE.BufferGeometry();
    g.setAttribute('position',new THREE.BufferAttribute(P,3)); g.setAttribute('color',new THREE.BufferAttribute(Cl,3)); g.setIndex(I);
    W.geo=g;
    W.fill=function(){
      const A=this.geo.attributes.position.array;
      for(const q of this.tongues) for(let i=0;i<q.n;i++){
        const s=q.s0+(q.s1-q.s0)*i/(q.n-1), e=q.e(s), y=railY(s), k=(q.o+i)*18;
        const L=frame(s,e[0]), R=frame(s,e[1]);
        A.set([L.x,y+RAIL_TOP,L.z, R.x,y+RAIL_TOP,R.z, L.x,y+0.058,L.z, L.x,y-0.03,L.z, R.x,y+0.058,R.z, R.x,y-0.03,R.z],k);
      }
      this.geo.attributes.position.needsUpdate=true; this.geo.computeVertexNormals();
      if(this.geo.boundingSphere) this.geo.computeBoundingSphere();
    };
    W.fill();
    const m=new THREE.Mesh(g,MAT_TONGUE); m.name='トングレール(転換)'; W.mesh=m;
    const c=frame((W.lo+W.hi)/2,W.T.A.zf((W.lo+W.hi)/2)), y=railY(W.lo);
    scene.add(m);
    lodAdd(m,{x0:c.x-14,x1:c.x+14,y0:y-1,y1:y+1,z0:c.z-14,z1:c.z+14},300);
  }
  // ---- クロッシング:ノーズ・ウイングレール・床・ガードレール ----
  for(const F of FROGS){
    const lo=s=>Math.min(F.p(s),F.q(s)), hi=s=>Math.max(F.p(s),F.q(s));
    if(!F.t){                                            // 鈍角:床だけ
      viaEach(F.s-1.2,F.s+1.2,(C,a,b)=>C.md.col(0x4d5155).loft(VD,a,b,s=>{const y=railY(s);
        return [[lo(s)-0.15,y+TRK.TIE_Y],[lo(s)-0.15,y+0.02],[hi(s)+0.15,y+0.02],[hi(s)+0.15,y+TRK.TIE_Y]];},{side:-1}));
      continue;
    }
    const t=F.t, w0=Math.min(F.throat,F.wingEnd-t*0.4), w1=Math.max(F.throat,F.wingEnd-t*0.4);
    const wf=s=>{const u=clamp(-t*(s-F.wingEnd)/0.4,0,1);return 0.05*u*u;};                 // V 側の端だけ外へ開く
    headRun(Math.min(F.tip,F.nose),Math.max(F.tip,F.nose),s=>[lo(s)-0.033,hi(s)+0.033]);      // ノーズ
    railRun(w0,w1,s=>F.wP(s)+F.sp*wf(s),true);                                              // ウイングレール
    railRun(w0,w1,s=>F.wQ(s)-F.sp*wf(s),true);
    const b0=Math.min(F.throat+t*0.5,F.wingEnd-t*0.4), b1=Math.max(F.throat+t*0.5,F.wingEnd-t*0.4);
    viaEach(b0,b1,(C,a,b)=>C.md.col(0x55595d).loft(VD,a,b,s=>{const y=railY(s), u=Math.min(lo(s),F.wQ(s),F.wP(s)), v=Math.max(hi(s),F.wQ(s),F.wP(s));
      return [[u-0.12,y+TRK.TIE_Y],[u-0.12,y+0.02],[v+0.12,y+0.02],[v+0.12,y+TRK.TIE_Y]];},Object.assign({side:-1},RFINE)));   // マンガン鋼の床
    const g0=Math.min(F.g0,F.g1), g1=Math.max(F.g0,F.g1);
    railRun(g0,g1,s=>F.gA(s)+F.ra*flare(s,g0,g1,0.06,0.5),true);                        // ガードレール
    railRun(g0,g1,s=>F.gB(s)+F.rb*flare(s,g0,g1,0.06,0.5),true);
    RAILS.push({id:F.a,r:-F.ra,s0:g0,s1:g1,kind:'ガードレール',frog:F.s},{id:F.b,r:-F.rb,s0:g0,s1:g1,kind:'ガードレール',frog:F.s});
  }
  // ---- 転てつ機と転てつ棒 ----
  for(const T of TURNOUTS){
    const A=T.A, f=T.f, sg=T.sg;
    for(const d of[0.45,1.25]){
      const s=T.s+f*d, C=chunkAt(s), y=railY(s), a=A.zf(s);
      C.md.col(0x50565c).box(VD,s,a+sg*0.05,y-0.09,y-0.07,0.07,RAIL_OFF*2+0.2);
    }
    const s=T.s+f*0.9, C=chunkAt(s), y=railY(s), o=A.zf(s)-sg*(RAIL_OFF+0.85);
    C.md.col(0x6f7a72).box(VD,s,o,y+TRK.TIE_Y,y+0.18,0.95,0.42,{tag:'転てつ機'})
      .col(0x5a6460).box(VD,s,o,y+0.18,y+0.22,0.85,0.34)
      .col(0x50565c).box(VD,T.s+f*0.45,A.zf(s)-sg*(RAIL_OFF+0.38),y-0.09,y-0.07,0.07,0.55);
  }
  // ---- まくらぎ(全線共通の格子。重なる線路は分岐まくらぎにまとめる)と締結装置 ----
  for(const C of VIA_CH){
    for(let k=Math.ceil(C.s0/TRK.TIE_P);k*TRK.TIE_P<C.s1;k++){
      const s=k*TRK.TIE_P, iv=[];
      for(const t of TRACKS) if(s>=t.x0&&s<=t.x1) iv.push([t.zf(s)-TRK.TIE_HW,t.zf(s)+TRK.TIE_HW,[t]]);
      if(!iv.length) continue;
      iv.sort((u,v)=>u[0]-v[0]);
      const G=[iv[0]];
      for(let i=1;i<iv.length;i++){const L=G[G.length-1]; if(iv[i][0]<L[1]+0.3){L[1]=Math.max(L[1],iv[i][1]);L[2]=L[2].concat(iv[i][2]);} else G.push(iv[i]);}
      const y=railY(s);
      for(const g of G){
        const one=g[2].length===1, t=g[2][0], yaw=one?Math.atan(t.zf(s+0.5)-t.zf(s-0.5)):0;
        C.ties.push([s,(g[0]+g[1])/2,y,(g[1]-g[0])/2/TRK.TIE_HW,yaw]);
        if(one) C.fast2.push([s,t.zf(s),y,yaw]);
        else for(const u of g[2]) for(const r of[-1,1]){
          if(FROGS.some(F=>F.t&&((F.A===u&&F.ra===r)||(F.B===u&&F.rb===r))&&(s-F.throat)*(s-F.nose)<0)) continue;
          C.fast1.push([s,u.zf(s)+r*RAIL_OFF,y,Math.atan(u.zf(s+0.5)-u.zf(s-0.5))]);
        }
      }
    }
  }
  // ---- 車止め:どこにもつながらない線路の端(区域の端を除く) ----
  for(const t of TRACKS) for(const end of[0,1]){
    const e=end?t.x1:t.x0, f=end?1:-1;
    if(Math.abs(e-DOM.x0)<10||Math.abs(e-DOM.x1)<10) continue;
    if(TRACKS.some(u=>u!==t&&e>=u.x0-0.05&&e<=u.x1+0.05&&Math.abs(u.zf(e)-t.zf(e))<0.03)) continue;
    const s=e-f*2.0, o=t.zf(s), y=railY(s), C=chunkAt(s);
    C.mg.col(0x7a3b33).box(VD,s,o,y+TRK.TIE_Y,y+1.1,0.8,2.6,{tag:'車止め'});
    C.md.col(0xe8c21c).box(VD,s-f*0.41,o,y+0.72,y+1.04,0.02,2.2);
    for(const d of[-0.8,-0.27,0.27,0.8]) C.md.col(0x26282b).box(VD,s-f*0.42,o+d,y+0.72,y+1.04,0.02,0.14);
    C.md.col(0xd23a2a).box(VD,s,o,y+1.1,y+1.28,0.16,0.16);
    BUFFERS.push({id:t.id,s:s,end:e});
  }
}
/* まくらぎ1本(PCまくらぎ)。上面と線路方向の2側面(数万本を描くので、ほとんど見えない端面は作らない)。
   原点=上面の中心、長さ方向=z */
function tieGeo(){
  const L=0.12, H=0.08, W=TRK.TIE_HW;
  const P=[-L,0,-W, L,0,-W, L,0,W, -L,0,W,   L,-H,-W, L,-H,W, L,0,W, L,0,-W,   -L,-H,W, -L,-H,-W, -L,0,-W, -L,0,W];
  const N=[]; for(const n of[[0,1,0],[1,0,0],[-1,0,0]]) for(let i=0;i<4;i++) N.push(n[0],n[1],n[2]);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(P,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(N,3));
  const I=[]; for(let f=0;f<3;f++){const v=f*4; I.push(v,v+2,v+1,v,v+3,v+2);}
  g.setIndex(I);
  return g;
}
/* 直方体の面(外向き・反時計回り)。fs に 'top','bot','px','nx','pz','nz' のうち作る面を入れる */
function boxFaces(x0,x1,y0,y1,z0,z1,fs){
  const F={top:[[x0,y1,z0],[x0,y1,z1],[x1,y1,z1],[x1,y1,z0],[0,1,0]], bot:[[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1],[0,-1,0]],
           px:[[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1],[1,0,0]], nx:[[x0,y0,z1],[x0,y1,z1],[x0,y1,z0],[x0,y0,z0],[-1,0,0]],
           pz:[[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1],[0,0,1]], nz:[[x1,y0,z0],[x0,y0,z0],[x0,y1,z0],[x1,y1,z0],[0,0,-1]]};
  return fs.map(k=>[k,F[k]]);
}
// 面の一覧を BufferGeometry に(cols があれば頂点カラーも)
/* 締結装置(1本のまくらぎの上、offs=レールの位置)。タイプレート・ショルダー・板ばね。頂点カラー */
function fastGeo(offs){
  const P=[],N=[],Cc=[],I=[], col=new THREE.Color();
  const box=(x0,x1,y0,y1,z0,z1,hex,fs,top)=>{
    for(const [k,q] of boxFaces(x0,x1,y0,y1,z0,z1,fs)){const v=P.length/3;
      setSrgb(col,k==='top'&&top!==undefined?top:hex);
      for(let i=0;i<4;i++){P.push(q[i][0],q[i][1],q[i][2]);N.push(q[4][0],q[4][1],q[4][2]);Cc.push(col.r,col.g,col.b);}
      I.push(v,v+1,v+2,v,v+2,v+3);}
  };
  for(const zo of offs){
    box(-0.09,0.09,0,0.012,zo-0.17,zo+0.17,0x3c4044,['top','px','nx']);
    for(const sd of[-1,1]) box(-0.05,0.05,0.012,0.05,Math.min(zo+sd*0.055,zo+sd*0.125),Math.max(zo+sd*0.055,zo+sd*0.125),
      0x6a6f74,['top','px','nx',sd>0?'pz':'nz'],0x23262a);
  }
  return facesGeo(P,N,I,Cc);
}
const TIE_GEO=tieGeo(), FAST1_GEO=fastGeo([0]), FAST2_GEO=fastGeo([-RAIL_OFF,RAIL_OFF]);
MAT.fast=M(0xffffff,{vertexColors:true});
CUR=null;
// 交差鉄道(井の頭線・世田谷線):実際の線路の位置(RAW.rail.*.tr。地理院のベクトルタイル)の曲線 xLineOf に沿って配置
function xGroup(){const g=new THREE.Group();scene.add(g);return g;}
/* 交差鉄道の部品。材質ごとに1つのジオメトリへまとめる(1個ずつ Mesh にすると描画の呼び出しが部品の数だけ増えた:
   井の頭線・世田谷線で約200回)。形は (u=中心線に沿う距離, y=高さ, v=中心線から横) で書き、頂点ごとに曲線の上へ写す
   (A.pos(u,v)。世界座標)。線路の方向に長い物は 2.5m 以下の区間の掃引(sweep。v と幅は u の関数でもよい=線路の間隔が
   場所で変わる)、短い物(柱・梁・妻の壁)はその u の接線に向けた箱(piece)。電線は線(シンプルカテナリ:ちょう架線・

MAT.railRust=M(0x6f5c4f);
const XSTEP=2.5;
function xKit(g,A){

  const quad=(q,p,n)=>{ const o=q.P.length/3;
    for(const v of p){ q.P.push(v[0],v[1],v[2]); q.N.push(n[0],n[1],n[2]); }
    const ax=p[1][0]-p[0][0], ay=p[1][1]-p[0][1], az=p[1][2]-p[0][2], bx=p[2][0]-p[0][0], by=p[2][1]-p[0][1], bz=p[2][2]-p[0][2];
    const d=(ay*bz-az*by)*n[0]+(az*bx-ax*bz)*n[1]+(ax*by-ay*bx)*n[2];
    if(d>=0) q.I.push(o,o+1,o+2,o,o+2,o+3); else q.I.push(o,o+2,o+1,o,o+3,o+2); };
  const W=(u,v,y)=>{ const w=A.pos(u,v); return [w.x,y,w.z]; };
  const k={

   発車標は時刻(画面のメニュー・撮影の時刻)で書き直す。配色(調べた範囲。2026-10):
     出口 … 黄地に黒字(鉄道駅の案内の共通の約束)
     番線案内 … 白地に黒字、番線は黒地に白抜きの数字、方面は京王の駅の案内と同じ書き方
       (下り=京王八王子・高尾山口・橋本方面/上り=新宿・本八幡方面。笹塚は3番線=新宿・4番線=新線新宿・本八幡)
     発車標 … 黒地の LED。種別の色は京王の路線図の配色(特急=赤・急行=緑・区間急行=黄緑・各停=白) */
const PIDS_CW=512, PIDS_CH=128, PIDS_COLS=4, PIDS_ROWS=16;
const PIDS_CV=document.createElement('canvas');
PIDS_CV.width=PIDS_CW*PIDS_COLS; PIDS_CV.height=PIDS_CH*PIDS_ROWS;
const PIDS={used:0, memo:new Map(), deps:[]};
const PIDS_F='"Hiragino Sans","Yu Gothic UI","Noto Sans JP",IPAGothic,sans-serif';
const PIDS_TEX=canvasTex(PIDS_CV);
MAT.pids=mkMat('MeshBasicMaterial',{map:PIDS_TEX});
const GUIDES=[];                     // 案内の登録簿(検証が向き・番線の左右・発車標の位置を確かめる)
function pidsXY(r){return [(r.k%PIDS_COLS)*PIDS_CW, Math.floor(r.k/PIDS_COLS)*PIDS_CH];}
function pidsPaint(r,draw){
  const c=PIDS_CV.getContext('2d'), q=pidsXY(r);
  c.save(); c.beginPath(); c.rect(q[0],q[1],PIDS_CW*r.w,PIDS_CH); c.clip();
  draw(c,q[0],q[1],PIDS_CW*r.w,PIDS_CH); c.restore();
  PIDS_TEX.needsUpdate=true;
}
function pidsCell(key,w,draw){           // key が同じ絵は1回だけ描く。w=1/2(こま幅)
  if(PIDS.memo.has(key)) return PIDS.memo.get(key);
  if(w===2&&PIDS.used%2) PIDS.used++;
  const r={k:PIDS.used, w:w}; PIDS.used+=w;
  if(PIDS.used>PIDS_COLS*PIDS_ROWS) throw new Error('案内の画像のこまが足りない');
  pidsPaint(r,draw); PIDS.memo.set(key,r); return r;
}
function pidsUV(r,rot){                  // 左下・右下・右上・左上(rot:縦長の面に90°回して貼る)
  const u0=(r.k%PIDS_COLS)/PIDS_COLS, u1=u0+r.w/PIDS_COLS;
  const row=Math.floor(r.k/PIDS_COLS), v1=1-row/PIDS_ROWS, v0=v1-1/PIDS_ROWS;
  return rot?[[u0,v1],[u0,v0],[u1,v0],[u1,v1]]:[[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
}
const pFit=(c,t,px,wmax,wt)=>{let f=px;c.font=wt+' '+f+'px '+PIDS_F;
  while(f>8&&c.measureText(t).width>wmax){f-=1;c.font=wt+' '+f+'px '+PIDS_F;} return f;};
/* 面を1枚貼る(signQuad と同じ向きの決め方:見る人の左に絵の左端) */
function pidsQuad(Sx,r,s,off,y0,y1,w,face,rot){
  const A=Sx.axes(s,off), c=[A.f.x,0,A.f.z];
  let L,R,out;
  if(face===1||face===-1){ L=v3sc(A.t,-face*w/2); R=v3sc(A.t,face*w/2); out=v3sc(A.n,face); }
  else { const f=(face==='w')?1:-1; L=v3sc(A.n,f*w/2); R=v3sc(A.n,-f*w/2); out=v3sc(A.t,f); }
  const P=(h,y)=>[c[0]+h[0],y,c[2]+h[2]];
  Sx.face(MAT.pids,[P(L,y0),P(R,y0),P(R,y1),P(L,y1)],out,pidsUV(r,rot));
}
/* 出口(黄)。階段のピクトグラムと「出口 Exit」 */
function pidsExit(w){
  return pidsCell('exit'+w,w,function(c,x,y,W,H){
    c.fillStyle='#f6c800'; c.fillRect(x,y,W,H);
    c.fillStyle='#e0b200'; c.fillRect(x,y+H-5,W,5);
    const cx=x+W/2-(w===2?150:120), b=y+H-22;                 // 階段(下りる人)のピクトグラム
    c.fillStyle='#111';
    for(let i=0;i<4;i++) c.fillRect(cx-44+i*20,b-(4-i)*18,20,(4-i)*18);
    c.beginPath(); c.arc(cx+24,y+24,9,0,Math.PI*2); c.fill();
    c.fillRect(cx+18,y+34,12,24);
    c.textBaseline='middle'; c.textAlign='left';
    pFit(c,'出口',70,170,'800'); c.fillText('出口',cx+70,y+H/2+2);
    pFit(c,'Exit',44,120,'700'); c.fillText('Exit',cx+220,y+H/2+6);
  });
}
/* 番線案内の半分(1つの線)。t={n,dest,en}。arrow=-1:左端に左向きの矢印/+1:右端に右向き/0:なし */
function pidsArrow(c,x,y,d){
  c.beginPath();
  c.moveTo(x+d*24,y); c.lineTo(x-d*4,y-26); c.lineTo(x-d*4,y-11); c.lineTo(x-d*26,y-11);
  c.lineTo(x-d*26,y+11); c.lineTo(x-d*4,y+11); c.lineTo(x-d*4,y+26); c.closePath(); c.fill();
}
function pidsTrack(t,arrow){
  return pidsCell('trk|'+t.n+'|'+t.dest+'|'+arrow,1,function(c,x,y,W,H){
    c.fillStyle='#f8f8f5'; c.fillRect(x,y,W,H);
    c.fillStyle='#c9c9c4'; c.fillRect(x,y+H-4,W,4);
    let lx=x+14, rx=x+W-14;
    c.fillStyle='#111';
    if(arrow<0){ pidsArrow(c,lx+26,y+H/2,-1); lx+=64; }
    if(arrow>0){ pidsArrow(c,rx-26,y+H/2,1); rx-=64; }
    c.fillStyle='#15181c'; roundRect(c,lx,y+16,92,92,10); c.fill();         // 番線:黒地に白抜き
    c.fillStyle='#ffffff'; c.textAlign='center'; c.textBaseline='middle';
    pFit(c,String(t.n),76,80,'800'); c.fillText(String(t.n),lx+46,y+64);
    lx+=108;
    c.fillStyle='#111'; c.textAlign='left'; c.textBaseline='alphabetic';
    pFit(c,t.dest,36,rx-lx,'700'); c.fillText(t.dest,lx,y+62);
    c.fillStyle='#3a3f45'; pFit(c,t.en,20,rx-lx,'600'); c.fillText(t.en,lx,y+96);
  });
}
/* ---- 発車標の時刻表(模式) ----
   20分の繰り返し(下りは笹塚、上りは仙川の発車の分)に、駅までの所要を足して各駅の時刻を出す。
   停車駅は 2022年3月のダイヤ改正後(特急:笹塚・明大前・千歳烏山/急行:+桜上水/区間急行:+仙川/各停:全駅)。
   快速は本数が少ないので載せない。2面4線は各停=外側(待避線)・優等=内側(本線)。
   笹塚の上りは3番線=新宿行き・4番線=本八幡行き(京王新線・都営新宿線) */
const DEP_NOW={morning:7*60+30, noon:12*60, evening:17*60+30, night:21*60};
let depNow=DEP_NOW.noon;
const DEP_COL={'特急':'#ff4038','急行':'#2fd36a','区急':'#b6e33a','各停':'#f4f4f4'};
const DEP_STOP={'特急':['笹塚','明大前','千歳烏山'], '急行':['笹塚','明大前','桜上水','千歳烏山'],
                '区急':['笹塚','明大前','桜上水','千歳烏山','仙川']};
const DEP_PAT={
  dn:[[0,'特急','京王八王子'],[3,'各停','京王八王子'],[6,'急行','橋本'],[10,'特急','高尾山口'],[13,'各停','調布'],[16,'区急','橋本']],
  up:[[1,'特急','新宿'],[4,'各停','本八幡'],[7,'急行','新宿'],[11,'特急','新宿'],[14,'各停','新宿'],[17,'区急','本八幡']],
};
function depList(i,t){                    // 駅 i・線 t の次の2本 [種別,行先,分]
  const st=STA[i], base=t.dn?STA[0]:STA[STA.length-1], out=[];
  for(let k=-2;k<=3;k++) for(const e of DEP_PAT[t.dn?'dn':'up']){
    const ty=e[1], to=e[2], stops=DEP_STOP[ty];
    if(stops&&stops.indexOf(st.n)<0) continue;
    if(st.n==='笹塚'&&!t.dn){ if((t.n===3)!==(to==='新宿')) continue; }
    else if(t.quad&&((ty==='各停')!==t.outer)) continue;
    const T=Math.floor(depNow/20)*20+20*k+e[0]+Math.round(Math.abs(st.x-base.x)/(ty==='各停'?520:900));
    if(T>=depNow) out.push([ty,to,T]);
  }
  return out.sort((a,b)=>a[2]-b[2]).slice(0,2);
}
function drawDep(c,x,y,W,H,d){
  c.fillStyle='#060708'; c.fillRect(x,y,W,H);
  c.fillStyle='#1c2026'; c.fillRect(x,y,W,30);                                  // 見出し:番線と方面
  c.fillStyle='#f4f4f0'; roundRect(c,x+6,y+3,30,24,4); c.fill();
  c.fillStyle='#111'; c.textAlign='center'; c.textBaseline='middle';
  pFit(c,String(d.t.n),20,26,'800'); c.fillText(String(d.t.n),x+21,y+16);
  c.fillStyle='#e9eef2'; c.textAlign='left'; pFit(c,'番線',14,34,'600'); c.fillText('番線',x+40,y+16);
  pFit(c,d.t.dest,17,W-90,'600'); c.fillText(d.t.dest,x+80,y+16);
  const L=depList(d.st,d.t);
  ['先発','次発'].forEach(function(lab,j){
    const cy=y+30+j*49+25;
    c.fillStyle='#b9c0c7'; c.textAlign='left'; pFit(c,lab,16,36,'600'); c.fillText(lab,x+8,cy);
    const e=L[j]; if(!e) return;
    const hm=Math.floor(e[2]/60)%24+':'+(e[2]%60<10?'0':'')+e[2]%60;
    c.fillStyle=DEP_COL[e[0]]; pFit(c,e[0],32,72,'800'); c.fillText(e[0],x+50,cy);
    c.fillStyle='#ffa41c'; pFit(c,hm,32,92,'800'); c.fillText(hm,x+130,cy);
    pFit(c,e[1],32,170,'800'); c.fillText(e[1],x+232,cy);
    c.textAlign='right'; pFit(c,'10両',24,60,'700'); c.fillText('10両',x+W-8,cy);
  });
  c.fillStyle='rgba(0,0,0,.45)';                                                // LED の粒(3画素ごとの目地)
  for(let yy=y+30;yy<y+H;yy+=3) c.fillRect(x,yy,W,1);
  for(let xx=x;xx<x+W;xx+=3) c.fillRect(xx,y+30,1,H-30);
}
function pidsDep(i,t){
  const key='dep|'+i+'|'+t.n; if(PIDS.memo.has(key)) return PIDS.memo.get(key);
  const d={st:i,t:t}, r=pidsCell(key,1,function(c,x,y,W,H){drawDep(c,x,y,W,H,d);});
  PIDS.deps.push({r:r,d:d}); return r;
}
/* 時刻を替えたら発車標を書き直す(画面のメニュー・撮影モードの CINE.setTime から呼ぶ) */
function pidsSetTime(k){
  depNow=DEP_NOW[k]!==undefined?DEP_NOW[k]:DEP_NOW.noon;
  for(const q of PIDS.deps) pidsPaint(q.r,function(c,x,y,W,H){drawDep(c,x,y,W,H,q.d);});
}
/* 自動販売機の前面(縦長)。商品見本の窓(光る)・値札(赤=あたたか〜い/青=つめた〜い)・ボタン・
   金額の表示・投入口・取出口。k=0 赤/1 青/2 白の機体 */
function pidsVend(k){
  return pidsCell('vend'+k,1,function(c,x,y,W,H){
    c.setTransform(0,1,-1,0,x+W,y);                  // 幅128×高さ512 の立てた絵を90°回して描く
    const bc=['#c8242b','#2a5caa','#e9eaea'][k], dark=(k===2);
    c.fillStyle=bc; c.fillRect(0,0,128,512);
    c.fillStyle='#f7f8f6'; c.fillRect(8,12,112,240);
    const B=['#2b6fd0','#e8e8e8','#d9302c','#f0b400','#3aa04a','#7a4b2a','#ff7a1a','#1d1d1d'];
    for(let r=0;r<3;r++) for(let j=0;j<6;j++){
      const bx=10+j*18, by=18+r*78;
      c.fillStyle=B[(r*6+j+k*3)%8]; c.fillRect(bx+3,by+20,11,40); c.fillRect(bx+5,by+13,7,8);
      c.fillStyle='#dfe3e5'; c.fillRect(bx+5,by+9,7,4);
      c.fillStyle=(r===0&&j<3)?'#d8322e':'#2f6fd0'; c.fillRect(bx+1,by+62,15,5);
      c.fillStyle='#30343a'; c.fillRect(bx+5,by+69,7,4);
    }
    c.fillStyle=dark?'#a3a9af':'rgba(255,255,255,.92)'; c.fillRect(8,262,112,24);
    c.fillStyle=dark?'#2a2f35':bc; c.textAlign='center'; c.textBaseline='middle'; pFit(c,'DRINK',18,90,'800'); c.fillText('DRINK',64,275);
    c.fillStyle='#0f2310'; c.fillRect(12,300,60,22);
    c.fillStyle='#58e05a'; pFit(c,'0',18,40,'700'); c.fillText('0',42,312);
    c.fillStyle='#23272d'; c.fillRect(84,296,32,70);
    c.fillStyle='#8a929a'; c.fillRect(90,304,20,6); c.fillRect(90,318,20,16); c.fillRect(90,344,20,8);
    c.fillStyle='#15181c'; c.fillRect(14,416,100,56);
    c.fillStyle='#3d434a'; c.fillRect(18,420,92,12);
  });
}
/* ---- 駅の番線:ホームに面する線路を南(off の小さい側)から 1,2,… と数える ----
   京王の各駅の番線と同じ並び(左側通行なので下り=西行きは南側の線)。2面4線は外側が待避線 */
function staTracks(st,pm){
  const L=[];
  pltOf(st).forEach(function(pp,pi){
    for(const sg of[-1,1]){
      if(noStopEdge(st,pi,sg)) continue;                 // 列車が停まらない縁(仙川の島式の北)
      const edge=pp[0]+sg*pp[1];
      for(const t of TRACKS){
        if(pm<t.x0||pm>t.x1) continue;
        const o=t.zf(pm), d=sg*(o-edge);
        if(!(d>0.5&&d<2.6)) continue;
        let q=L.find(r=>Math.abs(r.off-o)<0.5);
        if(!q){ q={off:o,plats:[]}; L.push(q); }
        if(q.plats.indexOf(pi)<0) q.plats.push(pi);
      }
    }
  });
  L.sort((a,b)=>a.off-b.off);
  const quad=L.length>=4;
  L.forEach(function(q,j){
    q.n=j+1; q.dn=q.off<0; q.quad=quad;
    const same=L.filter(r=>(r.off<0)===q.dn);
    q.outer=quad&&Math.abs(q.off)>=Math.max.apply(null,same.map(r=>Math.abs(r.off)))-1e-6;
    if(q.dn){ q.dest='京王八王子・高尾山口・橋本方面'; q.en='for Keio-hachioji, Takaosanguchi, Hashimoto'; }
    else if(st.n==='笹塚'&&q.n===3){ q.dest='新宿方面'; q.en='for Shinjuku'; }
    else if(st.n==='笹塚'&&q.n===4){ q.dest='新線新宿・本八幡方面'; q.en='for Shinjuku (Keio New Line), Motoyawata'; }
    else { q.dest='新宿・本八幡方面'; q.en='for Shinjuku, Motoyawata'; }
  });
  return L;
}
/* 階段口の案内(利用者指示):ホームから階段を望む向き=黄の「出口」(列車を降りた乗客に見える)、
   階段からホームを望む向き=白の番線案内(見る人の左右に合わせて番線と方面を並べる)。両面の吊り看板。
   s=看板の位置(入口 e0 からホーム側へ)、w.trk=そのホームの線(staTracks) */
function stairGuide(md,w,s,yA,yB){
  const f=w.dir||1, oc=(w.o0+w.o1)/2, T=w.trk||[], two=T.length>=2, W=two?2.8:1.4;
  const fP=f>0?'e':'w', fS=f>0?'w':'e';          // ホーム側を向く面(法線 -f)/階段側を向く面(法線 +f)
  pidsQuad(md,pidsExit(two?2:1),s-f*0.012,oc,yA,yB,W,fP);
  const lf=f>0?1:-1;                              // 階段側の面を見る人(-f を向く)の左は lf·off の側
  const ord=T.slice().sort((a,b)=>lf*(b.off-a.off));
  if(two){
    pidsQuad(md,pidsTrack(ord[0],-1),s+f*0.012,oc+lf*W/4,yA,yB,W/2,fS);
    pidsQuad(md,pidsTrack(ord[1],1),s+f*0.012,oc-lf*W/4,yA,yB,W/2,fS);
  }else if(T.length===1){
    pidsQuad(md,pidsTrack(T[0],lf*(T[0].off-oc)>0?-1:1),s+f*0.012,oc,yA,yB,W,fS);
  }
  md.col(0x2b3036).box(SV,s,oc,yA-0.02,yB+0.02,0.016,W+0.04,{tag:'階段の案内'});
  GUIDES.push({kind:'stair',st:w.st,s:s,off:oc,w:W,dir:f,faceP:fP,faceS:fS,y0:yA,y1:yB,
    shown:ord.slice(0,two?2:1).map(q=>({n:q.n,off:q.off,dest:q.dest}))});
}
/* 発車標:階段口の少しホーム寄りに、そのホームの線ごとに1台(島式は線の側の半分の上)。両面。
   筐体・吊り棒は細部(md)。yTop=吊り棒の上端(屋根・上屋の天井) */
function depBoards(md,w,s,yt,yTop){
  const T=w.trk||[]; if(!T.length) return;
  const two=T.length>=2, bw=two?Math.min(2.3,w.hw-0.45):Math.min(2.3,2*w.hw-0.9), yA=yt+2.70, yB=yA+bw/4;   // 案内(〜2.62)の上に見える高さ
  for(const t of T){
    const oc=two?w.pc+Math.sign(t.off-w.pc)*(0.12+bw/2):w.pc, r=pidsDep(STA.indexOf(w.st),t);
    pidsQuad(md,r,s+0.07,oc,yA,yB,bw,'w'); pidsQuad(md,r,s-0.07,oc,yA,yB,bw,'e');
    md.col(0x15181c).box(SV,s,oc,yA-0.04,yB+0.04,0.13,bw+0.08,{tag:'発車標'});
    for(const e of[-1,1]) md.col(0x8d949b).box(SV,s,oc+e*(bw/2-0.2),yB+0.04,yTop,0.04,0.04);
    GUIDES.push({kind:'dep',st:w.st,s:s,off:oc,w:bw,n:t.n,toff:t.off,y0:yA,y1:yB,t:t});
  }
}
/* ---- 駅の外装と駅舎の模様のテクスチャ ----------------------------------------
   小さな画像を UV で繰り返す(データ量を増やさない)。白っぽく描いておき、色合いは
   頂点カラーで塗り分ける(同じ模様で何色も出せ、材質=描画の呼び出しを増やさない)。 */
function texOf(w,h,draw){
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  draw(cv.getContext('2d'),w,h);
  const t=canvasTex(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
// レンガ(代田橋):1こま=4段×2丁。UV は 1m あたり (1/0.44, 1/0.28)
const brickTex=texOf(128,64,function(c){
  const tone=['#a8604f','#9c5646','#b36a56','#a35b4a','#ad6552'];
  for(let r=0;r<4;r++)for(let k=-1;k<3;k++){
    c.fillStyle=tone[(r*3+k+5)%tone.length];
    c.fillRect(k*64+(r%2)*32+2,r*16+2,60,12);
  }
  c.globalCompositeOperation='destination-over';c.fillStyle='#cdbfae';c.fillRect(0,0,128,64);
});
// 横ルーバー(明大前):白い羽根と淡い灰の隙間。羽根の厚さを不揃いに。1こま=高さ0.9m
const louverTex=texOf(16,128,function(c,w,h){
  c.fillStyle='#aab1b8';c.fillRect(0,0,w,h);
  let y=0,k=0;
  while(y<h){const t=(k%7===3)?8:4; c.fillStyle=(k%11===5)?'#d6dade':'#f5f7f8'; c.fillRect(0,y,w,t); y+=t+3; k++;}
});
// 縦リブ(桜上水の外装):細かい縦の凹凸。1こま=幅0.3m
const ribTex=texOf(32,8,function(c,w,h){

// 石積み(芦花公園・上北沢):大きさの不揃いな切石。1こま=2.4m×1.2m
const stoneTex=texOf(128,64,function(c){

    while(x<128){const w=22+((k*37)%26); c.fillStyle=tone[k%tone.length]; c.fillRect(x+1,r[0]+1,w-2,r[1]-2); x+=w; k++;}
  });

// 立ハゼの屋根(大屋根の上面):1こま=幅0.5m
const seamTex=texOf(16,4,function(c,w,h){

// 木の縦ルーバー(駅舎の壁):1こま=幅0.6m
const slatTex=texOf(32,8,function(c,w,h){

  c.fillStyle='#f2efe9';c.fillRect(2,0,10,h);c.fillRect(18,0,10,h);

const MAT_BRICK=M(0xffffff,{map:brickTex,vertexColors:true});
const MAT_LOUVER=M(0xffffff,{map:louverTex});
const MAT_RIB=M(0xffffff,{map:ribTex,vertexColors:true});
const MAT_STONE=M(0xffffff,{map:stoneTex,vertexColors:true});
const MAT_SEAM=M(0xffffff,{map:seamTex,vertexColors:true});
const MAT_SLAT=M(0xffffff,{map:slatTex,vertexColors:true});
// 半透明のパネル(明大前の駅舎の壁)
MAT.frost=mkMat('MeshLambertMaterial',{color:0xeef2f4,transparent:true,opacity:.62,side:THREE.DoubleSide});
// 決まった乱数(0〜1)。外装の"不揃い"を毎回同じ形にする(Math.random は撮影で種を替えるので使わない)
const hash01=n=>{const x=Math.sin(n*12.9898+78.233)*43758.5453;return x-Math.floor(x);};
// バラスト(地上部の道床):大きさの不揃いな砕石。1こま=1.2m
const MAT_BALLAST=M(0xffffff,{vertexColors:true,map:texOf(64,64,function(c){
  c.fillStyle='#8f8a82';c.fillRect(0,0,64,64);
  for(let i=0;i<520;i++){const v=118+Math.floor(hash01(i)*100);c.fillStyle='rgb('+v+','+(v-3)+','+(v-9)+')';
    c.fillRect(Math.floor(hash01(i+1e3)*64),Math.floor(hash01(i+2e3)*64),2+Math.floor(hash01(i+3e3)*3),2+Math.floor(hash01(i+4e3)*3));}
})});
/* ---- 駅の構造(2026-10 作り込み) -------------------------------------------
   【設計方針】駅は次の部品に分けて組み立てる。すべて駅ごとの結合ジオメトリ(STG)へ積むので、
   細かくしても描画の呼び出しは駅あたり材質の数(10回程度)で済む。遠くでは細部(md)を省く。
     ホーム    … 縁の張出し(下は退避空間)・縁石・点字ブロック・端の柵・番線の機器
     屋根      … 大屋根(公表デザインの7駅)/片持ちの上屋(既存駅)。梁・天井・鼻隠し・天窓
     柱        … ホームの樹状柱(枝で屋根の梁を受ける)。架線柱は屋根の梁と同じ位置で受ける
     昇降      … 階段とエスカレーターの井戸(床を抜く)・エレベーター
     サイン    … 吊りレールの駅名標(線路に向けて両面)・出口の案内・駅舎の看板
     ベンチ等  … ベンチ・自動販売機(乗務員用モニターは置かない:車上の車内モニター式とする。利用者指示)
     外装      … 側面(ホーム階)と高架下の駅舎。公表デザインの要点を形で表す
   公表デザインの要点(京王電鉄 2019.5.30 の発表文。図は参照できていない):
     代田橋   … レンガ調+透明感のある素材(近隣の歴史的建築物・玉川上水の流れ)
     明大前   … 透明感のある素材をリズミカルに組み合わせる(街の賑やかさと移り変わり)
     下高井戸 … 温かな色彩の大庇を街へ向けて広げる(商店街との繋がり)
     桜上水   … 木質調など自然と調和する質感・柔らかな配色(静かな住宅街と共存)
     上北沢   … 落ち着いた色合いの素材+透明感のある素材(桜並木が映える)
     芦花公園 … 木質調の縦格子を並べて書架を表現(文学にゆかりのある街)
     千歳烏山 … 温かみのある配色+開放感のある粗目の格子(街との一体感)
   八幡山(1970年に高架化済み)・笹塚(既設高架)・仙川(地上)は発表の対象外なので、
   既存駅らしい片持ちの上屋とする。 */
const SV=MAT.stVC;
const fv=(v,s)=>(typeof v==='function')?v(s):v;
// 水平な面(o0<o1)。up=true で上向き
function hS(Sx,mat,s0,s1,o0,o1,yf,up,o){
  return Sx.loft(mat,s0,s1,s=>[[fv(o0,s),yf],[fv(o1,s),yf]],Object.assign({side:up?-1:1},o||{}));
}
// 鉛直な面(y0<y1)。side=+1 で +off 向き
function vS(Sx,mat,s0,s1,o,y0,y1,side,o2){
  return Sx.loft(mat,s0,s1,s=>[[fv(o,s),y0],[fv(o,s),y1]],Object.assign({side:side},o2||{}));
}
// 線路方向に通る角材(断面 off o±hw・高さ y0〜y1)
function bar(Sx,col,s0,s1,o,hw,y0,y1,o2){
  Sx.col(col).loft(SV,s0,s1,s=>{const c=fv(o,s);return [[c-hw,y0],[c+hw,y0],[c+hw,y1],[c-hw,y1]];},
    Object.assign({closed:true,caps:true},o2||{}));
}
// その s が井戸・エレベーターの近く(柱やベンチを置かない範囲)か
const nearAny=(s,list,m)=>list.some(q=>s>q.s0-m&&s<q.s1+m);

/* ホームの躯体。線路に面する縁は張出し(厚さ LIP)の下を RECESS だけ引っ込める
   (実物のホーム下の退避空間)。線路の無い縁(相対式の背面など)は垂直に落とす。
   wells の範囲は床を抜いて井戸にする(その区間は井戸の左右に分けて作る)。 */
function platBody(S,x0,x1,pc,hw,y,wells,sh){
  const SH=sh||[()=>0,()=>0], fL=SH[0], fR=SH[1];
  const mid=(x0+x1)/2, mg=S.mg, yb=y<3?Math.min(y-DECK_DROP,floorY(mid)):y-DECK_DROP, yt=y+STD.PLAT, yl=yt-STD.LIP;   // 地上・掘割の駅は躯体を地表(底)まで
  const tL=trackNear(mid,pc-hw-TACTILE_TOL/2,TACTILE_TOL/2);
  const tR=trackNear(mid,pc+hw+TACTILE_TOL/2,TACTILE_TOL/2);
  const cuts=[x0,x1];
  for(const w of wells) cuts.push(clamp(w.s0,x0,x1),clamp(w.s1,x0,x1));
  cuts.sort((a,b)=>a-b);
  for(let k=0;k<cuts.length-1;k++){
    const a=cuts[k], b=cuts[k+1]; if(b-a<0.01) continue;
    const m=(a+b)/2, w=wells.find(q=>m>q.s0&&m<q.s1);
    const spans=w?[[pc-hw,w.o0],[w.o1,pc+hw]]:[[pc-hw,pc+hw]];
    for(const sp of spans){
      const l0=sp[0], r0=sp[1], eL=(l0===pc-hw), eR=(r0===pc+hw);
      // 縁は面する線路に沿う(待避線がホームの端で曲がる駅。井戸の脇は中ほどなので曲がらない)
      const L=s=>l0+(eL?fL(s):0), R=s=>r0+(eR?fR(s):0);
      // 床版。C[i]=点iから点i+1までの面の色。上面の縁0.5mは明るい縁石
      const C=[0x8a8d92,eR?0xdcd9cf:0x9a9da2];
      if(eR) C.push(0xd8d5ca,0xbdbcb5); else C.push(0xbdbcb5);
      if(eL) C.push(0xd8d5ca);
      C.push(eL?0xdcd9cf:0x9a9da2);
      const prof=s=>{const l=L(s), r=R(s), P=[[l,yl],[r,yl]];
        if(eR) P.push([r,yt],[r-0.5,yt]); else P.push([r,yt]);
        if(eL) P.push([l+0.5,yt]);
        P.push([l,yt]); return P;};
      mg.loft(SV,a,b,prof,{closed:true,caps:true,cols:C,tag:'ホーム',step:1,tol:0.005});
      // 床版の下の躯体。線路側は引っ込める(張出しの下に影ができる)
      const iL=(eL&&tL)?STD.RECESS:0, iR=(eR&&tR)?STD.RECESS:0;
      const Q=s=>[[L(s)+iL,yb],[R(s)-iR,yb],[R(s)-iR,yl],[L(s)+iL,yl]];
      const QC=[0x777a80,(eR&&tR)?0x6c7075:(eR?0xb3b6ba:0x8d9095),0x777a80,(eL&&tL)?0x6c7075:(eL?0xb3b6ba:0x8d9095)];
      mg.loft(SV,a,b,Q,{closed:true,caps:true,cols:QC,step:1,tol:0.005});
    }
  }
}
/* 階段とエスカレーターの井戸。w.dir=+1 なら入口は s0 側で +s へ降りる/-1 なら入口は s1 側で
   -s へ降りる。奥は手すり壁で閉じる。幅の左55%が階段、残りがエスカレーター(下り)。
   床版の下に続く先は暗がりにする。 */
function stairWell(S,w,y){
  const mg=S.mg, md=S.md, yt=y+STD.PLAT, yb=y-DECK_DROP;
  const f=w.dir||1, e0=f>0?w.s0:w.s1, e1=f>0?w.s1:w.s0;      // 入口・奥
  const oS=w.o0+(w.o1-w.o0)*0.55;
  mg.col(0x23272c); hS(mg,SV,w.s0,w.s1,w.o0,w.o1,yb+0.02,true);           // 井戸の底
  const rise=0.165, run=0.30, N=Math.ceil((yt-yb)/rise);
  for(let k=0;k<N;k++){                                                   // 階段(段の塊を積む)
    const sA=e0+f*k*run, yB=Math.max(yb+0.04,yt-(k+1)*rise);
    mg.col(0x9b9994).box(SV,sA+f*run/2,(w.o0+oS)/2,yb,yB,run,oS-w.o0-0.02,{skip:'-y'});
    md.col(0xcdbd84).box(SV,sA+f*0.03,(w.o0+oS)/2,yB,yB+0.006,0.06,oS-w.o0-0.04,{skip:'-y'});   // 段鼻の滑り止め
  }
  // エスカレーター:乗り口の床板(金属)と、30°で下る踏み段の帯
  const sC=e0+f*0.7, dl=(yt-yb-0.04)/Math.tan(Math.PI/6), eo=(oS+w.o1)/2, ehw=(w.o1-oS)/2-0.06;
  mg.col(0xb4b8bd).box(SV,e0+f*0.35,eo,yt-0.04,yt,0.7,ehw*2,{skip:'-y'});
  mg.col(0x3a3e44).box(SV,sC+f*dl/2,eo,yt-0.06-dl*Math.tan(Math.PI/6)/2-0.03,yt-0.06-dl*Math.tan(Math.PI/6)/2+0.03,
    dl/Math.cos(Math.PI/6),ehw*2,{pitch:-f*Math.PI/6});
  for(const o of[oS+0.03,w.o1-0.03]){                                     // 欄干(ガラス)と手すり
    const A=mg.axes(sC,o), B=mg.axes(sC+f*dl,o);
    const p0=[A.f.x,yt,A.f.z], p1=[B.f.x,yb+0.04,B.f.z];
    mg.face(MAT.glass,[p0,p1,[p1[0],p1[1]+0.9,p1[2]],[p0[0],p0[1]+0.9,p0[2]]],A.n);
    md.col(0x1a1c1f).tube(SV,[p0[0],p0[1]+0.93,p0[2]],[p1[0],p1[1]+0.93,p1[2]],0.04,6);
  }
  // 囲い:長辺2面と奥の面にガラスの手すり壁(高さ1.1m)。下に金属の幅木、上に笠木
  const H=1.1;
  vS(mg,MAT.glass,w.s0,w.s1,w.o0,yt,yt+H,-1); vS(mg,MAT.glass,w.s0,w.s1,w.o1,yt,yt+H,1);
  {const A0=mg.axes(e1,w.o0), A1=mg.axes(e1,w.o1);
   mg.face(MAT.glass,[[A0.f.x,yt,A0.f.z],[A1.f.x,yt,A1.f.z],[A1.f.x,yt+H,A1.f.z],[A0.f.x,yt+H,A0.f.z]],v3sc(A0.t,f));}
  for(const o of[w.o0,w.o1]){
    bar(mg,0xc3c7cc,w.s0,w.s1,o,0.04,yt,yt+0.12,{tag:'階段の囲い'});
    bar(md,0xd4d8dc,w.s0,w.s1,o,0.035,yt+H,yt+H+0.05);
  }
  mg.col(0xc3c7cc).box(SV,e1,(w.o0+w.o1)/2,yt,yt+0.12,0.08,w.o1-w.o0,{skip:'-y'});
  md.col(0xd4d8dc).box(SV,e1,(w.o0+w.o1)/2,yt+H,yt+H+0.05,0.07,w.o1-w.o0,{skip:'-y'});
  for(let s=w.s0+1.5;s<w.s1-0.5;s+=1.5) for(const o of[w.o0,w.o1])          // 支柱
    md.col(0xc3c7cc).box(SV,s,o,yt,yt+H,0.05,0.05,{skip:'-y'});
  // 入口の案内:ホーム側=出口(黄)/階段側=番線案内(白)。少しホーム寄りに発車標
  stairGuide(md,w,e0-f*0.6,yt+2.25,yt+2.62);
  depBoards(md,w,e0-f*4.0,yt,w.yTop);
}
/* 地上駅(仙川)の上り階段:ホームから線路の上の橋上駅舎(床 yF)へ上がる。w の向きは stairWell と同じ
   (入口 e0 → 奥 e1)。奥の端で駅舎の床に着く。半分が階段(段の塊)、半分が上りエスカレーター。
   屋根と両側のガラスで囲う(入口側は水平、段の上は勾配なり) */
function stairUp(S,w,y,yF){
  const mg=S.mg, md=S.md, yt=y+STD.PLAT, f=w.dir||1, e0=f>0?w.s0:w.s1, e1=f>0?w.s1:w.s0;
  const oS=w.o0+(w.o1-w.o0)*0.55, run=0.30, N=Math.ceil((yF-yt)/0.165), r=(yF-yt)/N, sB=e1-f*N*run;
  for(let k=0;k<N;k++){
    const sA=sB+f*k*run, yA=yt+(k+1)*r;
    mg.col(0x9b9994).box(SV,sA+f*run/2,(w.o0+oS)/2,yt,yA,run,oS-w.o0-0.02,{skip:'-y'});
    md.col(0xcdbd84).box(SV,sA+f*0.03,(w.o0+oS)/2,yA,yA+0.006,0.06,oS-w.o0-0.04,{skip:'-y'});   // 段鼻の滑り止め
  }
  const dl=(yF-yt)/Math.tan(Math.PI/6), eo=(oS+w.o1)/2, ehw=(w.o1-oS)/2-0.06, ym=(yt+yF)/2-0.45;   // エスカレーター(トラス込み)
  mg.col(0x5a5f66).box(SV,e1-f*dl/2,eo,ym-0.5,ym+0.5,dl/Math.cos(Math.PI/6),ehw*2,{pitch:f*Math.PI/6});
  mg.col(0xb4b8bd).box(SV,e1-f*(dl+0.35),eo,yt,yt+0.04,0.7,ehw*2,{skip:'-y'});
  const H=2.6, P=(s,o,yy)=>{const q=frame(s,o);return [q.x,yy,q.z];}, A=mg.axes(e0,0);
  for(const o of[w.o0,w.o1]){                                             // 両側のガラス(入口側+勾配の部分)
    mg.face(MAT.glass,[P(e0,o,yt),P(sB,o,yt),P(sB,o,yt+H),P(e0,o,yt+H)],A.n);
    mg.face(MAT.glass,[P(sB,o,yt),P(e1,o,yF),P(e1,o,yF+H),P(sB,o,yt+H)],A.n);
    bar(md,0xc3c7cc,Math.min(e0,sB),Math.max(e0,sB),o,0.04,yt+H-0.06,yt+H+0.02);
  }
  for(const sd of[1,-1]){                                                  // 屋根(上面と下面)
    const y0=yt+H+(sd>0?0.12:0), y1=yF+H+(sd>0?0.12:0), a=w.o0-0.15, b=w.o1+0.15;
    mg.col(0xd5d8db).face(SV,[P(e0,a,y0),P(sB,a,y0),P(sB,b,y0),P(e0,b,y0)],[0,sd,0])
      .face(SV,[P(sB,a,y0),P(e1,a,y1),P(e1,b,y1),P(sB,b,y0)],[0,sd,0]);
  }
  stairGuide(md,w,e0-f*0.05,yt+2.05,yt+2.42);                              // 入口の案内:出口(黄)/番線案内(白)
  depBoards(md,w,e0-f*4.0,yt,w.yTop);
}
/* 橋上駅舎:線路の上を渡る駅舎。床の下端はレール面+7.6m(架線柱の頂部・ビームより上)。
   ガラスの帯の壁・屋根・柱(ホームの中心線と線路の外)。看板は南北の面に */
function concourse(S,st,s0,s1,o0,o1,y,yF,cols){
  const mg=S.mg, yB=yF-0.34, i=STA.indexOf(st), c=(o0+o1)/2, hw=(o1-o0)/2;           // 床の厚さ 0.34m
  mg.col(0xc9ccd0).cbox(SV,s0,s1,c,hw,yB,yF,{tag:'橋上駅舎'});                              // 床
  mg.col(0xe8e9e6).cbox(SV,s0,s1,c,hw+0.6,yF+3.3,yF+3.55,{tag:'橋上駅舎'});                // 屋根
  for(const o of[o0,o1]){
    mg.col(st.c).cbox(SV,s0,s1,o,0.12,yF,yF+0.9).col(0xdfe1e3).cbox(SV,s0,s1,o,0.12,yF+2.8,yF+3.3);
    vS(mg,MAT.glass,s0,s1,o,yF+0.9,yF+2.8,o>c?1:-1);
  }
  const P=(s,o,yy)=>{const q=frame(s,o);return [q.x,yy,q.z];};
  for(const s of[s0,s1]) mg.face(MAT.glass,[P(s,o0,yF),P(s,o1,yF),P(s,o1,yF+3.3),P(s,o0,yF+3.3)],mg.axes(s,0).t);
  for(const q of cols) for(const s of q.s) mg.col(0xd9dbdd).box(SV,s,q.o,q.y,yB,0.6,0.6,{skip:'-y',tag:'橋上駅舎の柱'});
  for(const sg of[-1,1]) signQuad(mg,3*i+2,(s0+s1)/2,sg>0?o1+0.13:o0-0.13,yF+2.85,yF+3.25,6.0,sg);
}
/* エレベーター:ガラスのかご路(2m角)・四隅の柱・上の機械箱(駅の色)・扉(ステンレス)。
   H=かご路の高さ(地上駅は橋上駅舎の床まで) */
function elevator(S,s,o,y,col,Hh){
  const mg=S.mg, yt=y+STD.PLAT, H=Hh||2.5;
  mg.box(MAT.glass,s,o,yt,yt+H,2.0,2.0,{skip:'-y+y',tag:'エレベーター'});
  for(const a of[-0.97,0.97])for(const b of[-0.97,0.97])
    mg.col(0xb9bec4).box(SV,s+a,o+b,yt,yt+H,0.08,0.08,{skip:'-y'});
  mg.col(col).box(SV,s,o,yt+H,yt+H+0.25,2.1,2.1);
  mg.col(0xc9cdd2).box(SV,s-1.02,o,yt,yt+2.1,0.04,1.05,{skip:'-y'});        // 扉(新宿方を向く)
  mg.col(0x5b6470).box(SV,s-1.03,o,yt+2.1,yt+2.3,0.03,1.2,{skip:'-y'});      // 扉の上の表示
  S.md.col(0x30353b).box(SV,s+0.1,o,yt,yt+2.3,1.6,1.6,{skip:'-y'});          // かご(ガラス越しに見える)
}
/* ホームの付帯物(ベンチ・自動販売機)。近くだけ描く。乗務員用のホームモニターは置かない

/* 自動販売機(飲料)。機体はその色(赤・青・白)、前面は商品見本の窓・投入口・取出口を描いた光る面。

/* ---- 屋根 ---- */
/* 大屋根の形(駅ごと)。断面を「上面」「天井」の折れ線(-E→+E、高さはレール面基準)で持つ。
   既定は平らな屋根(中央が少し盛り上がる)。上北沢は公表パースのとおり軒を下げて屋根面を
   見せる(ガラスのスクリーンの上に立ハゼの屋根)。線路の上では天井をレール面+7.05m以上に
   保つ(パンタグラフ・架線より上。⑪が確かめる)。 */
const ROOF_DEF={
  top:E=>[[-E,STD.ROOF],[0,STD.ROOF+STD.CROWN],[E,STD.ROOF]],
  ceil:E=>[[-E,STD.CEIL],[E,STD.CEIL]],
  beam:E=>E-0.25, fas:[STD.FAS0,STD.FAS1],
};
const ROOF_OF={
  '上北沢':{
    top:E=>[[-E,5.25],[-(E-1.9),7.85],[0,8.45],[E-1.9,7.85],[E,5.25]],
    ceil:E=>[[-E,5.0],[-(E-1.9),7.55],[E-1.9,7.55],[E,5.0]],
    beam:E=>E-2.2, fas:[4.92,5.3],
  },
};
// 鼻隠し・屋根の色(公表パース)。屋根の上面は立ハゼ
const FAC_ROOF={'代田橋':0xd6c7a6,'明大前':0xe2e5e8,'下高井戸':0xf2f3f4,'桜上水':0xd9d3ca,
                '上北沢':0xeef0f2,'芦花公園':0x2e3134,'千歳烏山':0x8f7d68};
// 折れ線 poly 上の off における高さ
function polyAt(poly,o){
  if(o<=poly[0][0]) return poly[0][1];
  for(let i=1;i<poly.length;i++){
    const a=poly[i-1],b=poly[i];
    if(o<=b[0]) return a[1]+(b[1]-a[1])*(o-a[0])/Math.max(1e-9,b[0]-a[0]);
  }
  return poly[poly.length-1][1];
}
// 大屋根(ホーム階全体を覆う)。梁は柱の位置と架線柱の位置に入れる。
// 屋根の下には架線柱を建てない(5章)ので、架線はこの梁から吊る(吊り材を線路ごとに下ろす)
function bigRoof(S,st,y,colLines){
  const mg=S.mg, md=S.md, c0=st.x, R0=c0-STD.RL, R1=c0+STD.RL, R=ROOF_OF[st.n]||ROOF_DEF;
  const E=s=>deckHalf(s)+0.38;
  const lift=(p)=>p.map(q=>[q[0],y+q[1]]);
  // 天井(下向き)と上面(上向き・立ハゼ)
  const ce=R.ceil(E(c0));
  for(let i=0;i<ce.length-1;i++)
    mg.col(0xe9e9e5).loft(SV,R0,R1,s=>{const p=lift(R.ceil(E(s)));return [p[i],p[i+1]];},{side:1,tag:'大屋根'});
  const tp=R.top(E(c0));
  for(let i=0;i<tp.length-1;i++)
    mg.col(0xb3b9bf).loft(MAT_SEAM,R0,R1,s=>{const p=lift(R.top(E(s)));return [p[i],p[i+1]];},
      {side:-1,uv:(s,p)=>[s/0.5,p[0]/4]});
  for(const sg of[-1,1])                                                         // 鼻隠し
    mg.col(FAC_ROOF[st.n]||st.c).loft(SV,R0,R1,s=>{const o=sg*E(s),i=sg*(E(s)-0.2);
      return [[i,y+R.fas[0]],[o,y+R.fas[0]],[o,y+R.fas[1]],[i,y+R.fas[1]]];},{closed:true,caps:true});
  for(const s of[R0,R1]){                                                        // 妻側の屋根の厚み
    const e=E(s), A=mg.axes(s,0), f=s<c0?-1:1, cp=R.ceil(e), tq=R.top(e);
    const offs=[...new Set(cp.map(q=>q[0]).concat(tq.map(q=>q[0])))].sort((p,q)=>p-q);
    const P=(o,yy)=>{const q=frame(s,o);return [q.x,yy,q.z];};
    for(let i=0;i<offs.length-1;i++){
      const a=offs[i], b=offs[i+1];
      mg.col(0xc9ccd0).face(SV,[P(a,y+polyAt(cp,a)),P(b,y+polyAt(cp,b)),P(b,y+polyAt(tq,b)),P(a,y+polyAt(tq,a))],v3sc(A.t,f));
    }
  }
  // 梁(柱の位置と架線柱の位置)。下面は天井より下に見える
  const poles=POLE_S.filter(p=>p>R0+1&&p<R1-1);
  for(const s of colLines.concat(poles)){
    const e=R.beam(E(s));
    mg.col(0xd5d8db).box(SV,s,0,y+STD.BEAM,y+STD.CEIL,0.32,e*2,{skip:'+y',tag:'屋根の梁'});
  }
  // 架線は架線柱の位置の梁から可動ブラケットで吊る(6b章 buildCatenary)
  // 天窓(ホームの上。空が映るガラスの帯)
  for(const p of pltOf(st)){
    const a=c0-92, b=c0+92, o0=p[0]-1.0, o1=p[0]+1.0;
    const yr=s=>o=>y+polyAt(R.top(E(s)),o);
    mg.loft(MAT.glass,a,b,s=>[[o0,yr(s)(o0)+0.12],[o1,yr(s)(o1)+0.12]],{side:-1});
    for(const o of[o0,o1]) bar(mg,0x7b828a,a,b,o,0.06,yr(c0)(o)-0.05,yr(c0)(o)+0.16);
  }
}
// 片持ちの上屋(既存駅)。ホームの中心線の柱で受ける
function canopy(S,x0,x1,pc,hw,y,col){
  const mg=S.mg, w=hw+0.35, yc=y+STD.CAN0, yr=y+STD.CAN1;
  mg.col(0xdedfda); hS(mg,SV,x0,x1,pc-w,pc+w,yc,false,{tag:'上屋'});
  mg.col(0x8d949b).loft(SV,x0,x1,()=>[[pc-w,yr-0.08],[pc,yr+0.12],[pc+w,yr-0.08]],{side:-1});
  for(const sg of[-1,1])
    mg.col(col).loft(SV,x0,x1,()=>{const o=pc+sg*w;return [[o-sg*0.14,yc-0.1],[o,yc-0.1],[o,yr],[o-sg*0.14,yr]];},{closed:true,caps:true});
  for(const s of[x0,x1]){
    const A=mg.axes(s,pc), P=(o,yy)=>{const f=frame(s,o);return [f.x,yy,f.z];};
    mg.col(0xc9ccd0).face(SV,[P(pc-w,yc),P(pc+w,yc),P(pc+w,yr-0.08),P(pc,yr+0.12),P(pc-w,yr-0.08)],v3sc(A.t,s<(x0+x1)/2?-1:1));
  }
}

/* ---- 側面の外装(公表パース 2019.5.30)。sg=+1:北面/-1:南面 ---------------------
   外装の外面は桁端から d=0.15m 外。範囲は大屋根と同じ。下端は床版の上面(レール面-0.6m)で、
   その下の高架の側面(桁)も駅ごとの色・材で覆う(パースでは桁の色が駅ごとに違う)。
   形の大きいもの(帯・格子・縦材)は mg、細い方立などは md(近くだけ)。
   不透明の板は厚みのある箱で作る(片面の板だとホームの内側から見て消える)。 */
const FD=0.15, FAC_Y0=-0.6;
const WEAVE=[];                 // 千歳烏山の格子の交点(横・縦の帯の off)。検証用
const fO=(sg,d)=>s=>sg*(deckHalf(s,sg)+d);
function fBand(Sx,mat,col,s0,s1,sg,d,th,y0,y1,o){        // 厚さ th の板(外面が d)
  if(col!==null) Sx.col(col);
  Sx.loft(mat,s0,s1,s=>{const o2=sg*(deckHalf(s,sg)+d);return [[o2-sg*th,y0],[o2,y0],[o2,y1],[o2-sg*th,y1]];},
    Object.assign({closed:true,caps:true},o||{}));
}
function fRail(Sx,col,s0,s1,sg,d,dep,y0,y1,tag){        // 外装に沿って通る横材(曲線に追従)
  fBand(Sx,SV,col,s0,s1,sg,d+dep,dep,y0,y1,{tag:tag});
}
function fGlass(Sx,s0,s1,sg,d,y0,y1,tag){ vS(Sx,MAT.glass,s0,s1,fO(sg,d),y0,y1,sg,{tag:tag}); }
function fFin(Sx,col,sx,sg,d,w,dep,y0,y1,tag){            // 外装の面から外へ dep 張り出す縦材
  Sx.col(col).box(SV,sx,sg*(deckHalf(sx,sg)+d+dep/2),y0,y1,w,dep,{skip:'-y',tag:tag});
}
const uvW=(su,sv)=>(s,p)=>[s/su,p[1]/sv];                  // 鉛直な面の模様の UV
const FAC={
  /* 代田橋:細い縦材(1.6m間隔・真鍮色)の間に透明なスクリーン。その前を密な縦ルーバーの帯が
     下に寄ったり上に寄ったりしながら流れる(玉川上水の流れ)。桁は暗い灰 */
  '代田橋':function(S,st,sg,y){
    const a=st.x-STD.RL+1, b=st.x+STD.RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0, H=y1-y0, c0=st.x;
    fBand(S.mg,SV,0x5b5f64,a,b,sg,FD,0.2,yg,y0,{tag:'外装:高架の側面'});
    fGlass(S.mg,a,b,sg,FD-0.06,y0,y1,'外装:透明のスクリーン');
    for(let s=a;s<=b+0.01;s+=1.6) fFin(S.mg,0xd6c7a6,s,sg,FD,0.09,0.22,y0,y1+0.2,'外装:縦材');
    for(let s=a+0.2;s<b;s+=0.4){
      const u=(s-c0)/80*Math.PI*2, cc=0.5+0.27*Math.sin(u), w=0.23+0.04*Math.sin(u*2.3+1.1);
      const lo=y0+H*clamp(cc-w,0,1), hi=y0+H*clamp(cc+w,0,1);
      fFin(S.mg,0xbca37a,s,sg,FD+0.22,0.07,0.26,lo,hi,'外装:流れのルーバー');
    }
  },
  /* 明大前:方立(1.55m間隔)の格子に、白い横ルーバー・灰の板・透明のガラスを不揃いに入れ、
     ところどころに紫の横帯。上の段ほど透明が多い(屋根の骨組みが透けて見える)。桁は明るい灰 */
  '明大前':function(S,st,sg,y){
    const a=st.x-STD.RL+1, b=st.x+STD.RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0, B=1.55, T=[0,0.28,0.54,0.76,1];
    fBand(S.mg,SV,0xc4c7ca,a,b,sg,FD,0.2,yg,y0,{tag:'外装:高架の側面'});
    let k=0;
    for(let s=a;s<b-0.05;s+=B,k++){
      const e=Math.min(s+B,b);
      for(let t=0;t<4;t++){
        const ya=y0+(y1-y0)*T[t], yb=y0+(y1-y0)*T[t+1], h=hash01(k*7+t*131+sg*977);
        const type=(t===3)?(h<0.55?'c':h<0.85?'l':'s'):(h<0.6?'l':h<0.85?'s':'c');
        if(type==='l'){
          fBand(S.mg,MAT_LOUVER,null,s,e,sg,FD-0.02,0.04,ya,yb,{uv:(ss,p)=>[ss/B,(p[1]-y0)/0.9],tag:'外装:横ルーバー'});
          if(hash01(k*13+t*17+sg*5)<0.45){
            const n=hash01(k*3+t+sg)<0.7?1:2;
            for(let j=0;j<n;j++){
              const yy=ya+0.2+(yb-ya-0.55)*hash01(k*29+t*7+j*3+sg);
              fFin(S.mg,0x6b33b8,(s+e)/2,sg,FD-0.02,e-s-0.12,0.05,yy,yy+0.26,'外装:紫のアクセント');
            }
          }
        }else if(type==='s') fBand(S.mg,SV,0xb6bbc0,s+0.02,e-0.02,sg,FD-0.01,0.04,ya,yb,{tag:'外装:灰の板'});
        else fGlass(S.mg,s,e,sg,FD-0.03,ya,yb,'外装:透明');
      }
      fFin(S.md,0xd5d8db,s,sg,FD,0.06,0.12,y0,y1);
    }
    for(const t of T) fRail(S.md,0xd5d8db,a,b,sg,FD,0.08,y0+(y1-y0)*t-0.035,y0+(y1-y0)*t+0.035);
  },
  /* 下高井戸:白い箱。下は白い腰壁、上は大きなガラス(2.6m割り)。新宿方と反対の半分は
     ガラスと換気ガラリの白い板を交互に。桁は灰。街側の大庇は高架下の駅舎(bldg)で作る */
  '下高井戸':function(S,st,sg,y){
    const a=st.x-STD.RL+1, b=st.x+STD.RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0, c0=st.x, B=2.6;
    fBand(S.mg,SV,0xa1a6ac,a,b,sg,FD,0.2,yg,y0,{tag:'外装:高架の側面'});
    fBand(S.mg,SV,0xe9ebed,a,b,sg,FD,0.2,y0,y+2.1,{tag:'外装:白い腰壁'});
    fRail(S.md,0xc9cdd2,a,b,sg,FD,0.02,y+0.7,y+0.74);
    fGlass(S.mg,a,b,sg,FD-0.06,y+2.1,y+6.5,'外装:ガラスの帯');
    fBand(S.mg,SV,0xf2f3f4,a,b,sg,FD,0.2,y+6.5,y1);
    let k=0;
    for(let s=a;s<b-0.05;s+=B,k++){
      fFin(S.md,0xdfe2e5,s,sg,FD,0.08,0.14,y+2.1,y+6.5);
      if(s>c0&&k%2===0){
        const e=Math.min(s+B,b);
        fBand(S.mg,SV,0xeef0f1,s+0.06,e-0.06,sg,FD+0.02,0.04,y+2.1,y+6.5,{tag:'外装:ガラリの板'});
        for(const y2 of[y+2.25,y+2.45,y+2.65,y+5.75,y+5.95,y+6.15])
          fFin(S.mg,0x59616a,(s+e)/2,sg,FD+0.02,e-s-0.4,0.04,y2,y2+0.08);
      }
    }
  },
  /* 桜上水:縦リブの板(淡い灰・2色)と細長い窓を不揃いに並べた箱。窓の1か所は4枚の幅広。
     下は暗い茶の帯(細い縦目地) */
  '桜上水':function(S,st,sg,y){
    const a=st.x-STD.RL+1, b=st.x+STD.RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0;
    fBand(S.mg,SV,0x40372f,a,b,sg,FD,0.2,yg,y0,{tag:'外装:暗い帯'});
    for(let s=a;s<b;s+=0.6) fFin(S.md,0x2c2622,s,sg,FD,0.03,0.02,yg,y0);
    const SEQ=[[3.0,'r'],[0.7,'g'],[2.6,'d'],[1.0,'g'],[3.6,'r'],[0.6,'g'],[2.2,'d'],[4.6,'W'],
               [2.8,'r'],[0.8,'g'],[1.8,'d'],[3.2,'r'],[0.7,'g']];
    const rib=(s0,s1,col,ya,yb,tag)=>fBand(S.mg,MAT_RIB,col,s0,s1,sg,FD,0.05,ya,yb,{uv:uvW(0.3,2),tag:tag});
    let s=a,k=0;
    while(s<b-0.05){
      const q=SEQ[k%SEQ.length], e=Math.min(s+q[0],b);
      if(q[1]==='r'||q[1]==='d') rib(s,e,q[1]==='r'?0xdcd6cc:0xc9c2b7,y0,y1,'外装:縦リブの板');
      else{
        rib(s,e,0xdcd6cc,y0,y0+0.6); rib(s,e,0xdcd6cc,y1-0.45,y1);
        fGlass(S.mg,s,e,sg,FD-0.03,y0+0.6,y1-0.45,'外装:細長い窓');
        for(const m of[s+0.03,e-0.03]) fFin(S.md,0x6b6f74,m,sg,FD,0.05,0.08,y0+0.6,y1-0.45);
        if(q[1]==='W') for(let m=s+1.15;m<e-0.3;m+=1.15) fFin(S.md,0x6b6f74,m,sg,FD,0.05,0.08,y0+0.6,y1-0.45);
      }
      s=e;k++;
    }
    fRail(S.mg,0xbfb8ae,a,b,sg,FD,0.06,y1-0.06,y1+0.04);
  },
  /* 上北沢:桁はベージュのパネル(縦目地)。ホーム階は透明なスクリーン(白い横の見切り)で、
     その上に立ハゼの屋根(ROOF_OF で軒を下げて屋根面を見せる)。白い弓形の柱が外に立つ */
  '上北沢':function(S,st,sg,y){
    const a=st.x-STD.RL+1, b=st.x+STD.RL-1, yg=y-GIRDER, y0=y+FAC_Y0, yE=y+5.38;   // 軒裏に届くまで
    fBand(S.mg,SV,0xd8c8a6,a,b,sg,FD,0.2,yg+0.25,y0+0.3,{tag:'外装:ベージュの帯'});
    for(let s=a;s<=b+0.01;s+=2.4) fFin(S.md,0xb9ab8e,s,sg,FD,0.03,0.02,yg+0.25,y0+0.3);
    fGlass(S.mg,a,b,sg,FD-0.06,y0+0.3,yE,'外装:透明の帯');
    for(const h of[y+1.5,y+3.4]) fRail(S.md,0xeef0f2,a,b,sg,FD,0.06,h,h+0.06);
    for(let s=a;s<=b+0.01;s+=1.8) fFin(S.md,0xdfe3e7,s,sg,FD,0.05,0.08,y0+0.3,yE);
    for(let s=a+6;s<b;s+=15){                                  // 白い弓形の柱(15m間隔)
      const P=[];
      for(let i=0;i<=8;i++){
        const t=i/8, yy=y0+0.2+(y+7.4-(y0+0.2))*t, o=sg*(deckHalf(s,sg)+0.6+0.5*Math.sin(Math.PI*t*0.85));
        const f=frame(s,o); P.push([f.x,yy,f.z]);
      }
      S.mg.col(0xf4f5f6);
      for(let i=0;i<8;i++) S.mg.tube(SV,P[i],P[i+1],0.18,8);
      STRUCT.push({tag:'外装:白い弓形の柱',s0:s-0.15,s1:s+0.15,o0:sg>0?deckHalf(s,sg)+0.45:-(deckHalf(s,sg)+1.25),
                   o1:sg>0?deckHalf(s,sg)+1.25:-(deckHalf(s,sg)+0.45),y0:y0+0.2,y1:y+7.4});
    }
  },
  /* 芦花公園:木の縦格子(見付16cm・見込み55cm・50cm間隔)を連ねて書架を表す。
     上に暗い色の薄い屋根が深く張り出す。桁の側面は石積み */
  '芦花公園':function(S,st,sg,y){
    const a=st.x-STD.RL+1, b=st.x+STD.RL-1, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0;
    fBand(S.mg,MAT_STONE,0xb3afa7,a,b,sg,FD+0.05,0.25,yg,y0,{uv:uvW(2.4,1.2),tag:'外装:石積み'});
    fGlass(S.mg,a,b,sg,FD-0.08,y0,y1);
    const tone=[0xcaa56c,0xc29b60,0xd3b07a];
    for(let s=a,k=0;s<=b+0.01;s+=0.5,k++) fFin(S.mg,tone[k%3],s,sg,FD-0.05,0.16,0.55,y0,y1+0.1,'外装:木の縦格子');
    fBand(S.mg,SV,0x2e3134,a-1,b+1,sg,1.9,2.3,y1+0.1,y1+0.38,{tag:'外装:深い軒'});
  },
  /* 千歳烏山:温かみのある灰褐色の粗目の格子がホーム階を覆う。格子は単純なマス目ではなく、
     レンガの小口積みのように段ごとに縦材を半目ずらす(利用者指示)。目は0.9m×0.8m、
     見付16〜18cm・見込み35cm。奥はガラス。下は暗い灰の太い桁 */
  /* 千歳烏山:平織り(利用者指示)。横の帯と縦の帯が交点ごとに表と裏を入れ替えて編まれる。
     交点 (段 r, 列 c) で r+c が偶数なら横の帯が表、奇数なら縦の帯が表。帯は交点の間で表の層と
     裏の層の間を斜めに渡る(横の帯=交点ごとに標本を置いた掃引/縦の帯=交点の間ごとの面)。
     交点の表裏は登録簿 WEAVE に残す(⑪が上下・左右で交互か確かめる) */
  '千歳烏山':function(S,st,sg,y){
    const G=0.9, GY=0.8, W=0.17, T=0.07, dO=FD+0.33, dI=FD+0.24;   // 目・帯の幅・帯の厚さ・表と裏の層
    const n=Math.floor((2*STD.RL-2)/G), a=st.x-n*G/2, b=a+n*G, yg=y-GIRDER, y0=y+FAC_Y0, y1=y+STD.FAS0;
    const R=Math.floor((y1-y0-0.3)/GY), hr=r=>y0+0.25+GY*(r+0.5);    // 横の帯の中心の高さ
    const dep=(r,c,hor)=>((r+c)%2===0)===hor?dO:dI;                  // 交点の層(表=dO)
    fBand(S.mg,SV,0x575859,a,b,sg,FD,0.25,yg,y0,{tag:'外装:高架の側面'});
    fGlass(S.mg,a,b,sg,FD-0.06,y0,y1);
    for(let r=0;r<R;r++){                                            // 横の帯
      const h=hr(r);
      S.mg.col(0xb09b82).loft(SV,a,b,s=>{const c=Math.round((s-a)/G), E=deckHalf(s,sg), d=dep(r,c,true);
        return [[sg*(E+d-T/2),h-W/2],[sg*(E+d+T/2),h-W/2],[sg*(E+d+T/2),h+W/2],[sg*(E+d-T/2),h+W/2]];},
        {closed:true,step:G,tol:0.0005,maxL:1e9,tag:'外装:格子(横)'});
    }
    const P=(s,d,yy)=>{const f=frame(s,sg*(deckHalf(s,sg)+d));return [f.x,yy,f.z];};
    for(let c=0;c<=n;c++){                                           // 縦の帯(交点の間ごとに斜めの面)
      const s=a+c*G, A=S.mg.axes(s,0), out=v3sc(A.n,sg);
      const pts=[[y0,dep(0,c,false)]];
      for(let r=0;r<R;r++) pts.push([hr(r),dep(r,c,false)]);
      pts.push([y1,dep(R-1,c,false)]);
      S.mg.col(0x9c8770);
      for(let k=0;k<pts.length-1;k++){
        const [ya,da]=pts[k], [yb,db]=pts[k+1];
        for(const [u,v,nrm] of[[T/2,T/2,out],[-T/2,-T/2,v3sc(out,-1)]])      // 外面・内面
          S.mg.face(SV,[P(s-W/2,da+u,ya),P(s+W/2,da+u,ya),P(s+W/2,db+v,yb),P(s-W/2,db+v,yb)],nrm);
        for(const sd of[-1,1])                                                  // 側面
          S.mg.face(SV,[P(s+sd*W/2,da-T/2,ya),P(s+sd*W/2,da+T/2,ya),P(s+sd*W/2,db+T/2,yb),P(s+sd*W/2,db-T/2,yb)],v3sc(A.t,sd));
      }
      for(let r=0;r<R;r++){
        const h=hr(r), dv=dep(r,c,false), dh=dep(r,c,true), E=deckHalf(s,sg);
        STRUCT.push({tag:'外装:格子(縦)',s0:s-W/2,s1:s+W/2,o0:Math.min(sg*(E+dv-T/2),sg*(E+dv+T/2)),o1:Math.max(sg*(E+dv-T/2),sg*(E+dv+T/2)),y0:h-W/2,y1:h+W/2});
        WEAVE.push({sg:sg,r:r,c:c,s:s,y:h,hor:sg*(E+dh),ver:sg*(E+dv)});
      }
    }
    fRail(S.mg,0x8a7764,a,b,sg,FD,0.45,y1-0.05,y1+0.12);
  },
};

/* ---- 高架下の駅舎(公表パース) -------------------------------------------
   桁下の駅舎。長辺の中央に入口(暗い奥・ガラス・看板)。左右の壁と庇は駅ごと(BLDG_FAC)。
   seg=[[s0,s1,入口側の端(+1=s1/-1=s0)],...] */
const BLDG_FAC={
  // 明るいレンガの腰壁+緑がかった室内のガラス、入口脇に暗いレンガの柱。入口の上に格子の庇
  '代田橋':function(mg,md,st,sg,seg,hb){

      mg.col(0x34413a); vS(mg,SV,s0,s1,fO(sg,-1.0+0.01),1.3,hb-0.25,sg);

      for(let s=s0+1.5;s<s1;s+=1.5) fFin(md,0x6d6a62,s,sg,-1.0+0.05,0.05,0.06,1.3,hb-0.25);
      const p0=ent>0?s1-2.0:s0, p1=ent>0?s1:s0+2.0;

      mg.col(0xbca37a).tube(SV,[A.f.x,4.45,A.f.z],[B.f.x,3.95,B.f.z],0.035,4);
    }
    STRUCT.push({tag:'駅舎:格子の庇',s0:st.x-7,s1:st.x+7,o0:sg>0?deckHalf(st.x,sg)-1.0:-(deckHalf(st.x,sg)+2.6),
                 o1:sg>0?deckHalf(st.x,sg)+2.6:-(deckHalf(st.x,sg)-1.0),y0:3.9,y1:4.5});
    return {noCanopy:true};
  },
  // 半透明の白いガラスの壁(細い方立)。入口の上に斜めに持ち上がる白い庇
  '明大前':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1] of seg){
      mg.col(0xdfe3e6); vS(mg,SV,s0,s1,fO(sg,-1.0+0.01),0.2,hb-1.4,sg);
      vS(mg,MAT.frost,s0,s1,fO(sg,-1.0+0.05),0.2,hb-1.4,sg,{tag:'駅舎:半透明の壁'});
      for(let s=s0;s<=s1+0.01;s+=1.2) fFin(md,0xc9ced3,s,sg,-1.0+0.05,0.05,0.06,0.2,hb-1.4);
      fBand(mg,SV,0x9aa0a6,s0,s1,sg,-1.0+0.05,0.05,hb-1.4,hb-0.2);
    }
    mg.col(0xf1f3f4).loft(SV,st.x-16,st.x+16,s=>{const i=sg*(deckHalf(s,sg)-1.0),q=sg*(deckHalf(s,sg)+3.0);
      return [[i,4.1],[q,4.9],[q,5.05],[i,4.3]];},{closed:true,caps:true,tag:'駅舎の庇'});
    return {noCanopy:true};
  },
  // 暖かい明かりの室内が見えるガラスの壁。大庇は bldg の最後で作る
  '下高井戸':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1] of seg){
      mg.col(0xeadcc0); vS(mg,SV,s0,s1,fO(sg,-1.0+0.01),0,hb-0.3,sg);
      fGlass(mg,s0,s1,sg,-1.0+0.05,0,hb-0.3,'駅舎:ガラス');
      for(let s=s0;s<=s1+0.01;s+=1.4) fFin(md,0xd9dcdf,s,sg,-1.0+0.05,0.05,0.06,0,hb-0.3);
    }
    return {noCanopy:true};
  },
  // 木の縦ルーバー(入口から遠い側は濃い茶・近い側は明るい木)、入口の脇に青灰の板
  '桜上水':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1,ent] of seg){
      const m=(s0+s1)/2, far=ent>0?[s0,m]:[m,s1], near=ent>0?[m,s1-2.2]:[s0+2.2,m], bl=ent>0?[s1-2.2,s1]:[s0,s0+2.2];
      fBand(mg,MAT_SLAT,0x6e5545,far[0],far[1],sg,-1.0+0.05,0.06,0,hb-0.9,{uv:uvW(0.6,2),tag:'駅舎:木の縦ルーバー'});
      fBand(mg,MAT_SLAT,0xd3a777,near[0],near[1],sg,-1.0+0.05,0.06,0,hb-0.9,{uv:uvW(0.6,2),tag:'駅舎:木の縦ルーバー'});
      fBand(mg,SV,0x6f8eaa,bl[0],bl[1],sg,-1.0+0.06,0.06,0,hb-0.9);
      fBand(mg,SV,0x3d3530,s0,s1,sg,-1.0+0.06,0.06,hb-0.9,hb-0.1);
    }
    return {canopyCol:0x3d3530};
  },
  // 石積みの腰壁と壁、開口の上に木の横ルーバー。建物に沿って低い金属の庇
  '上北沢':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1] of seg){
      fBand(mg,MAT_STONE,0xa9a8a3,s0,s1,sg,-1.0+0.05,0.05,0,0.9,{uv:uvW(2.4,1.2),tag:'駅舎:石積み'});
      mg.col(0x3a3f44); vS(mg,SV,s0,s1,fO(sg,-1.0+0.01),0.9,2.6,sg);
      fGlass(mg,s0,s1,sg,-1.0+0.05,0.9,2.6);
      for(let h=2.62;h<3.3;h+=0.14) fRail(mg,0xb58b5e,s0,s1,sg,-1.0+0.05,0.04,h,h+0.07);
      fBand(mg,MAT_STONE,0xa9a8a3,s0,s1,sg,-1.0+0.05,0.05,3.3,hb-0.3,{uv:uvW(2.4,1.2)});
    }
    const a=bldgSpan(st)[0]-4, b=bldgSpan(st)[1]+4;
    mg.col(0x50565d).loft(SV,a,b,s=>{const i=sg*(deckHalf(s,sg)-1.0),q=sg*(deckHalf(s,sg)+1.4);
      return [[i,3.55],[q,3.2],[q,3.3],[i,3.65]];},{closed:true,caps:true,tag:'駅舎:低い庇'});
    return {noCanopy:true};
  },
  // 石積みの壁
  '芦花公園':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1] of seg)
      fBand(mg,MAT_STONE,0xc2beb6,s0,s1,sg,-1.0+0.05,0.06,0,hb-0.1,{uv:uvW(2.4,1.2),tag:'駅舎:石積み'});
    return {canopyCol:0x2e3134};
  },
  // 木の板張りの壁とガラス。高架下の柱も木で包む(パース:木の柱が並ぶ)
  '千歳烏山':function(mg,md,st,sg,seg,hb){
    for(const [s0,s1] of seg){
      const m=(s0+s1)/2;
      fBand(mg,MAT_SLAT,0xd8b083,s0,m,sg,-1.0+0.05,0.06,0,hb-0.3,{uv:uvW(0.6,2),tag:'駅舎:木の柱'});
      mg.col(0x3a3f44); vS(mg,SV,m,s1,fO(sg,-1.0+0.01),0,hb-0.3,sg);
      fGlass(mg,m,s1,sg,-1.0+0.05,0,hb-0.3);
    }
    return {canopyCol:0xb58b5e};
  },
};
function bldg(S,st,y){
  // c0=駅舎の中ほど(入口・看板・庇の位置)。範囲は bldgSpan(下高井戸は駅の西端部)
  const SP=bldgSpan(st), a=SP[0], b=SP[1], c0=(a+b)/2;
  const mg=S.mg, md=S.md, H=(b-a)/2, hb=y-GIRDER-0.05, E=deckHalf(c0)-1.0, F=BLDG_FAC[st.n];
  mg.col(0xe9e7e2).cbox(SV,a,b,0,E,0,hb,{tag:'駅舎'});
  // 妻側(線路方向の端):窓の帯と通用口
  for(const [s,f] of[[a,-1],[b,1]]){
    const A=mg.axes(s,0), P=(o,yy)=>{const q=frame(s+f*0.03,o);return [q.x,yy,q.z];};
    mg.col(0x3a4148).face(SV,[P(-E+1.5,2.9),P(E-1.5,2.9),P(E-1.5,4.7),P(-E+1.5,4.7)],v3sc(A.t,f));
    mg.col(0x8c939b).face(SV,[P(-0.6,0),P(0.6,0),P(0.6,2.2),P(-0.6,2.2)],v3sc(A.t,f));
    for(let o=-E+1.5;o<=E-1.5+0.01;o+=1.8)
      md.col(0xbfc4c9).box(SV,s+f*0.05,o,2.9,4.7,0.06,0.07,{skip:'-y'});
  }
  for(const sg of[-1,1]){
    // 入口:暗い奥+ガラス+枠、上に看板
    mg.col(0x2b3036); vS(mg,SV,c0-6,c0+6,fO(sg,-1.0+0.02),0,3.3,sg);
    fGlass(mg,c0-6,c0+6,sg,-1.0+0.06,0,3.3);
    for(let s=c0-6;s<=c0+6.01;s+=1.5) md.col(0xbfc4c9).box(SV,s,sg*(E+0.07),0,3.3,0.06,0.08,{skip:'-y'});
    signQuad(mg,3*STA.indexOf(st)+2,c0,sg*(E+0.04),3.95,5.15,4.8,sg);
    // 左右の壁(駅ごと)。庇も駅ごと(無ければ既定の箱の庇)
    const r=F?F(mg,md,st,sg,[[a,c0-6.3,1],[c0+6.3,b,-1]],hb):null;
    if(!r||!r.noCanopy)
      mg.col((r&&r.canopyCol)||st.c).box(SV,c0,sg*(E+0.9),3.45,3.7,14,1.8,{tag:'駅舎の庇'});
  }
  /* 下高井戸:温かな色彩の大庇を街へ広げる(公表パース:木の下面・白い薄い縁)。白い丸柱(帯付き)で受ける。
     パースは南から北を望む画で、大庇は左=**西の端で反り上がる**。置くのは**駅の西南**(利用者指示):南側だけ、
     駅舎(駅の西端部)の入口の東から西の端まで(s が西へ増えるので e1 が西端。その先は下高井戸1号踏切の道路)。
     以前は両側・新宿方の端で反っていた */
  if(st.n==='下高井戸'){
    /* 形はパースの人物(約1.7m)との比で読んだ:縁の高さは低い所で約4.0m、西の先端で約6.3m(反り約2.3m)。
       張出しは先端へ行くほど外へ広がる(桁の縁から4.6m → 先端で8.0m) */
    const e0=a+12, e1=b;
    const uW=s=>(e1-s)/(e1-e0);                                 // u=0 が西端(反り上がる側)
    const hE=s=>{const u=uW(s);
      return 4.0+2.3*Math.pow(Math.max(0,1-u/0.38),2)+0.35*Math.pow(Math.max(0,(u-0.75)/0.25),2);};
    const dE=s=>4.6+3.4*Math.pow(Math.max(0,1-uW(s)/0.45),2);  // 桁の縁からの張出し
    for(const sg of[-1]){                                       // 南側だけ
      mg.loft(SV,e0,e1,s=>{const i=sg*(deckHalf(s,sg)-1.0), q=sg*(deckHalf(s,sg)+dE(s)), h=hE(s);
        return [[i,5.0],[q,h],[q,h+0.16],[i,5.35]];},
        {closed:true,caps:true,cols:[0xc99a62,0xf4f5f6,0xe4e6e8,0xe4e6e8],tag:'大庇'});
      for(let s=e0;s<=e1+0.01;s+=4){                           // 縁の高さの登録簿(検証が反りを測る)
        const q=deckHalf(s,sg)+dE(s);
        STRUCT.push({tag:'大庇の縁',s0:s,s1:s,o0:sg>0?q-0.05:-q,o1:sg>0?q:-(q-0.05),y0:hE(s),y1:hE(s)+0.16});
      }
      for(let s=e0+0.6;s<e1;s+=1.1){                          // 下面の木の板目
        const A=md.axes(s,sg*(deckHalf(s,sg)-0.98)), B=md.axes(s,sg*(deckHalf(s,sg)+dE(s)-0.05)), h=hE(s);
        md.col(0xa97c47).tube(SV,[A.f.x,4.985,A.f.z],[B.f.x,h-0.015,B.f.z],0.02,4);
      }
      for(let s=e0+5;s<e1-2;s+=13){
        const o=sg*(deckHalf(s,sg)+3.4), f=(3.4+1.0)/(dE(s)+1.0), h=5.0+(hE(s)-5.0)*f;   // 柱の頭=下面の高さ
        mg.col(0xf4f5f6).cyl(SV,s,o,0,h,0.38,12,{tag:'大庇の柱'});
        md.col(0x9aa0a6).cyl(SV,s,o,2.4,2.7,0.41,12);
      }
    }
  }
  // 千歳烏山:駅の範囲の高架下の柱を木で包む(駅舎の外の柱)
  if(st.n==='千歳烏山')
    for(const c of VIA_COLS){
      if(Math.abs(c.s-st.x)>STD.RL||(c.s>a-1&&c.s<b+1)) continue;      // 駅の範囲で、駅舎の外の柱
      for(const o of c.offs) mg.col(0xb88d62).box(SV,c.s,o,0,Math.min(3.6,c.top),1.15,1.15,{skip:'-y',tag:'駅舎:木の柱'});
    }
}

/* ---- 駅を組み立てる ---- */
const STAIRS=[];                     // 階段・エレベーターの登録簿(検証用)
for(const s of STA){
  const y=railY(s.x),c0=s.x, i=STA.indexOf(s), S=STG[i];
  CUR=s.kk?KOUKU[s.kk-1].VGs:null;
  // 点字ブロックは「線路のある縁」だけに敷く。笹塚の内側は上の留置線を敷いてから判定する
  // (先に判定すると留置線がまだ TRACKS に無く、内側の縁に敷かれない)。
  const pr=platRange(s), x0=pr[0], x1=pr[1], pm=(x0+x1)/2, big=BIGROOF(s);
  const lampY=big?y+STD.RAIL0-0.06:y+STD.CAN0-0.08;
  const lifts=[];                    // 井戸とエレベーター(柱・ベンチを避ける)

function trackChains(){
  const nx=new Map(), pv=new Set();
  for(const a of TRACKS) for(const b of TRACKS)
    if(a!==b&&Math.abs(b.x0-a.x1)<0.01&&Math.abs(b.zf(b.x0)-a.zf(a.x1))<0.02){nx.set(a,b);pv.add(b);}

    out.push({ch:ch, x0:ch[0].x0, x1:ch[ch.length-1].x1,

function catWires(c){

    return {s:s,o:o,x:f.x,z:f.z,nx:g.x-f.x,nz:g.z-f.z,y:rTop(s)};});
