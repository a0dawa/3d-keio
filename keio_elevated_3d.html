  // 1.5km 先では数画素にしかならない。全体俯瞰で50両ぶん効く)
  const mid=[], addMid=(geo,mat,parent)=>{const m=add(geo,mat,parent);mid.push(m);carInstReg(m,g);return m;};
  addMid(o.motor?GEO.bogieM:GEO.bogieT,M_BOG);
  // 床下機器・冷房装置・パンタの台座の小物(京王八王子方へ 5.1m)を1つの形に(幌は頂点カラーの細部にまとめた)
  { const parts=[[GEO.under,false,0],[GEO.ac,false,0]];
    if(o.panto) parts.push([GEO.pantoBits,false,o.hachi*5.1]);
    addMid(k8Merge(SK+'|mid|'+(o.panto?o.hachi:0),parts),K8M.vc); }
  // パンタグラフ:京王八王子方の台車の上(台座の中心が車両中心から 6.88m)、ひじも八王子方
  if(o.panto){
    const pg=new THREE.Group(); pg.position.x=o.hachi*SP.BOGIE_X; if(o.hachi<0) pg.rotation.y=Math.PI;
    g.add(pg); mid.push(pg);
    for(const [pgeo,pmat] of [[GEO.panto.base,M_PANS],[GEO.panto.frame,M_PN],[GEO.panto.shoe,M_SH]]) carInstReg(add(pgeo,pmat,pg),g);
    g.userData.panto=pg;
  }
  g.userData.body=body; g.userData.bodyMat=bodyMat; g.userData.tail=tail;
  CARS_ALL.push(g);
  g.userData.fine=fine; g.userData.hi=true; g.userData.k8=o;
  g.userData.mid=mid; g.userData.far=false;
  g.userData.doors={r:0,side:1};
  scene.add(g); return g;
}
/* 客用扉の開度 r(0=閉/1=開)を反映する。side は開ける面(車体ローカルz の符号)。
   車体ローカル+z = v4 の −y。シェルを180°回した車(最後尾)では左右も入れ替わる。 */
const DOOR_HW=K8.DOOR_HW;         // 片側の戸の幅(=開口の半幅)
const DOOR_SLIDE=K8.DOOR_HW;      // 全開のときの移動量(戸1枚ぶん)
function setCarDoors(c,r,side){
  const ud=c.userData; if(!ud||!ud.bodyMat) return;
  const v4side=(ud.tail?1:-1)*side;                  // 開く面のシェル座標での ±y
  const U=ud.bodyMat.userData.k8.uni.uOpen.value;
  U.set(v4side>0?r:0, v4side<0?r:0);
  ud.doors.r=r; ud.doors.side=side;
}
// 編成の組み立てに使う:新宿方から n 両目(1始まり)の諸元
function k8CarSpec(form,n){
  const F=K8_FORMATIONS[form]||K9_FORMATIONS[form];
  return {num:F.cars[n-1], panto:F.panto.indexOf(n)>=0, motor:F.motor.indexOf(n)>=0,
          series:K9_FORMATIONS[form]?'9000':'8000'};
}

/* ---- 走行列車(7本。TRAIN_DEF)。各駅停車・急行・特急を自動運転で走らせる ----
   加速=P4(3.3km/h/s), 上限=60km/h, 減速=B5(3.0km/h/s), 停車時間=25秒。
   状態機械: 'run'(駅間走行) → 'brake'(停止位置へ減速) → 'dwell'(25秒停車) → 'run' */
const DRIVE={ACC:3.3, DEC:3.0, VMAX_KMH:60, DWELL:25};   // 自動運転パラメータ
// 駅別の停車時間[秒](未記載の駅は DRIVE.DWELL)。待避線に入る駅は1分。
const DWELL_OF={'八幡山':60,'明大前':60,'桜上水':60,'千歳烏山':60};
/* 列車の種別(利用者指示:各停以外は識別灯が点く。点く列車を走らせる)。
   各停 …… 全駅に停まり、待避駅(DIVERT)では待避線・停車線へ入る。上限60km/h
   特急・急行 …… 停車駅は発車標と同じ表(DEP_STOP。特急=笹塚・明大前・千歳烏山/急行=それと桜上水)。待避線には
            入らず本線(八幡山は外側の通過線)を通り、2面4線の駅では本線側(内側)のホームに停まる。上限90km/h・停車25秒 */
const TRAIN_KIND={'各停':{vmax:60},'急行':{vmax:90},'特急':{vmax:90}};
function isLocal(t){ return !t.kind||t.kind==='各停'; }
function stopsAt(t,st){ return isLocal(t)||(DEP_STOP[t.kind]||[]).indexOf(st.n)>=0; }
function trainOff(t,x){ return isLocal(t)?runOff(x):mainOff(x); }          // その列車が走る線(北が+)
function trainZf(t){ return t.dir>0?(isLocal(t)?zRunDown:zDown):(isLocal(t)?zRunUp:zUp); }
function trainVmax(t){ return ((TRAIN_KIND[t.kind]||{}).vmax||DRIVE.VMAX_KMH)/3.6; }
const trains=[];
/* 走行列車(7本):[向き, 初めの位置 s, 種別, 編成, 行先]。下りは各停2本と急行1本(急行が各停を待避駅で追い越す。
   利用者指示)。上りは特急1本と、各停2本・急行1本(利用者指示:上りが少ない。下りと同じく急行が各停を待避駅で
   追い越す)。上りの急行は 9735F の各停の後ろから出る(千歳烏山で緩急接続、その先で追い越す)。
   上りの各停・急行の行先は笹塚の4番線(新線新宿・本八幡方面)に合わせ、9000系は本八幡(都営新宿線へ直通)、
   8000系は新線新宿(都営線へは直通しない)。
   trains[0] は下りの各停、上りの最初(trains の並びで)は特急(検証と撮影が使う)。足す列車は後ろへ */
const TRAIN_DEF=[[1,300,'各停','8714F','京王八王子'],[1,3000,'各停','9731F','京王八王子'],
                 [1,-380,'急行','9733F','橋本'],[-1,5600,'特急','8713F','新宿'],
                 [-1,7200,'各停','9735F','本八幡'],[-1,8000,'急行','9736F','本八幡'],
                 [-1,2900,'各停','8715F','新線新宿']];
TRAIN_DEF.forEach(function(a){
  const dir=a[0], xs=a[1], kind=a[2], form=a[3], dest=a[4], cars=[];
  /* 編成は v4 の 8714F/8713F と 9000系。車番・パンタ・電動車は「新宿方から何両目」で決まる。
     下り(dir>0・西へ)は先頭 j=0 が京王八王子方=新宿方から10両目。上りは逆。
     車体ローカル+x は進行方向なので、京王八王子方(西)の向き hachi は dir と同じ符号。 */
  for(let j=0;j<10;j++){
    const n=dir>0?10-j:j+1, sp=k8CarSpec(form,n);
    cars.push(makeCar({cabF:j===0, cabR:j===9, panto:sp.panto, motor:sp.motor, num:sp.num, series:sp.series,
      hachi:dir>0?1:-1, lights:j===0?'head':(j===9?'tail':'off'),
      sign:{kind:kind, dest:dest}, crowd:j%3}));
  }
  const reset=(dir>0)?(DOM.x0-210):(DOM.x1+210);
  // st=状態, v=速度[m/s], dwell=停車残り時間, target=次の停止位置s
  trains.push({dir:dir, kind:kind, x:xs, x0:reset, v:0, st:'run', dwell:0, target:null, atSt:null, cars:cars});
});
// 進行方向の次の停止位置を返す。停車時間の決定に使うので駅も一緒に持つ。
// stopPosOf は「先頭(運転台)を着ける位置」を返すが、列車の t.x は先頭車の"中心"なので
// 車体半長ぶん手前を目標にする。ここを取り違えると編成が車体半長だけホームからはみ出す。
function nextStopFor(t){
  let best=null;
  for(const s of STA){
    if(!stopsAt(t,s)) continue;              // 通過駅(特急)
    const sp=stopPosOf(s,t.dir)-t.dir*CAR_HALF;
    if(t.dir>0 && sp>t.x+1 && (best===null||sp<best.s)) best={s:sp,st:s};
    if(t.dir<0 && sp<t.x-1 && (best===null||sp>best.s)) best={s:sp,st:s};
  }
  return best;
}
function dwellOf(st,t){ return (t&&!isLocal(t))?DRIVE.DWELL:((st&&DWELL_OF[st.n])||DRIVE.DWELL); }   // 待避で長く停まるのは各停だけ
/* ---- 列車どうしの間隔(閉塞)と待避(利用者指示:下りの急行が各停を待避線で追い越す) ----
   ・前の列車の最後尾の HEAD.MARGIN 手前を「止まるべき所」とし、停止位置と同じ減速(B5)の曲線で近づく。
     前の列車が動けば止まるべき所も進む(ATS の速度照査に近い)。
   ・待避線・停車線に全体が入った各停は、本線を走る優等列車を塞がない(追い越される)。各停どうしは同じ線に入るので塞ぐ。
   ・待避線の各停は、すぐ後ろ(先頭どうしで HEAD.HOLD 以内)が優等列車なら、それが先へ出るまで扉を開けたまま待つ
     (急行が同じ駅に停まるときは緩急接続:急行の発車を待つ)。追い越された後は間隔を保って本線へ出る。
   ・線路の端の先で入り直すときは、入り直す所が空いてから(見えない所で待つ=st 'wait')。
   ・運転モードの自列車(下り。特急=本線/各停=待避線・停車線)も前の列車として扱う(後ろから来る自動運転の列車が
     突っ込まない)。各停の自列車が待避線・停車線に全体で入っていれば、優等列車は塞がない(追い越す)。
   検証の単独の列車(trains に無い)は間隔も待避も見ない(ほかの列車に止められずに全線を走る)。 */
const HEAD={MARGIN:40, HOLD:1800, LANE:3.0, START:60};
const trainLen=t=>((t.cars?t.cars.length:10)-1)*K8.PITCH+K8.LEN;     // 編成長(前の連結面から後ろの連結面まで)
const headFront=t=>t.x+t.dir*CAR_HALF;                                 // 先頭の前端(t.x は先頭車の中心)
const tailRear=t=>headFront(t)-t.dir*trainLen(t);                     // 最後尾の後端
function inLoop(t){                       // 待避線・停車線に全体が入っているか(本線から LANE 以上離れた線)
  if(!isLocal(t)) return false;
  const a=headFront(t), b=tailRear(t);
  return Math.abs(runOff(a)-mainOff(a))>HEAD.LANE&&Math.abs(runOff(b)-mainOff(b))>HEAD.LANE;
}
function gapAhead(t){                     // 前の列車(この列車の線を塞ぐもの)の最後尾までの距離[m]
  if(trains.indexOf(t)<0) return Infinity;
  const f=headFront(t); let g=Infinity;
  for(const q of trains){
    if(q===t||q.dir!==t.dir||q.st==='wait') continue;
    if((headFront(q)-f)*t.dir<=0) continue;                        // 後ろか並んでいる列車
    if(!isLocal(t)&&inLoop(q)) continue;                           // 待避線の各停は優等列車を塞がない
    g=Math.min(g,(tailRear(q)-f)*t.dir);
  }
  if(t.dir>0&&rideOn&&trainsOn&&rideS>f&&!(!isLocal(t)&&rideInLoop()))   // 運転モードの自列車(rideS=先頭)。各停で待避線・停車線に
    g=Math.min(g,rideS-RIDE_LEN-f);                                       // 入っていれば、本線の優等列車は塞がない
  for(const W of SWITCHES){               // 進路へ転換し終わっていない分岐器の 5m 手前で止まる
    const rb=routeB(t,W); if(rb===null) continue;
    const d=((t.dir>0?W.lo:W.hi)-f)*t.dir;
    if(d<0||d>SW.LOOK) continue;
    if(W.r!==(rb?1:0)) g=Math.min(g,d-5+HEAD.MARGIN);
  }
  return g;
}
function expressBehind(t){                // すぐ後ろ(または並び)の同じ向きの列車が HEAD.HOLD 以内の優等列車か
  const f=headFront(t); let best=null, bd=Infinity;
  for(const q of trains){
    if(q===t||q.dir!==t.dir||q.st==='wait') continue;
    const d=(f-headFront(q))*t.dir;
    if(d>=0&&d<bd){bd=d;best=q;}
  }
  return !!best&&bd<=HEAD.HOLD&&!isLocal(best);
}
/* ---- 6c. 分岐器の転換(利用者指示:待避線へ入る列車に合わせて転換)。SWITCHES の r を動かす ----
   ・分岐器に向かう列車(先頭が SW.LOOK 以内。停車中の列車は発車の5秒前から)のうち最も近いものの進路へ転換する。
     各停は待避線・停車線(反位)、急行・特急は本線(定位)。運転モードの自列車は選んだ種別のとおり(RIDE_T)。
   ・列車が分岐器(先端〜後端±2m)に載っている間は転換しない(鎖錠)。転換は SW.THROW 秒。
   ・列車は進路へ転換し終わっていない分岐器の手前で止まる(gapAhead)。撮影で列車を置き直したら syncSwitches */
const SW={LOOK:600, THROW:3.0};
const RIDE_LEN=9*K8.PITCH+K8.LEN;
function routeB(t,W){                     // 列車 t がこの分岐器を B(待避線・停車線)へ通るか。通らなければ null
  const T=W.T, zf=trainZf(t);
  if(Math.abs(zf(T.s)-T.A.zf(T.s))>0.5) return null;                 // 別の線(反対の方向の線など)
  const s1=T.s+T.f*20;
  return Math.abs(zf(s1)-T.B.zf(s1))<Math.abs(zf(s1)-T.A.zf(s1));
}
function swOccupied(W,t){ const h=headFront(t), tl=tailRear(t); return Math.max(h,tl)>=W.lo&&Math.min(h,tl)<=W.hi; }
function stepSwitches(dt){
  for(const W of SWITCHES){
    let occ=false, bd=Infinity, want=null;
    for(const t of trains){
      if(t.st==='wait') continue;
      const rb=routeB(t,W); if(rb===null) continue;
      if(swOccupied(W,t)){occ=true;break;}
      if(t.st==='dwell'&&t.dwell>5) continue;                         // 停車中は発車間際だけ
      const d=((t.dir>0?W.lo:W.hi)-headFront(t))*t.dir;
      if(d>=0&&d<=SW.LOOK&&d<bd){bd=d;want=rb?1:0;}
    }
    const rr=(!occ&&rideOn&&trainsOn)?routeB(RIDE_T,W):null;           // 運転モードの自列車(下り。特急=本線/各停=待避線・停車線)
    if(rr!==null){
      if(rideS>=W.lo&&rideS-RIDE_LEN<=W.hi) occ=true;
      else{ const d=W.lo-rideS; if(d>=0&&d<=SW.LOOK&&d<bd){bd=d;want=rr?1:0;} }
    }
    if(!occ&&want!==null) W.want=want;
    if(W.r!==W.want){ const k=dt/SW.THROW; W.r=W.want>W.r?Math.min(W.want,W.r+k):Math.max(W.want,W.r-k); W.fill(); }
  }
}
function syncSwitches(){                  // 載っている列車の進路へ即座に合わせる(撮影で列車を置き直したとき)
  for(const W of SWITCHES) for(const t of trains){
    if(t.st==='wait') continue;
    const rb=routeB(t,W); if(rb===null||!swOccupied(W,t)) continue;
    const v=rb?1:0; if(W.r!==v){ W.r=W.want=v; W.fill(); }
  }
}
function startClear(t){                   // 入り直す所(線路の端の外)の先が空いているか
  if(trains.indexOf(t)<0) return true;
  const h0=t.x0+t.dir*CAR_HALF;
  for(const q of trains){
    if(q===t||q.dir!==t.dir||q.st==='wait') continue;
    if((tailRear(q)-h0)*t.dir<HEAD.MARGIN+HEAD.START) return false;
  }
  return true;
}
// 1列車の自動運転を1フレーム進める
function driveTrain(t,dt){
  const VMAX=trainVmax(t), DEC=DRIVE.DEC/3.6;
  if(t.st==='wait'){                        // 線路の端の先:入り直す所が空くまで待つ(見えない)
    if(startClear(t)){ t.x=t.x0; t.v=0; t.st='run'; t.target=null; }
    return;
  }
  if(t.st==='dwell'){                       // 停車中:残り時間を減らす
    t.dwell-=dt;
    // 待避:待避線の各停は、すぐ後ろの優等列車が追い越すまで扉を開けたまま待つ(扉は発車の3秒前に閉まり始める)
    if(t.dwell<=3.2&&trains.indexOf(t)>=0&&inLoop(t)&&expressBehind(t)){ t.dwell=6; t.holdT=(t.holdT||0)+dt; }
    if(t.dwell<=0){ t.st='run'; t.target=nextStopFor(t); }
    return;
  }
  if(t.target===null) t.target=nextStopFor(t);
  const room=gapAhead(t)-HEAD.MARGIN;      // 前の列車の手前で止まれる余裕(無ければ Infinity)
  const brakeDist=(t.v*t.v)/(2*DEC);        // 現速度から止まるのに要る距離
  if(t.target===null){                      // 前方に駅なし=線路の端の先まで走り抜け、入り直す
    if(room<=brakeDist+0.2) t.v=Math.max(0,t.v-DEC*dt); else t.v=Math.min(VMAX,t.v+DRIVE.ACC/3.6*dt);
    t.x+=t.dir*Math.min(t.v*dt,Math.max(0,room));
    if((tailRear(t)-(t.dir>0?DOM.x1:DOM.x0))*t.dir>5){       // 最後尾まで線路の端の外へ出た
      t.v=0; t.target=null; t.atSt=null;
      if(startClear(t)){ t.x=t.x0; t.st='run'; } else t.st='wait';
    }
    return;
  }
  const dist=(t.target.s-t.x)*t.dir;       // 停止位置までの残距離[m](進行方向正)
  const lim=Math.min(dist,room);            // 先に止まるべき所(駅の停止位置か、前の列車の手前)
  if(lim<=brakeDist+0.2){                   // 減速フェーズ
    t.st='brake';
    t.v=Math.max(0, t.v-DEC*dt);
    if(dist<=room && t.v<0.15 && dist<1.0){ t.x=t.target.s; t.v=0; t.st='dwell';
      t.dwell=dwellOf(t.target.st,t); t.atSt=t.target.st; }   // 停車時間は駅別(八幡山60秒)
    else t.x+=t.dir*Math.min(t.v*dt,Math.max(0,lim));         // 止まるべき所を越えない
  }else{                                     // 力行/惰行フェーズ(種別の上限。各停60・特急90km/h)
    t.st='run';
    t.v=Math.min(VMAX, t.v+DRIVE.ACC/3.6*dt);
    t.x+=t.dir*t.v*dt;
  }
}

// 車両は「前後の車端2点を結ぶ弦」に沿って配置する(曲線でも必ず線路方向を向く)
const CAR_HALF=K8.LEN/2;
syncSwitches();                           // 初めの位置で分岐器に載っている列車があればその進路へ(CAR_HALF の後)
// 車端2点の実位置から姿勢(ヨー+ピッチ)を決める。勾配区間でも車体が線路に沿う
let LOD_NEAR=420;   // この距離までは高精細モデル(スマホでは短縮)
let LOD_FAR=1500;   // この距離より先は台車・床下・冷房・パンタも省く(車体だけ)
const _UP=new THREE.Vector3(0,1,0), _F=new THREE.Vector3(), _R=new THREE.Vector3(),
      _U=new THREE.Vector3(), _M4=new THREE.Matrix4();
function seatCar(c,s,zf,dir){
  if(c.userData) c.userData.s=s;              // 夜の駅の照明(carLit)が位置を見る
  const sA=s-CAR_HALF, sB=s+CAR_HALF;
  const pA=frame(sA,zf(sA)), pB=frame(sB,zf(sB));
  const yA=railY(sA)+RAIL_TOP, yB=railY(sB)+RAIL_TOP;    // 車体の原点=レール頭頂面(v4 の z=0)
  _F.set(pB.x-pA.x, yB-yA, pB.z-pA.z);
  if(dir<0)_F.multiplyScalar(-1);                      // 上り列車は先頭部を進行方向へ
  _F.normalize();
  _R.crossVectors(_F,_UP).normalize();                 // 右手系: X=前, Y=上, Z=右
  _U.crossVectors(_R,_F).normalize();
  _M4.makeBasis(_F,_U,_R);
  c.quaternion.setFromRotationMatrix(_M4);
  c.position.set((pA.x+pB.x)/2, (yA+yB)/2, (pA.z+pB.z)/2);
  lodCar(c);
}
// LODの切替。走行中の列車だけでなく、留置中の車両も毎フレーム見直す
// (初期化時に一度だけ判定していたため、留置線の編成が遠景モデルのまま固定されていた)。
function lodCar(c){
  const ud=c.userData;
  if(!ud||!ud.body) return;
  const d=camera.position.distanceTo(c.position), hi=d<(ud.lodNear||LOD_NEAR);   // 交差鉄道の車両は近くの細部を短く(ud.lodNear)
  if(hi!==ud.hi){
    ud.hi=hi;
    // 遠景では車内・乗客・ガラス・表示器・細部を省く(塗り分けはシェーダなので遠景でも崩れない)
    if(ud.fine) for(const m of ud.fine) m.visible=hi;
  }
  const far=d>Math.min(LOD_FAR,ud.lodFar||LOD_FAR);
  if(far!==ud.far){ ud.far=far; if(ud.mid) for(const m of ud.mid) m.visible=!far; }
}
// 編成の各車両を配置する。範囲外の車両は非表示にし、姿勢計算もスキップして軽量化。
/* 夜の駅の照明で車体を照らす(利用者指示:駅は明るいのに、進入する電車が暗いまま)。駅の結合ジオメトリと同じく
   **車体の色を掛けた**発光(uLit)なので、帯や扉の色を保ったまま明るくなる。ホームの範囲で最大、外へ 40m で消える。
   昼・夜以外は 0。走行列車は placeTrain が毎コマ、留置車は夜の切替(NIGHT.set)で見直す */
function stationLight(s){
  let v=0;
  for(const st of STA){
    const r=platRange(st), d=s<r[0]?r[0]-s:(s>r[1]?s-r[1]:0);
    v=Math.max(v,1-d/CAR_LIT_FADE);
  }
  return Math.max(0,v)*CAR_LIT;
}
function carLit(c,s){
  const ud=c.userData; if(!ud||!ud.bodyMat) return;
  if(s!==undefined) ud.s=s;
  ud.bodyMat.userData.k8.uni.uLit.value=ud.xcar?(NIGHT_ON?Math.max(CAR_NIGHT_FILL,ud.xsta||0):0):   // 交差鉄道の車両は停車中のホームの照明(xDoorStep)
    ((NIGHT_ON&&ud.s!==undefined)?Math.max(CAR_NIGHT_FILL,stationLight(ud.s)):0);
}
function placeTrain(t){
  const zf=trainZf(t);   // 各停は八幡山で内側(停車線)・待避駅で待避線へ、特急は本線のまま
  for(let j=0;j<t.cars.length;j++){
    const s=t.x-t.dir*j*K8.PITCH, c=t.cars[j];
    const inside=(s>DOM.x0+CAR_HALF && s<DOM.x1-CAR_HALF);
    c.visible = inside && trainsOn;
    if(inside) seatCar(c, s, zf, t.dir);      // 見えている車両だけ弦法で姿勢決定
    carLit(c, s);
  }
}
/* ---- 交差鉄道の列車(井の頭線 京王1000系・世田谷線 東急300系)--------------------------------
   車両は 9c章の makeXCar(8000・9000系と同じ作り。2026-11 利用者指示で以前の簡易モデルから作り直した)。編成は線区ごとの群
   (userData.xtrain)にまとめ、群ごとに表示を切り替える。1両は剛体:前後の台車の中心を線路の上に置いた弦に置く(xCarPose)。
   300系は連接:A車とB車が連接台車(車体の境)を共有するので、連接台車の点から両側の端の台車まで弦を張る(xArtPose)。
   車体の原点はレール頭頂面 XR.RAILTOP(線路の敷設と同じ定数)。停車中はホームの側の扉を開ける(setCarDoors) */
function xTrainGroup(kind){ const g=new THREE.Group(); g.userData.xcar=kind; g.userData.xtrain=true; scene.add(g); return g; }
// 中心 uc の車両を、線路 vf(u) の上の前後の台車の中心(uc±bog)を結ぶ弦に置く(u は中心線の距離なので、弦が 2·bog になるまで u の幅を詰める)
function xCarPose(A,vf,uc,bog){
  let b=bog, p, q, dx, dz, l;
  for(let it=0;it<3;it++){ p=A.pos(uc-b,vf(uc-b)); q=A.pos(uc+b,vf(uc+b)); dx=q.x-p.x; dz=q.z-p.z; l=Math.hypot(dx,dz)||1; if(it<2) b*=2*bog/l; }
  return {x:(p.x+q.x)/2, z:(p.z+q.z)/2, hx:dx/l, hz:dz/l};
}
// 連接:点 uJ(連接台車)から向き sg の側へ、弦の長さ d の所の台車の点(線路の上)と、uJ→その点の単位ベクトル
function xArtPoint(A,vf,uJ,sg,d){
  const pJ=A.pos(uJ,vf(uJ)); let b=d, q, dx, dz, l;
  for(let it=0;it<4;it++){ q=A.pos(uJ+sg*b,vf(uJ+sg*b)); dx=q.x-pJ.x; dz=q.z-pJ.z; l=Math.hypot(dx,dz)||1; b*=d/l; }
  return {p:pJ, hx:dx/l, hz:dz/l};
}
// 車両を置く:p={x,z,hx,hz}=車体の中心と +u の向き。dir=車体の局所 +x が +u の向きなら 1。局所 +z=(−hz,hx)
function seatXCar(c,p,dir){
  const hx=p.hx*dir, hz=p.hz*dir;
  c.position.set(p.x,XR.RAILTOP,p.z); c.rotation.set(0,Math.atan2(-hz,hx),0);
  c.userData.pose={x:p.x,z:p.z,hx:hx,hz:hz};
  lodCar(c);
}
// ホームの側(+v に sg)が車体の局所 z のどちらか(setCarDoors の side)
function xDoorSide(A,c,u,v,sg){ const a=A.pos(u,v), b=A.pos(u,v+sg), P=c.userData.pose; return ((b.x-a.x)*(-P.hz)+(b.z-a.z)*P.hx)>0?1:-1; }
// 扉の開度(停車の初め 2秒で開き、終わりの 3秒で閉める)と夜の照らし方(停車中はホームの照明)
function xDoorStep(t,cars,dt,open,side){
  t.dr=t.dr||0; t.dr=open?Math.min(1,t.dr+dt/2):Math.max(0,t.dr-dt/2);
  for(const c of cars){ setCarDoors(c,t.dr,side); c.userData.xsta=open?CAR_LIT:0; carLit(c); }
}
/* 井の頭線の列車:上下1本ずつ(左側通行)。下り(吉祥寺方=+u)は西の線(0)、上り(渋谷方=-u)は東の線(1)。片道を走って線路の端の先へ抜け、
   見えない所で反対の端へ戻る(線路の上で線を移らない)。明大前のホームに停車して扉を開ける。編成は 1751F(上り)と同じ 1・2次車・
   ブルーグリーンの 1758F(下り。形は 1751F と同じとした) */
const INO_CARS=5, INO_PITCH=K10.PITCH, INO_V=16, INO_ACC=0.9, INO_DEC=1.0, INO_DWELL=20;
const INO_UL=Math.min(-XR.U0,XR.U1);                    // 線路の端(u=0 から)
let inoShow=true;                                       // 列車走行 ON/OFF(trainsOn は10章で宣言されるのでここでは見ない)
const inoTrains=[1,-1].map(function(dir){
  const form=dir>0?'1758F':'1751F', F=K10_FORMATIONS[form], g=xTrainGroup('ino'), k=dir>0?0:1, cars=[];
  const dest=dir>0?'吉祥寺':'渋谷';
  for(let j=0;j<INO_CARS;j++){
    const n=dir>0?INO_CARS-j:j+1;                       // 渋谷方から n 両目(公表の編成表。j=0 が先頭)
    const c=makeXCar({series:'1000',cabF:j===0,cabR:j===INO_CARS-1,panto:F.panto.indexOf(n)>=0,motor:F.motor.indexOf(n)>=0,
      num:F.cars[n-1],carNo:INO_CARS+1-n,color:F.color,pside:dir>0?-1:1,lights:j===0?'head':(j===INO_CARS-1?'tail':'off'),
      sign:{kind:'各停',dest:dest},crowd:j%3});
    g.add(c); cars.push(c);
  }
  const ext=K10.LEN/2+0.1, pl=dir>0?INO_PLAT.dn:INO_PLAT.up;   // 停車位置:先頭の前端をホームの先の端の1m手前に
  return {g:g, cars:cars, form:form, dir:dir, k:k, vf:u=>INO.trk(k,u), ext:ext, uS:dir>0?pl[1]-1-ext:pl[0]+1+ext,
          u:dir>0?-150:330, v:INO_V, wait:0, served:false, poses:[]};
});
function stepIno(t,dt){
  if(t.wait>0){ t.wait=Math.max(0,t.wait-dt); t.v=0; }
  else if(!t.served){
    const d=t.dir*(t.uS-t.u);
    if(d<=0||t.v*dt>=d){ t.u=t.uS; t.v=0; t.wait=INO_DWELL; t.served=true; }
    else t.v=Math.min(t.v+INO_ACC*dt, INO_V, Math.sqrt(2*INO_DEC*d));
  } else t.v=Math.min(t.v+INO_ACC*dt, INO_V);
  t.u+=t.dir*t.v*dt;
  if(t.dir*t.u-(INO_CARS-1)*INO_PITCH-t.ext>INO_UL){ t.u=-t.dir*(INO_UL+t.ext); t.served=false; t.v=INO_V; }
  let any=false;
  for(let j=0;j<INO_CARS;j++){ const uc=t.u-t.dir*j*INO_PITCH, c=t.cars[j];
    c.visible=Math.abs(uc)+t.ext<=INO_UL;
    if(c.visible){ any=true; t.poses[j]=xCarPose(INO,t.vf,uc,K10.BOGIE_X); seatXCar(c,t.poses[j],t.dir); } }
  t.g.visible=inoShow&&any;
  const open=t.wait>3&&t.wait<INO_DWELL-0.5, c0=t.cars[0];
  xDoorStep(t,t.cars,dt,open,c0.visible?xDoorSide(INO,c0,t.u,t.vf(t.u),t.k?1:-1):1);
}
/* 世田谷線の列車(304F。2車体連接)。南の端から北行き(西の線)で入り、下高井戸の終端のホーム(西の線の脇)に停まって折り返し、南行きは
   渡り線で東の線へ移って南の端へ抜ける。抜けたら SETA_AWAY 秒おいて南の端から入り直す。u=連接台車の位置。A車が北(下高井戸方)。
   折り返しで前照灯・尾灯と行先を入れ替える(北行き=A車が前・下高井戸行、南行き=B車が前・三軒茶屋行) */
const SETA_CARS=2, SETA_V=8, SETA_ACC=0.8, SETA_DEC=0.9, SETA_DWELL=25, SETA_AWAY=30;
const SETA_EXT=K30.LEN/2-K30.JACOBS;                    // 連接台車から編成の端まで(片側)
const setaTrain=(function(){
  const g=xTrainGroup('seta'), F=K30_FORMATIONS['304F'];
  const A=makeXCar({series:'300',art:'A',cabF:true,panto:true,motor:true,num:F.cars[0],pside:1,lights:'head',sign:{kind:'',dest:'下高井戸'},crowd:0});
  const B=makeXCar({series:'300',art:'B',cabR:true,panto:true,motor:true,num:F.cars[1],pside:-1,lights:'tail',sign:{kind:'',dest:'下高井戸'},crowd:1});
  g.add(A); g.add(B);
  return {g:g, cars:[A,B], ext:SETA_EXT, uS:SETA_PLAT.u[1]-1-SETA_EXT, u:-250, dir:1, v:SETA_V, wait:0, away:0};
})();
const setaVf=t=>t.dir>0?(u=>SETA.trk(0,u)):setaXO;       // 北行き=西の線/南行き=渡り線で東の線へ
function setaHead(t){                                    // 前の車両の灯火と行先(折り返しで入れ替える)
  const [A,B]=t.cars, n=t.dir>0, sg={kind:'',dest:n?'下高井戸':'三軒茶屋'};
  setXCarLights(A,n?'head':'tail'); setXCarLights(B,n?'tail':'head'); setXCarSign(A,sg); setXCarSign(B,sg);
}
function stepSeta(t,dt){
  if(t.away>0){ t.away-=dt; if(t.away<=0){ t.dir=1; t.u=XR.SETA_U0-t.ext; t.v=SETA_V; } }
  else if(t.dir>0){
    const d=t.uS-t.u;
    if(d<=0||t.v*dt>=d){ t.u=t.uS; t.v=0; t.dir=-1; t.wait=SETA_DWELL; }
    else { t.v=Math.min(t.v+SETA_ACC*dt, SETA_V, Math.sqrt(2*SETA_DEC*d)); t.u+=t.v*dt; }
  } else if(t.wait>0) t.wait=Math.max(0,t.wait-dt);
  else { t.v=Math.min(t.v+SETA_ACC*dt, SETA_V); t.u-=t.v*dt;
    if(t.u+t.ext<XR.SETA_U0) t.away=SETA_AWAY; }
  setaHead(t);
  const vf=setaVf(t), [A,B]=t.cars, dE=K30.END_BOG-K30.JACOBS;
  const on=!(t.away>0), inA=on&&t.u+t.ext<=XR.SETA_U1+1e-6&&t.u>=XR.SETA_U0, inB=on&&t.u-t.ext>=XR.SETA_U0&&t.u<=XR.SETA_U1;
  A.visible=inA; B.visible=inB;
  if(inA||inB){
    const a=xArtPoint(SETA,vf,t.u,1,dE), b=xArtPoint(SETA,vf,t.u,-1,dE);
    if(inA) seatXCar(A,{x:a.p.x-a.hx*K30.JACOBS, z:a.p.z-a.hz*K30.JACOBS, hx:a.hx, hz:a.hz},1);
    if(inB) seatXCar(B,{x:b.p.x-b.hx*K30.JACOBS, z:b.p.z-b.hz*K30.JACOBS, hx:-b.hx, hz:-b.hz},1);
  }
  t.g.visible=inoShow&&(inA||inB);
  const open=t.dir<0&&t.wait>3&&t.wait<SETA_DWELL-0.5;
  xDoorStep(t,t.cars,dt,open,A.visible?xDoorSide(SETA,A,t.u,vf(t.u),-1):1);
}
function xTrainsLod(){ for(const t of inoTrains.concat([setaTrain])) for(const c of t.cars) if(c.visible) lodCar(c); }   // 描く直前の今のカメラで
/* 交差鉄道の列車を進めて配置する */
function stepXRail(dt){
  for(const t of inoTrains) stepIno(t,dt);              // 井の頭線の線路に沿って走行
  stepSeta(setaTrain,dt);
}
stepXRail(0);           // 初期配置(列車走行OFFのままでも線路の上に載っている)
const parkedCars=[];
/* 留置の編成の登録簿(検証が置き場所・編成・向きを読む)。cars は東(新宿方)から順。
   lit=灯火・表示を点けてホームで待っている編成(笹塚の3番線) */
const PARKS=[];
{ // 滞泊編成:留置線の実測有効長に応じ両数を自動決定
  // 留置線は sx が j とともに増える(走行列車と逆)。cabF/cabR をそのまま使うと
  // 両端の運転台が編成の内側を向いてしまうので、前後を入れ替える。
  const nE=10, nW=10;                       // 滞泊は上下方とも10両(指示)
  // 留置線は sx が j とともに増える=j が大きいほど西。西端基準は nE-j
  // 留置車は j が大きいほど西(京王八王子方)=新宿方から j+1 両目。灯火・表示は消灯、乗客なし
  const park=(j,n,form)=>{const sp=k8CarSpec(form,j+1);
    return makeCar({cabF:j===n-1, cabR:j===0, panto:sp.panto, motor:sp.motor, num:sp.num, series:sp.series,
      hachi:1, lights:'off', sign:null, crowd:null});};
  // 東端 e0 から西へ n 両を並べ、群 grp に入れて登録簿に残す
  const parkSet=(name,form,n,e0,off,grp)=>{
    const P={name:name, form:form, off:off, e0:e0, e1:e0+(n-1)*K8.PITCH+K8.LEN, cars:[]};
    for(let j=0;j<n;j++){const c=park(j,n,form);
      seatCar(c,e0+j*K8.PITCH+K8.LEN/2,()=>off,1);
      if(grp) grp.add(c);
      parkedCars.push(c); P.cars.push(c);}
    PARKS.push(P); return P;
  };
  parkSet('桜上水 留置線内側','8713F',nE,YARD_E+12,YARD_A,KOUKU[3].VGn);
  parkSet('桜上水 留置線外側','8714F',nW,YW0e+12,YARD_B,KOUKU[3].VGn);
  /* 笹塚の西側の留置線(南。内側 −2m):9000系10両(利用者指示)。西端を車止めの1m 手前(線路の端の3m 手前)に着ける。
     東端は本線からの渡り線が留置線に入る分岐の先(⑥が分岐との離れを見る) */
  { const T=TRACKS.find(t=>t.id==='笹塚留置線南'), L=9*K8.PITCH+K8.LEN;
    parkSet('笹塚 留置線(西側・南)','9732F',10,T.x1-3.0-L,-2,null); }
  /* ホームで待っている編成:上りの列車と同じ向き(j=0 が東端=新宿方の先頭)で、駅の上りの停止位置に着ける
     (扉がホームドアの開口に合う)。前照灯・尾灯・表示器を点け、乗客も乗せる。扉とホームドアは開けたまま
     (利用者指示。ホームドアの列ができてから開ける=10章の setPSD の後) */
  const standSet=(name,form,st,off,kind,dest)=>{
    const n=10, e0=stopPosOf(st,-1);
    const P={name:name, form:form, st:st, off:off, e0:e0, e1:e0+(n-1)*K8.PITCH+K8.LEN, cars:[], lit:true};
    for(let j=0;j<n;j++){const sp=k8CarSpec(form,j+1);
      const c=makeCar({cabF:j===0, cabR:j===n-1, panto:sp.panto, motor:sp.motor, num:sp.num, series:sp.series,
        hachi:-1, lights:j===0?'head':(j===n-1?'tail':'off'), sign:{kind:kind,dest:dest}, crowd:j%3});
      seatCar(c,e0+CAR_HALF+j*K8.PITCH,()=>off,-1);
      parkedCars.push(c); P.cars.push(c);}
    PARKS.push(P); return P;
  };
  /* 笹塚の3番線(内側の北 +2m。番線は南から数える。新宿方面のホーム):9000系10両(利用者指示)。この線は西で車止めに
     終わる線(本線は外側)なので、走行列車とは交わらない。西端は本線へ渡る分岐の手前(⑥が分岐との離れを見る) */
  standSet('笹塚 3番線','9734F',STA[0],2,'各停','本八幡');
}

/* ---- ホームドア(可動式ホーム柵) ------------------------------------------
   開口は「列車の停止位置」と「車両の扉配置 K8.DOORX」から算出する。
   1両4箇所×10両=40箇所。停止位置や扉配置を変えれば開口も自動で追従するので、
   ホームドアと車両の扉がずれることが起こらない。
   停車中(発車の3秒前まで)だけ開く。                                          */
const PSD=[];
const G_PSD_LEAF=new THREE.BoxGeometry(1,1.22,.07);
const MAT_PSDL=M(0xdfe2e5);
const PSD_OPEN=0.80;                      // 開口の半幅[m](開口1.60m)
/* 開口と開口の間の固定部(戸袋)。扉はこの中へ引き込まれる。
   駅ごとの結合ジオメトリ(STG)へ積む:1個ずつ Mesh にすると1列あたり約250回の描画になり、
   ホームドアだけで運転モードの描画の7割を占めていた(2026-10 実測 5,400回/画)。
   ・戸袋(白)と笠木(濃灰)は常に描く。京王の藍の帯と開口脇の支柱は近くだけ(LOD) */
const PSD_H=1.22, PSD_T=0.24;             // 高さ(ホーム面から)・戸袋の厚さ[m]
function psdFixed(S,a,b,off0,y,sh){
  const yp=y+1.1, oA=s=>off0+(sh?sh(s):0);
  // 面する線路に沿う:列が曲がる所(待避線がホームの端で曲がる駅)は線路に沿って掃引する(2026-10-13:分岐を駅へ寄せて曲がりが急になり、
  // 2m の真っすぐな片の端が待避線の建築限界に入った)
  const bend=sh&&Math.abs(sh(a)-sh(b))>0.005;
  if(bend){
    bar(S.mg,0xe9ebee,a,b,oA,PSD_T/2,yp,yp+PSD_H-0.10,{tag:'ホームドア'});
    bar(S.mg,0x59626d,a,b,oA,PSD_T/2+0.03,yp+PSD_H-0.10,yp+PSD_H);
    bar(S.md,0x1b2a66,a,b,oA,PSD_T/2+0.006,yp+PSD_H-0.36,yp+PSD_H-0.28);
  }
  for(let i=0,n=bend?0:1;i<n;i++){
    const a1=a+(b-a)*i/n, b1=a+(b-a)*(i+1)/n, m=(a1+b1)/2, L=b1-a1, off=oA(m), ex=(n>1)?0.02:0;
    S.mg.col(0xe9ebee).box(MAT.stVC,m,off,yp,yp+PSD_H-0.10,L+ex,PSD_T,{skip:'-y',tag:'ホームドア'});
    S.mg.col(0x59626d).box(MAT.stVC,m,off,yp+PSD_H-0.10,yp+PSD_H,L+0.02,PSD_T+0.06,{skip:'-y'});
    S.md.col(0x1b2a66).box(MAT.stVC,m,off,yp+PSD_H-0.36,yp+PSD_H-0.28,Math.max(0.05,L-0.02+ex),PSD_T+0.012,{skip:'-y+y'});
  }
  for(const e of[a+0.05,b-0.05])
    S.md.col(0xc4c9cf).box(MAT.stVC,e,oA(e),yp,yp+PSD_H+0.04,0.10,PSD_T+0.08,{skip:'-y'});
}
for(const d of PSD_DEF){
  const st=d.st, ro=runOff(st.x);
  for(const off of d.drs){
    // その扉列がどの走行線に面しているか。各停は ±runOff を走る(openable=各停が停まる列)。
    // (笹塚では内側が留置線で開かない。2面4線の本線側(内側)は特急が停まったときだけ開く=trainPSD)
    let dir=0, openable=true;
    if(Math.abs(off+ro)<2.5) dir=1;        // 南側=下り
    else if(Math.abs(off-ro)<2.5) dir=-1;  // 北側=上り
    if(!dir){
      // 各停が来ない側(笹塚の留置線側・2面4線の本線側)にもホームドアは設置する。
      // 開口の位置は本線の停止位置に合わせる。開くのは本線に停まる列車(特急)が面したときだけ。
      dir=off<0?1:-1; openable=false;
    }
    const stop=stopPosOf(st,dir)-dir*CAR_HALF;          // 先頭車の中心
    const open=[];
    for(let j=0;j<10;j++){                              // 10両
      const cs=stop-dir*j*K8.PITCH;
      for(const dx of K8.DOORX) open.push(cs+dir*dx);   // 1両4箇所
    }
    open.sort((a,b)=>a-b);
    // その扉列から見て、列車のどちらの"面"(車体ローカルzの符号)がホーム側か。
    // ローカル+zが±offのどちらを向くかは線形の向き(この路線はsが西へ増える)と
    // 進行方向で決まる。符号を推論で決めると間違えるので、実際の姿勢から求める。
    // 面している線は、駅の中心で列に最も近い線路(以前は各停の線/本線と決めていたので、笹塚の内側の列=留置線に
    // 面する列を外側の本線に対して求めていた。ホームで待たせる編成の扉を開けて分かった)
    const near=TRACKS.filter(t=>st.x>=t.x0&&st.x<=t.x1).map(t=>t.zf(st.x)).reduce((b,o)=>Math.abs(o-off)<Math.abs(b-off)?o:b,Infinity);
    const trackOff=isFinite(near)?near:(openable?(dir>0?-ro:ro):(dir>0?-mainOff(st.x):mainOff(st.x)));
    const side=(off>trackOff?1:-1)*localZSign(st.x,dir);
    // 列車が停まらない縁(PLAT_NOSTOP。仙川の島式の北)の列は開かない柵:trainPSD・ridePSDFor が選ばない
    const noStop=pltOf(st).some((pp,pi)=>[-1,1].some(sg=>noStopEdge(st,pi,sg)&&Math.abs(off-(pp[0]+sg*pp[1]))<0.3));
    const sh=edgeShift(st,off,trackOff>off?1:-1);       // 列は面する線路に沿う(ホームの縁と同じ)
    CUR=st.kk?KOUKU[st.kk-1].VGs:null;
    // 開口と開口の間の固定部(戸袋)。駅の結合ジオメトリへ積む
    const SG=STG[STA.indexOf(st)];
    let prev=d.x0;
    for(const c of open){
      if(c-PSD_OPEN-prev>0.05) psdFixed(SG,prev,c-PSD_OPEN,off,d.y,sh);
      prev=c+PSD_OPEN;
    }
    if(d.x1-prev>0.05) psdFixed(SG,prev,d.x1,off,d.y,sh);
    // 扉(2枚引き)。曲線に追従させるためインスタンスで置き、開閉は行列を更新する。
    // 列ごとに形を複製して列全体の外接球を持たせ、画面の外の列は描かない(共有の形のままだと間引けない)
    const lg=G_PSD_LEAF.clone(), lp=frame((d.x0+d.x1)/2,off);
    lg.boundingSphere=new THREE.Sphere(new THREE.Vector3(lp.x,d.y+1.7,lp.z),(d.x1-d.x0)/2+3);
    const inst=new THREE.InstancedMesh(lg,MAT_PSDL,open.length*2);
    inst.frustumCulled=true;
    add(inst);
    PSD.push({st:st,dir:dir,off:off,sh:sh,side:side,openable:openable,noStop:noStop,
              y:d.y+1.71,open:open,inst:inst,r:-1});
  }
}
CUR=null;
stFlush();      // 駅の結合ジオメトリ(7章の構造+ホームドア)を Mesh にする
// 開度 r(0=閉/1=開)を反映する
const _psdM=new THREE.Matrix4(),_psdQ=new THREE.Quaternion(),_psdE=new THREE.Euler(),
      _psdV=new THREE.Vector3(),_psdS=new THREE.Vector3(PSD_OPEN,1,1);
function setPSD(p,r){
  let i=0;
  for(const c of p.open){
    for(const sg of[-1,1]){
      const s=c+sg*(PSD_OPEN/2+PSD_OPEN*r);            // 閉=開口の内側/開=戸袋へ退避
      const q=frame(s,p.off+p.sh(s));                  // 列は面する線路に沿う(待避線がホームの端で曲がる駅)
      _psdE.set(0,-q.a,0);_psdQ.setFromEuler(_psdE);
      _psdV.set(q.x,p.y,q.z);
      _psdM.compose(_psdV,_psdQ,_psdS);
      p.inst.setMatrixAt(i++,_psdM);
    }
  }
  p.inst.instanceMatrix.needsUpdate=true;
  p.r=r;
}
for(const p of PSD) setPSD(p,0);
/* ホームで待たせる編成(standSet。笹塚の3番線)は扉とホームドアを開けたままにする(利用者指示)。
   列は編成の線に面したもの、開く面はその列の side(列と編成の線の位置関係から。走行列車の stepCarDoors と同じ) */
for(const P of PARKS){
  if(!P.lit) continue;
  const row=PSD.find(q=>q.st===P.st&&Math.abs(q.off-P.off)<2.5);
  if(!row) continue;
  P.psd=row; row.hold=true; setPSD(row,1);
  for(const c of P.cars) setCarDoors(c,1,row.side);
}

/* ---- ホームの人(利用者指示)--------------------------------------------------------
   ホームドアの開口(PSD の open=扉の位置)の後ろに1〜3人の列、ほかに数人がまばらに立つ。ホームの縁から 1.1m 以上内側
   (点字ブロックの後ろ)・ホームの端の柵の内側。ホームの柱・ベンチ・自動販売機・階段の囲い・エレベーターなど床の上の物
   (登録簿 STRUCT・STAIRS)には重ならない。線路の方を向く。駅ごとに1つのインスタンス(外接球を持たせ、近くだけ描く)。
   形:脚(濃い色)・胴(服=インスタンスの色)・頭(肌)。服の色は頂点の色が白の所だけに掛ける(onBeforeCompile)。
   夜は駅の照明で照らされた明るさ(面の色を掛けた発光)。登録簿 PEOPLE(検証が位置を測る) */
const PEOPLE=[];
/* 人の形(2026-10-12 利用者指示:老若男女・学生・会社員・主婦など多くの型、鞄やスマホも)。1つの形に全部の部品を入れ、
   人ごとに見せる部品(iMask のビット)と色(上着=インスタンスの色・下=iLow・髪=iHair・鞄=iBag)を属性で選ぶ。
   隠す部品は頂点を原点へ潰す(三角形が消える)。駅ごと・歩道ごとに1回の描画のまま。
   歩く人は脚と腕を振る(iWalk=(歩く量,位相)。uPeopleT=時刻)。高さ1・前=+x */
const PP={LEGL:0,LEGR:1,TORSO:2,ARML:3,ARMR:4,ARMUP:5,HEAD:6,HAIRS:7,HAIRL:8,SKIRT:9,TIE:10,PACK:11,SBAG:12,CASE:13,PHONE:14,SHOP:15};
const PK={FIX:0,UP:1,LOW:2,HAIR:3,BAG:4,LEG:5};   // 色の出どころ:頂点の色・上着・下(ズボン・スカート)・髪・鞄・脚(ズボンかタイツ)
const PEOPLE_U={uPeopleT:{value:0}};
/* 形の道具(2026-11 利用者指示「車やトラック、人間のモデルを精密にしポリゴン数を上げて」):箱だけで作っていた人と車を、丸い断面の筒・
   楕円体・側面の形の押し出しで作る。頂点に (位置・法線・色・追加の属性) を積み、最後に三角形の巻き順を法線に合わせてそろえる
   (表の面だけ描く材質でも裏返らない)。hex=null の色は白(インスタンスの色を掛ける所) */
function meshKit(){
  const K={P:[],N:[],C:[],I:[],A:[],attr:null}, col=new THREE.Color();
  const setC=hex=>{ if(hex===null||hex===undefined) col.setRGB(1,1,1); else setSrgb(col,hex); };
  const vtx=(x,y,z,nx,ny,nz)=>{ const l=Math.hypot(nx,ny,nz)||1; K.P.push(x,y,z); K.N.push(nx/l,ny/l,nz/l); K.C.push(col.r,col.g,col.b); if(K.attr) K.A.push(...K.attr); return K.P.length/3-1; };
  const tri=(a,b,c)=>K.I.push(a,b,c);
  K.use=a=>{ K.attr=a; return K; };
  // y に沿う楕円の断面の積み重ね rings=[[y,cx,cz,rx,rz],…](n 角。法線は断面の楕円の外向き+傾き)。cap0/cap1=下と上の蓋
  K.lofty=(rings,n,hex,cap0,cap1)=>{ setC(hex); const base=K.P.length/3;
    for(let r=0;r<rings.length;r++){ const [y,cx,cz,rx,rz]=rings[r], q=rings[Math.max(0,r-1)], w=rings[Math.min(rings.length-1,r+1)];
      const dy=(w[0]-q[0])||1, drx=(w[3]-q[3])/dy, drz=(w[4]-q[4])/dy;
      for(let k=0;k<n;k++){ const t=2*Math.PI*k/n, c=Math.cos(t), s=Math.sin(t), ex=c/Math.max(rx,1e-4), ez=s/Math.max(rz,1e-4), el=Math.hypot(ex,ez)||1;
        vtx(cx+rx*c,y,cz+rz*s, ex/el,-(drx*c*c+drz*s*s),ez/el); } }
    for(let r=0;r+1<rings.length;r++) for(let k=0;k<n;k++){ const a=base+r*n+k, b=base+r*n+(k+1)%n, c=a+n, d=b+n; tri(a,b,d); tri(a,d,c); }
    for(const [use,r,sg] of [[cap0,0,-1],[cap1,rings.length-1,1]]) if(use){ const [y,cx,cz]=rings[r], m=vtx(cx,y,cz,0,sg,0), b0=K.P.length/3;
      for(let k=0;k<n;k++){ const i=base+r*n+k; vtx(K.P[3*i],K.P[3*i+1],K.P[3*i+2],0,sg,0); }
      for(let k=0;k<n;k++) tri(m,b0+k,b0+(k+1)%n); }
    return K; };
  // 点の列に沿う丸い筒 pts=[[x,y,z,r],…](端は半球に近い蓋)
  K.tube=(pts,n,hex,caps)=>{ setC(hex); const base=K.P.length/3, F=[];
    for(let i=0;i<pts.length;i++){ const p=pts[Math.max(0,i-1)], q=pts[Math.min(pts.length-1,i+1)]; let tx=q[0]-p[0], ty=q[1]-p[1], tz=q[2]-p[2]; const l=Math.hypot(tx,ty,tz)||1; tx/=l; ty/=l; tz/=l;
      let ux=0,uy=0,uz=1; if(Math.abs(tz)>0.9){ux=1;uz=0;}
      let ax=ty*uz-tz*uy, ay=tz*ux-tx*uz, az=tx*uy-ty*ux; const la=Math.hypot(ax,ay,az); ax/=la; ay/=la; az/=la;
      const bx=ty*az-tz*ay, by=tz*ax-tx*az, bz=tx*ay-ty*ax; F.push([ax,ay,az,bx,by,bz]); }
    for(let i=0;i<pts.length;i++){ const [x,y,z,r]=pts[i], f=F[i];
      for(let k=0;k<n;k++){ const t=2*Math.PI*k/n, c=Math.cos(t), s=Math.sin(t), nx=f[0]*c+f[3]*s, ny=f[1]*c+f[4]*s, nz=f[2]*c+f[5]*s; vtx(x+nx*r,y+ny*r,z+nz*r,nx,ny,nz); } }
    for(let i=0;i+1<pts.length;i++) for(let k=0;k<n;k++){ const a=base+i*n+k, b=base+i*n+(k+1)%n, c=a+n, d=b+n; tri(a,b,d); tri(a,d,c); }
    if(caps) for(const [i,sg] of [[0,-1],[pts.length-1,1]]){ const p=pts[i], q=pts[i-sg]||pts[i]; let tx=(p[0]-q[0])*sg, ty=(p[1]-q[1])*sg, tz=(p[2]-q[2])*sg; const l=Math.hypot(tx,ty,tz)||1;
      const m=vtx(p[0]+tx/l*p[3]*0.6,p[1]+ty/l*p[3]*0.6,p[2]+tz/l*p[3]*0.6,tx,ty,tz); for(let k=0;k<n;k++) tri(m,base+i*n+k,base+i*n+(k+1)%n); }
    return K; };
  // 楕円体(の一部):極角 ph0〜ph1(0=上)・方位 th0〜th1(0=+x)
  K.ell=(cx,cy,cz,rx,ry,rz,nu,nv,hex,ph0,ph1,th0,th1)=>{ setC(hex); ph0=ph0||0; ph1=ph1===undefined?Math.PI:ph1; th0=th0||0; th1=th1===undefined?2*Math.PI:th1;
    const full=Math.abs(th1-th0-2*Math.PI)<1e-6, nu1=full?nu:nu+1, base=K.P.length/3;
    for(let j=0;j<=nv;j++){ const ph=ph0+(ph1-ph0)*j/nv, sp=Math.sin(ph), cp=Math.cos(ph);
      for(let k=0;k<nu1;k++){ const th=th0+(th1-th0)*k/nu, ct=Math.cos(th), st=Math.sin(th); vtx(cx+rx*sp*ct,cy+ry*cp,cz+rz*sp*st,sp*ct/rx,cp/ry,sp*st/rz); } }
    for(let j=0;j<nv;j++) for(let k=0;k<nu;k++){ const a=base+j*nu1+k, b=base+j*nu1+(k+1)%nu1, c=a+nu1, d=b+nu1; tri(a,b,d); tri(a,d,c); }
    return K; };
  // 平らな多角形(凸か単純。点は順に)と法線
  K.poly=(V,n,hex)=>{ setC(hex); const b=K.P.length/3; for(const v of V) vtx(v[0],v[1],v[2],n[0],n[1],n[2]); for(let i=1;i+1<V.length;i++) tri(b,b+i,b+i+1); return K; };
  // 箱(下面なし)
  K.box=(x0,x1,y0,y1,z0,z1,hex)=>{ for(const [k,q] of boxFaces(x0,x1,y0,y1,z0,z1,['top','px','nx','pz','nz'])) K.poly([q[0],q[1],q[2],q[3]],q[4],hex); return K; };

    const W=STAIRS.filter(w=>w.s1>q.x0&&w.s0<q.x1&&w.o1>q.off-q.hw&&w.o0<q.off+q.hw);
    const free=(s,o)=>{
      if(s<q.x0+3||s>q.x1-3||o<q.edge(s,-1)+1.1||o>q.edge(s,1)-1.1) return false;   // 縁はその s の縁(待避線に沿って曲がる)
      for(const w of W){                                   // 階段の入口の前 2.6m・エレベーターの前 1.8m は空けておく(出入りする人の通り道)
        const fr=w.kind==='階段'?((w.dir||1)>0?[2.6,0.8]:[0.8,2.6]):[0.8,0.8], fo=w.kind==='階段'?0.6:1.8;
        if(s>w.s0-fr[0]&&s<w.s1+fr[1]&&o>w.o0-fo&&o<w.o1+fo) return false; }
      for(const b of OB) if(s>b.s0-0.35&&s<b.s1+0.35&&o>b.o0-0.35&&o<b.o1+0.35) return false;
      for(const m of PEOPLE) if(m.q===q&&Math.abs(m.s-s)<0.55&&Math.abs(m.o-o)<0.55) return false;
      return true;
    };
    const put=(s,o,face,ex)=>{ if(!free(s,o)) return null; const L=personLook();
      const m=Object.assign({q:q,s:s,o:o,y:railY(s)+STD.PLAT,face:face,h:L.h,w:L.w,c:L.up,look:L,type:L.type},ex||{}); PEOPLE.push(m); return m; };
    /* ホームドアの開口の両脇に並ぶ(扉の位置ごとに 55%。2026-10-12:降りる人が真ん中を通れるように扉の中心から 0.85m ずつ
       左右へ分かれる)。row・door を残す(乗り降りの動き FLOW がこの人たちを乗せる) */
    for(const e of[-1,1]){
      const edge=q.off+e*q.hw;
      const row=PSD.find(r=>!r.noStop&&Math.abs(r.off-edge)<1.2&&r.open.some(c=>c>q.x0&&c<q.x1));
      if(!row) continue;
      for(const c of row.open){
        if(c<q.x0||c>q.x1||Math.random()>0.55) continue;
        for(const sd of[-1,1]){ const n=Math.floor(Math.random()*2.6);
          for(let k=0;k<n;k++){ const sp=c+sd*(0.85+(Math.random()-0.5)*0.1);
            if(1.5+0.62*k>(q.edge(sp,1)-q.edge(sp,-1))/2-0.2) break;          // 列はホームの中心を越えない(待避線の側の縁が曲がって狭くなる端)
            put(sp, psdLineOf(q,e,sp)-e*(1.5+0.62*k), e, {row:row,door:c,qk:k}); } }   // ホームドアの線から 1.5m 奥(通り道の後ろ)   // ホームドアの線から 1.5m 奥(通り道の後ろ)
      }
    }
    // まばらに立つ人(向きはどちらかの縁)
    for(let k=0;k<10;k++) put(q.x0+3+Math.random()*(q.x1-q.x0-6), q.off+(Math.random()-0.5)*2*(q.hw-1.2), Math.random()<0.5?-1:1);
    byPlat.set(q,true);
  }
  // 駅ごと(ホームの中ほどが近い駅)に1つのインスタンス
  const groups=new Map();
  for(const m of PEOPLE){ let st=STA[0]; for(const z of STA) if(Math.abs(z.x-(m.q.x0+m.q.x1)/2)<Math.abs(st.x-(m.q.x0+m.q.x1)/2)) st=z;
    m.st=st; let g=groups.get(st); if(!g){g=[];groups.set(st,g);} g.push(m); }
  for(const [st,list] of groups){
    const bx={x0:1e9,x1:-1e9,y0:1e9,y1:-1e9,z0:1e9,z1:-1e9};
    const L2=list.map(function(m){
      const f=frame(m.s,m.o), n=frame(m.s,m.o+m.face);            // 縁(線路)の方を向く
      bx.x0=Math.min(bx.x0,f.x);bx.x1=Math.max(bx.x1,f.x);bx.y0=Math.min(bx.y0,m.y);bx.y1=Math.max(bx.y1,m.y+2);bx.z0=Math.min(bx.z0,f.z);bx.z1=Math.max(bx.z1,f.z);
      return (m.rec={x:f.x,y:m.y,z:f.z,yaw:Math.atan2(-(n.z-f.z),n.x-f.x),look:m.look});
    });
    const sph=new THREE.Sphere(new THREE.Vector3((bx.x0+bx.x1)/2,(bx.y0+bx.y1)/2,(bx.z0+bx.z1)/2),Math.hypot(bx.x1-bx.x0,bx.y1-bx.y0,bx.z1-bx.z0)/2+2);
    // 近く(PEOPLE_NEAR まで)は細かい形、その先 PEOPLE_FAR までは粗い形。どちらも駅ごとに1回の描画
    const im=peopleMesh(L2,'ホームの人 '+st.n), imF=peopleMesh(L2,'ホームの人(遠く) '+st.n,true);
    list.forEach((m,i)=>{ m.im=im; m.imF=imF; m.ii=i; m.shown=true; });   // 乗り降りで隠す・戻すための番号
    for(const m of [im,imF]){ m.geometry.boundingSphere=sph; m.frustumCulled=true; scene.add(m); }
    lodAdd(im,bx,PEOPLE_NEAR); lodAdd(imF,bx,PEOPLE_FAR,PEOPLE_NEAR);
  }
}

/* ---- 乗り降り(2026-10-12 利用者指示)------------------------------------------------------
   列車が停まって扉が開くと、まず車内の人がホームへ降り(扉ごとに0〜3人)、ホームの通り道(線路側の縁から約1〜1.35m 内・階段の
   井戸の外)を通って最も近い階段(高齢者の半分はエレベーター)へ進み、井戸の中へ降りて(仙川は上がって)消える。その扉の降車が
   済んだら(扉から 1.5m 以内に降りる人がいない)、扉の両脇に並んでいた人が並んだ順に乗る。列車が出ると、乗った人の場所へ
   5〜40秒のうちに階段から新しい人が歩いて来て並ぶ。歩く人どうし・立っている人とはぶつからないよう、前方 1m 以内の人から
   横へよけ(押しのける力)、真正面に近い人がいれば速さを落とす。登録簿 FLOW(walkers=歩いている人) */
const FLOW={walkers:[], ev:new Map(), respawn:[], T:0};
const FLOW_NEAR=120, FLOW_FAR=350;
function flowPlat(row){                          // その扉の列の面するホーム(PLATS)と縁の向き e(+1=北の縁)
  for(const q of PLATS){
    if(row.open[0]<q.x0-5||row.open[row.open.length-1]>q.x1+5) continue;
    if(row.off<q.off-q.hw-0.4||row.off>q.off+q.hw+0.4) continue;
    return {q:q,e:Math.sign(row.off-q.off)||1};
  }

}
function flowExits(q){                           // そのホームの出口:階段の入口(e0)とエレベーターの扉の前
  if(q.exits) return q.exits;
  const X=[];
  for(const w of STAIRS){
    if(w.s1<q.x0||w.s0>q.x1||w.o1<q.off-q.hw||w.o0>q.off+q.hw) continue;
    const oc=(w.o0+w.o1)/2;
    if(w.kind==='階段'){ const f=w.dir||1, e0=f>0?w.s0:w.s1; X.push({kind:'階段',s:e0,o:oc,f:f,up:!!w.up,w:w}); }

// 歩く人を作る:path=[[s,o,y?],...](最後の点で消える/着く)。done=着いたときに呼ぶ
function flowWalker(st,q,look,path,v,done,kind){
  const last=path[path.length-1];

    goal:[last[0],last[1]]};

}
/* ホームドアの線(縁 e の側):その縁に立つホームドアの列の o(待避線に沿って曲がる駅は s で変わる)。列が無ければ縁。
   人は乗り降りの間(車内⇄扉)を除き、体の中心がこの線より FLOW_PSD 内側にいる(全身がホーム側) */
const FLOW_PSD=0.3;
function psdLineOf(q,e,s){
  if(!q._psd) q._psd={};
  if(!(e in q._psd)){ const edge=q.off+e*q.hw;
    q._psd[e]=PSD.find(r=>Math.abs(r.off-edge)<1.2&&r.open.some(c=>c>q.x0-5&&c<q.x1+5))||null; }
  const r=q._psd[e]; return r?r.off+r.sh(s):q.edge(s,e);
}
/* 通り道:ホームドアの線から 0.55m(+s へ歩く人の側は縁 e が北なら近い方)と 0.95m の2本。向きで分け、すれ違う人が
   正面からぶつからない(左右どちらを通るかを向きで決める)。扉の脇の列はホームドアの線から 1.5m より奥 */
const FLOW_LANE=[0.55,0.95];
function flowLaneAt(q,e,s,d){ return psdLineOf(q,e,s)-e*FLOW_LANE[(d*e>0)?0:1]; }
/* 階段とエスカレーター(STAIRS の井戸)を歩く所:高さは段の形から(入口 e0 から奥へ。押されても上下しない)。
   高架駅(下り):階段=幅の 0〜55%(段 0.165/0.30)、エスカレーター(下り)=55〜100%(入口の 0.7m の床板の先から 30°)。
   降りて床より下に頭が隠れる所(1.75m 下)で消える/そこから現れる。
   地上駅(仙川。上り):階段は奥 e1 の手前 sB から上り、エスカレーター(上り)は奥から dl の所から 30°。奥 e1(駅舎の床)で消える/現れる。
   階段は2列:ホームから離れる人=エスカレーター寄り、ホームへ来る人=反対の縁寄り */
function flowWell(x){
  if(x.g) return x.g;
  const w=x.w, f=x.f, e0=f>0?w.s0:w.s1, e1=f>0?w.s1:w.s0, oS=w.o0+(w.o1-w.o0)*0.55, yt=railY(e0)+STD.PLAT;
  const g={f:f,e0:e0,e1:e1,yt:yt,laneOut:oS-0.32,laneIn:w.o0+0.32,laneEsc:(oS+w.o1)/2};
  if(!x.up){
    const D=1.75;                                                 // 頭が床より下に隠れる深さ
    g.stairY=s=>yt-0.55*Math.max(0,f*(s-e0)); g.stairEnd=e0+f*D/0.55;
    g.escY=s=>yt-Math.tan(Math.PI/6)*Math.max(0,f*(s-e0)-0.7); g.escEnd=e0+f*(0.7+D/Math.tan(Math.PI/6));
  }else{
    const yF=w.yF, N=Math.ceil((yF-yt)/0.165), r=(yF-yt)/N, sB=e1-f*N*0.30, dl=(yF-yt)/Math.tan(Math.PI/6);
    g.stairY=s=>yt+r/0.30*clamp(f*(s-sB),0,N*0.30); g.stairEnd=e1;
    g.escY=s=>yt+Math.tan(Math.PI/6)*clamp(f*(s-(e1-f*dl)),0,dl); g.escEnd=e1;
  }
  return (x.g=g);
}
function flowPathToExit(q,e,s0,o0,x,w0){        // 降りた人:通り道へ出て、出口へ。w0=歩く人(階段の区間の印を付ける)
  const yP=railY(s0)+STD.PLAT, P=[[s0,o0,yP]];
  if(x.kind==='階段'){
    const g=flowWell(x), d=Math.sign(x.s-s0)||1, ln=flowLaneAt(q,e,s0,d), a=g.e0-g.f*1.2;
    // エスカレーターに3人以上並んでいれば階段へ
    const qEsc=FLOW.walkers.filter(o=>o.rail&&o.rail.g===g&&o.rail.esc&&o.k<=o.rail.from).length;
    const esc=qEsc<3&&Math.random()<0.5, oi=esc?g.laneEsc:g.laneOut;
    P.push([s0,ln],[a,flowLaneAt(q,e,a,d)],[a,oi],[g.e0,oi]);
    w0.rail={from:P.length-1,g:g,esc:esc};                        // [e0,oi] から先が段(エスカレーター)の上
    P.push([esc?g.escEnd:g.stairEnd,oi]);
  }else{
    // エレベーター:扉の前(かごの中心から 1.15m=扉の所)まで歩いて乗る(そこで消える)。扉の前は1列に並ぶ
    const d=Math.sign(x.s-s0)||1, ln=flowLaneAt(q,e,s0,d), sd=Math.sign(ln-x.o||1), o1=x.o+sd*1.9, od=x.o+sd*1.15;
    P.push([s0,ln],[x.s,flowLaneAt(q,e,x.s,d)],[x.s,o1],[x.s,od]);
    w0.evDoor=[x.s,od];
  }

}
function flowNearestExit(q,s,elder){
  const X=flowExits(q); if(!X.length) return null;
  const ev=X.filter(x=>x.kind==='EV'), st=X.filter(x=>x.kind==='階段');
  const pool=(elder&&ev.length&&Math.random()<0.5)?ev:(st.length?st:ev);
  return pool.reduce((b,x)=>Math.abs(x.s-s)<Math.abs(b.s-s)?x:b,pool[0]);
}
function flowHide(m,hide){                        // ホームに立っている人を隠す/戻す(駅のインスタンスの番号 m.ii)
  if(!m.im) return;
  if(hide){ _pM.makeScale(0,0,0); for(const im of[m.im,m.imF]){ im.setMatrixAt(m.ii,_pM); im.instanceMatrix.needsUpdate=true; } }
  else for(const im of[m.im,m.imF]){ personInst(im,m.ii,m.rec); im.instanceMatrix.needsUpdate=true; }
  m.shown=!hide;
}
const flowOnRail=w=>!!w.rail&&w.k>=w.rail.from&&w.k<(w.rail.to===undefined?1e9:w.rail.to);
function stepFlow(dt){
  FLOW.T+=dt;
  // 停まって扉が開いた列車ごとに、降りる人を出し、乗る人を決める
  for(const t of trains){
    let E=FLOW.ev.get(t);
    if(t.st!=='dwell'||!t.atSt){ if(E){ flowClose(E); FLOW.ev.delete(t); } continue; }
    if(E&&E.st!==t.atSt){ flowClose(E); FLOW.ev.delete(t); E=null; }
    if(E||!(t.dr>0.95)) continue;
    const row=trainPSD(t); if(!row) continue;
    const pq=flowPlat(row); if(!pq) continue;
    const q=pq.q, e=pq.e, st=t.atSt, busy=['笹塚','明大前','桜上水','千歳烏山'].indexOf(st.n)>=0;
    E={t:t,st:st,row:row,q:q,e:e,t0:FLOW.T,doors:new Map(),board:[]};
    for(const c of row.open){
      if(c<q.x0+0.5||c>q.x1-0.5) continue;
      const n=Math.floor(Math.random()*(busy?3.4:2.6)), D={c:c,n:0,left:[]};
      for(let k=0;k<n;k++){
        const look=personLook(), x=flowNearestExit(q,c,look.type==='高齢者'); if(!x) continue;
        const oe=q.edge(c,e), wk={};
        const P=flowPathToExit(q,e,c+(Math.random()-0.5)*0.3,oe+e*0.7,x,wk);
        const w=flowWalker(st,q,look,P,(look.type==='高齢者'?0.9:1.15+Math.random()*0.3),null,'降');
        if(wk.rail) w.rail=wk.rail; if(wk.evDoor) w.evDoor=wk.evDoor;
        w.door=D; w.wait=k*0.9; w.e=e; D.left.push(w);
      }
      E.doors.set(c,D);
    }
    // 乗る人:その列の扉の両脇に並んでいる人
    for(const m of PEOPLE) if(m.row===row&&m.shown&&E.doors.has(m.door)) E.board.push(m);
    E.board.sort((a,b)=>a.qk-b.qk);
    FLOW.ev.set(t,E);
  }
  // 乗る人:その扉の降車が済んだら、並んだ順に(0.9秒ずつ)
  for(const E of FLOW.ev.values()){
    for(const m of E.board){
      if(m.boarding) continue;
      const D=E.doors.get(m.door); if(!D) continue;
      const de=E.q.edge(m.door,E.e);                                   // 扉の前(ホームの縁)から降りた人が離れるまで待つ
      const busyDoor=D.left.some(w=>FLOW.walkers.indexOf(w)>=0&&(w.k<2||w.wait>0||Math.hypot(w.s-m.door,w.o-de)<1.9));
      if(busyDoor||FLOW.T-E.t0<3+m.qk*0.9) continue;
      if(E.t.dwell!==undefined&&E.t.dwell<4) continue;                 // 発車の4秒前からは乗らない
      m.boarding=true; flowHide(m,true);
      const oe=E.q.edge(m.door,E.e), yP=railY(m.s)+STD.PLAT, sd=Math.sign(m.s-m.door)||1;
      const w=flowWalker(E.st,E.q,m.look,[[m.s,m.o,yP],[m.door+sd*0.25,psdLineOf(E.q,E.e,m.door)-E.e*(FLOW_PSD+0.1)],[m.door,oe+E.e*0.9]],1.2,null,'乗');
      w.m=m; w.e=E.e;
    }
  }
  // 戻ってくる人(乗った人の場所へ、階段から)
  for(let i=FLOW.respawn.length-1;i>=0;i--){
    const r=FLOW.respawn[i]; if(FLOW.T<r.at) continue;
    const m=r.m, q=m.q, x=flowNearestExit(q,m.s,false); if(!x){ FLOW.respawn.splice(i,1); flowHide(m,false); continue; }
    const e=Math.sign(m.o-q.off)||1, yP=railY(m.s)+STD.PLAT;
    // 列の場所へは扉と反対の脇から横に入る(前の列の人の真後ろを通らない)
    const sa=m.door!==undefined?m.s+(Math.sign(m.s-m.door)||1)*0.55:m.s;
    let P, rail=null;
    if(x.kind==='階段'){
      const g=flowWell(x), a=g.e0-g.f*1.2, d=Math.sign(sa-a)||1, oi=g.laneIn;
      P=[[g.stairEnd,oi],[g.e0,oi],[a,oi],[a,flowLaneAt(q,e,a,d)],[sa,flowLaneAt(q,e,sa,d)]];
      rail={from:0,to:1,g:g,esc:false};
    }else{
      const d=Math.sign(sa-x.s)||1;
      P=[[x.s,x.o,yP],[x.s,flowLaneAt(q,e,x.s,d)],[sa,flowLaneAt(q,e,sa,d)]];
    }
    if(sa!==m.s) P.push([sa,m.o]);
    P.push([m.s,m.o]);
    if(FLOW.walkers.some(w=>w.q===q&&Math.hypot(w.s-P[0][0],w.o-P[0][1])<1.0)){ r.at=FLOW.T+0.5; continue; }   // 前の人が出口から離れてから
    FLOW.respawn.splice(i,1);
    m.look=personLook(); m.rec.look=m.look;                      // 別の人
    const w=flowWalker(m.st||null,q,m.look,P,1.2,()=>{ m.boarding=false; flowHide(m,false); },'戻');
    w.m=m; w.e=e; if(rail) w.rail=rail;
  }
  // 歩く:次の点へ向かい、前方の人をよける
  const A=FLOW.walkers;
  for(let i=A.length-1;i>=0;i--){
    const w=A[i];
    if(w.wait>0){ w.wait-=dt; w.mv=0; continue; }
    const tg0=w.path[w.k+1];
    if(!tg0){ A.splice(i,1); if(w.done) w.done(); continue; }
    const s0=w.s, o0=w.o, onRail=flowOnRail(w);
    // 回り道(固まったとき)の点があればそこへ
    const tg=(w.det&&!onRail)?w.det:tg0;
    let ds=tg[0]-w.s, dO=tg[1]-w.o; const L=Math.hypot(ds,dO);
    if(L<(onRail?0.005:0.25)){ if(tg===w.det) w.det=null; else {
      if(w.rail&&w.k+1===w.rail.from){ w.s=tg[0]; w.o=tg[1]; }          // 段の入口に乗る所はその点に置く(高さが跳ねない)
      w.k++; w.best=1e9; } continue; }   // 段の上は点まで進み切る(降り口で高さが跳ねない)
    ds/=L; dO/=L;
    if(onRail){
      /* 段の上:押し合いはしない。同じ列(o が 0.4m 以内)で前を同じ向きに進む人に 0.7m まで近づいたら止まる。
         エスカレーターは歩かずに運ばれる(水平 0.43m/s) */
      let gap=1e9;
      for(const o of A) if(o!==w&&o.q===w.q&&flowOnRail(o)&&Math.abs(o.o-w.o)<0.3){   // 同じ列・同じ向きの前の人だけ(すれ違う人は別の列)

         いる人がいれば立ち止まって待つ(押し合って入口の前で回らない)。段の上の人は入口より先(道のりが負) */

        const dw=D(w);
        for(const o of A) if(o!==w&&o.rail&&o.rail.g===R.g&&o.rail.esc===R.esc&&!o.rail.to&&!(o.wait>0)&&o.k>=o.rail.from-2&&Math.hypot(o.s-w.s,o.o-w.o)<1.0){

        if(d>=0.4) continue;

        const c=[[b.s0-0.15-w.s,0],[b.s1+0.15-w.s,0],[0,b.o0-0.15-w.o],[0,b.o1+0.15-w.o]].sort((u,v)=>Math.hypot(...u)-Math.hypot(...v))[0];

      for(const e of[-1,1]){ if(crossing&&e===w.e) continue;            // 線路のない縁(柵・壁)も同じだけ内側

      else if(FLOW.T-w.bt>15){ if(w.rail&&w.k+1===w.rail.from){ w.s=tg0[0]; w.o=tg0[1]; } w.k++; w.best=1e9; w.bt=FLOW.T; w.gh2=0; FLOW.skips=(FLOW.skips||0)+1; }   // それでも進めなければ次の点へ(行き詰まらない)
      else if(FLOW.T-w.bt>2.5&&!w.det&&!(FLOW.T-(w.detT||-99)<5)){   // 回り道は5秒に1回まで
        let side=1, cnt=[0,0];
        for(const o of A) if(o!==w&&o.q===w.q){ const lat=-(o.s-w.s)*dO+(o.o-w.o)*ds; if(Math.hypot(o.s-w.s,o.o-w.o)<1.5) cnt[lat>0?0:1]++; }

    // 速さも 0.4秒ほどでならす:押し合いで前後に揺れているだけの人は足を止めて見える(その場で歩き続けない)

/* 停車中の列車が面しているホームドアの列(その列車が走る線=trainOff から 2.5m 以内)。
   各停は openable の列(待避線側)、特急は2面4線の本線側(openable:false の列)に面する */
function trainPSD(t){
  if(t.st!=='dwell'||!t.atSt) return null;
  const to=t.dir>0?-trainOff(t,t.atSt.x):trainOff(t,t.atSt.x);
  let best=null,bd=2.5;
  for(const q of PSD){ if(q.st!==t.atSt||q.dir!==t.dir||q.noStop) continue; const d=Math.abs(q.off-to); if(d<bd){bd=d;best=q;} }
  return best;
}
function stepCarDoors(t,dt){
  const p=trainPSD(t);
  const want=(p&&t.dwell>3)?1:0, side=p?p.side:1;
  if(t.dr===undefined){t.dr=0;t.dside=1;}
  if(t.dr===want&&t.dside===side) return;
  let nr=t.dr+(want-t.dr)*Math.min(1,dt*3.0);    // 約1秒で開閉
  if(Math.abs(want-nr)<0.005) nr=want;           // 端で止め切る(半開きのまま残らないように)
  t.dr=nr; t.dside=side;
  for(const c of t.cars) setCarDoors(c,nr,side);
}
// 毎フレームの開閉。停車中(発車3秒前まで)だけ開く。
function stepPSD(dt){
  for(const p of PSD){
    let want=0;
    if(p.hold) want=1;                                   // ホームで待たせる編成の列(笹塚の3番線)は開けたまま
    // 運転モードの自列車が停車して扉を開けている間は、自列車の面する列が開く
    else if(rideOn&&doorOpenT>0&&doorPSD===p) want=1;
    else for(const t of trains){
      if(t.dwell>3&&trainPSD(t)===p){want=1;break;}
    }
    if(p.r===want) continue;                           // 開き切り/閉じ切りなら何もしない
    let nr=p.r+(want-p.r)*Math.min(1,dt*3.5);          // 約0.9秒で開閉
    if(Math.abs(want-nr)<0.005) nr=want;               // 端で止め切る(半開きのまま残らないように)
    setPSD(p,nr);
  }
}

const DOOR_OPEN_SEC=25, DOOR_STOP_TOL=1.0, DOOR_REARM=60;

function ridePSDFor(st){
  const trackOff=rideZf(st.x);               // 自列車の線(下り=−rideOff)
  let best=null,bd=2.5;

   残る/本線へ出た先頭の後ろはまだ待避線。先頭の位置だけで線を見ると、線を塞いでいる最後尾を見落とす */
function atcRear(t){
  const a=tailRear(t), b=headFront(t);
  for(let x=a;;x=Math.min(b,x+ATC.STEP)){
    if(Math.abs(trainOff(t,x)-rideOff(x))<=ATC.OFFTOL) return x;

function atcLimit(s){

    if(rear===null) continue;                                // 全体が別の線(特急:待避線の各停/各停:駅の本線の優等列車)
    const d=rear-s;

    const v=(d<=ATC.NEAR)?0:ATC.VFAR*Math.sqrt((d-ATC.NEAR)/(ATC.FAR-ATC.NEAR));
    if(lim===null||v<lim) lim=v;
  }

}

// 運転モードの1ステップ(速度と位置)。ATCと扉扱いの判定もここで行う。
function stepRide(dt){
  atcRaw=atcLimit(rideS);                       // 瞬時の許容速度(null=制限なし)
  const rv=(atcRaw===null)?Infinity:atcRaw, ev=(atcLim===null)?Infinity:atcLim;
  if(rv<ev-1e-9){ atcLim=atcRaw; atcUpT=0; }    // 現示ダウンは即時
  else if(rv>ev+1e-9){                          // 現示アップは10秒待つ
    atcUpT+=dt;
    if(atcUpT>=ATC_UP_LAG){ atcLim=atcRaw; atcUpT=0; }
  }else atcUpT=0;
  atcOn=(atcLim!==null&&rideV>atcLim);
  // 扉扱い:停止位置に着いたら25秒開ける。離れたら次の停車で再び開く
  if(doorOpenT>0){
    doorOpenT=Math.max(0,doorOpenT-dt);
    if(doorOpenT===0){doorSt=null;doorPSD=null;}
  }else{
    // 点灯条件:停止位置の前後1m以内、かつ速度が完全に0km/hであること
    const st=rideStopAt(rideS);
    if(st&&rideV===0&&doorArmed!==st&&rideStops(st)){                 // 特急は通過駅では開けない(利用者指示)
      doorSt=st;doorPSD=ridePSDFor(st);doorOpenT=DOOR_OPEN_SEC;doorArmed=st;
    }
    if(doorArmed&&Math.abs(stopPosOf(doorArmed,1)-rideS)>DOOR_REARM) doorArmed=null;
  }
  // 加減速の応答は一次遅れ(時定数 NOTCH_LAG 秒)。さらに速度による特性を加味する:
  //   力行 : 60km/h までは設定どおり、以降は鈍化し 120km/h で半分
  //   制動 : 120km/h では75%、速度が落ちるほど強まり 60km/h 以下で設定どおり
  // 扉が開いている間(=戸閉灯が消えている間)は力行できない
  const nUse=atcOn?NIDX_B7:(doorOpenT>0?Math.min(notch,NIDX_N):notch);
  const aSet=NOTCHES[nUse].a;
  // 保安装置の制動は指令どおりの減速度で効く(速度による鈍化を受けない)。
  // 鈍化を受けると高速域でパターンに追従できず、頭打ちのまま接近してしまう。
  const aCmd=atcOn?aSet:aSet*accCurve(rideV,aSet);
  accEff += (aCmd-accEff)*Math.min(1, dt/NOTCH_LAG);
  rideV=clamp(rideV+accEff*dt,0,VMAX);
  rideS+=(rideV/3.6)*dt; if(rideS>7950){rideS=-250;}          // 終端で笹塚方へ戻る
}
// マスコン操作の遊び(反応遅れ1.0秒):cmdNotch=操作値 / notch=実際に効いている段

function applyCam(){
  const x=cam.tx+cam.r*Math.sin(cam.ph)*Math.cos(cam.th), z=cam.tz+cam.r*Math.sin(cam.ph)*Math.sin(cam.th);
  camera.position.set(x, Math.max(cam.ty+cam.r*Math.cos(cam.ph), terH(x,z)+3), z);   // 丘(地形)の中へは入らない
  camera.lookAt(cam.tx,cam.ty,cam.tz);
}
function flyTo(to,dur){fly={a:Object.assign({},cam),b:Object.assign(Object.assign({},cam),to),t0:performance.now(),dur:dur||1400};}
function stepFly(now){
  if(!fly)return;
  let t=(now-fly.t0)/fly.dur;if(t>=1){Object.assign(cam,fly.b);fly=null;return;}
  t=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  for(const k of['tx','ty','tz','r','th','ph'])cam[k]=fly.a[k]+(fly.b[k]-fly.a[k])*t;
}
const pts=new Map();let pinchD=0;
canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});pinchD=0;if(!rideOn)fly=null;});
canvas.addEventListener('pointerup',e=>{pts.delete(e.pointerId);pinchD=0;});

canvas.addEventListener('pointermove',e=>{
  if(!pts.has(e.pointerId))return;
  const p=pts.get(e.pointerId),dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(rideOn){   // 運転モード:ドラッグで首振り(左右±120°/上下±45°)。2本指は無視
    if(pts.size>=2)return;
    rideYaw   = clamp(rideYaw   - dx*.004, -2.1, 2.1);
    ridePitch = clamp(ridePitch - dy*.003, -0.8, 0.8);
    return;
  }
  if(pts.size===2){
    const a=[...pts.values()],d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    if(pinchD>0){if(chaseOn)CH.r=clamp(CH.r*pinchD/d,60,650);else cam.r=clamp(cam.r*pinchD/d,90,9800);}
    pinchD=d;return;

  if(chaseOn){CH.th+=dx*.005;CH.ph=clamp(CH.ph-dy*.004,.18,1.45);return;}   // 追尾中は角度のみ操作
  setAuto(false);
  if(e.shiftKey||e.ctrlKey||(e.buttons&2)){cam.th+=dx*.005;cam.ph=clamp(cam.ph-dy*.004,.14,1.5);}   // 回転=修飾キー+ドラッグ

  const k=cam.r*.0014;

/* 影の「落とす/受ける」は最後に一括で設定する。生成箇所ごとに付けると
   必ず付け忘れが出て、その物だけ影が無いという分かりにくい不整合になる。
   ・地表は受けるだけ(巨大な板なので落とす側に入れても無駄)
   ・線(架線)とラベル(Sprite)は対象外 */
const SHADOW_STAT={cast:0,recv:0};
function applyShadows(){
  SHADOW_STAT.cast=0;SHADOW_STAT.recv=0;
  scene.traverse(function(o){
    if(!(o.isMesh||o.isInstancedMesh))return;
    o.receiveShadow=true;SHADOW_STAT.recv++;
    // 空ドームは裏面の巨大な球。影の対象に入れると世界中が影になる
    if(o===skyDome){o.castShadow=false;o.receiveShadow=false;SHADOW_STAT.recv--;return;}
    if(o===groundMesh||o.userData.flat||o.userData.decal){o.castShadow=false;return;}   // 地表と、地表に敷いた平らな面(道路)・路面標示(decal)は受けるだけ
    // 夜の灯りは「光っている面」なので影を落とさない(落とすと灯りが黒い塊になる)
    if(o.userData.night){o.castShadow=false;o.receiveShadow=false;SHADOW_STAT.recv--;return;}
    o.castShadow=true;SHADOW_STAT.cast++;
    if(!farMoving(o)) o.layers.enable(FAR_LAYER);     // 遠くの影は動かない物だけ(遠くの影の章)
  });
}
// 動く物(走行列車・留置車・交差鉄道の列車・自動車・人):遠くの影マップは 200m 動くまで写し直さないので、動く物の影は残像になる
function farMoving(o){
  for(let p=o;p;p=p.parent) if(p.userData&&p.userData.mv) return true;
  return false;
}
for(const t of trains) for(const c of t.cars) c.userData.mv=true;
for(const c of parkedCars) c.userData.mv=true;
for(const t of inoTrains) t.g.userData.mv=true;
setaTrain.g.userData.mv=true;
scene.traverse(o=>{ if(o.isInstancedMesh&&(/^自動車/.test(o.name)||o.material===M_PEOPLE)) o.userData.mv=true; });
applyShadows();

let last=performance.now();
/* 世界(列車・扉・交差鉄道)を dt 秒進める。
   実時間のループと撮影モードの両方から呼ぶ。撮影では固定の dt を与えるので、
   何度流しても同じ絵が出る(動画の作り直しで結果が変わらない)。 */
function stepWorld(dt){
  stepRoadCars(dt);       // 自動車(線路を横切る道路・並ぶ幹線)
  stepPeds(dt);           // 歩道を歩く人
  plazaStep(dt);          // 千歳烏山駅前広場の往復する人(10e章)
  if(!trainsOn) return;
  for(const t of trains){
    driveTrain(t,dt);     // 各駅停車の自動運転(加速P4/60km/h上限/減速B5/停車25秒)
    placeTrain(t);
    stepCarDoors(t,dt);   // 客用扉:停車中はホーム側だけ開く
  }
  stepSwitches(dt);       // 分岐器:近づく列車の進路へ転換(載っている間は動かさない)
  stepFlow(dt);           // 乗り降り:降りる人→階段・EV、その後に並んだ人が乗る
  stepPSD(dt);            // ホームドア:停車中(発車3秒前まで)だけ開く
  for(const c of parkedCars) lodCar(c);   // 留置中の編成もLODを見直す
  stepXRail(dt);          // 井の頭線・世田谷線
}
let cineOn=false;         // 撮影モード:実時間のループを止め、CINE が時間を進める
function loop(now){
  requestAnimationFrame(loop);
  if(cineOn){last=now;return;}
  // 最初のコマは rAF の時刻が読み込み完了の時刻より前のことがあり、差が負になる
  // (そのままだと列車や雪が数秒ぶん逆に進む)。0〜0.05秒に収める
  const dt=clamp((now-last)/1000,0,.05);last=now;
  stepWorld(dt);
  if(rideOn){
    stepRide(dt);
    updSpd();
    // 視線=線路の接線方向(勾配も含む)。同じ軌道オフセット上の前後2点から方向を作るため、
    // 曲線でも画面中央が線路の正面を向く。
    const p=frame(rideS,rideZf(rideS));            // 自列車の線(特急=本線・八幡山は外側の通過線/各停=待避線・停車線)
    const pa=frame(rideS-6,rideZf(rideS-6)), pb=frame(rideS+6,rideZf(rideS+6));   // 振り分けのS字でも線路の向きを見る
    let tx=pb.x-pa.x, tz=pb.z-pa.z, ty=railY(rideS+6)-railY(rideS-6);
    const tl=Math.hypot(tx,ty,tz)||1; tx/=tl; ty/=tl; tz/=tl;
    const EYE=3.2;                                   // 運転士の目線(レール面から)
    camera.up.set(0,1,0);
    camera.position.set(p.x, railY(rideS)+EYE, p.z);
    // 進行方向を基準に、ドラッグ量(rideYaw/ridePitch)だけ首を振る
    const base=Math.atan2(tz,tx), a2=base+rideYaw;
    const cp=Math.cos(ridePitch);
    const dx=Math.cos(a2)*cp, dz=Math.sin(a2)*cp, dy=ty*cp+Math.sin(ridePitch);
    camera.lookAt(p.x+dx*200, railY(rideS)+EYE+dy*200, p.z+dz*200);
    cam.tx=p.x;cam.tz=p.z;
  }else if(chaseOn){   // 注視点=列車固定、視点=球面(CH)上をユーザー操作可
    const t=trains[chaseIdx],zf=trainZf(t);
    const hx=t.x,ph2=frame(hx,zf(hx));
    const ty=railY(hx)+3;
    const ex=ph2.x+CH.r*Math.sin(CH.ph)*Math.cos(CH.th);
    const ey=Math.max(ty+CH.r*Math.cos(CH.ph),1.5,terH(ex,ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th))+1.5);   // 地表(地形)より下へは行かない(掘割の列車を低い角度で見るとき)
    const ez=ph2.z+CH.r*Math.sin(CH.ph)*Math.sin(CH.th);
    const kk=Math.min(1,dt*3.6);
    chaseEye.x+=(ex-chaseEye.x)*kk;chaseEye.y+=(ey-chaseEye.y)*kk;chaseEye.z+=(ez-chaseEye.z)*kk;
    camera.position.copy(chaseEye);
    camera.lookAt(ph2.x,ty,ph2.z);
    cam.tx=ph2.x;cam.tz=ph2.z;
  }else{
    stepFly(now);
    if(autoOrbit&&!fly&&pts.size===0)cam.th+=dt*.03;
    applyCam();
  }
  syncNav();
  // 影の写す範囲を注視点へ追従させる(太陽の向きは変えない)
  sunFollow(cam.tx,cam.tz,
    Math.hypot(camera.position.x-cam.tx,camera.position.y,camera.position.z-cam.tz));
  CINE.tick(dt);          // 雪・花びら(冬・春)を進め、空をカメラの真上へ
  lodStruct();            // 駅・高架橋の細部は近くだけ描く(今のカメラで判定)
  // 車両の LOD も描く直前の今のカメラで(stepWorld はカメラを動かす前。最初のコマはカメラが原点=笹塚の近くに
  // あり、笹塚の留置車を高精細で描いて車番の画像まで作っていた)
  for(const t of trains) for(const c of t.cars) if(c.visible) lodCar(c);
  for(const c of parkedCars) lodCar(c);
  xTrainsLod();           // 井の頭線・世田谷線の車両も
  postRender();           // 画面の後処理(12b章)を通して描く
}

/* ============ 12b. 画面の後処理(2026-11 利用者指示「更なるクオリティアップ」) ============
   描画をいったん中間の画像(色=半精度の浮動小数・奥行き=奥行きの画像)へ描き、全画面の描画を重ねて仕上げる:
   ① 接地の陰(SAO:奥行きから位置と面の向きを戻し、周りの 12点が面の上に出ているほど暗くする。半分の解像度で求めて 4×4 でならす。
      半径 POST.R=1.0m・強さ POST.ao=0.7。空(奥行き=1)と 250m より遠くは掛けない)
   ② 光のにじみ(明るさ POST.th を超えた所を 1/4 の解像度に取り出し、横と縦のぼかしを2段=1/4・1/8 で足す。夜は強く POST.bloomN、昼は弱く POST.bloomD)
   ③ sRGB へ(r128 は中間の画像に描くときもトーンマップ(ACES)は掛け、出力の符号化だけが線形になる。画面へ直接描くときと同じ式 LinearTosRGB。
      2026-11 に確かめた:ここで ACES を掛け直すと全体が 15〜24/255 明るくなる=二重に掛かる)
   ④ FXAA(縁のギザギザ。中間の画像は MSAA が効かないので)
   画面のループと撮影(CINE.render)が postRender() を呼ぶ。照合の描画(⑩⑮・⑯の位置合わせ・⑰ の renderer.render)には掛からない
   (⑯の「繋がらないとき ON と OFF が同じ」は CINE.render=後処理を通した絵どうしで比べる)。
   描画の数(renderer.info)は場面(従来どおり影マップは数えない)と後処理の 9回の合計にする(⑫)。スマホ・WebGL1 は使わない(POST.on=false で従来の1回の描画) */
const POST={on:!IS_MOBILE, ao:0.7, R:1.0, th:0.82, bloomN:0.85, bloomD:0.12, rt:null, w:0, h:0};
(function(){
  if(!POST.on) return;
  const gl=renderer.getContext&&renderer.getContext();
  if(!renderer.capabilities||!renderer.capabilities.isWebGL2){ POST.on=false; return; }
  const FSQ_V='varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }';
  const quad=new THREE.Mesh(new THREE.PlaneGeometry(2,2),null); quad.frustumCulled=false;
  const qs=new THREE.Scene(); qs.add(quad); const qc=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
  const mat=(frag,uni)=>new THREE.ShaderMaterial({uniforms:uni,vertexShader:FSQ_V,fragmentShader:frag,depthTest:false,depthWrite:false,toneMapped:false});
  POST.mAO=mat(`
    uniform sampler2D tD; uniform mat4 uPI, uP; uniform vec2 uRes; uniform float uR, uK; varying vec2 vUv;
    vec3 vpos(vec2 uv){ float d=texture2D(tD,uv).x; vec4 c=vec4(uv*2.-1.,d*2.-1.,1.); vec4 v=uPI*c; return v.xyz/v.w; }
    float h12(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      float d=texture2D(tD,vUv).x; if(d>=0.99999){ gl_FragColor=vec4(1.); return; }
      vec3 P=vpos(vUv); if(-P.z>250.){ gl_FragColor=vec4(1.); return; }
      vec3 N=normalize(cross(dFdx(P),dFdy(P)));
      float rp=uR*uP[1][1]/(-P.z)*0.5;                                 // 半径を画面の割合に
      float a0=h12(gl_FragCoord.xy)*6.2832, occ=0.;
      for(int i=0;i<12;i++){ float fi=float(i), t=(fi+0.5)/12., a=a0+fi*2.39996;
        vec2 o=vec2(cos(a),sin(a))*rp*sqrt(t)*vec2(uRes.y/uRes.x,1.);
        vec3 S=vpos(vUv+o)-P; float l=length(S);
        occ+=max(0.,dot(N,S)/max(l,1e-3)-0.12)*smoothstep(uR*2.2,uR*0.6,l); }
      float ao=clamp(1.-uK*occ/12.*1.6,0.,1.); gl_FragColor=vec4(ao,ao,ao,1.); }`,
    {tD:{value:null},uPI:{value:new THREE.Matrix4()},uP:{value:new THREE.Matrix4()},uRes:{value:new THREE.Vector2()},uR:{value:POST.R},uK:{value:POST.ao}});
  POST.mAOB=mat(`uniform sampler2D tA; uniform vec2 uTx; varying vec2 vUv;
    void main(){ float s=0.; for(int i=-2;i<2;i++) for(int j=-2;j<2;j++) s+=texture2D(tA,vUv+(vec2(float(i),float(j))+0.5)*uTx).x; s/=16.; gl_FragColor=vec4(s,s,s,1.); }`,
    {tA:{value:null},uTx:{value:new THREE.Vector2()}});
  POST.mBR=mat(`uniform sampler2D tC; uniform float uTh; varying vec2 vUv;
    void main(){ vec3 c=texture2D(tC,vUv).rgb; float l=max(c.r,max(c.g,c.b)); gl_FragColor=vec4(c*smoothstep(uTh,uTh+0.25,l),1.); }`,
    {tC:{value:null},uTh:{value:POST.th}});
  POST.mBL=mat(`uniform sampler2D tC; uniform vec2 uDir; varying vec2 vUv;
    void main(){ vec3 s=texture2D(tC,vUv).rgb*0.227; s+=(texture2D(tC,vUv+uDir*1.385).rgb+texture2D(tC,vUv-uDir*1.385).rgb)*0.316;
      s+=(texture2D(tC,vUv+uDir*3.231).rgb+texture2D(tC,vUv-uDir*3.231).rgb)*0.070; gl_FragColor=vec4(s,1.); }`,
    {tC:{value:null},uDir:{value:new THREE.Vector2()}});
  POST.mCO=mat(`uniform sampler2D tC, tA, tB1, tB2; uniform float uB; varying vec2 vUv;
    vec3 toS(vec3 c){ return mix(c*12.92, 1.055*pow(c,vec3(0.41666))-0.055, step(0.0031308,c)); }
    void main(){ vec3 c=texture2D(tC,vUv).rgb*texture2D(tA,vUv).x + (texture2D(tB1,vUv).rgb+texture2D(tB2,vUv).rgb)*uB;
      gl_FragColor=vec4(toS(clamp(c,0.,1.)),1.); }`,
    {tC:{value:null},tA:{value:null},tB1:{value:null},tB2:{value:null},uB:{value:0}});
  POST.mFX=mat(`uniform sampler2D tC; uniform vec2 uTx; varying vec2 vUv;
    float lu(vec3 c){ return dot(c,vec3(0.299,0.587,0.114)); }
    void main(){ vec3 rgbM=texture2D(tC,vUv).rgb; float lM=lu(rgbM);
      float lNW=lu(texture2D(tC,vUv+vec2(-1.,-1.)*uTx).rgb), lNE=lu(texture2D(tC,vUv+vec2(1.,-1.)*uTx).rgb),
            lSW=lu(texture2D(tC,vUv+vec2(-1.,1.)*uTx).rgb),  lSE=lu(texture2D(tC,vUv+vec2(1.,1.)*uTx).rgb);
      float mn=min(lM,min(min(lNW,lNE),min(lSW,lSE))), mx=max(lM,max(max(lNW,lNE),max(lSW,lSE)));
      vec2 dir=vec2(-((lNW+lNE)-(lSW+lSE)),((lNW+lSW)-(lNE+lSE)));
      float red=max((lNW+lNE+lSW+lSE)*0.25*0.125,1./128.), rcp=1./(min(abs(dir.x),abs(dir.y))+red);
      dir=clamp(dir*rcp,vec2(-8.),vec2(8.))*uTx;
      vec3 A=0.5*(texture2D(tC,vUv+dir*(1./3.-0.5)).rgb+texture2D(tC,vUv+dir*(2./3.-0.5)).rgb);
      vec3 B=A*0.5+0.25*(texture2D(tC,vUv-dir*0.5).rgb+texture2D(tC,vUv+dir*0.5).rgb);
      float lB=lu(B); gl_FragColor=vec4((lB<mn||lB>mx)?A:B,1.); }`,
    {tC:{value:null},uTx:{value:new THREE.Vector2()}});
  POST.quad=quad; POST.qs=qs; POST.qc=qc;
})();
function postSize(){
  const v=renderer.getDrawingBufferSize(new THREE.Vector2()), w=Math.max(2,v.x|0), h=Math.max(2,v.y|0);
  if(POST.rt&&POST.w===w&&POST.h===h) return;
  for(const k of ['rt','tAO','tAOB','bA','bB','bC','bD','cmp']) if(POST[k]){ POST[k].dispose(); POST[k]=null; }
  const T=(x,y,o)=>new THREE.WebGLRenderTarget(x,y,Object.assign({minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,depthBuffer:false,stencilBuffer:false},o||{}));
  POST.rt=T(w,h,{type:THREE.HalfFloatType,depthBuffer:true}); POST.rt.depthTexture=new THREE.DepthTexture(w,h); POST.rt.depthTexture.type=THREE.UnsignedIntType;
  POST.tAO=T(w>>1,h>>1); POST.tAOB=T(w>>1,h>>1);
  POST.bA=T(w>>2,h>>2,{type:THREE.HalfFloatType}); POST.bB=T(w>>2,h>>2,{type:THREE.HalfFloatType});
  POST.bC=T(w>>3,h>>3,{type:THREE.HalfFloatType}); POST.bD=T(w>>3,h>>3,{type:THREE.HalfFloatType});
  POST.cmp=T(w,h); POST.w=w; POST.h=h;
}
function postRender(){
  if(!POST.on||!POST.quad){ renderer.render(scene,camera); return; }
  postSize();
  const info=renderer.info, ar=info.autoReset;
  const pass=(m,target)=>{ POST.quad.material=m; renderer.setRenderTarget(target); renderer.render(POST.qs,POST.qc); };
  renderer.setRenderTarget(POST.rt); renderer.render(scene,camera);   // 描画の数はここで従来どおり数え直す(r128 は影マップの描画の後で数え直す)
  info.autoReset=false;                                               // 後処理の 9回は場面の数に足す
  // ① 接地の陰
  const U=POST.mAO.uniforms; U.tD.value=POST.rt.depthTexture; U.uP.value.copy(camera.projectionMatrix); U.uPI.value.copy(camera.projectionMatrixInverse);
  U.uRes.value.set(POST.w>>1,POST.h>>1); U.uK.value=POST.ao; pass(POST.mAO,POST.tAO);
  POST.mAOB.uniforms.tA.value=POST.tAO.texture; POST.mAOB.uniforms.uTx.value.set(1/(POST.w>>1),1/(POST.h>>1)); pass(POST.mAOB,POST.tAOB);
  // ② 光のにじみ
  const night=!!(NIGHT&&NIGHT.on), bk=night?POST.bloomN:POST.bloomD;
  POST.mBR.uniforms.tC.value=POST.rt.texture; POST.mBR.uniforms.uTh.value=night?POST.th-0.12:POST.th; pass(POST.mBR,POST.bA);
  const B=POST.mBL.uniforms;
  B.tC.value=POST.bA.texture; B.uDir.value.set(1/(POST.w>>2),0); pass(POST.mBL,POST.bB);
  B.tC.value=POST.bB.texture; B.uDir.value.set(0,1/(POST.h>>2)); pass(POST.mBL,POST.bA);
  B.tC.value=POST.bA.texture; B.uDir.value.set(2/(POST.w>>3),0); pass(POST.mBL,POST.bC);
  B.tC.value=POST.bC.texture; B.uDir.value.set(0,2/(POST.h>>3)); pass(POST.mBL,POST.bD);
  // ③ 合わせて sRGB へ → ④ FXAA で画面へ
  const C=POST.mCO.uniforms; C.tC.value=POST.rt.texture; C.tA.value=POST.tAOB.texture; C.tB1.value=POST.bA.texture; C.tB2.value=POST.bD.texture; C.uB.value=bk; pass(POST.mCO,POST.cmp);
  POST.mFX.uniforms.tC.value=POST.cmp.texture; POST.mFX.uniforms.uTx.value.set(1/POST.w,1/POST.h); pass(POST.mFX,null);
  info.autoReset=ar;
}

/* ============ 13. 撮影モード(動画用) ============
   動画は「駅のフォーカス → 次の駅までの前面展望・俯瞰 → 次の駅のフォーカス」を
   繰り返す。時刻(朝/昼/夕/夜)と季節(春夏秋冬)を場面ごとに差し替える。

   ・実時間のループは止め(cineOn)、外部(tools/capture.js)が1コマずつ
     「時間を dt 進める → カメラを置く → 1枚描く」を呼ぶ。
     固定の dt なので、何度流しても同じ動画になる。
   ・色は「画面上でこう見せたい色」で書く。トーンマッピングを通すと沈むので、
     invTone() が逆算して実際に設定する値を作る(tools/tune_sky.js と同じ考え方)。 */
const CINE=(function(){
  /* ---- トーンマッピングの逆算(見せたい色 → 設定すべき色) ---- */
  const l2s=v=>(v<=0.0031308)?v*12.92:1.055*Math.pow(v,1/2.4)-0.055;
  const AIN=[[0.59719,0.07600,0.02840],[0.35458,0.90834,0.13383],[0.04823,0.01566,0.83777]];
  const AOUT=[[1.60475,-0.10208,-0.00327],[-0.53108,1.10813,-0.07276],[-0.07367,-0.00605,1.07602]];
  const mul=(M,c)=>[0,1,2].map(i=>M[0][i]*c[0]+M[1][i]*c[1]+M[2][i]*c[2]);
  const rrt=v=>(v*(v+0.0245786)-0.000090537)/(v*(0.983729*v+0.432951)+0.238081);
  function toneShow(lin){                      // リニア → 画面上のsRGB値(0〜1)
    const e=renderer.toneMappingExposure/0.6;
    let x=mul(AIN,[lin[0]*e,lin[1]*e,lin[2]*e]).map(rrt);
    return mul(AOUT,x).map(v=>l2s(Math.min(1,Math.max(0,v))));
  }
  const H=h=>[((h>>16)&255)/255,((h>>8)&255)/255,(h&255)/255];
  /* 見せたい色(16進) → 設定すべき著作値(16進)。ACESは成分を混ぜるので
     成分ごとではなく3成分まとめて反復で追い込む。 */
  function invTone(hex){
    const t=H(hex); let c=t.slice();
    for(let i=0;i<120;i++){
      const o=toneShow(c.map(s2l)); let moved=0;
      for(let k=0;k<3;k++){
        const r=(o[k]>1e-6)?t[k]/o[k]:1.6;
        const nv=Math.min(1,Math.max(0,c[k]*Math.pow(r,0.7)));
        moved=Math.max(moved,Math.abs(nv-c[k])); c[k]=nv;
      }
      if(moved<1e-7) break;
    }
    return (Math.round(c[0]*255)<<16)|(Math.round(c[1]*255)<<8)|Math.round(c[2]*255);
  }

  /* ---- 時刻 ------------------------------------------------------------
     az=方位[°](0=東・90=南・180=西) / el=高度[°]。空の色は"見せたい色"で書く。 */
  const TIME={
    morning:{n:'朝',  az: 12, el:19, sun:0xffd9a8, si:0.62,
             hs:0xdfe6f2, hg:0x8d8a86, hi:0.74, expo:1.18,

  /* ---- 季節(樹木と地表の色。いずれも"見せたい色"ではなく直接の着色) ---- */

       cloud … 空を同じ明るさの灰へ寄せる割合 / dim … その灰の明るさ(地平の見え方に掛ける)

  const WEATHER={
    clear :{n:'晴れ'},
    cloudy:{n:'曇り', cloud:0.85, dim:0.92, si:0.40, hi:1.02, fog:0.70},
    rain  :{n:'雨',   cloud:0.95, dim:0.74, si:0.22, hi:0.86, fog:0.30, rain:1, wet:0.84},
    heavy :{n:'大雨', cloud:1.00, dim:0.56, si:0.12, hi:0.70, fog:0.13, rain:2, wet:0.74},

  };

  function setTime(k){

  /* 地表と樹木の色を今の「季節 × 時刻」で塗り直す。

     時刻と季節のどちらを変えても呼ぶ(片方だけだと前の時刻の明るさが残る)。 */
  /* ---- 季節の天候:冬=雪 / 春=桜の花びら(ほのかに) -----------------------
     【設計方針】
     ・粒は**世界に固定した場**として持ち、カメラの周り BOX 四方だけを切り出して描く
       (水平は剰余で巡回させる)。カメラが速く動いても粒が一緒に流されず、
       前面展望では正しく後ろへ流れていく
     ・位置は**時刻 t だけの関数**(乱数は生成時に一度だけ)。撮影の世界時間と同じ
       fxT で進めるので、撮り直しても並列に撮っても同じ粒が同じ場所に降る
     ・カメラのごく近く(NEAR 未満)の粒は描かない。目の前の1粒が画面を覆う
     ・点群は照明を受けないので、夜は色を落とす(昼の白のままだと夜に光って見える) */
  let fxT=0;
  const FX=(function(){
    // 粒を描くのはカメラの周り BOX 四方・上下 V の範囲だけ。広く取ると大半の粒が
    // 遠くて1画素未満になり、480×270では何も降っていないように見える(実測)
    const BOX=120, V=90, NEAR=5;
    function tex(draw){
      const cv=document.createElement('canvas');cv.width=cv.height=64;
      draw(cv.getContext('2d'));return canvasTex(cv);
    }
    const snowTex=tex(function(c){
      const g=c.createRadialGradient(32,32,2,32,32,30);
      g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.5,'rgba(255,255,255,0.75)');
      g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);
    });
    const petalTex=tex(function(c){        // 先端に切れ込みのある花びら
      c.translate(32,32);c.rotate(0.6);c.fillStyle='rgba(255,255,255,1)';
      c.beginPath();c.ellipse(0,0,24,14,0,0,Math.PI*2);c.fill();
      c.globalCompositeOperation='destination-out';
      c.beginPath();c.arc(27,0,7,0,Math.PI*2);c.fill();
    });
    function make(n,map,hex,size,opacity){
      const pos=new Float32Array(n*3), seed=new Float32Array(n*4);

      const g=new THREE.BufferGeometry();
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const m=new THREE.PointsMaterial({map:map,color:srgb(hex),size:size,sizeAttenuation:true,

    }
    // 落下速度[m/s]・横揺れの振幅[m]と周期・風で流れる速さ[m/s]
    const SPEC={
      snow :{n:13000,fall:1.1, sway:0.6, freq:0.7, drift:0.25},
      petal:{n:1200, fall:0.7, sway:1.8, freq:1.3, drift:0.9},   // ほのかに=雪の1/10
    };
    const snow =make(SPEC.snow.n, snowTex, 0xffffff,0.62,0.95);

    const wrap=(v,c,L)=>c+((((v-c+L/2)%L)+L)%L)-L/2;
    function place(o,k,t){
      const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z;
      const a=o.pos, s=o.seed;

        const r0=s[i*4], r1=s[i*4+1], r2=s[i*4+2], r3=s[i*4+3];
        const sp=k.fall*(0.7+0.6*r3), ph=r3*6.2832, sw=k.sway*(0.5+r2);

        const x=wrap(r0*BOX+k.drift*t+sw*Math.sin(t*k.freq+ph),cx,BOX);

    }
    /* 雨:線分(落ちる向きに伸ばした筋)。雪と同じく世界に固定した場をカメラの周り RBOX 四方・上下 RV で巡回させる。

    const RBOX=70, RV=40, RNEAR=2.5;
    const RSPEC={
      rain :{n:5000, fall:8.0, len:0.55, wind:0.6, op:0.38},
      heavy:{n:14000,fall:10.0,len:0.95, wind:2.6, op:0.55},
    };
    const rain=(function(){
      const n=RSPEC.heavy.n, pos=new Float32Array(n*6), seed=new Float32Array(n*4);

      const cx=camera.position.x, cy=camera.position.y, cz=camera.position.z, a=o.pos, s=o.seed, dl=k.len/k.fall;
      for(let i=0;i<o.n;i++){
        const r0=s[i*4], r1=s[i*4+1], r2=s[i*4+2], r3=s[i*4+3], sp=k.fall*(0.85+0.3*r3);

        a[i*6+3]=x-k.wind*dl; a[i*6+4]=off?-50:y+sp*dl; a[i*6+5]=z;

    }
    /* 雷:光る時刻は世界時間 t だけで決まる(撮り直しても同じ所で光る)。600秒の周期に 4〜14秒おきの落雷を並べ、
       1回の落雷は「強く光る→少し暗く→もう一度光る→消える」(半分ほどは1回だけ)。光る間は環境光・空・フォグを明るくし、
       遠く(2.5〜4.5km)にジグザグの稲妻を出す */
    const BOLT=(function(){
      let sd=12345; const rnd=()=>((sd=(sd*1103515245+12345)&0x7fffffff)/0x7fffffff);
      const T=[]; for(let t=3+rnd()*4; t<600; t+=6+rnd()*12) T.push({t:t,dbl:rnd()<0.55,a:rnd()*6.2832,d:2500+rnd()*2000,s:Math.floor(rnd()*1e6)});

    })();
    const BOLT_P=600;
    function strikeAt(t){ const tt=((t%BOLT_P)+BOLT_P)%BOLT_P; let b=null; for(const q of BOLT){ if(q.t<=tt) b=q; else break; } return b?{b:b,dt:tt-b.t}:null; }
    function flashOf(dt,dbl){
      if(dt<0) return 0;
      if(dt<0.07) return 1;
      if(!dbl) return dt<0.6?Math.exp(-(dt-0.07)/0.09):0;
      if(dt<0.16) return 0.22;
      if(dt<0.24) return 0.85;
      return dt<0.8?0.85*Math.exp(-(dt-0.24)/0.11):0;
    }
    const bolt=(function(){
      const N=48, g=new THREE.BufferGeometry(), pos=new Float32Array(N*6*3);
      g.setAttribute('position',new THREE.BufferAttribute(pos,3));
      const m=new THREE.MeshBasicMaterial({color:new THREE.Color(3.2,3.4,4.0),fog:false,transparent:true,depthWrite:false,
        blending:THREE.AdditiveBlending,side:THREE.DoubleSide});
      const p=new THREE.Mesh(g,m); p.frustumCulled=false; p.visible=false; p.renderOrder=1; scene.add(p);
      return {p:p,pos:pos,N:N,seed:-1};
    })();
    function shapeBolt(b){                     // 稲妻の帯(雲の底 1400m → 地表)。カメラに向けた幅 8m の帯をジグザグに
      if(bolt.seed===b.s&&bolt.cam&&Math.hypot(bolt.cam[0]-camera.position.x,bolt.cam[1]-camera.position.z)<200) return;
      bolt.seed=b.s; bolt.cam=[camera.position.x,camera.position.z];
      let sd=b.s||1; const rnd=()=>((sd=(sd*1103515245+12345)&0x7fffffff)/0x7fffffff);
      const cx=camera.position.x+Math.cos(b.a)*b.d, cz=camera.position.z+Math.sin(b.a)*b.d;
      const rx=-Math.sin(b.a), rz=Math.cos(b.a), W=8;      // 視線に直角な横の向き

      for(let i=0;i<bolt.N;i++){ const A=P[i], B=P[i+1], w=W*(1-0.6*i/bolt.N);
        const q=[[A[0]-rx*w,A[1],A[2]-rz*w],[A[0]+rx*w,A[1],A[2]+rz*w],[B[0]+rx*w,B[1],B[2]+rz*w],[B[0]-rx*w,B[1],B[2]-rz*w]];
        for(const j of [0,1,2,0,2,3]){ a[k++]=q[j][0]; a[k++]=q[j][1]; a[k++]=q[j][2]; } }

    let thunder=false, flash=0;
    return {
      set(w,season,night){
        snow.p.visible=!!w.snow; petal.p.visible=(season==='spring'&&!w.rain&&!w.snow);
        const d=night?0.45:1;

          const s=strikeAt(t); flash=s?flashOf(s.dt,s.b.dbl):0;

          scene.background.copy(WXB.bg).multiplyScalar(1+1.8*flash);

      snow:snow, petal:petal, rain:rain, bolt:bolt, SPEC:SPEC, RSPEC:RSPEC, BOX:BOX, V:V, NEAR:NEAR, RBOX:RBOX, RV:RV, RNEAR:RNEAR,

  const GROUND_NIGHT=0.58;          // 夜の地表と緑(昼の58%。2026-10-12 に 40%→48%、10-13 に 55%、11 に 58% へ少し明るく。⑨は 6割未満を見る)
  const URBAN_GROUND=0xc3c0b3, URBAN_MIX=0.3;     // 実データの緑があるときの既定の地表(住宅地など)
  function applyLook(){
    const s=SEASON[curSeason]||SEASON.summer;

  const STAGE={ARRIVE_T:20.0, DEPART_T:6.0, CLEAR:900, BACK:1200, PASS_T:30};

       (上りに各停・急行を足したので、通過駅のホームに各停が停まっていることがある) */
    const ahead=pass?STAGE.CLEAR+trainVmax(t)*STAGE.PASS_T:STAGE.CLEAR;
    const mv=trains.filter(q=>q!==t&&q.dir===dir&&(q.x-stop)*dir<ahead&&(stop-q.x)*dir<STAGE.CLEAR);
    let slot=0;
    for(const q of mv){

    }
    if(pass){                                // 通過する駅(特急):本線の上限で駆け抜ける所を切り取る
      const vp=trainVmax(t);
      t.x=stop-dir*vp*(mode==='arrive'?4:-1); t.v=vp; t.st='run'; t.target=null; t.atSt=null; t.dwell=0;
      for(const c of t.cars) setCarDoors(c,0,1);

  /* 撮影用の見通し距離。前面展望は線路の先にある物が全部画角へ入るので、

    for(const t of trains) for(const c of t.cars) if(c.visible) lodCar(c);

    label:()=>TIME[curTime].n+'・'+SEASON[curSeason].n+(curWeather!=='clear'?'・'+(curWeather==='heavy'&&curThunder?'大雨と雷':WEATHER[curWeather].n):''),
